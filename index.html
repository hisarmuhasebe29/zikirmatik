 sonra nasıl diriltecek? dedi. Bunun üzerine Allah onu öldürüp yüz sene bıraktı; sonra tekrar diriltti. \"Ne kadar kaldın?\" dedi. \"Bir gün yahut daha az\" dedi. Allah ona: \"Hayır, yüz sene kaldın. Yiyeceğine ve içeceğine bir bak, henüz bozulmamıştır. Eşeğine de bak. Seni insanlara ibret kılacağız. Kemiklere bak, onları nasıl birleştirip yerli yerine koyuyor ve sonra onlara nasıl et giydiriyoruz?\" dedi. Durum kendisince anlaşılınca: \"Şimdi iyice biliyorum ki, Allah her şeye kadirdir,\" dedi.",""],[260,"وَإِذْ قَالَ إِبْرَٰهِـۧمُ رَبِّ أَرِنِى كَيْفَ تُحْىِ ٱلْمَوْتَىٰ قَالَ أَوَلَمْ تُؤْمِن قَالَ بَلَىٰ وَلَٰكِن لِّيَطْمَئِنَّ قَلْبِى قَالَ فَخُذْ أَرْبَعَةً مِّنَ ٱلطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ ٱجْعَلْ عَلَىٰ كُلِّ جَبَلٍ مِّنْهُنَّ جُزْءًا ثُمَّ ٱدْعُهُنَّ يَأْتِينَكَ سَعْيًا وَٱعْلَمْ أَنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌ","Ve iz kâla ibrâhîmu rabbi arinî kayfa tuhyil-mavtâ, kâla avalam tu'min, kâla balâ ve lâkil liyatma'inna kalbî, kâla fahuz arba'atam minat-tayri fasurhunna ilayka summac'al 'alâ kulli cabalim minhunna cuz'an summad'uhunna ya'tînaka sa'yâ, ve'lam annallâha 'azîzun hakîm.","Hani İbrahim Rabbine: \"Ey Rabbim! Ölüyü nasıl dirilttiğini bana göster.\" demişti. Rabbi ona: \"Yoksa inanmıyor musun?\" dedi. İbrahim: \"Hayır! İnandım, fakat kalbimin mutmain olması için.\" demişti. \"Öyleyse dört kuş tut, onları yanına al. Sonra (kesip parçala), her dağın başına onlardan bir parça koy. Ardından onları kendine çağır; koşarak sana gelirler. Bil ki şüphesiz Allah Azîz'dir, Hakîm'dir.\"",""],[261,"مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ أَنۢبَتَتْ سَبْعَ سَنَابِلَ فِى كُلِّ سُنۢبُلَةٍ مِّا۟ئَةُ حَبَّةٍ وَٱللَّهُ يُضَٰعِفُ لِمَن يَشَآءُ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ","Masalul-lazîna yunfikûna amvâlahum fî sabîlillâhi kamasali habbatin ambatat sab'a sanâbila fî kulli sumbulatim mi'atu habbah, vallâhu yudâ'ifu limay yaşâ', vallâhu vâsi'un 'alîm.","Allah yolunda mallarını harcayanların örneği, yedi başak bitiren bir tane gibidir ki, her başakta yüz tane vardır. Allah dilediğine kat kat verir. Allah, ihsanı bol olandır, her şeyi bilendir.",""],[262,"ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ ثُمَّ لَا يُتْبِعُونَ مَآ أَنفَقُوا۟ مَنًّا وَلَآ أَذًى لَّهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","Allazîna yunfikûna amvâlahum fî sabîlillâhi summa lâ yutbi'ûna mâ anfakû mannav ve lâ azâ, lahum acruhum 'inda rabbihim, ve lâ havfun 'alayhim ve lâ hum yahzanûn.","Mallarını Allah yolunda infak edip sonra infak ettikleri şeyin ardından başa kakmayan ve eza etmeyenlerin ecirleri Rablerinin katındadır. Onlara korku yoktur ve onlar üzülmeyeceklerdir.",""],[263,"قَوْلٌ مَّعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِّن صَدَقَةٍ يَتْبَعُهَآ أَذًى وَٱللَّهُ غَنِىٌّ حَلِيمٌ","Kavlum ma'rûfuv ve magfiratun hayrum min sadakatiy yatba'uhâ azâ, vallâhu ganiyyun halîm.","Güzel söz ve bağışlama, arkasından incitme gelen sadakadan daha iyidir. Allah çok zengindir, Halim'dir.",""],[264,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُبْطِلُوا۟ صَدَقَٰتِكُم بِٱلْمَنِّ وَٱلْأَذَىٰ كَٱلَّذِى يُنفِقُ مَالَهُۥ رِئَآءَ ٱلنَّاسِ وَلَا يُؤْمِنُ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ فَمَثَلُهُۥ كَمَثَلِ صَفْوَانٍ عَلَيْهِ تُرَابٌ فَأَصَابَهُۥ وَابِلٌ فَتَرَكَهُۥ صَلْدًا لَّا يَقْدِرُونَ عَلَىٰ شَىْءٍ مِّمَّا كَسَبُوا۟ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلْكَٰفِرِينَ","Yâ ayyuhal-lazîna âmanû lâ tubtilû sadakâtikum bil-manni vel-azâ, kal-lazî yunfiku mâlahû ri'â'an-nâsi ve lâ yu'minu billâhi vel-yavmil-âhir, fa masaluhû kamasali safvânin 'alayhi turâbun fa'asâbahû vâbilun fatarakahû saldâ, lâ yakdirûna 'alâ şay'im mimmâ kasabû, vallâhu lâ yahdil-kavmal-kâfirîn.","Ey iman edenler! Allah'a ve ahiret gününe iman etmediği halde malını gösteriş için harcayan kimse gibi, başa kakmak ve incitmek suretiyle yaptığınız hayırlarınızı boşa çıkarmayın. Artık onun durumu, üzerinde biraz toprak bulunan düz kayaya benzer ki, sağanak bir yağmur isabet etmiş de onu çıplak pürüzsüz kaya haline getirivermiştir. Bunlar kazandıklarından hiçbir şeye sahip olamazlar. Allah, kâfirleri doğru yola iletmez.",""],[265,"وَمَثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمُ ٱبْتِغَآءَ مَرْضَاتِ ٱللَّهِ وَتَثْبِيتًا مِّنْ أَنفُسِهِمْ كَمَثَلِ جَنَّةٍۭ بِرَبْوَةٍ أَصَابَهَا وَابِلٌ فَـَٔاتَتْ أُكُلَهَا ضِعْفَيْنِ فَإِن لَّمْ يُصِبْهَا وَابِلٌ فَطَلٌّ وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ","Ve masalul-lazîna yunfikûna amvâlahumubtigâ'a mardâtillâhi ve tasbîtam min anfusihim kamasali cannatim birabvatin asâbahâ vâbilun fa'âtat ukulahâ di'fayn, fa'illam yusibhâ vâbilun fatall, vallâhu bimâ ta'malûna basîr.","Mallarını Allah'ın rızasını kazanmak ve içlerindeki imanı sağlamlaştırmak için sarf edenlerin durumu ise bir tepe üzerindeki bahçenin haline benzer. Kuvvetli bir sağanak düşünce meyvelerini iki kat verir. Bol yağmur isabet etmezse de çisinti vardır. Allah, yaptıklarınızı görmektedir.",""],[266,"أَيَوَدُّ أَحَدُكُمْ أَن تَكُونَ لَهُۥ جَنَّةٌ مِّن نَّخِيلٍ وَأَعْنَابٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ لَهُۥ فِيهَا مِن كُلِّ ٱلثَّمَرَٰتِ وَأَصَابَهُ ٱلْكِبَرُ وَلَهُۥ ذُرِّيَّةٌ ضُعَفَآءُ فَأَصَابَهَآ إِعْصَارٌ فِيهِ نَارٌ فَٱحْتَرَقَتْ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلْـَٔايَٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَ","Ayavaddu ahadukum an takûna lahû cannatum min nahîliv ve a'nâbin tacrî min tahtihal-anhâr, lahû fîhâ min kullis-samarât, ve asâbahul-kibaru ve lahû zurriyyatun du'afâ', fa'asâbahâ i'sârun fîhi nârun fahtarakat, kazâlika yubayyinullâhu lakumul-âyâti la'allakum tatafakkarûn.","Sizden biriniz arzu eder mi ki, hurma ve üzüm ağaçlarıyla dolu, altından ırmaklar akan ve içinde her çeşit meyveden bulunan bir bahçesi olsun da, kendisi ihtiyarlamış, çocukları da güçsüz kalmışken, bahçesi ateşli bir kasırga ile yanıversin. Düşünesiniz diye Allah, size ayetlerini böyle açıklar.",""],[267,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَنفِقُوا۟ مِن طَيِّبَٰتِ مَا كَسَبْتُمْ وَمِمَّآ أَخْرَجْنَا لَكُم مِّنَ ٱلْأَرْضِ وَلَا تَيَمَّمُوا۟ ٱلْخَبِيثَ مِنْهُ تُنفِقُونَ وَلَسْتُم بِـَٔاخِذِيهِ إِلَّآ أَن تُغْمِضُوا۟ فِيهِ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَنِىٌّ حَمِيدٌ","Yâ ayyuhal-lazîna âmanû anfikû min tayyibâti mâ kasabtum ve mimmâ ahracnâ lakum minal-ard, ve lâ tayammamul-habîsa minhu tunfikûna ve lastum bi'âhizîhi illâ an tugmidû fîh, ve'lamû annallâha ganiyyun hamîd.","Ey iman edenler! Gerek kazandıklarınızın ve gerekse yerden sizin için çıkardıklarımızın iyilerinden bağışta bulunun. Göz yummadan alıcısı olmayacağınız kötü şeyleri vermeye kalkışmayın. Bilin ki Allah, hiçbir şeye ihtiyacı olmayan ve hamt edilmeye layık olandır.",""],[268,"ٱلشَّيْطَٰنُ يَعِدُكُمُ ٱلْفَقْرَ وَيَأْمُرُكُم بِٱلْفَحْشَآءِ وَٱللَّهُ يَعِدُكُم مَّغْفِرَةً مِّنْهُ وَفَضْلًا وَٱللَّهُ وَٰسِعٌ عَلِيمٌ","Aş-şaytânu ya'idukumul-fakra ve ya'murukum bil-fahşâ', vallâhu ya'idukum magfiratam minhu ve fadlâ, vallâhu vâsi'un 'alîm.","Şeytan sizi fakirlikle korkutur ve size cimriliği telkin eder. Allah ise, size mağfiretini ve bolluk vadediyor. Allah her şeyi kuşatandır ve her şeyi bilendir.",""],[269,"يُؤْتِى ٱلْحِكْمَةَ مَن يَشَآءُ وَمَن يُؤْتَ ٱلْحِكْمَةَ فَقَدْ أُوتِىَ خَيْرًا كَثِيرًا وَمَا يَذَّكَّرُ إِلَّآ أُو۟لُوا۟ ٱلْأَلْبَٰبِ","Yu'til-hikmata may yaşâ', ve may yu'tal-hikmata fakad ûtiya hayran kasîrâ, ve mâ yazzakkaru ilâ ulul-albâb.","O, hikmeti dilediği kimseye verir. Hikmet verilen kimseye pek çok hayır da verilmiştir. Akıl sahiplerinden başkası öğüt alıp düşünmez.",""],[270,"وَمَآ أَنفَقْتُم مِّن نَّفَقَةٍ أَوْ نَذَرْتُم مِّن نَّذْرٍ فَإِنَّ ٱللَّهَ يَعْلَمُهُۥ وَمَا لِلظَّٰلِمِينَ مِنْ أَنصَارٍ","Ve mâ anfaktum min nafakatin av nazartum min nazrin fa innallâha ya'lamuh, ve mâ liz-zâlimîna min ansâr.","Yaptığınız her harcamayı ve adadığınız her adağı muhakkak Allah bilir. O gün zalimler için hiç bir yardımcı yoktur.",""],[271,"إِن تُبْدُوا۟ ٱلصَّدَقَٰتِ فَنِعِمَّا هِىَ وَإِن تُخْفُوهَا وَتُؤْتُوهَا ٱلْفُقَرَآءَ فَهُوَ خَيْرٌ لَّكُمْ وَيُكَفِّرُ عَنكُم مِّن سَيِّـَٔاتِكُمْ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ","In tubdus-sadakâti fani'immâ hiy, ve in tuhfûhâ ve tu'tûhal-fukarâ'a fahuva hayrul lakum, ve yukaffiru 'ankum min sayyi'âtikum, vallâhu bimâ ta'malûna habîr.","Eğer sadakaları açık olarak verirseniz o, ne güzeldir. Şayet onu gizleyip de fakirlere verirseniz, o da sizin için (daha) hayırlıdır. (Allah bununla) günahlarınızı örtüp, bağışlar. Allah, yaptıklarınızdan tamamıyla haberdardır.",""],[272,"لَّيْسَ عَلَيْكَ هُدَىٰهُمْ وَلَٰكِنَّ ٱللَّهَ يَهْدِى مَن يَشَآءُ وَمَا تُنفِقُوا۟ مِنْ خَيْرٍ فَلِأَنفُسِكُمْ وَمَا تُنفِقُونَ إِلَّا ٱبْتِغَآءَ وَجْهِ ٱللَّهِ وَمَا تُنفِقُوا۟ مِنْ خَيْرٍ يُوَفَّ إِلَيْكُمْ وَأَنتُمْ لَا تُظْلَمُونَ","Laysa 'alayka hudâhum ve lâkinnallâha yahdî may yaşâ', ve mâ tunfikû min hayrin fa li'anfusikum, ve mâ tunfikûna illabtigâ'a vachillâh, ve mâ tunfikû min hayriy yuvaffa ilaykum ve antum lâ tuzlamûn.","(Ey Muhammed!) Onları hidayete erdirmek senin üzerine (bir sorumluluk) değildir. Fakat Allah, dilediği kimseyi hidayete erdirir. İyilik olarak her ne verirseniz, o kendiniz içindir. Zaten siz, yalnız Allah’ın rızasını/vechini kazanmak için verirsiniz. İyilik olarak ne verirseniz (bunun karşılığı) size eksiksizce ödenecektir. Ve siz, haksızlığa uğratılmazsınız.",""],[273,"لِلْفُقَرَآءِ ٱلَّذِينَ أُحْصِرُوا۟ فِى سَبِيلِ ٱللَّهِ لَا يَسْتَطِيعُونَ ضَرْبًا فِى ٱلْأَرْضِ يَحْسَبُهُمُ ٱلْجَاهِلُ أَغْنِيَآءَ مِنَ ٱلتَّعَفُّفِ تَعْرِفُهُم بِسِيمَٰهُمْ لَا يَسْـَٔلُونَ ٱلنَّاسَ إِلْحَافًا وَمَا تُنفِقُوا۟ مِنْ خَيْرٍ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌ","Lil-fukarâ'il-lazîna uhsirû fî sabîlillâhi lâ yastatî'ûna darban fil-ard, yahsabuhumul-câhilu agniyâ'a minat-ta'affuf, ta'rifuhum bisîmâhum, lâ yas'alûnan-nâsa ilhâfâ, ve mâ tunfikû min hayrin fa innallâha bihî 'alîm.","(Sadakalar) Allah yolunda mahsur kalmış, kazanç için yeryüzünde dolaşamayan, çekingenliklerinden dolayı bilmeyenlerin onları zengin zannettikleri, senin de simalarından tanıdığın ısrarlı bir şekilde insanlardan istemeyen fakirler içindir. Hayır olarak ne harcarsanız, şüphesiz Allah onu hakkıyla bilir.",""],[274,"ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُم بِٱلَّيْلِ وَٱلنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","Allazîna yunfikûna amvâlahum bil-layli van-nahâri sirrav ve 'alâniyatan falahum acruhum 'inda rabbihim, ve lâ havfun 'alayhim ve lâ hum yahzanûn.","Gece ve gündüz, gizli ve açık olarak mallarından verenler, işte onlar için Rableri katında mükâfatlar vardır! Onlara korku yoktur, mahzun da olmayacaklardır.",""],[275,"ٱلَّذِينَ يَأْكُلُونَ ٱلرِّبَوٰا۟ لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ ٱلَّذِى يَتَخَبَّطُهُ ٱلشَّيْطَٰنُ مِنَ ٱلْمَسِّ ذَٰلِكَ بِأَنَّهُمْ قَالُوٓا۟ إِنَّمَا ٱلْبَيْعُ مِثْلُ ٱلرِّبَوٰا۟ وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ وَحَرَّمَ ٱلرِّبَوٰا۟ فَمَن جَآءَهُۥ مَوْعِظَةٌ مِّن رَّبِّهِۦ فَٱنتَهَىٰ فَلَهُۥ مَا سَلَفَ وَأَمْرُهُۥٓ إِلَى ٱللَّهِ وَمَنْ عَادَ فَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ هُمْ فِيهَا خَٰلِدُونَ","Allazîna ya'kulûnar-ribâ lâ yakûmûna illâ kamâ yakûmul-lazî yatahabbatuhuş-şaytânu minal-mass, zâlika bi'annahum kâlû innamal-bay'u mislur-ribâ, ve ahallallâhul-bay'a ve harramar-ribâ, faman câ'ahû mav'izatum mir rabbihî fantahâ falahû mâ salaf, ve amruhû ilallâh, ve man 'âda fa ulâ'ika ashâbun-nâr, hum fîhâ hâlidûn.","Faiz yiyenler, ancak şeytanın çarptığı kimsenin kalktığı gibi kalkarlar. Bu, onların, “Alışveriş de faiz gibidir” demelerinden dolayıdır. Oysa Allah, alışverişi helâl, faizi haram kılmıştır. Bundan böyle kime Rabbinden bir öğüt gelir de (o öğüte uyarak) faizden vazgeçerse, artık önceden aldığı onun olur. Durumu da Allah’a kalmıştır. (Allah, onu affeder.) Kim tekrar (faize) dönerse, işte onlar cehennemliklerdir. Orada ebedî kalacaklardır.",""],[276,"يَمْحَقُ ٱللَّهُ ٱلرِّبَوٰا۟ وَيُرْبِى ٱلصَّدَقَٰتِ وَٱللَّهُ لَا يُحِبُّ كُلَّ كَفَّارٍ أَثِيمٍ","Yamhakullâhur-ribâ ve yurbis-sadakât, vallâhu lâ yuhibbu kulla kaffârin asîm.","Allah, faizi yok eder, sadakaları ise bereketlendirir. Allah, hiçbir günahkâr kâfiri sevmez.",""],[277,"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَءَاتَوُا۟ ٱلزَّكَوٰةَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","Innal-lazîna âmanû ve 'amilus-sâlihâti ve akâmus-salâta ve âtuz-zakâta lahum acruhum 'inda rabbihim, ve lâ havfun 'alayhim ve lâ hum yahzanûn.","Şüphesiz iman edenler, salih amel işleyenler, namazı dosdoğru kılanlar ve zekâtı verenler için Rableri katında mükâfatları vardır. Onlara korku yoktur. Onlar, mahzun da olmayacaklardır.",""],[278,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَذَرُوا۟ مَا بَقِىَ مِنَ ٱلرِّبَوٰٓا۟ إِن كُنتُم مُّؤْمِنِينَ","Yâ ayyuhal-lazîna âmanuttakullâha ve zarû mâ bakiya minar-ribâ in kuntum mu'minîn.","Ey iman edenler! Eğer gerçekten Mümin iseniz, Allah’tan korkun ve faizden geri kalanı bırakın.",""],[279,"فَإِن لَّمْ تَفْعَلُوا۟ فَأْذَنُوا۟ بِحَرْبٍ مِّنَ ٱللَّهِ وَرَسُولِهِۦ وَإِن تُبْتُمْ فَلَكُمْ رُءُوسُ أَمْوَٰلِكُمْ لَا تَظْلِمُونَ وَلَا تُظْلَمُونَ","Fa'illam taf'alû fa'zanû biharbim minallâhi ve rasûlih, ve in tubtum falakum ru'ûsu amvâlikum, lâ tazlimûna ve lâ tuzlamûn.","Eğer böyle yapmazsanız, bunun Allah’a ve elçisine karşı açılmış bir savaş olduğunu bilin. Şayet tevbe ederseniz, ana paranız sizindir. (Böylece) zulmetmemiş ve de zulme uğramamış olursunuz.",""],[280,"وَإِن كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَن تَصَدَّقُوا۟ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ","Ve in kâna zû 'usratin fanaziratun ilâ maysarah, ve an tasaddakû hayrul lakum in kuntum ta'lamûn.","Eğer (borçlu) darda ise eli genişleyinceye kadar ona mühlet verin. Sadaka olarak bağışlamanız, bilirseniz sizin için daha hayırlıdır.",""],[281,"وَٱتَّقُوا۟ يَوْمًا تُرْجَعُونَ فِيهِ إِلَى ٱللَّهِ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ","Vattakû yavman turca'ûna fîhi ilallâh, summa tuvaffâ kullu nafsim mâ kasabat ve hum lâ yuzlamûn.","Allah'a döndürüleceğiniz ve sonra zulme uğramadan herkesin kazancının kendisine eksiksiz verileceği günden korkunuz.",""],[282,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍ مُّسَمًّى فَٱكْتُبُوهُ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبٌۢ بِٱلْعَدْلِ وَلَا يَأْبَ كَاتِبٌ أَن يَكْتُبَ كَمَا عَلَّمَهُ ٱللَّهُ فَلْيَكْتُبْ وَلْيُمْلِلِ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ وَلَا يَبْخَسْ مِنْهُ شَيْـًٔا فَإِن كَانَ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ سَفِيهًا أَوْ ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَن يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُۥ بِٱلْعَدْلِ وَٱسْتَشْهِدُوا۟ شَهِيدَيْنِ مِن رِّجَالِكُمْ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌ وَٱمْرَأَتَانِ مِمَّن تَرْضَوْنَ مِنَ ٱلشُّهَدَآءِ أَن تَضِلَّ إِحْدَىٰهُمَا فَتُذَكِّرَ إِحْدَىٰهُمَا ٱلْأُخْرَىٰ وَلَا يَأْبَ ٱلشُّهَدَآءُ إِذَا مَا دُعُوا۟ وَلَا تَسْـَٔمُوٓا۟ أَن تَكْتُبُوهُ صَغِيرًا أَوْ كَبِيرًا إِلَىٰٓ أَجَلِهِۦ ذَٰلِكُمْ أَقْسَطُ عِندَ ٱللَّهِ وَأَقْوَمُ لِلشَّهَٰدَةِ وَأَدْنَىٰٓ أَلَّا تَرْتَابُوٓا۟ إِلَّآ أَن تَكُونَ تِجَٰرَةً حَاضِرَةً تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَلَّا تَكْتُبُوهَا وَأَشْهِدُوٓا۟ إِذَا تَبَايَعْتُمْ وَلَا يُضَآرَّ كَاتِبٌ وَلَا شَهِيدٌ وَإِن تَفْعَلُوا۟ فَإِنَّهُۥ فُسُوقٌۢ بِكُمْ وَٱتَّقُوا۟ ٱللَّهَ وَيُعَلِّمُكُمُ ٱللَّهُ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌ","Yâ ayyuhal-lazîna âmanû izâ tadâyantum bidaynin ilâ acalim musamman faktubûh, valyaktub baynakum kâtibum bil-'adl, ve lâ ya'ba kâtibun ay yaktuba kamâ 'allamahullâhu falyaktub, valyumlilil-lazî 'alayhil-hakku valyattakillâha rabbahû ve lâ yabhas minhu şay'â, fa'in kânal-lazî 'alayhil-hakku safîhan av da'îfan av lâ yastatî'u ay yumilla huva falyumlil valiyyuhû bil-'adl, vastaşhidû şahîdayni mir ricâliûkum, fa'illam yakûnâ raculayni faraculuv vamra'atâni mimman tardavna minaş-şuhadâ'i an tadilla ihdâhumâ fatuzakkira ihdâhumal-uhrâ, ve lâ ya'baş-şuhadâ'u izâ mâ du'û, ve lâ tas'amû an taktubûhu sagîran av kabîran ilâ acalih, zâlikum aksatu 'indallâhi ve akvamu liş-şahâdati ve adnâ allâ tartâbû illâ an takûna ticâratan hâdiratan tudîrûnahâ baynakum falaysa 'alaykum cunâhun allâ taktubûhâ, ve aşhidû izâ tabâya'tum, ve lâ yudârra kâtibuv ve lâ şahîd, ve in taf'alû fa'innahû fusûkum bikum, vattakullâh, ve yu'allimukumullâh, vallâhu bikulli şay'in 'alîm.","Ey iman edenler! Belirli bir süreye kadar borçlandığınız zaman onu yazın. Aranızda bir kâtip doğru olarak yazsın. Kâtip, Allah’ın kendisine öğrettiği gibi yazmaktan kaçınmasın, yazsın. (Katibe) borçlu olan yazdırsın. Rabbi olan Allah’tan korksun da ondan hiçbir şeyi eksiltmesin. Eğer borçlu cahil/sefih veya zayıf ya da bizzat kendisi yazdırmaya gücü yetmezse, velisi (onu) dosdoğru yazdırsın. Erkeklerinizden iki de şahit bulundurun. Eğer iki erkek yoksa, razı olacağınız şahitlerden, bir erkek ve biri unuttuğu zaman diğerinin ona hatırlatması için iki kadın şahitler çağrıldıklarında (şahitlik etmekten) kaçınmasınlar. Küçük olsun, büyük olsun borcu süresiyle birlikte yazmaya üşenmeyin. Bu, Allah katında daha adaletli, şahitlik için daha sağlam, şüpheye düşmemeniz için de en isabetli olandır. Ancak aranızda yaptığınız alışverişin peşin bir ticaret olması halinde onu yazmamanızın bir günahı yoktur. Alışveriş yaptığınız zaman da şahit tutun. Yazana da şahide de zarar verilmesin. Eğer bir zarar verirseniz bu şüphesiz, sizin hak yoldan çıkmanız demektir. Allah’tan korkun. Allah (bunları) size öğretmektedir. Allah her şeyi bilendir.",""],[283,"وَإِن كُنتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا۟ كَاتِبًا فَرِهَٰنٌ مَّقْبُوضَةٌ فَإِنْ أَمِنَ بَعْضُكُم بَعْضًا فَلْيُؤَدِّ ٱلَّذِى ٱؤْتُمِنَ أَمَٰنَتَهُۥ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ وَلَا تَكْتُمُوا۟ ٱلشَّهَٰدَةَ وَمَن يَكْتُمْهَا فَإِنَّهُۥٓ ءَاثِمٌ قَلْبُهُۥ وَٱللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ","Ve in kuntum 'alâ safariv ve lam tacidû kâtiban fa rihânum makbûdah, fa'in amina ba'dukum ba'dan falyu'addil-lazi'tumina amânatahû valyattakillâha rabbah, ve lâ taktumuş şahâdah, ve may yaktumhâ fa'innahû âsimun kalbuh, vallâhu bimâ ta'malûna 'alîm.","Eğer yolculukta iseniz bir kâtip de bulamazsanız, (borca karşılık) alınmış rehinler yeterlidir. Eğer birbirinize güvenirseniz, kendisine güvenilen kimse emanetini ödesin. Şahitliği gizlemeyin; kim onu gizlerse, o mutlaka kalben günahkârdır. Allah, yapmakta olduklarınızı bilendir.",""],[284,"لِّلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ وَإِن تُبْدُوا۟ مَا فِىٓ أَنفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُم بِهِ ٱللَّهُ فَيَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Lillâhi mâ fis-samâvâti ve mâ fil-ard, ve in tubdû mâ fî anfusikum av tuhfûhu yuhâsibkum bihillâh, fayagfiru limay yaşâ'u ve yu'azzibu may yaşâ', vallâhu 'alâ kulli şay'in kadîr.","Göklerde ve yerde ne varsa Allah’ındır. İçinizdekini açıklasanız da gizleseniz de Allah, onunla sizi hesaba çeker. Sonra da dilediği kimseyi bağışlar, dilediği kimseyi de azaba uğratır. Allah’ın her şeye gücü yeter.",""],[285,"ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِۦ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ","Âmanar-rasûlu bimâ unzila ilayhi mir rabbihî vel-mu'minûn, kullun âmana billâhi ve malâ'ikatihî ve kutubihî ve rusulih, lâ nufarriku bayna ahadim mir rusulih, ve kâlû sami'nâ ve ata'nâ, gufrânaka rabbanâ ve ilaykal-masîr.","Peygamber, Rabbinden kendisine indirilene iman etmiştir, Müminler de! Hepsi de Allah’a, meleklerine, kitaplarına ve peygamberlerine iman etmiş ve Allah’ın peygamberlerinden hiçbirini (diğerinden) ayırmayız. İşittik ve itaat ettik, demişlerdir. Rabbimiz! Bağışlamanı dileriz, dönüş sanadır.",""],[286,"لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","Lâ yukallifullâhu nafsan illâ vus'ahâ, lahâ mâ kasabat ve 'alayhâ maktasabat, rabbanâ lâ tu'âhiznâ in nasînâ av ahta'nâ, rabbanâ ve lâ tahmil 'alaynâ isran kamâ hamaltahû 'alal-lazîna min kablinâ, rabbanâ ve lâ tuhammilnâ mâ lâ tâkata lanâ bih, ve'fu 'annâ, vagfir lanâ, varhamnâ, anta mavlânâ fansurnâ 'alal kavmil-kâfirîn.","Allah, hiç kimseye gücünün üstünde bir şey (sorumluluk) yüklemez. (Herkesin) kazandığı (iyilik) lehine ve işlediği (kötülük) ise aleyhinedir! Rabbimiz, eğer unuttuk veya hata yaptıysak bizi hesaba çekme. Rabbimiz! Bizden öncekilere yüklediğin gibi bize de ağır bir görev yükleme. Rabbimiz! Gücümüzün yetmeyeceğini bize taşıtma. Bizi affet, bizi bağışla ve bize merhamet et. Sen bizim mevlâmızsın. Kâfir topluma karşı bize yardım et.",""]],"3":[[1,"الٓمٓ","Alif lâm mîm.","Elif, Lâm, Mîm.",""],[2,"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ","Allâhu lâ ilâha illâ huval-hayyul-kayyûm.","Allah, kendisinden başka (ibadet edilmeye layık) hak ilah olmayan, her zaman diri, ölümsüz, bütün varlıkların tek yöneteni ve gözeteni olan tek hak ilahtır.",""],[3,"نَزَّلَ عَلَيْكَ ٱلْكِتَٰبَ بِٱلْحَقِّ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ وَأَنزَلَ ٱلتَّوْرَىٰةَ وَٱلْإِنجِيلَ","Nazzala 'alaykal-kitâba bil-hakki musaddikal limâ bayna yadayhi ve anzalat-tavrâta vel-incîl.","O, sana kitabı hak ve önceki kitapları tasdik edici olarak indirdi. Tevrat ile İncil'i de indirmişti.",""],[4,"مِن قَبْلُ هُدًى لِّلنَّاسِ وَأَنزَلَ ٱلْفُرْقَانَ إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِ ٱللَّهِ لَهُمْ عَذَابٌ شَدِيدٌ وَٱللَّهُ عَزِيزٌ ذُو ٱنتِقَامٍ","Min kablu hudal lin-nâsi ve anzalal-furkân, innal-lazîna kafarû bi âyâtillâhi lahum 'azâbun şadîd, vallâhu 'azîzun zuntikâm.","Daha önce, insanlar için yol gösterici ve hakkı batıldan ayıran/Furkan'ı da indirmişti. Allah’ın ayetlerini inkâr edenlere, şiddetli bir azap vardır. Allah çok güçlüdür, intikam sahibidir.",""],[5,"إِنَّ ٱللَّهَ لَا يَخْفَىٰ عَلَيْهِ شَىْءٌ فِى ٱلْأَرْضِ وَلَا فِى ٱلسَّمَآءِ","Innallâha lâ yahfâ 'alayhi şay'un fil-ardi ve lâ fis-samâ'.","Allah’a yer ve gökte olanlardan hiçbir şey gizli kalmaz.",""],[6,"هُوَ ٱلَّذِى يُصَوِّرُكُمْ فِى ٱلْأَرْحَامِ كَيْفَ يَشَآءُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ","Huval-lazî yusavvirukum fil-arhâmi kayfa yaşâ', lâ ilâha illâ huval-'azîzul-hakîm.","Ana rahminde size dilediği gibi şekil veren O’dur. Kendinden başka (ibadete layık hak) ilah olmayan, Aziz ve Hakim olan O’dur.",""],[7,"هُوَ ٱلَّذِىٓ أَنزَلَ عَلَيْكَ ٱلْكِتَٰبَ مِنْهُ ءَايَٰتٌ مُّحْكَمَٰتٌ هُنَّ أُمُّ ٱلْكِتَٰبِ وَأُخَرُ مُتَشَٰبِهَٰتٌ فَأَمَّا ٱلَّذِينَ فِى قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَٰبَهَ مِنْهُ ٱبْتِغَآءَ ٱلْفِتْنَةِ وَٱبْتِغَآءَ تَأْوِيلِهِۦ وَمَا يَعْلَمُ تَأْوِيلَهُۥٓ إِلَّا ٱللَّهُ وَٱلرَّٰسِخُونَ فِى ٱلْعِلْمِ يَقُولُونَ ءَامَنَّا بِهِۦ كُلٌّ مِّنْ عِندِ رَبِّنَا وَمَا يَذَّكَّرُ إِلَّآ أُو۟لُوا۟ ٱلْأَلْبَٰبِ","Huval-lazî anzala 'alaykal-kitâba minhu âyâtum muhkamâtun hunna ummul-kitâbi ve uharu mutaşâbihât, fa'ammal-lazîna fî kulûbihim zaygun fayattabi'ûna mâ taşâbaha minhubtigâ'al-fitnati vabtigâ'a ta'vîlih, ve mâ ya'lamu ta'vîlahû illallâh, var-râsihûna fil-'ilmi yakûlûna âmannâ bih, kullum min 'indi rabbinâ, ve mâ yazzakkaru illâ ulul-albâb.","Sana kitabı indiren O’dur. Onun bir kısmı, muhkem ki bunlar kitabın özüdür. Bir kısmı da müteşabih ayetlerdir. Kalplerinde eğrilik olanlar, fitne çıkarmak ve (kendilerine göre) onun tevilini yapmak için onun müteşabih olanlarına uyarlar. Oysa, onun tevilini Allah’tan başkası bilmez. İlimde derinleşenler ise “Biz, ona iman ettik, onun hepsi Rabbimizin katındandır.” derler. Temiz akıl sahiplerinden başkası düşünmez.",""],[8,"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً إِنَّكَ أَنتَ ٱلْوَهَّابُ","Rabbanâ lâ tuzig kulûbanâ ba'da iz hadaytanâ ve hab lanâ mil ladunka rahmah, innaka antal-vahhâb.","Rabbimiz! Bizi doğru yola ilettikten sonra, kalplerimizi eğriltme. Bize katından rahmet bahşet! Şüphesiz sen, bol bol bahşedensin.",""],[9,"رَبَّنَآ إِنَّكَ جَامِعُ ٱلنَّاسِ لِيَوْمٍ لَّا رَيْبَ فِيهِ إِنَّ ٱللَّهَ لَا يُخْلِفُ ٱلْمِيعَادَ","Rabbanâ innaka câmi'un-nâsi liyavmil lâ rayba fîh, innallâha lâ yuhliful-mî'âd.","Rabbimiz! Hakkında şüphe olmayan günde bütün insanları mutlaka toplayacak olan şüphesiz sensin. Şüphesiz ki Allah sözünden asla dönmez.",""],[10,"إِنَّ ٱلَّذِينَ كَفَرُوا۟ لَن تُغْنِىَ عَنْهُمْ أَمْوَٰلُهُمْ وَلَآ أَوْلَٰدُهُم مِّنَ ٱللَّهِ شَيْـًٔا وَأُو۟لَٰٓئِكَ هُمْ وَقُودُ ٱلنَّارِ","Innal-lazîna kafarû lan tugniya 'anhum amvâluhum ve lâ avlâduhum minallâhi şay'â, ve ulâ'ika hum vakûdun-nâr.","Şüphesiz kâfir olanlara ne malları ve ne de çocukları Allah'ın (azabına) karşılık hiçbir fayda sağlamaz. İşte bunlar, ateşin yakıtı olanlardır.",""],[11,"كَدَأْبِ ءَالِ فِرْعَوْنَ وَٱلَّذِينَ مِن قَبْلِهِمْ كَذَّبُوا۟ بِـَٔايَٰتِنَا فَأَخَذَهُمُ ٱللَّهُ بِذُنُوبِهِمْ وَٱللَّهُ شَدِيدُ ٱلْعِقَابِ","Kada'bi âli fir'avn, vel-lazîna min kablihim, kazzabû bi'âyâtinâ, fa'ahazahumullâhu bizunûbihim, vallâhu şadîdul-'ikâb.","Tıpkı Firavun Hanedanı ve onlardan öncekilerin durumu gibi ayetlerimizi yalanladılar da Allah da onları günahları sebebiyle cezalandırdı. Allah, cezası çok çetin olandır.",""],[12,"قُل لِّلَّذِينَ كَفَرُوا۟ سَتُغْلَبُونَ وَتُحْشَرُونَ إِلَىٰ جَهَنَّمَ وَبِئْسَ ٱلْمِهَادُ","Kul lil-lazîna kafarû satuglabûna ve tuhşarûna ilâ cahannam, ve bi'sal-mihâd.","(Rasûlüm) Kâfirlere de ki: Yakında yenilgiye uğrayacak ve toplanıp Cehennem'e sürüleceksiniz. Orası ne kötü yerleşme yeridir.",""],[13,"قَدْ كَانَ لَكُمْ ءَايَةٌ فِى فِئَتَيْنِ ٱلْتَقَتَا فِئَةٌ تُقَٰتِلُ فِى سَبِيلِ ٱللَّهِ وَأُخْرَىٰ كَافِرَةٌ يَرَوْنَهُم مِّثْلَيْهِمْ رَأْىَ ٱلْعَيْنِ وَٱللَّهُ يُؤَيِّدُ بِنَصْرِهِۦ مَن يَشَآءُ إِنَّ فِى ذَٰلِكَ لَعِبْرَةً لِّأُو۟لِى ٱلْأَبْصَٰرِ","Kad kâna lakum âyatun fî fi'ataynil takatâ, fi'atun tukâtilu fî sabîlillâhi ve uhrâ kâfiratuy yaravnahum mislayhim ra'yal-'ayn, vallâhu yu'ayyidu binasrihî may yaşâ', inna fî zâlika la'ibratal li'ulil-absâr.","(Bedir'de) Karşı karşıya gelen iki toplulukta, sizin için bir ayet vardır. Bunlardan biri Allah yolunda savaşıyordu, diğeri ise kâfir idi. Gözleriyle onların kendilerinin iki misli olduklarını görüyorlardı. Allah, dilediğini yardımıyla güçlendirir. Bunda, basiret sahipleri için gerçekten ibret vardır.",""],[14,"زُيِّنَ لِلنَّاسِ حُبُّ ٱلشَّهَوَٰتِ مِنَ ٱلنِّسَآءِ وَٱلْبَنِينَ وَٱلْقَنَٰطِيرِ ٱلْمُقَنطَرَةِ مِنَ ٱلذَّهَبِ وَٱلْفِضَّةِ وَٱلْخَيْلِ ٱلْمُسَوَّمَةِ وَٱلْأَنْعَٰمِ وَٱلْحَرْثِ ذَٰلِكَ مَتَٰعُ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَٱللَّهُ عِندَهُۥ حُسْنُ ٱلْمَـَٔابِ","Zuyyina lin-nâsi hubbuş-şahavâti minan-nisâ'i vel-banîna vel-kanâtîril-mukantarati minaz-zahabi vel-fiddati vel-haylil-musavvamati vel-an'âmi vel-hars, zâlika matâ'ul-hayâtid-dun-yâ, vallâhu 'indahû husnul-ma'âb.","Nefsî arzulardan olan, kadınlara, evlatlara, öbek öbek yığılmış altın ve gümüşe, güzel cins atlara, davarlara ve ekinlere karşı aşırı sevgi insanlara çekici ve hoş gösterildi. Oysa bunlar, (fani olan) dünya hayatının nimetleridir. Asıl varılacak güzel yer Allah katındadır.",""],[15,"قُلْ أَؤُنَبِّئُكُم بِخَيْرٍ مِّن ذَٰلِكُمْ لِلَّذِينَ ٱتَّقَوْا۟ عِندَ رَبِّهِمْ جَنَّٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَا وَأَزْوَٰجٌ مُّطَهَّرَةٌ وَرِضْوَٰنٌ مِّنَ ٱللَّهِ وَٱللَّهُ بَصِيرٌۢ بِٱلْعِبَادِ","Kul a'unabbi'ukum bihayrim min zâlikum, lil-lazînattakav 'inda rabbihim cannâtun tacrî min tahtihal-anhâru hâlidîna fîhâ ve azvâcum mutahharatuv ve ridvânum minallâh, vallâhu basîrum bil-'ibâd.","De ki: Size, bundan daha hayırlı olanı haber vereyim mi? Allah’tan korkan/günahlardan sakınanlara, altından nehirler akan ebedi kalacakları Cennetler vardır. Tertemiz eşler ve Allah’ın rızası vardır. Allah, kullarını hakkıyla görendir.",""],[16,"ٱلَّذِينَ يَقُولُونَ رَبَّنَآ إِنَّنَآ ءَامَنَّا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ ٱلنَّارِ","Allazîna yakûlûna rabbanâ innanâ âmannâ fagfir lanâ zunûbanâ ve kinâ 'azâban-nâr.","Onlar: \"Rabbimiz! Biz, kesin olarak iman ettik. Bizim günahlarımızı bağışla ve bizi ateşin azabından koru!\" derler.",""],[17,"ٱلصَّٰبِرِينَ وَٱلصَّٰدِقِينَ وَٱلْقَٰنِتِينَ وَٱلْمُنفِقِينَ وَٱلْمُسْتَغْفِرِينَ بِٱلْأَسْحَارِ","As-sâbirîna vas-sâdikîna vel-kânitîna vel-munfikîna vel-mustagfirîna bil-ashâr.","(Onlar): Sabredenler, sadık olanlar, gönülden boyun eğip itaat edenler, sadaka verenler ve seher vakitlerinde bağışlanma dileyenlerdir.",""],[18,"شَهِدَ ٱللَّهُ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا هُوَ وَٱلْمَلَٰٓئِكَةُ وَأُو۟لُوا۟ ٱلْعِلْمِ قَآئِمًۢا بِٱلْقِسْطِ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ","Şahidallâhu annahû lâ ilâha illâ huv, vel-malâ'ikatu ve ulul-'ilmi kâ'imam bil-kist, lâ ilâha illâ huval-'azîzul-hakîm.","Allah şahittir ki kendisinden başka (ibadet edilmeye layık hak) bir ilah yoktur. Melekler ve adaleti ayakta tutan ilim sahipleri de (buna şahittir.) O’ndan başka (hak) ilah yoktur. O, Aziz'dir, Hakim'dir.",""],[19,"إِنَّ ٱلدِّينَ عِندَ ٱللَّهِ ٱلْإِسْلَٰمُ وَمَا ٱخْتَلَفَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَهُمُ ٱلْعِلْمُ بَغْيًۢا بَيْنَهُمْ وَمَن يَكْفُرْ بِـَٔايَٰتِ ٱللَّهِ فَإِنَّ ٱللَّهَ سَرِيعُ ٱلْحِسَابِ","Innad-dîna 'indallâhil-islâm, ve mahtalafal-lazîna ûtul-kitâba illâ mim ba'di mâ câ'ahumul-'ilmu bagyam baynahum, ve may yakfur bi'âyâtillâhi fa innallâha sarî'ul-hisâb.","Şüphesiz, Allah katında din İslam’dır. Kendilerine kitap verilenler, kendilerine ilim geldikten sonra, sadece aralarındaki haset ve kıskançlık yüzünden ihtilafa düştüler. Kim Allah’ın ayetlerini inkâr ederse şüphesiz Allah, hesabı çok çabuk görendir.",""],[20,"فَإِنْ حَآجُّوكَ فَقُلْ أَسْلَمْتُ وَجْهِىَ لِلَّهِ وَمَنِ ٱتَّبَعَنِ وَقُل لِّلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ وَٱلْأُمِّيِّـۧنَ ءَأَسْلَمْتُمْ فَإِنْ أَسْلَمُوا۟ فَقَدِ ٱهْتَدَوا۟ وَّإِن تَوَلَّوْا۟ فَإِنَّمَا عَلَيْكَ ٱلْبَلَٰغُ وَٱللَّهُ بَصِيرٌۢ بِٱلْعِبَادِ","Fa'in hâccûka fa kul aslamtu vachiya lillâhi ve manittaba'an, ve kul lil-lazîna ûtul-kitâba vel-ummiyyîna a'aslamtum, fa'in aslamû fakadihtadav, ve in tavallav fa'innamâ 'alaykal-balâg, vallâhu basîrum bil-'ibâd.","Seninle tartışmaya girişirlerse de ki: \"Ben, bana tabi olanlarla birlikte yüzümü Allah’a teslim ettim.\" Kendilerine kitap verilenlere ve ümmilere de de ki: \"Siz de teslim oldunuz mu?\" Eğer teslim oldularsa doğru yolu bulmuşlar demektir. Eğer yüz çevirirlerse, sana düşen yalnızca tebliğdir. Allah kullarını görmektedir.",""],[21,"إِنَّ ٱلَّذِينَ يَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلنَّبِيِّـۧنَ بِغَيْرِ حَقٍّ وَيَقْتُلُونَ ٱلَّذِينَ يَأْمُرُونَ بِٱلْقِسْطِ مِنَ ٱلنَّاسِ فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ","Innal-lazîna yakfurûna bi'âyâtillâhi ve yaktulûnan nabiyyîna bigayri hakk, ve yaktulûnal-lazîna ya'murûna bil-kisti minan-nâs, fabaşşirhum bi'azâbin alîm.","Allah’ın ayetlerini inkâr edenlere, peygamberleri haksız yere öldürenlere, insanlardan adaleti emredenleri öldürenlere, işte onlara acıklı bir azap müjdesi ver.",""],[22,"أُو۟لَٰٓئِكَ ٱلَّذِينَ حَبِطَتْ أَعْمَٰلُهُمْ فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَمَا لَهُم مِّن نَّٰصِرِينَ","Ulâ'ikal-lazîna habitat a'mâluhum fid-dun-yâ vel-âhirah, ve mâ lahum min nâsirîn.","Bunlar, dünya ve ahirette amelleri boşa çıkanlardır. Bunların bir yardımcısı da yoktur.",""],[23,"أَلَمْ تَرَ إِلَى ٱلَّذِينَ أُوتُوا۟ نَصِيبًا مِّنَ ٱلْكِتَٰبِ يُدْعَوْنَ إِلَىٰ كِتَٰبِ ٱللَّهِ لِيَحْكُمَ بَيْنَهُمْ ثُمَّ يَتَوَلَّىٰ فَرِيقٌ مِّنْهُمْ وَهُم مُّعْرِضُونَ","Alam tara ilal-lazîna ûtû nasîbam minal-kitâbi yud'avna ilâ kitâbillâhi liyahkuma baynahum summa yatavallâ farîkum minhum ve hum mu'ridûn.","Kendilerine kitaptan bir pay verilenleri görmedin mi? Aralarında hüküm vermesi için Allah’ın kitabına çağırılıyorlar da sonra onlardan bir kısmı yüz çevirerek dönüp gidiyor.",""],[24,"ذَٰلِكَ بِأَنَّهُمْ قَالُوا۟ لَن تَمَسَّنَا ٱلنَّارُ إِلَّآ أَيَّامًا مَّعْدُودَٰتٍ وَغَرَّهُمْ فِى دِينِهِم مَّا كَانُوا۟ يَفْتَرُونَ","Zâlika bi'annahum kâlû lan tamassanan nâru illâ ayyâmam ma'dûdât, ve garrahum fî dînihim mâ kânû yaftarûn.","Bu, (haktan yüz çeviriş) onların: \"Sayılı günlerden başka bize, asla ateş dokunmayacak\" demeleri yüzündendir. Ve uydura geldikleri yalanlar, dinlerinde kendilerini aldatmıştır.",""],[25,"فَكَيْفَ إِذَا جَمَعْنَٰهُمْ لِيَوْمٍ لَّا رَيْبَ فِيهِ وَوُفِّيَتْ كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ","Fakayfa izâ cama'nâhum liyavmil lâ rayba fîh, ve vuffiyat kullu nafsim mâ kasabat ve hum lâ yuzlamûn.","Hakkında şüphe olmayan günde, onları bir araya topladığımız ve her nefse yaptığının karşılığının tam verilip asla haksızlığa uğratılmadığı o zaman, halleri nasıl olacak?",""],[26,"قُلِ ٱللَّهُمَّ مَٰلِكَ ٱلْمُلْكِ تُؤْتِى ٱلْمُلْكَ مَن تَشَآءُ وَتَنزِعُ ٱلْمُلْكَ مِمَّن تَشَآءُ وَتُعِزُّ مَن تَشَآءُ وَتُذِلُّ مَن تَشَآءُ بِيَدِكَ ٱلْخَيْرُ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Kulillâhumma mâlikal-mulki tu'til-mulka man taşâ'u ve tanzi'ul-mulka mim man taşâ', ve tu'izzu man taşâ'u ve tuzillu man taşâ', biyadikal-hayr, innaka 'alâ kulli şay'in kadîr.","De ki: Ey hakimiyetin yegane maliki Allah’ım! Mülkü dilediğine verirsin, dilediğinden de mülkü çekip alırsın, dilediğini yükseltir/aziz kılarsın, dilediğini de alçaltır/zelil edersin. Bütün hayır senin elindedir, şüphesiz senin her şeye gücün yeter.",""],[27,"تُولِجُ ٱلَّيْلَ فِى ٱلنَّهَارِ وَتُولِجُ ٱلنَّهَارَ فِى ٱلَّيْلِ وَتُخْرِجُ ٱلْحَىَّ مِنَ ٱلْمَيِّتِ وَتُخْرِجُ ٱلْمَيِّتَ مِنَ ٱلْحَىِّ وَتَرْزُقُ مَن تَشَآءُ بِغَيْرِ حِسَابٍ","Tûlicul-layla fin-nahâri ve tûlicun-nahâra fil-layli ve tuhricul-hayya minal-mayyiti ve tuhricul-mayyita minal-hayyi ve tarzuku man taşâ'u bigayri hisâb.","Geceyi gündüze geçirir, gündüzü de geceye sokarsın. Diriyi ölüden çıkarır, ölüyü de diriden çıkarırsın. Dilediğine de hesapsız rızık verirsin.",""],[28,"لَّا يَتَّخِذِ ٱلْمُؤْمِنُونَ ٱلْكَٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ وَمَن يَفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ ٱللَّهِ فِى شَىْءٍ إِلَّآ أَن تَتَّقُوا۟ مِنْهُمْ تُقَىٰةً وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ وَإِلَى ٱللَّهِ ٱلْمَصِيرُ","Lâ yattahizil-mu'minûnal-kâfirîna avliyâ'a min dûnil-mu'minîn, ve may yaf'al zâlika falaysa minallâhi fî şay', illâ an tattakû minhum tukâh, ve yuhazzirukumullâhu nafsah, ve ilallâhil-masîr.","Müminler, Müminleri bırakıp kâfirleri veli/dost edinmesinler. Kim böyle yaparsa Allah ile ilişiğini kesmiş olur. Ancak onlardan (gelebilecek tehlikeden) korunmanız başkadır. Allah, asıl sizi kendisi hakkında korkutup uyarmaktadır. Dönüş Allah’adır.",""],[29,"قُلْ إِن تُخْفُوا۟ مَا فِى صُدُورِكُمْ أَوْ تُبْدُوهُ يَعْلَمْهُ ٱللَّهُ وَيَعْلَمُ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Kul in tuhfû mâ fî sudûrikum av tubdûhu ya'lamhullâh, ve ya'lamu mâ fis-samâvâti ve mâ fil-ard, vallâhu 'alâ kulli şay'in kadîr.","De ki: İçinizdekini gizleseniz de açıklasanız da onu Allah bilir. Göklerde ve yerde olan her şeyi bilir. Allah’ın her şeye de gücü yeter.",""],[30,"يَوْمَ تَجِدُ كُلُّ نَفْسٍ مَّا عَمِلَتْ مِنْ خَيْرٍ مُّحْضَرًا وَمَا عَمِلَتْ مِن سُوٓءٍ تَوَدُّ لَوْ أَنَّ بَيْنَهَا وَبَيْنَهُۥٓ أَمَدًۢا بَعِيدًا وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ وَٱللَّهُ رَءُوفٌۢ بِٱلْعِبَادِ","Yavma tacidu kullu nafsim mâ 'amilat min hayrim muhdarâ, ve mâ 'amilat min sû', tavaddu lav anna baynahâ ve baynahû amadam ba'îdâ, ve yuhazzirukumullâhu nafsah, vallâhu ra'ûfum bil-'ibâd.","Herkes, yaptığı bütün iyilikleri de kötülükleri de karşısında bulacağı o gün isteyecek ki, kötülükleri ile kendi arasında uzun bir mesafe bulunsun. Allah, asıl sizi kendisi hakkında korkutup uyarmaktadır. Allah kullarına karşı da çok merhametlidir.",""],[31,"قُلْ إِن كُنتُمْ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِى يُحْبِبْكُمُ ٱللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَٱللَّهُ غَفُورٌ رَّحِيمٌ","Kul in kuntum tuhibbûnallâha fattabi'ûnî yuhbibkumullâhu ve yagfir lakum zunûbakum, vallâhu gafûrur rahîm.","De ki: Allah’ı seviyorsanız, bana tabi olun ki Allah da sizi sevsin ve günahlarınızı bağışlasın. Allah, çok bağışlayandır, çok merhamet edendir.",""],[32,"قُلْ أَطِيعُوا۟ ٱللَّهَ وَٱلرَّسُولَ فَإِن تَوَلَّوْا۟ فَإِنَّ ٱللَّهَ لَا يُحِبُّ ٱلْكَٰفِرِينَ","Kul atî'ullâha var-rasûl, fa'in tavallav fa innallâha lâ yuhibbul-kâfirîn.","De ki: Allah’a ve Rasûlüne itaat edin! Eğer yüz çevirirlerse, şüphesiz Allah, kâfirleri sevmez.",""],[33,"إِنَّ ٱللَّهَ ٱصْطَفَىٰٓ ءَادَمَ وَنُوحًا وَءَالَ إِبْرَٰهِيمَ وَءَالَ عِمْرَٰنَ عَلَى ٱلْعَٰلَمِينَ","Innallâhastafâ âdama ve nûhav ve âla ibrâhîma ve âla 'imrâna 'alal-'âlamîn.","Allah; Âdem’i, Nûh’u, İbrahim ailesini ve İmran Ailesi'ni toplumlar üzerine seçkin kıldı.",""],[34,"ذُرِّيَّةًۢ بَعْضُهَا مِنۢ بَعْضٍ وَٱللَّهُ سَمِيعٌ عَلِيمٌ","Zurriyyatam ba'duhâ mim ba'd, vallâhu samî'un 'alîm.","Bunlar birbirlerinin soylarından gelen bir nesildir. Allah, hakkıyla işiten ve hakkıyla bilendir.",""],[35,"إِذْ قَالَتِ ٱمْرَأَتُ عِمْرَٰنَ رَبِّ إِنِّى نَذَرْتُ لَكَ مَا فِى بَطْنِى مُحَرَّرًا فَتَقَبَّلْ مِنِّىٓ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ","Iz kâlatimra'atu 'imrâna rabbi innî nazartu laka mâ fî batnî muharraran fatakabbal minnî, innaka antas-samî'ul-'alîm.","Hani İmran’ın karısı: \"Rabbim karnımda olanı sadece sana hizmet etmek üzere adadım, benden bunu kabul buyur. Şüphesiz sen, hakkıyla işitensin, hakkıyla bilensin.\" demişti.",""],[36,"فَلَمَّا وَضَعَتْهَا قَالَتْ رَبِّ إِنِّى وَضَعْتُهَآ أُنثَىٰ وَٱللَّهُ أَعْلَمُ بِمَا وَضَعَتْ وَلَيْسَ ٱلذَّكَرُ كَٱلْأُنثَىٰ وَإِنِّى سَمَّيْتُهَا مَرْيَمَ وَإِنِّىٓ أُعِيذُهَا بِكَ وَذُرِّيَّتَهَا مِنَ ٱلشَّيْطَٰنِ ٱلرَّجِيمِ","Falammâ vada'athâ kâlat rabbi innî vada'tuhâ unsâ, vallâhu a'lamu bimâ vada'at, ve laysaz-zakaru kal-unsâ, ve innî sammaytuhâ maryama ve innî u'îzuhâ bika ve zurriyyatahâ minaş-şaytânir-racîm.","Onu doğurunca da: \"Rabbim! Ben, kız doğurdum. (Hâlbuki Allah, neyi doğuracağını en iyi bilendir) Erkek, kız gibi değildir. Adını Meryem koydum, O’nu da, onun soyunu da kovulmuş şeytandan sana sığındırıyorum.\" dedi.",""],[37,"فَتَقَبَّلَهَا رَبُّهَا بِقَبُولٍ حَسَنٍ وَأَنۢبَتَهَا نَبَاتًا حَسَنًا وَكَفَّلَهَا زَكَرِيَّا كُلَّمَا دَخَلَ عَلَيْهَا زَكَرِيَّا ٱلْمِحْرَابَ وَجَدَ عِندَهَا رِزْقًا قَالَ يَٰمَرْيَمُ أَنَّىٰ لَكِ هَٰذَا قَالَتْ هُوَ مِنْ عِندِ ٱللَّهِ إِنَّ ٱللَّهَ يَرْزُقُ مَن يَشَآءُ بِغَيْرِ حِسَابٍ","Fatakabbalahâ rabbuhâ bikabûlin hasaniv ve ambatahâ nabâtan hasanâ, ve kaffalahâ zakariyyâ, kullamâ dahala 'alayhâ zakariyyal-mihrâba vacada 'indahâ rizkâ, kâla yâ maryama annâ laki hâzâ, kâlat huva min 'indillâh, innallâha yarzuku may yaşâ'u bigayri hisâb.","Rabbi, onu güzel bir kabul ile kabul etti ve onu güzel bir şekilde yetiştirdi. Zekeriya’yı da ona bakmakla görevlendirdi. Zekeriya ne zaman yanına, onun bulunduğu ibadet mahalline girse, O’nun yanında bir yiyecek bulurdu: Meryem, bu sana nereden geldi? dediğinde, o şöyle cevap verirdi: Bu, Allah katından! Doğrusu Allah, dilediği kimseye hesapsız rızık bağışlar.",""],[38,"هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُۥ قَالَ رَبِّ هَبْ لِى مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ ٱلدُّعَآءِ","Hunâlika da'â zakariyyâ rabbahû kâla rabbi hab lî mil ladunka zurriyyatan tayyibah, innaka samî'ud-du'â'.","Zekeriya orada Rabbine dua etti: \"Rabbim! Bana katından tertemiz bir soy ver! Sen duayı en iyi bir şekilde işitensin.\" dedi.",""],[39,"فَنَادَتْهُ ٱلْمَلَٰٓئِكَةُ وَهُوَ قَآئِمٌ يُصَلِّى فِى ٱلْمِحْرَابِ أَنَّ ٱللَّهَ يُبَشِّرُكَ بِيَحْيَىٰ مُصَدِّقًۢا بِكَلِمَةٍ مِّنَ ٱللَّهِ وَسَيِّدًا وَحَصُورًا وَنَبِيًّا مِّنَ ٱلصَّٰلِحِينَ","Fanâdathul-malâ'ikatu ve huva kâ'imuy yusallî fil-mihrâb, annallâha yubaşşiruka biyahyâ musaddikam bikalimatim minallâhi ve sayyidav ve hasûrav ve nabiyyam minas-sâlihîn.","(Zekeriya) mabedde namaz kılarken melekler ona: “Allah sana, Allah'tan bir kelimeyi (İsa’yı) doğrulayıcı, efendi, nefsine hâkim ve salihlerden bir peygamber olarak Yahya’yı müjdeler!” diye seslendiler.",""],[40,"قَالَ رَبِّ أَنَّىٰ يَكُونُ لِى غُلَٰمٌ وَقَدْ بَلَغَنِىَ ٱلْكِبَرُ وَٱمْرَأَتِى عَاقِرٌ قَالَ كَذَٰلِكَ ٱللَّهُ يَفْعَلُ مَا يَشَآءُ","Kâla rabbi annâ yakûnu lî gulâmuv ve kad balaganîyal-kibaru vamra'atî 'âkir, kâla kazâlikallâhu yaf'alu mâ yaşâ'.","\"Rabbim! Ben iyice yaşlanmış, karım da kısır iken nasıl benim bir oğlum olacak?\" dedi. Allah: \"Öyle de olsa, Allah dilediğini yapar!\" buyurdu.",""],[41,"قَالَ رَبِّ ٱجْعَل لِّىٓ ءَايَةً قَالَ ءَايَتُكَ أَلَّا تُكَلِّمَ ٱلنَّاسَ ثَلَٰثَةَ أَيَّامٍ إِلَّا رَمْزًا وَٱذْكُر رَّبَّكَ كَثِيرًا وَسَبِّحْ بِٱلْعَشِىِّ وَٱلْإِبْكَٰرِ","Kâla rabbic'al lî âyah, kâla âyatuka allâ tukalliman-nâsa salâsata ayyâmin illâ ramzâ, vazkur rabbaka kasîrav ve sabbih bil-'aşiyyi vel-ibkâr.","Zekeriyya: “Ey Rabbim! Bana bir işaret göster” diye niyaz etti. Allah da: \"Senin delilin, üç gün insanlarla işaretle anlaşmak dışında hiç konuşmamandır. Rabbini çokça zikret ve akşam, sabah tesbih et!\" buyurdu.",""],[42,"وَإِذْ قَالَتِ ٱلْمَلَٰٓئِكَةُ يَٰمَرْيَمُ إِنَّ ٱللَّهَ ٱصْطَفَىٰكِ وَطَهَّرَكِ وَٱصْطَفَىٰكِ عَلَىٰ نِسَآءِ ٱلْعَٰلَمِينَ","Ve iz kâlatil-malâ'ikatu yâ maryama innallâhastafâki ve tahharaki vastafâki 'alâ nisâ'il-'âlamîn.","Hani bir zamanlar da melekler şöyle demişlerdi: \"Ey Meryem! Allah seni seçip tertemiz yarattı ve seni dünya kadınlarına üstün kıldı.\"",""],[43,"يَٰمَرْيَمُ ٱقْنُتِى لِرَبِّكِ وَٱسْجُدِى وَٱرْكَعِى مَعَ ٱلرَّٰكِعِينَ","Yâ maryamuknutî lirabbiki vascudî varka'î ma'ar-râki'în.","\"Ey Meryem! Rabbine gönülden boyun eğ, secde et, rükû edenlerle birlikte rükû et!\"",""],[44,"ذَٰلِكَ مِنْ أَنۢبَآءِ ٱلْغَيْبِ نُوحِيهِ إِلَيْكَ وَمَا كُنتَ لَدَيْهِمْ إِذْ يُلْقُونَ أَقْلَٰمَهُمْ أَيُّهُمْ يَكْفُلُ مَرْيَمَ وَمَا كُنتَ لَدَيْهِمْ إِذْ يَخْتَصِمُونَ","Zâlika min ambâ'il-gaybi nûhîhi ilayk, ve mâ kunta ladayhim iz yulkûna aklâmahum ayyuhum yakfulu maryam, ve mâ kunta ladayhim iz yahtasimûn.","(Ey Peygamber!) Bunlar, sana vahyettiğimiz gayb haberlerindendir. Meryem’e hangisi kefil olacak diye kalemlerini atarlarken (kura çekerlerken) sen yanlarında değildin, konuyu tartışırlarken de yanlarında değildin.",""],[45,"إِذْ قَالَتِ ٱلْمَلَٰٓئِكَةُ يَٰمَرْيَمُ إِنَّ ٱللَّهَ يُبَشِّرُكِ بِكَلِمَةٍ مِّنْهُ ٱسْمُهُ ٱلْمَسِيحُ عِيسَى ٱبْنُ مَرْيَمَ وَجِيهًا فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَمِنَ ٱلْمُقَرَّبِينَ","Iz kâlatil-malâ'ikatu yâ maryama innallâha yubaşşiruki bikalimatim minhusmuhul-masîhu 'îsabnu maryama vacîhan fid-dun-yâ vel-âhirati ve minal-mukarrabîn.","Melekler demişti ki: Ey Meryem! Allah sana adı Mesih Meryemoğlu İsa olan, dünya ve ahirette itibarlı ve öncülerden/mukarrebinden olacak kendisinden bir kelimeyi (İsa’yı) müjdeliyor.",""],[46,"وَيُكَلِّمُ ٱلنَّاسَ فِى ٱلْمَهْدِ وَكَهْلًا وَمِنَ ٱلصَّٰلِحِينَ","Ve yukallimun nâsa fil-mahdi ve kahlav ve minas-sâlihîn.","O, insanlarla beşikte iken de yetişkin iken de konuşacaktır ve o, salihlerden biridir.",""],[47,"قَالَتْ رَبِّ أَنَّىٰ يَكُونُ لِى وَلَدٌ وَلَمْ يَمْسَسْنِى بَشَرٌ قَالَ كَذَٰلِكِ ٱللَّهُ يَخْلُقُ مَا يَشَآءُ إِذَا قَضَىٰٓ أَمْرًا فَإِنَّمَا يَقُولُ لَهُۥ كُن فَيَكُونُ","Kâlat rabbi annâ yakûnu lî valaduv ve lam yamsasnî başar, kâla kazâlikillâhu yahluku mâ yaşâ', izâ kadâ amran fa'innamâ yakûlu lahû kun fayakûn.","Meryem, şöyle dedi: \"Rabbim! Bana bir beşer dokunmamışken nasıl çocuğum olabilir?\" (Melek şöyle cevap verdi:) \"İşte böyle! Allah neyi dilerse yaratır. Bir işin olmasını isterse ona “ol” der ve o da hemen oluverir.\"",""],[48,"وَيُعَلِّمُهُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ وَٱلتَّوْرَىٰةَ وَٱلْإِنجِيلَ","Ve ya'allimuhul-kitâba vel-hikmata vat-tavrâta vel-incîl.","O’na kitabı, hikmeti, Tevrat ve İncil’i öğretecektir.",""],[49,"وَرَسُولًا إِلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنِّى قَدْ جِئْتُكُم بِـَٔايَةٍ مِّن رَّبِّكُمْ أَنِّىٓ أَخْلُقُ لَكُم مِّنَ ٱلطِّينِ كَهَيْـَٔةِ ٱلطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَيْرًۢا بِإِذْنِ ٱللَّهِ وَأُبْرِئُ ٱلْأَكْمَهَ وَٱلْأَبْرَصَ وَأُحْىِ ٱلْمَوْتَىٰ بِإِذْنِ ٱللَّهِ وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِى بُيُوتِكُمْ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ","Ve rasûlan ilâ banî isrâ'îl, annî kad ci'tukum bi'âyatim mir rabbikum, annî ahluku lakum minat-tîni kahay'atit-tayri fa'anfuhu fihi fayakûnu tayram bi'iznillâh, ve ubarri'ul-akmaha vel-abrasa ve uhyil-mavtâ bi'iznillâh, ve unabbi'ukum bimâ ta'kulûna ve mâ taddahirûna fî buyûtikum, inna fî zâlika la'âyatal lakum in kuntum mu'minîn.","Ben size Rabbinizden bir ayet ile geldim. Ben size, çamurdan kuş şeklinde bir şey yapıp ona üfleyeceğim. Allah’ın izniyle, o hemen kuş oluverecektir. Allah’ın izniyle kör ve (cildi) alacalı olan (hastaları) iyileştirir ve ölüleri diriltirim. Yediklerinizi ve evlerinizde sakladıklarınızı da size haber vereceğim. Eğer Müminler iseniz bunda sizin için bir delil vardır.",""],[50,"وَمُصَدِّقًا لِّمَا بَيْنَ يَدَىَّ مِنَ ٱلتَّوْرَىٰةِ وَلِأُحِلَّ لَكُم بَعْضَ ٱلَّذِى حُرِّمَ عَلَيْكُمْ وَجِئْتُكُم بِـَٔايَةٍ مِّن رَّبِّكُمْ فَٱتَّقُوا۟ ٱللَّهَ وَأَطِيعُونِ","Ve musaddikal limâ bayna yadayya minat-tavrâti ve li'uhilla lakum ba'dal-lazî hurrima 'alaykum ve ci'tukum bi'âyatim mir rabbikum, fattakullâha ve atî'ûn.","Benden önce gelen Tevrat’ı tasdik etmekle beraber size haram edilen şeylerin bir kısmını helal kılmak üzere, Rabbinizden size bir ayet getirdim. Allah’tan korkun ve bana itaat edin!",""],[51,"إِنَّ ٱللَّهَ رَبِّى وَرَبُّكُمْ فَٱعْبُدُوهُ هَٰذَا صِرَٰطٌ مُّسْتَقِيمٌ","Innallâha rabbî ve rabbukum fa'budûh, hâzâ sirâtum mustakîm.","Şüphesiz Allah, benim de Rabbim sizin de Rabbinizdir. O’na ibadet edin! Doğru yol budur.",""],[52,"فَلَمَّآ أَحَسَّ عِيسَىٰ مِنْهُمُ ٱلْكُفْرَ قَالَ مَنْ أَنصَارِىٓ إِلَى ٱللَّهِ قَالَ ٱلْحَوَارِيُّونَ نَحْنُ أَنصَارُ ٱللَّهِ ءَامَنَّا بِٱللَّهِ وَٱشْهَدْ بِأَنَّا مُسْلِمُونَ","Falammâ ahassa 'îsâ minhumul-kufra kâla man ansârî ilallâh, kâlal-havâriyyûna nahnu ansârullâh, âmannâ billâh, vaşhad bi'annâ muslimûn.","İsa, onların küfrünü hissedince: \"Allah uğrunda bana yardımcı olacak kim vardır?\" dedi. Havariler de şöyle cevap verdiler: \"Biz Allah’ın yardımcılarıyız, Allah’a iman ettik, O’na teslim olduğumuza da şahit ol!\"",""],[53,"رَبَّنَآ ءَامَنَّا بِمَآ أَنزَلْتَ وَٱتَّبَعْنَا ٱلرَّسُولَ فَٱكْتُبْنَا مَعَ ٱلشَّٰهِدِينَ","Rabbanâ âmannâ bimâ anzalta vattaba'nar-rasûla faktubnâ ma'aş-şâhidîn.","Rabbimiz, indirdiğine iman ettik, peygambere tabi olduk, bizi şahit olanlarla beraber yaz!",""],[54,"وَمَكَرُوا۟ وَمَكَرَ ٱللَّهُ وَٱللَّهُ خَيْرُ ٱلْمَٰكِرِينَ","Ve makarû ve makarallâh, vallâhu hayrul-mâkirîn.","(İsrailoğulları) tuzak kurdular (ve buna karşılık) Allah da bir tuzak kurdu. Allah, düzen/tuzak kurucuların en hayırlısıdır.",""],[55,"إِذْ قَالَ ٱللَّهُ يَٰعِيسَىٰٓ إِنِّى مُتَوَفِّيكَ وَرَافِعُكَ إِلَىَّ وَمُطَهِّرُكَ مِنَ ٱلَّذِينَ كَفَرُوا۟ وَجَاعِلُ ٱلَّذِينَ ٱتَّبَعُوكَ فَوْقَ ٱلَّذِينَ كَفَرُوٓا۟ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ ثُمَّ إِلَىَّ مَرْجِعُكُمْ فَأَحْكُمُ بَيْنَكُمْ فِيمَا كُنتُمْ فِيهِ تَخْتَلِفُونَ","Iz kâlallâhu yâ 'îsâ innî mutavaffîka ve râfi'uka ilayya ve mutahhiruka minal-lazîna kafarû ve câ'ilul-lazînattaba'ûka favkal-lazîna kafarû ilâ yavmil-kiyâmah, summa ilayya marci'ukum fa ahkumu baynakum fîmâ kuntum fîhi tahtalifûn.","Allah, İsa’ya şöyle buyurmuştu: \"Ey İsa! Seni vefat ettireceğim ve seni kendime yükselteceğim. Kâfirlerden seni tertemiz kurtaracağım. Sana tabi olanları kıyamet gününe kadar inkâr edenlerin/kâfirlerin üstünde tutacağım. Sonra bana döneceksiniz. Sizin aranızda, hakkında ihtilaf ettiğiniz konularda hüküm vereceğim.\"",""],[56,"فَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَأُعَذِّبُهُمْ عَذَابًا شَدِيدًا فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَمَا لَهُم مِّن نَّٰصِرِينَ","Fa ammal-lazîna kafarû fa u'azzibuhum 'azâban şadîdan fid-dun-yâ vel-âhirah, ve mâ lahum min nâsirîn.","O kâfir olanlara gelince, ben onları dünyada da ahirette de en şiddetli bir azaba çarptıracağım ve onların hiçbir yardımcıları da olmayacak.",""],[57,"وَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فَيُوَفِّيهِمْ أُجُورَهُمْ وَٱللَّهُ لَا يُحِبُّ ٱلظَّٰلِمِينَ","Ve ammal-lazîna âmanû ve 'amilus-sâlihâti fa yuvaffîhim ucûrahum, vallâhu lâ yuhibbuz-zâlimîn.","İman eden ve salih amel işleyenlere ise eksiksiz mükâfatlarını verecektir. Allah, zalimleri sevmez.",""],[58,"ذَٰلِكَ نَتْلُوهُ عَلَيْكَ مِنَ ٱلْـَٔايَٰتِ وَٱلذِّكْرِ ٱلْحَكِيمِ","Zâlika natlûhu 'alayka minal-âyâti vaz-zikril-hakîm.","(Ey Muhammed!) Bunlar sana okuduğumuz âyetlerden ve hikmet dolu Zikir'dendir.",""],[59,"إِنَّ مَثَلَ عِيسَىٰ عِندَ ٱللَّهِ كَمَثَلِ ءَادَمَ خَلَقَهُۥ مِن تُرَابٍ ثُمَّ قَالَ لَهُۥ كُن فَيَكُونُ","Inna masala 'îsâ 'indallâhi kamasali âdam, halakahû min turâbin summa kâla lahû kun fayakûn.","Allah katında (yaratılış olarak) İsa’nın örneği, Âdem’in örneği gibidir. Kendisini topraktan yaratıp sonra ona “Ol!” dedi ve oluverdi.",""],[60,"ٱلْحَقُّ مِن رَّبِّكَ فَلَا تَكُن مِّنَ ٱلْمُمْتَرِينَ","Al-hakku mir rabbika falâ takum minal-mumtarîn.","Bu gerçek senin Rabbindendir. O halde sakın şüphe edenlerden olma!",""],[61,"فَمَنْ حَآجَّكَ فِيهِ مِنۢ بَعْدِ مَا جَآءَكَ مِنَ ٱلْعِلْمِ فَقُلْ تَعَالَوْا۟ نَدْعُ أَبْنَآءَنَا وَأَبْنَآءَكُمْ وَنِسَآءَنَا وَنِسَآءَكُمْ وَأَنفُسَنَا وَأَنفُسَكُمْ ثُمَّ نَبْتَهِلْ فَنَجْعَل لَّعْنَتَ ٱللَّهِ عَلَى ٱلْكَٰذِبِينَ","Faman hâccaka fîhi mim ba'di mâ câ'aka minal-'ilmi fakul ta'âlav nad'u abnâ'anâ ve abnâ'akum ve nisâ'anâ ve nisâ'akum ve anfusanâ ve anfusakum, summa nabtahil fanac'al la'natallâhi 'alal-kâzibîn.","Sana ilim geldikten sonra, bu hususta seninle kim tartışacak olursa, de ki: \"Gelin, oğullarımızı, oğullarınızı, kadınlarımızı, kadınlarınızı, kendilerimizi ve kendilerinizi çağıralım. Sonra da dua ederek Allah’ın lanetinin yalancılara olmasını dileyelim.\"",""],[62,"إِنَّ هَٰذَا لَهُوَ ٱلْقَصَصُ ٱلْحَقُّ وَمَا مِنْ إِلَٰهٍ إِلَّا ٱللَّهُ وَإِنَّ ٱللَّهَ لَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ","Inna hâzâ lahuval-kasasul-hakk, ve mâ min ilâhin illallâh, ve innallâha lahuval-'azîzul-hakîm.","Şüphesiz bu anlatılanlar gerçek olan kıssalardır. Allah’tan başka (ibadete layık hak) ilah yoktur. Allah, elbette Aziz'dir, Hakim'dir.",""],[63,"فَإِن تَوَلَّوْا۟ فَإِنَّ ٱللَّهَ عَلِيمٌۢ بِٱلْمُفْسِدِينَ","Fa in tavallav fa innallâha 'alîmum bil-mufsidîn.","Eğer yüz çevirirlerse şüphesiz Allah, bozguncuları hakkıyla bilendir.",""],[64,"قُلْ يَٰٓأَهْلَ ٱلْكِتَٰبِ تَعَالَوْا۟ إِلَىٰ كَلِمَةٍ سَوَآءٍۭ بَيْنَنَا وَبَيْنَكُمْ أَلَّا نَعْبُدَ إِلَّا ٱللَّهَ وَلَا نُشْرِكَ بِهِۦ شَيْـًٔا وَلَا يَتَّخِذَ بَعْضُنَا بَعْضًا أَرْبَابًا مِّن دُونِ ٱللَّهِ فَإِن تَوَلَّوْا۟ فَقُولُوا۟ ٱشْهَدُوا۟ بِأَنَّا مُسْلِمُونَ","Kul yâ ahlal-kitâbi ta'âlav ilâ kalimatin savâ'im baynanâ ve baynakum allâ na'buda illallâha ve lâ nuşrika bihî şay'av ve lâ yattahiza ba'dunâ ba'dan arbâbam min dûnillâh, fa in tavallav fa kûluşhadû bi'annâ muslimûn.","De ki: “Ey kitap ehli! Bizimle sizin aranızda ortak bir söze gelin: Yalnız Allah’a ibadet edelim. O’na hiçbir şeyi ortak koşmayalım. Allah’ı bırakıp da kimimiz kimimizi ilâh edinmesin.” Eğer onlar yine yüz çevirirlerse, deyin ki: “Şahit olun, biz Müslümanlarız.”",""],[65,"يَٰٓأَهْلَ ٱلْكِتَٰبِ لِمَ تُحَآجُّونَ فِىٓ إِبْرَٰهِيمَ وَمَآ أُنزِلَتِ ٱلتَّوْرَىٰةُ وَٱلْإِنجِيلُ إِلَّا مِنۢ بَعْدِهِۦٓ أَفَلَا تَعْقِلُونَ","Yâ ahlal-kitâbi lima tuhâccûna fî ibrâhîma ve mâ unzilatit-tavrâtu vel-incîlu illâ mim ba'dih, afalâ ta'kilûn.","Ey Ehl-i kitap! İbrahim hakkında niçin tartışıyorsunuz? Tevrat da İncil de şüphesiz ondan sonra indirilmiştir. Akıl etmiyor musunuz?",""],[66,"هَٰٓأَنتُمْ هَٰٓؤُلَآءِ حَٰجَجْتُمْ فِيمَا لَكُم بِهِۦ عِلْمٌ فَلِمَ تُحَآجُّونَ فِيمَا لَيْسَ لَكُم بِهِۦ عِلْمٌ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ","Hâ antum hâ'ulâ'i hâcactum fîmâ lakum bihî 'ilmun falima tuhâccûna fîmâ laysa lakum bihî 'ilm, vallâhu ya'lamu ve antum lâ ta'lamûn.","İşte siz böyle kimselersiniz. İlminiz olan şey hakkında tartışıyorsunuz. Ya ilminiz olmayan şey (İbrahim) hakkında neden tartışırsınız? Oysa Allah bilir, sizler bilmezsiniz.",""],[67,"مَا كَانَ إِبْرَٰهِيمُ يَهُودِيًّا وَلَا نَصْرَانِيًّا وَلَٰكِن كَانَ حَنِيفًا مُّسْلِمًا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ","Ve mâ kâna ibrâhîmu yahûdiyyav ve lâ nasrâniyyav ve lâkin kâna hanîfam muslimâ, ve mâ kâna minal-muşrikîn.","İbrahim bir Yahudi değildi, bir Hıristiyan da değildi. Fakat, hanif (şirkten uzak) bir Müslümandı. Müşriklerden de değildi.",""],[68,"إِنَّ أَوْلَى ٱلنَّاسِ بِإِبْرَٰهِيمَ لَلَّذِينَ ٱتَّبَعُوهُ وَهَٰذَا ٱلنَّبِىُّ وَٱلَّذِينَ ءَامَنُوا۟ وَٱللَّهُ وَلِىُّ ٱلْمُؤْمِنِينَ","Inna avlan-nâsi bi'ibrâhîma lal-lazînattaba'ûhu ve hâzan-nabiyyu vel-lazîna âmanû, vallâhu valiyyul-mu'minîn.","Doğrusu İbrahim’e en yakın olanlar; ona tabi olanlar ve bu peygambere (Muhammed'e) iman edenlerdir. Allah, Müminlerin velisidir.",""],[69,"وَدَّت طَّآئِفَةٌ مِّنْ أَهْلِ ٱلْكِتَٰبِ لَوْ يُضِلُّونَكُمْ وَمَا يُضِلُّونَ إِلَّآ أَنفُسَهُمْ وَمَا يَشْعُرُونَ","Vaddat-tâ'ifatum min ahlil-kitâbi lav yudillûnakum, ve mâ yudillûna illâ anfusahum ve mâ yaş'urûn.","Kitap ehlinden bir kısmı sizi saptırmak isterler. Fakat yalnızca kendilerini yoldan çıkarırlar da bunun farkına varmazlar.",""],[70,"يَٰٓأَهْلَ ٱلْكِتَٰبِ لِمَ تَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَأَنتُمْ تَشْهَدُونَ","Yâ ahlal-kitâbi lima takfurûna bi'âyâtillâhi ve antum taşhadûn.","Ey Ehl-i kitap! (Gerçeğe) şahit olduğunuz halde, niçin Allah’ın ayetlerini inkâr ediyorsunuz?",""],[71,"يَٰٓأَهْلَ ٱلْكِتَٰبِ لِمَ تَلْبِسُونَ ٱلْحَقَّ بِٱلْبَٰطِلِ وَتَكْتُمُونَ ٱلْحَقَّ وَأَنتُمْ تَعْلَمُونَ","Yâ ahlal-kitâbi lima talbisûnal-hakka bil-bâtili ve taktumûnal-hakka ve antum ta'lamûn.","Ey Ehl-i kitap! Niçin hakla batılı karıştırıyor ve bile bile hakkı gizliyorsunuz?",""],[72,"وَقَالَت طَّآئِفَةٌ مِّنْ أَهْلِ ٱلْكِتَٰبِ ءَامِنُوا۟ بِٱلَّذِىٓ أُنزِلَ عَلَى ٱلَّذِينَ ءَامَنُوا۟ وَجْهَ ٱلنَّهَارِ وَٱكْفُرُوٓا۟ ءَاخِرَهُۥ لَعَلَّهُمْ يَرْجِعُونَ","Ve kâlat-tâ'ifatum min ahlil-kitâbi âminû bil-lazî unzila 'alal-lazîna âmanû vachan-nahâri vakfurû âhirahû la'allahum yarci'ûn.","Kitap ehlinden bir topluluk: \"İman edenlere indirilene günün başında (sabahleyin) iman edin, sonunda (akşamleyin) inkâr edin, belki (dinlerinden) dönerler.\" dedi.",""],[73,"وَلَا تُؤْمِنُوٓا۟ إِلَّا لِمَن تَبِعَ دِينَكُمْ قُلْ إِنَّ ٱلْهُدَىٰ هُدَى ٱللَّهِ أَن يُؤْتَىٰٓ أَحَدٌ مِّثْلَ مَآ أُوتِيتُمْ أَوْ يُحَآجُّوكُمْ عِندَ رَبِّكُمْ قُلْ إِنَّ ٱلْفَضْلَ بِيَدِ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ","Ve lâ tu'minû illâ liman tabi'a dînakum, kul innal-hudâ hudallâh, ay yu'tâ ahadum misla mâ ûtîtum av yuhâccûkum 'inda rabbikum, kul innal-fadla biyadillâh, yu'tîhi may yaşâ', vallâhu vâsi'un 'alîm.","\"Sizin dininize uyanlardan başkasına inanmayın” derler. Ey Rasûlüm! De ki: “Doğru yol, Allah'ın yoludur.” Yine onlar şöyle derler: \"(Müslümanlardan) Birine, size verilen ilmi (öğretirseniz onlar bu ilmi öğrenir de) ve (sonra) bunu Rabbinizin huzurunda aleyhinize delil olarak (kullanırlar)” De ki: Nimet ve lütuf Allah’ın elindedir. Onu dilediğine verir. Allah, ihsanı bol olan, her şeyi bilendir.",""],[74,"يَخْتَصُّ بِرَحْمَتِهِۦ مَن يَشَآءُ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ","Yahtassu birahmatihî may yaşâ', vallâhu zul-fadlil-'azîm.","O, rahmetini dilediğine has kılar. Allah, büyük lütuf sahibidir.",""],[75,"وَمِنْ أَهْلِ ٱلْكِتَٰبِ مَنْ إِن تَأْمَنْهُ بِقِنطَارٍ يُؤَدِّهِۦٓ إِلَيْكَ وَمِنْهُم مَّنْ إِن تَأْمَنْهُ بِدِينَارٍ لَّا يُؤَدِّهِۦٓ إِلَيْكَ إِلَّا مَا دُمْتَ عَلَيْهِ قَآئِمًا ذَٰلِكَ بِأَنَّهُمْ قَالُوا۟ لَيْسَ عَلَيْنَا فِى ٱلْأُمِّيِّـۧنَ سَبِيلٌ وَيَقُولُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ وَهُمْ يَعْلَمُونَ","Ve min ahlil-kitâbi man in ta'manhu bi kintârin yu'addîhi ilayk, ve minhum man in ta'manhu bidînâril lâ yu'addîhi ilayka illâ mâ dumta 'alayhi kâ'imâ, zâlika bi'annahum kâlû laysa 'alaynâ fil-ummiyyîna sabîl, ve yakûlûna 'alallâhil-kaziba ve hum ya'lamûn.","Kitap ehlinden öylesi vardır ki, ona yüklerle mal emanet etsen, onu sana (eksiksiz) iade eder. Fakat onlardan öylesi de vardır ki, ona bir dinar emanet etsen, tepesine dikilip durmadıkça onu sana iade etmez. Bu da onların, “Ümmîlere karşı (yaptıklarımızdan) bize vebal yoktur” demelerinden dolayıdır. Onlar, bile bile Allah’a karşı yalan söylerler.",""],[76,"بَلَىٰ مَنْ أَوْفَىٰ بِعَهْدِهِۦ وَٱتَّقَىٰ فَإِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَّقِينَ","Balâ man avfâ bi'ahdihî vattakâ fa innallâha yuhibbul-muttakîn.","Hayır! (Gerçek, onların dediği değil.) Kim sözünü yerine getirir ve Allah’a karşı gelmekten sakınırsa, şüphesiz Allah da sakınanları sever.",""],[77,"إِنَّ ٱلَّذِينَ يَشْتَرُونَ بِعَهْدِ ٱللَّهِ وَأَيْمَٰنِهِمْ ثَمَنًا قَلِيلًا أُو۟لَٰٓئِكَ لَا خَلَٰقَ لَهُمْ فِى ٱلْـَٔاخِرَةِ وَلَا يُكَلِّمُهُمُ ٱللَّهُ وَلَا يَنظُرُ إِلَيْهِمْ يَوْمَ ٱلْقِيَٰمَةِ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ","Innal-lazîna yaştarûna bi'ahdillâhi ve aymânihim samanan kalîlan ulâ'ika lâ halâka lahum fil-âhirati ve lâ yukallimuhumullâhu ve lâ yanzuru ilayhim yavmal-kiyâmati ve lâ yuzakkîhim, ve lahum 'azâbun alîm.","Allah’a verdikleri sözü ve ettikleri yeminlerini az bir pahaya değiştirenlere gelince, onların ahirette bir nasibi olmayacaktır. Allah, kıyamet gününde onlarla konuşmayacak, onlara bakmayacak ve onları temize çıkarmayacaktır. Onlar için acı bir azap vardır.",""],[78,"وَإِنَّ مِنْهُمْ لَفَرِيقًا يَلْوُۥنَ أَلْسِنَتَهُم بِٱلْكِتَٰبِ لِتَحْسَبُوهُ مِنَ ٱلْكِتَٰبِ وَمَا هُوَ مِنَ ٱلْكِتَٰبِ وَيَقُولُونَ هُوَ مِنْ عِندِ ٱللَّهِ وَمَا هُوَ مِنْ عِندِ ٱللَّهِ وَيَقُولُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ وَهُمْ يَعْلَمُونَ","Ve inna minhum lafarîkay yalvûna alsinatahum bil-kitâbi litahsabûhu minal-kitâbi ve mâ huva minal-kitâb, ve yakûlûna huva min 'indillâhi ve mâ huva min 'indillâh, ve yakûlûna 'alallâhil-kaziba ve hum ya'lamûn.","Onların bir kısmı, kitaptan olmadığı halde, sizin kitaptan zannetmeniz için (kitaba bakarak) dillerini eğip bükerler. O, Allah katından olmadığı halde: “Allah katındandır” derler. Bile bile Allah hakkında yalan söylerler.",""],[79,"مَا كَانَ لِبَشَرٍ أَن يُؤْتِيَهُ ٱللَّهُ ٱلْكِتَٰبَ وَٱلْحُكْمَ وَٱلنُّبُوَّةَ ثُمَّ يَقُولَ لِلنَّاسِ كُونُوا۟ عِبَادًا لِّى مِن دُونِ ٱللَّهِ وَلَٰكِن كُونُوا۟ رَبَّٰنِيِّـۧنَ بِمَا كُنتُمْ تُعَلِّمُونَ ٱلْكِتَٰبَ وَبِمَا كُنتُمْ تَدْرُسُونَ","Mâ kâna libaşarin ay yu'tiyahullâhul-kitâba vel-hukma van-nubuvvata summa yakûla lin-nâsi kûnû 'ibâdal lî min dûnillâhi ve lâkin kûnû rabbâniyyîna bimâ kuntum tu'allimûnal-kitâba ve bimâ kuntum tadrusûn.","Allah'ın, kendisine kitabı, hükmü ve peygamberliği verdiği bir insana (peygambere), “Allah'ı bırakıp bana ibadet edin” demek yaraşmaz. Lakin (her peygamber), “Öğrettiğiniz ve okuduğunuz kitap gereğince Rabbanî insanlar olunuz” der",""],[80,"وَلَا يَأْمُرَكُمْ أَن تَتَّخِذُوا۟ ٱلْمَلَٰٓئِكَةَ وَٱلنَّبِيِّـۧنَ أَرْبَابًا أَيَأْمُرُكُم بِٱلْكُفْرِ بَعْدَ إِذْ أَنتُم مُّسْلِمُونَ","Ve lâ ya'murakum an tattahizul-malâ'ikata van-nabiyyîna arbâbâ, aya'murukum bil-kufri ba'da iz antum muslimûn.","O, size melekleri ve peygamberleri rabler edinmenizi emretmez. Size, Müslüman olduktan sonra hiç kâfir olmayı emreder mi?",""],[81,"وَإِذْ أَخَذَ ٱللَّهُ مِيثَٰقَ ٱلنَّبِيِّـۧنَ لَمَآ ءَاتَيْتُكُم مِّن كِتَٰبٍ وَحِكْمَةٍ ثُمَّ جَآءَكُمْ رَسُولٌ مُّصَدِّقٌ لِّمَا مَعَكُمْ لَتُؤْمِنُنَّ بِهِۦ وَلَتَنصُرُنَّهُۥ قَالَ ءَأَقْرَرْتُمْ وَأَخَذْتُمْ عَلَىٰ ذَٰلِكُمْ إِصْرِى قَالُوٓا۟ أَقْرَرْنَا قَالَ فَٱشْهَدُوا۟ وَأَنَا۠ مَعَكُم مِّنَ ٱلشَّٰهِدِينَ","Ve iz ahazallâhu mîsâkan-nabiyyîna lamâ âtaytukum min kitâbiv ve hikmatin summa câ'akum rasûlum musaddikul limâ ma'akum latu'minunna bihî ve latansurunnah, kâla a'akrartum ve ahaztum 'alâ zâlikum isrî, kâlû akrarnâ, kâla faşhadû ve ana ma'akum minaş-şâhidîn.","Hani, Allah tüm peygamberlerden; “Size vereceğim her kitap ve hikmetten sonra, elinizdekini doğrulayan bir peygamber geldiğinde, ona mutlaka iman edecek ve ona mutlaka yardım edeceksiniz.” diye söz almıştı. Onlara: “Bunu kabul ettiniz mi? Verdiğim bu ağır görevi üstlendiniz mi?” demişti. Onlar da: \"Kabul ettik\" diye cevap verdiler. Bunun üzerine Allah da: \"Şahit olun! Ben de sizinle birlikte şahitlik edenlerdenim\" buyurmuştu.",""],[82,"فَمَن تَوَلَّىٰ بَعْدَ ذَٰلِكَ فَأُو۟لَٰٓئِكَ هُمُ ٱلْفَٰسِقُونَ","Faman tavallâ ba'da zâlika fa ulâ'ika humul-fâsikûn.","Artık kim bundan sonra yüz çevirirse, işte onlar fasıkların ta kendileridir.",""],[83,"أَفَغَيْرَ دِينِ ٱللَّهِ يَبْغُونَ وَلَهُۥٓ أَسْلَمَ مَن فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ طَوْعًا وَكَرْهًا وَإِلَيْهِ يُرْجَعُونَ","Afagayra dînillâhi yabgûna ve lahû aslama man fis-samâvâti vel-ardi tav'av ve ilayhi yurca'ûn.","Allah’ın dininden başka bir din mi arzu ediyorlar? Oysa, göklerde ve yerde olanların hepsi isteyerek ve isyemeyerek O’na teslim olmuştur. Ve O'na döndürüleceklerdir.",""],[84,"قُلْ ءَامَنَّا بِٱللَّهِ وَمَآ أُنزِلَ عَلَيْنَا وَمَآ أُنزِلَ عَلَىٰٓ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ وَيَعْقُوبَ وَٱلْأَسْبَاطِ وَمَآ أُوتِىَ مُوسَىٰ وَعِيسَىٰ وَٱلنَّبِيُّونَ مِن رَّبِّهِمْ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّنْهُمْ وَنَحْنُ لَهُۥ مُسْلِمُونَ","Kul âmannâ billâhi ve mâ unzila 'alaynâ ve mâ unzila 'alâ ibrâhîma ve ismâ'îla ve ishâka ve ya'kûba vel-asbâti ve mâ ûtiya mûsâ ve 'îsâ van-nabiyyûna mir rabbihim, lâ nufarriku bayna ahadim minhum, ve nahnu lahû muslimûn.","Deyin ki: ''Biz Allah’a, bize indirilene (Kur’an’a), İbrahim, İsmail, İshak, Ya'kûb ve torunlarına indirilene, Mûsâ ve İsa’ya verilen (Tevrat ve İncil) ile bütün diğer peygamberlere Rablerinden verilene iman ettik. Onlardan hiçbirini diğerinden ayırt etmeyiz. Biz Allah'a teslim olanlarız.\"",""],[85,"وَمَن يَبْتَغِ غَيْرَ ٱلْإِسْلَٰمِ دِينًا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِى ٱلْـَٔاخِرَةِ مِنَ ٱلْخَٰسِرِينَ","Ve may yabtagi gayral-islâmi dînan falay yukbala minh, ve huva fil-âhirati minal hâsirîn.","Kim İslam’dan başka bir din ararsa, (bu) ondan asla kabul edilmeyecektir. O, ahirette de hüsrana uğrayanlardandır.",""],[86,"كَيْفَ يَهْدِى ٱللَّهُ قَوْمًا كَفَرُوا۟ بَعْدَ إِيمَٰنِهِمْ وَشَهِدُوٓا۟ أَنَّ ٱلرَّسُولَ حَقٌّ وَجَآءَهُمُ ٱلْبَيِّنَٰتُ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ","Kayfa yahdillâhu kavman kafarû ba'da îmânihim ve şahidû annar-rasûla hakkuv ve câ'ahumul-bayyinât, vallâhu lâ yahdil-kavmaz-zâlimîn.","İman edip, peygamberin hak olduğuna şehadet ettikten ve kendilerine açık belgeler geldikten sonra kâfir olan bir topluluğa Allah nasıl hidayet eder? Allah zalim topluma hidayet etmez.",""],[87,"أُو۟لَٰٓئِكَ جَزَآؤُهُمْ أَنَّ عَلَيْهِمْ لَعْنَةَ ٱللَّهِ وَٱلْمَلَٰٓئِكَةِ وَٱلنَّاسِ أَجْمَعِينَ","Ulâ'ika cazâ'uhum anna 'alayhim la'natallâhi vel-malâ'ikati van-nâsi acma'în.","İşte onların cezası, Allah’ın meleklerin ve bütün insanların lanetinin üzerlerine olmasıdır.",""],[88,"خَٰلِدِينَ فِيهَا لَا يُخَفَّفُ عَنْهُمُ ٱلْعَذَابُ وَلَا هُمْ يُنظَرُونَ","Hâlidîna fihâ, lâ yuhaffafu 'anhumul-'azâbu ve lâ hum yunzarûn.","Orada ebedi kalacaklar. Azap, onlardan hafifletilmez ve onlara mühlet de verilmez.",""],[89,"إِلَّا ٱلَّذِينَ تَابُوا۟ مِنۢ بَعْدِ ذَٰلِكَ وَأَصْلَحُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ","Illal-lazîna tâbû mim ba'di zâlika ve aslahû, fa'innallâha gafûrur rahîm.","Ancak, bu hatalarından sonra tevbe edip, hallerini düzeltenler müstesnadır. Muhakkak ki Allah, çokça affedendir, çokça merhamet edendir.",""],[90,"إِنَّ ٱلَّذِينَ كَفَرُوا۟ بَعْدَ إِيمَٰنِهِمْ ثُمَّ ٱزْدَادُوا۟ كُفْرًا لَّن تُقْبَلَ تَوْبَتُهُمْ وَأُو۟لَٰٓئِكَ هُمُ ٱلضَّآلُّونَ","Innal-lazîna kafarû ba'da îmânihim summazdâdû kufral lan tukbala tavbatuhum, ve ulâ'ika humud-dâllûn.","İman ettikten sonra kâfir olup küfürlerini arttıranların tevbeleri asla kabul edilmeyecektir. Onlar sapıkların ta kendileridir.",""],[91,"إِنَّ ٱلَّذِينَ كَفَرُوا۟ وَمَاتُوا۟ وَهُمْ كُفَّارٌ فَلَن يُقْبَلَ مِنْ أَحَدِهِم مِّلْءُ ٱلْأَرْضِ ذَهَبًا وَلَوِ ٱفْتَدَىٰ بِهِۦٓ أُو۟لَٰٓئِكَ لَهُمْ عَذَابٌ أَلِيمٌ وَمَا لَهُم مِّن نَّٰصِرِينَ","Innal-lazîna kafarû ve mâtû ve hum kuffârun falay yukbala min ahadihim mil'ul-ardi zahabav ve laviftadâ bih, ulâ'ika lahum 'azâbun alîmuv ve mâ lahum min nâsirîn.","Şüphesiz, kâfir olup bu halde kâfir olarak ölenlerin hiçbirinden, yeryüzünü dolduracak kadar altın fidye verse dahi asla kabul edilmeyecektir. İşte acıklı azap bunlar içindir. Onlar için hiçbir yardımcı da yoktur.",""],[92,"لَن تَنَالُوا۟ ٱلْبِرَّ حَتَّىٰ تُنفِقُوا۟ مِمَّا تُحِبُّونَ وَمَا تُنفِقُوا۟ مِن شَىْءٍ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌ","Lan tanâlul-birra hattâ tunfikû mimmâ tuhibbûn, ve mâ tunfikû min şay'in fa innallâha bihî 'alîm.","Sevdiğiniz şeylerden infak etmedikçe iyiliğe asla erişemezsiniz. Her ne harcarsanız Allah onu hakkıyla bilir.",""],[93,"كُلُّ ٱلطَّعَامِ كَانَ حِلًّا لِّبَنِىٓ إِسْرَٰٓءِيلَ إِلَّا مَا حَرَّمَ إِسْرَٰٓءِيلُ عَلَىٰ نَفْسِهِۦ مِن قَبْلِ أَن تُنَزَّلَ ٱلتَّوْرَىٰةُ قُلْ فَأْتُوا۟ بِٱلتَّوْرَىٰةِ فَٱتْلُوهَآ إِن كُنتُمْ صَٰدِقِينَ","Kullut-ta'âmi kâna hillal libanî isrâ'îla illâ mâ harrama isrâ'îlu 'alâ nafsihî min kabli an tunazzalat-tavrâh, kul fa'tû bit-tavrâti fatlûhâ in kuntum sâdikîn.","Tevrat indirilmeden önce, İsrail’in (Ya'kûb’un) kendisine haram kıldığı dışında, yiyeceklerin hepsi İsrailoğulları'na helâl idi. De ki: ''Eğer doğru söyleyenler iseniz, haydi Tevrat’ı getirip okuyun.''",""],[94,"فَمَنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ ٱلْكَذِبَ مِنۢ بَعْدِ ذَٰلِكَ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ","Fa maniftarâ 'alallâhil-kaziba mim ba'di zâlika fa ulâ'ika humuz-zâlimûn.","Artık bundan sonra Allah’a karşı kim yalan uydurursa, işte onlar zalimlerin ta kendileridir.",""],[95,"قُلْ صَدَقَ ٱللَّهُ فَٱتَّبِعُوا۟ مِلَّةَ إِبْرَٰهِيمَ حَنِيفًا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ","Kul sadakallâh, fattabi'û millata ibrâhîma hanîfâ, ve mâ kâna minal-muşrikîn.","De ki: Allah doğru söylemiştir. Öyleyse, hanif olan İbrahim’in yoluna uyun! O, müşriklerden değildi.",""],[96,"إِنَّ أَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذِى بِبَكَّةَ مُبَارَكًا وَهُدًى لِّلْعَٰلَمِينَ","Inna avvala baytiv vudi'a lin-nâsi lal-lazî bibakkata mubârakav ve hudal lil-'âlamîn.","İnsanlar için (mabed olarak) kurulan ilk ev şüphesiz Mekke'deki mübarek ve âlemlere hidayet kaynağı olan (Kâbe) dir.",""],[97,"فِيهِ ءَايَٰتٌۢ بَيِّنَٰتٌ مَّقَامُ إِبْرَٰهِيمَ وَمَن دَخَلَهُۥ كَانَ ءَامِنًا وَلِلَّهِ عَلَى ٱلنَّاسِ حِجُّ ٱلْبَيْتِ مَنِ ٱسْتَطَاعَ إِلَيْهِ سَبِيلًا وَمَن كَفَرَ فَإِنَّ ٱللَّهَ غَنِىٌّ عَنِ ٱلْعَٰلَمِينَ","Fîhi âyâtum bayyinâtum makâmu ibrâhîm, ve man dahalahû kâna âminâ, ve lillâhi 'alan-nâsi hiccul-bayti manistatâ'a ilayhi sabîlâ, ve man kafara fa innallâha ganiyyun 'anil-'âlamîn.","Orada apaçık deliller, Makam-ı İbrahim vardır. Kim oraya girerse güven içinde olur. Yoluna güç yetirebilenlerin (Kâbe'yi) haccetmesi, Allah’ın insanlar üzerine (yüklediği) hakkıdır. Kim inkâr ederse (bu hakkı tanımazsa), şüphesiz Allah bütün âlemlerden müstağnidir.",""],[98,"قُلْ يَٰٓأَهْلَ ٱلْكِتَٰبِ لِمَ تَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَٱللَّهُ شَهِيدٌ عَلَىٰ مَا تَعْمَلُونَ","Kul yâ ahlal-kitâbi lima takfurûna bi'âyâtillâh, vallâhu şahîdun 'alâ mâ ta'malûn.","De ki: Ey Ehl-i Kitap! Allah, yaptıklarınızı görüp dururken Allah’ın âyetlerini niçin inkâr ediyorsunuz?",""],[99,"قُلْ يَٰٓأَهْلَ ٱلْكِتَٰبِ لِمَ تَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ تَبْغُونَهَا عِوَجًا وَأَنتُمْ شُهَدَآءُ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ","Kul yâ ahlal-kitâbi lima tasuddûna 'an sabîlillâhi man âmana tabgûnahâ 'ivacav ve antum şuhadâ', ve mallâhu bigâfilin 'ammâ ta'malûn.","De ki: Ey Ehl-i kitap! (Gerçeği) görüp bildiğiniz halde niçin Allah'ın yolunu eğri göstermeye yeltenerek Müminleri Allah yolundan çevirmeye kalkışıyorsunuz? Allah yaptıklarınızdan gâfil değildir.",""],[100,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن تُطِيعُوا۟ فَرِيقًا مِّنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ يَرُدُّوكُم بَعْدَ إِيمَٰنِكُمْ كَٰفِرِينَ","Yâ ayyuhal-lazîna âmanû in tutî'û farîkam minal-lazîna ûtul-kitâba yaruddûkum ba'da îmânikum kâfirîn.","Ey iman edenler! Eğer kitap verilenlerden bir gruba itaat edecek olursanız, sizi iman ettikten sonra kâfirler olarak döndürürler.",""],[101,"وَكَيْفَ تَكْفُرُونَ وَأَنتُمْ تُتْلَىٰ عَلَيْكُمْ ءَايَٰتُ ٱللَّهِ وَفِيكُمْ رَسُولُهُۥ وَمَن يَعْتَصِم بِٱللَّهِ فَقَدْ هُدِىَ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ","Ve kayfa takfurûna ve antum tutlâ 'alaykum âyâtullâhi ve fîkum rasûluh, ve may ya'tasim billâhi fakad hudiya ilâ sirâtim mustakîm.","Size Allah’ın ayetleri okunur dururken, üstelik Allah'ın peygamberi de aranızda bulunurken nasıl olurda inkâra saparsınız ? Her kim Allah’a bağlanırsa kesinlikle doğru yola iletilmiştir.",""],[102,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ حَقَّ تُقَاتِهِۦ وَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ","Yâ ayyuhal-lazîna âmanuttakullâha hakka tukâtihî ve lâ tamûtunna illâ ve antum muslimûn.","Ey iman edenler! Allah’tan gerektiği gibi sakının ve yalnızca Müslümanlar olarak can verin.",""],[103,"وَٱعْتَصِمُوا۟ بِحَبْلِ ٱللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا۟ وَٱذْكُرُوا۟ نِعْمَتَ ٱللَّهِ عَلَيْكُمْ إِذْ كُنتُمْ أَعْدَآءً فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُم بِنِعْمَتِهِۦٓ إِخْوَٰنًا وَكُنتُمْ عَلَىٰ شَفَا حُفْرَةٍ مِّنَ ٱلنَّارِ فَأَنقَذَكُم مِّنْهَا كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَهْتَدُونَ","Ve'tasimû bihablillâhi camî'av ve lâ tafarrakû, vazkurû ni'matallâhi 'alaykum iz kuntum a'dâ'an fa allafa bayna kulûbikum fa asbahtum bi ni'matihî ihvânâ, ve kuntum 'alâ şafâ hufratim minan-nâri fa ankazakum minhâ, kazâlika yubayyinullâhu lakum âyâtihî la'allakum tahtadûn.","Topluca Allah’ın ipine sımsıkı sarılın ve ayrılığa düşmeyin! Allah’ın üzerinizdeki nimetini düşünün. Hani siz düşman idiniz de O, kalplerinizi birleştirdi. O'nun bu nimeti ile kardeşler oldunuz. Siz, bir ateş çukurunun kenarında idiniz de sizi oradan kurtardı. Doğru yola çıkasınız diye, Allah size ayetlerini işte böyle açıklıyor.",""],[104,"وَلْتَكُن مِّنكُمْ أُمَّةٌ يَدْعُونَ إِلَى ٱلْخَيْرِ وَيَأْمُرُونَ بِٱلْمَعْرُوفِ وَيَنْهَوْنَ عَنِ ٱلْمُنكَرِ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ","Valtakum minkum ummatuy yad'ûna ilal-hayri ve ya'murûna bil-ma'rûfi ve yanhavna 'anil-munkar, ve ulâ'ika humul-muflihûn.","Sizden hayra davet eden, iyiliği emredip, kötülükten uzaklaştıran bir ümmet bulunsun. İşte kurtuluşa erenler onlardır.",""],[105,"وَلَا تَكُونُوا۟ كَٱلَّذِينَ تَفَرَّقُوا۟ وَٱخْتَلَفُوا۟ مِنۢ بَعْدِ مَا جَآءَهُمُ ٱلْبَيِّنَٰتُ وَأُو۟لَٰٓئِكَ لَهُمْ عَذَابٌ عَظِيمٌ","Ve lâ takûnû kal-lazîna tafarrakû vahtalafû mim ba'di mâ câ'ahumul-bayyinât, ve ulâ'ika lahum 'azâbun 'azîm.","Kendilerine apaçık deliller geldikten sonra parçalanıp ayrılığa düşenler gibi olmayın. İşte onlar için büyük bir azap vardır.",""],[106,"يَوْمَ تَبْيَضُّ وُجُوهٌ وَتَسْوَدُّ وُجُوهٌ فَأَمَّا ٱلَّذِينَ ٱسْوَدَّتْ وُجُوهُهُمْ أَكَفَرْتُم بَعْدَ إِيمَٰنِكُمْ فَذُوقُوا۟ ٱلْعَذَابَ بِمَا كُنتُمْ تَكْفُرُونَ","Yavma tabyaddu vucûhuv ve tasvaddu vucûh, fa ammal-lazînasvaddat vucûhuhum, akafartum ba'da îmânikum fa zûkul-'azâba bimâ kuntum takfurûn.","Bir takım yüzlerin parladığı ve bir takım yüzlerin de karardığı o günde yüzleri kararanlara: İmanınızdan sonra kâfir mi oldunuz? Öyleyse, kâfir olduğunuz için tadın azabı (denir).",""],[107,"وَأَمَّا ٱلَّذِينَ ٱبْيَضَّتْ وُجُوهُهُمْ فَفِى رَحْمَةِ ٱللَّهِ هُمْ فِيهَا خَٰلِدُونَ","Ve ammal lazînabyaddat vucûhuhum fafî rahmatillâh, hum fîhâ hâlidûn.","Yüzleri ağaranlar ise Allah’ın rahmeti içindedirler. Onlar orada ebedî kalacaklardır.",""],[108,"تِلْكَ ءَايَٰتُ ٱللَّهِ نَتْلُوهَا عَلَيْكَ بِٱلْحَقِّ وَمَا ٱللَّهُ يُرِيدُ ظُلْمًا لِّلْعَٰلَمِينَ","Tilka âyâtullâhi natlûhâ 'alayka bil-hakk, ve mallâhu yurîdu zulmal lil-'âlamîn.","İşte bunlar Allah’ın, sana hak olarak okuduğumuz ayetleridir. Allah, âlemlerdeki hiçbir kimseye zulmetmek istemez.",""],[109,"وَلِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ وَإِلَى ٱللَّهِ تُرْجَعُ ٱلْأُمُورُ","Ve lillâhi mâ fis-samâvâti ve mâ fil-ard, ve ilallâhi turca'ul-umûr.","Göklerde ve yerde ne varsa Allah’ındır. Bütün işler ancak Allah’a döndürülür.",""],[110,"كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِٱلْمَعْرُوفِ وَتَنْهَوْنَ عَنِ ٱلْمُنكَرِ وَتُؤْمِنُونَ بِٱللَّهِ وَلَوْ ءَامَنَ أَهْلُ ٱلْكِتَٰبِ لَكَانَ خَيْرًا لَّهُم مِّنْهُمُ ٱلْمُؤْمِنُونَ وَأَكْثَرُهُمُ ٱلْفَٰسِقُونَ","Kuntum hayra ummatin uhricat lin-nâsi ta'murûna bil-ma'rûfi ve tanhavna 'anil-munkari ve tu'minûna billâh, ve lav âmana ahlul-kitâbi lakâna hayral lahum, minhumul-mu'minûna ve aksaruhumul-fâsikûn.","Siz, insanlar için çıkarılmış en hayırlı ümmetsiniz. İyiliği emreder, kötülükten men eder ve Allah’a iman edersiniz. Kitap ehli de iman etseydi elbette kendileri için hayırlı olurdu. Onlardan iman edenler de var. Ama pek çoğu fasık kimselerdir.",""],[111,"لَن يَضُرُّوكُمْ إِلَّآ أَذًى وَإِن يُقَٰتِلُوكُمْ يُوَلُّوكُمُ ٱلْأَدْبَارَ ثُمَّ لَا يُنصَرُونَ","Lay yadurrûkum illâ azâ, ve iy yukâtilûkum yuvallûkumul-adbâr, summa lâ yunsarûn.","Onlar size eziyetten başka bir zarar veremezler. Eğer sizinle savaşmaya kalkışsalar, size arkalarını dönüp kaçarlar. Sonra onlara yardım da edilmez.",""],[112,"ضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ أَيْنَ مَا ثُقِفُوٓا۟ إِلَّا بِحَبْلٍ مِّنَ ٱللَّهِ وَحَبْلٍ مِّنَ ٱلنَّاسِ وَبَآءُو بِغَضَبٍ مِّنَ ٱللَّهِ وَضُرِبَتْ عَلَيْهِمُ ٱلْمَسْكَنَةُ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ","Duribat 'alayhimuz-zillatu ayna mâ sukifû illâ bihablim minallâhi ve hablim minan-nâsi ve bâ'û bigadabim minallâhi ve duribat 'alayhimul-maskanah, zâlika bi'annahum kânû yakfurûna bi'âyâtillâhi ve yaktulûnal-ambiyâ'a bigayri hakk, zâlika bimâ 'asav ve kânû ya'tadûn.","Onlar (Yahudiler) nerede bulunsalar, Allah'ın ipine (ahdine) ve insanların ipine (emanına) sığınanlar müstesna, onlara alçaklık damgası vurulmuştur. Allah'tan bir gazaba uğramışlardır ve onlara miskinlik damgası vurulmuştur. Çünkü onlar, Allah'ın ayetlerinin inkâr ediyorlar ve haksız yere peygamberlerini öldürüyorlardı. Bu da, onların isyan etmiş ve haddi aşmış bulunmalarındandır.",""],[113,"لَيْسُوا۟ سَوَآءً مِّنْ أَهْلِ ٱلْكِتَٰبِ أُمَّةٌ قَآئِمَةٌ يَتْلُونَ ءَايَٰتِ ٱللَّهِ ءَانَآءَ ٱلَّيْلِ وَهُمْ يَسْجُدُونَ","Laysû savâ'â, min ahlil-kitâbi ummatun kâ'imatuy yatlûna âyâtillâhi ânâ'al-layli ve hum yascudûn.","Ehl-i kitabın hepsi bir değildir. Onlardan; geceleri Allah’ın ayetlerini okuyup duran, secdeye kapanan bir topluluk vardır.",""],[114,"يُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ وَيَأْمُرُونَ بِٱلْمَعْرُوفِ وَيَنْهَوْنَ عَنِ ٱلْمُنكَرِ وَيُسَٰرِعُونَ فِى ٱلْخَيْرَٰتِ وَأُو۟لَٰٓئِكَ مِنَ ٱلصَّٰلِحِينَ","Yu'minûna billâhi vel-yavmil-âhiri ve ya'murûna bil-ma'rûfi ve yanhavna 'anil-munkari ve yusâri'ûna fil-hayrât, ve ulâ'ika minas-sâlihîn.","Onlar, Allah’a ve ahiret gününe iman ederler. İyiliği emreder, kötülükten men eder, hayır işlerinde birbirleriyle yarışırlar. İşte onlar salihlerdendir.",""],[115,"وَمَا يَفْعَلُوا۟ مِنْ خَيْرٍ فَلَن يُكْفَرُوهُ وَٱللَّهُ عَلِيمٌۢ بِٱلْمُتَّقِينَ","Ve mâ yaf'alûna min hayrin falay yukfarûh, vallâhu 'alîmum bil-muttakîn.","Yaptıkları hiçbir iyilik inkâr edilmeyecektir. Allah muttakileri çok iyi bilmektedir.",""],[116,"إِنَّ ٱلَّذِينَ كَفَرُوا۟ لَن تُغْنِىَ عَنْهُمْ أَمْوَٰلُهُمْ وَلَآ أَوْلَٰدُهُم مِّنَ ٱللَّهِ شَيْـًٔا وَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ هُمْ فِيهَا خَٰلِدُونَ","Innal-lazîna kafarû lan tugniya 'anhum amvâluhum ve lâ avlâduhum minallâhi şay'â, ve ulâ'ika ashâbun-nâr, hum fîhâ hâlidûn.","Kâfirlerin ne malları ne evlatları Allah’a karşı bir fayda sağlamayacaktır. İşte onlar ateş ehlidirler. Onlar orada ebedî kalacaklardır.",""],[117,"مَثَلُ مَا يُنفِقُونَ فِى هَٰذِهِ ٱلْحَيَوٰةِ ٱلدُّنْيَا كَمَثَلِ رِيحٍ فِيهَا صِرٌّ أَصَابَتْ حَرْثَ قَوْمٍ ظَلَمُوٓا۟ أَنفُسَهُمْ فَأَهْلَكَتْهُ وَمَا ظَلَمَهُمُ ٱللَّهُ وَلَٰكِنْ أَنفُسَهُمْ يَظْلِمُونَ","Masalu mâ yunfikûna fî hâzihil-hayâtid-dun-yâ kamasali rîhin fihâ sirrun asâbat harsa kavmin zalamû anfusahum fa ahlakath, ve mâ zalamahumullâhu ve lâkin anfusahum yazlimûn.","Onların, bu dünya hayatında yapmakta oldukları harcamaların durumu, kendilerine zulmetmiş olan bir kavmin ekinlerini vurup da mahveden kavurucu bir rüzgârın durumu gibidir. Allah onlara zulmetmiş değildir, aksine onlar kendi kendilerine zulmetmişlerdir.",""],[118,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ بِطَانَةً مِّن دُونِكُمْ لَا يَأْلُونَكُمْ خَبَالًا وَدُّوا۟ مَا عَنِتُّمْ قَدْ بَدَتِ ٱلْبَغْضَآءُ مِنْ أَفْوَٰهِهِمْ وَمَا تُخْفِى صُدُورُهُمْ أَكْبَرُ قَدْ بَيَّنَّا لَكُمُ ٱلْـَٔايَٰتِ إِن كُنتُمْ تَعْقِلُونَ","Yâ ayyuhal-lazîna âmanû lâ tattahizû bitânatam min dûnikum lâ ya'lûnakum habâlâ, vaddû mâ 'anittum, kad badatil-bagdâ'u min afvâhihim, ve mâ tuhfî sudûruhum akbar, kad bayyannâ lakumul-âyâti in kuntum ta'kilûn.","Ey iman edenler! Sizden olmayanı sırdaş edinmeyin. Zira onlar size ellerinden gelen her türlü kötülüğü yaparlar, size sıkıntı verecek şeyleri arzu ederler. Öfkeleri ağızlarından taşmaktadır. İçlerinde gizledikleri (nefret) ise daha da büyüktür. Eğer düşünüp anlıyorsanız size âyetleri açıkladık.",""],[119,"هَٰٓأَنتُمْ أُو۟لَآءِ تُحِبُّونَهُمْ وَلَا يُحِبُّونَكُمْ وَتُؤْمِنُونَ بِٱلْكِتَٰبِ كُلِّهِۦ وَإِذَا لَقُوكُمْ قَالُوٓا۟ ءَامَنَّا وَإِذَا خَلَوْا۟ عَضُّوا۟ عَلَيْكُمُ ٱلْأَنَامِلَ مِنَ ٱلْغَيْظِ قُلْ مُوتُوا۟ بِغَيْظِكُمْ إِنَّ ٱللَّهَ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ","Hâ antum ulâ'i tuhibbûnahum ve lâ yuhibbûnakum ve tu'minûna bil-kitâbi kullih, ve izâ lakûkum kâlû âmannâ, ve izâ halav 'addû 'alaykumul-anâmila minal-gayz, kul mûtû bigayzikum, innallâha 'alîmum bizâtis-sudûr.","İşte siz öyle kimselersiniz ki, onları seversiniz; onlar ise bütün kitaplara iman ettiğiniz halde sizi sevmezler. Onlar sizinle karşılaştıkları zaman “iman ettik” derler. Ama kendi başlarına kaldıklarında, size karşı kinlerinden dolayı parmaklarının uçlarını ısırırlar. De ki: Öfkenizden ölün! Şüphesiz ki Allah, sinelerde olanı hakkıyla bilir.",""],[120,"إِن تَمْسَسْكُمْ حَسَنَةٌ تَسُؤْهُمْ وَإِن تُصِبْكُمْ سَيِّئَةٌ يَفْرَحُوا۟ بِهَا وَإِن تَصْبِرُوا۟ وَتَتَّقُوا۟ لَا يَضُرُّكُمْ كَيْدُهُمْ شَيْـًٔا إِنَّ ٱللَّهَ بِمَا يَعْمَلُونَ مُحِيطٌ","In tamsaskum hasanatun tasu'hum, ve in tusibkum sayyi'atuy yafrahû bihâ, ve in tasbirû ve tattakû lâ yadurrukum kayduhum şay'â, innallâha bimâ ya'malûna muhît.","Size bir iyilik dokunursa, bu onları üzer. Başınıza bir kötülük gelse, ona sevinirler. Eğer siz sabırlı olur, Allah’a karşı gelmekten sakınırsanız, onların hileleri size hiçbir zarar vermez. Çünkü Allah, onların yaptıklarını tam olarak kuşatmıştır.",""],[121,"وَإِذْ غَدَوْتَ مِنْ أَهْلِكَ تُبَوِّئُ ٱلْمُؤْمِنِينَ مَقَٰعِدَ لِلْقِتَالِ وَٱللَّهُ سَمِيعٌ عَلِيمٌ","Ve iz gadavka min ahlika tubavvi'ul-mu'minîna makâ'ida lil-kitâl, vallâhu samî'un 'alîm.","Hani sen Müminleri (Uhud’da) savaş mevzilerine yerleştirmek için, sabah erken ailenden (evinden) ayrılmıştın. Allah, hakkıyla işitendir, hakkıyla bilendir.",""],[122,"إِذْ هَمَّت طَّآئِفَتَانِ مِنكُمْ أَن تَفْشَلَا وَٱللَّهُ وَلِيُّهُمَا وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ","Iz hammat-tâ'ifatâni minkum an tafşalâ, vallâhu valiyyuhumâ, ve 'alallâhi falyatavakkalil-mu'minûn.","Hani sizden iki topluluk çözülüp dağılmaya yüz tutmuş idi; oysa Allah onların velisi idi. İman edenler yalnız Allah'a tevekkül etsinler.",""],[123,"وَلَقَدْ نَصَرَكُمُ ٱللَّهُ بِبَدْرٍ وَأَنتُمْ أَذِلَّةٌ فَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تَشْكُرُونَ","Ve lakad nasarakumullâhu bibadriv ve antum azillah, fattakullâha la'allakum taşkurûn.","Andolsun, siz son derece güçsüz iken Allah size Bedir’de yardım etmişti. O halde Allah’a karşı gelmekten sakının ki şükretmiş olasınız.",""],[124,"إِذْ تَقُولُ لِلْمُؤْمِنِينَ أَلَن يَكْفِيَكُمْ أَن يُمِدَّكُمْ رَبُّكُم بِثَلَٰثَةِ ءَالَٰفٍ مِّنَ ٱلْمَلَٰٓئِكَةِ مُنزَلِينَ","Iz takûlu lil-mu'minîna alay yakfiyakum ay yumiddakum rabbukum bisalâsati âlâfim minal-malâ'ikati munzalîn.","Hani sen Müminlere: “Rabbinizin, indirilmiş üç bin melek ile yardım etmesi size yetmez mi?” diyordun.",""],[125,"بَلَىٰٓ إِن تَصْبِرُوا۟ وَتَتَّقُوا۟ وَيَأْتُوكُم مِّن فَوْرِهِمْ هَٰذَا يُمْدِدْكُمْ رَبُّكُم بِخَمْسَةِ ءَالَٰفٍ مِّنَ ٱلْمَلَٰٓئِكَةِ مُسَوِّمِينَ","Balâ, in tasbirû ve tattakû ve ya'tûkum min favrihim hâzâ yumdidkum rabbukum bihamsati âlâfim minal-malâ'ikati musavvimîn.","Evet! Sabrettiğiniz ve Allah’a karşı gelmekten sakındığınız takdirde onlar ansızın üzerinize gelseler bile Rabbiniz nişanlı beş bin melekle size yardım eder.",""],[126,"وَمَا جَعَلَهُ ٱللَّهُ إِلَّا بُشْرَىٰ لَكُمْ وَلِتَطْمَئِنَّ قُلُوبُكُم بِهِۦ وَمَا ٱلنَّصْرُ إِلَّا مِنْ عِندِ ٱللَّهِ ٱلْعَزِيزِ ٱلْحَكِيمِ","Ve mâ ca'alahullâhu illâ buşrâ lakum ve litatma'inna kulûbukum bih, ve man-nasru illâ min 'indillâhil-'azîzil-hakîm.","Allah, bu yardımı size sadece müjde olması ve kalplerinizin bununla yatışması için yaptı. Zafer, ancak Aziz ve Hakim olan Allah katındandır.",""],[127,"لِيَقْطَعَ طَرَفًا مِّنَ ٱلَّذِينَ كَفَرُوٓا۟ أَوْ يَكْبِتَهُمْ فَيَنقَلِبُوا۟ خَآئِبِينَ","Liyakta'a tarafam minal-lazîna kafarû av yakbitahum fa yankalibû hâ'ibîn.","Bir de Allah, bu (yardımı) kâfirlerden bir kısmını helâk etsin ya da perişan etsin de ümitsiz olarak dönüp gitsinler diye yaptı.",""],[128,"لَيْسَ لَكَ مِنَ ٱلْأَمْرِ شَىْءٌ أَوْ يَتُوبَ عَلَيْهِمْ أَوْ يُعَذِّبَهُمْ فَإِنَّهُمْ ظَٰلِمُونَ","Laysa laka minal-amri şay'un av yatûba 'alayhim av yu'azzibahum fa innahum zâlimûn.","Bu işte senin yapacağın bir şey yoktur. Allah, ya tevbelerini
