    '<span class="note">'+(d.q[2]-d.q[1]+1>1?(d.q[2]-d.q[1]+1)+' âyet · ':'')+'Mişârî Râşid el-Afâsî</span></div>' : '';

    else if(gor==="ml") flow='<p class="flow ml-flow">'+rows.map((r,i)=>span(r,i,esc(r.ml),"ayno lt")).join("")+'</p>';
    else flow='<div class="mushaf"><p class="flow ar-flow" lang="ar">'+rows.map((r,i)=>span(r,i,esc(r.ar),"ayno")).join("")+'</p></div>';

      (gor==="ar" && d.q[1]===1 && d.q[0]!==9 && d.q[0]!==1 ? '<div class="besmele" lang="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>' : '')+
      flow+
      (d.not?'<p class="note">'+esc(d.not)+'</p>':'')+

  } else {
    body = (d.ar?'<div class="arbox" id="ay-'+d.id+'-0"><div class="ar" lang="ar">'+esc(d.ar)+'</div></div>':'')+
      '<div><div class="label">Okunuşu</div><p class="ok" style="margin-top:4px">'+esc(d.ok)+'</p></div>'+
      '<div><div class="label">Türkçe anlamı</div><p class="ml" style="margin-top:4px">'+esc(d.ml)+'</p></div>';

/* ================= SESLİ OKUMA ================= */
const player = {audio:null, id:null, queue:[], i:0, rowMap:[]};
const HIZLAR=[1,1.25,1.5,2];
function ayahUrl(n){ return "https://cdn.islamic.network/quran/audio/64/ar.alafasy/"+n+".mp3"; }
function playMark(){
  document.querySelectorAll(".ay.playing,.arbox.playing").forEach(x=>x.classList.remove("playing"));
  document.querySelectorAll("[data-play]").forEach(b=>{ const on=b.dataset.play===player.id; b.setAttribute("aria-pressed",String(on)); b.innerHTML=(on?I.stop+'<span>Durdur</span>':I.play+'<span>Dinle</span>'); });
  if(!player.id) return;
  const row=player.rowMap[player.i]; if(row==null) return;
  const el=document.getElementById("ay-"+player.id+"-"+row);
  if(el){ el.classList.add("playing"); const r=el.getBoundingClientRect(); if(r.top<80||r.bottom>innerHeight-90) el.scrollIntoView({block:"center",behavior:"smooth"}); }
}
function stopPlay(){ if(player.audio){ player.audio.pause(); player.audio.src=""; } player.id=null; player.queue=[]; playMark(); }
function startPlay(id){
  const d=duaById(id); if(!d||!d.q) return;
  if(player.id===id){ stopPlay(); return; }
  stopPlay();
  const [s,a0,a1]=d.q, base=AYAH_OFF[s-1];
  player.queue=[]; player.rowMap=[];
  if(a0===1 && s!==1 && s!==9){ player.queue.push(1); player.rowMap.push(null); }
  const multi=!!ayahRows(d);
  for(let a=a0;a<=a1;a++){ player.queue.push(base+a); player.rowMap.push(multi?a-a0:0); }
  player.id=id; player.i=0;
  if(!player.audio){
    player.audio=new Audio(); player.audio.preload="auto";
    player.audio.addEventListener("ended",()=>{ player.i++; if(player.i>=player.queue.length){ const done=player.id; stopPlay(); if(done) toast("Okuma tamamlandı"); return; } loadAyah(); });
    player.audio.addEventListener("error",()=>{ if(!player.id) return; stopPlay(); toast(SES_OK?"Ses yüklenemedi. İnternet bağlantınızı kontrol edin.":"Sesli okuma telefona kurduğunuz uygulamada çalışır, bu önizlemede çalmaz."); });
  }
  loadAyah();
}
function loadAyah(){
  const a=player.audio; a.src=ayahUrl(player.queue[player.i]);
  a.defaultPlaybackRate=a.playbackRate=S.hiz||1; try{ a.preservesPitch=true; }catch(e){}
  const p=a.play(); if(p&&p.catch) p.catch(()=>{});
  playMark();
  const nx=player.queue[player.i+1]; if(nx){ const pre=new Audio(); pre.preload="auto"; pre.src=ayahUrl(nx); }
}

/* ================= NAMAZ REHBERİ ================= */
const NAMAZLAR = [
  ["sabah_s","Sabah · sünnet","s2","sabah namazının sünnetini"],["sabah_f","Sabah · farz","f2","sabah namazının farzını"],
  ["ogle_s1","Öğle · ilk sünnet","sm4","öğle namazının ilk sünnetini"],["ogle_f","Öğle · farz","f4","öğle namazının farzını"],["ogle_s2","Öğle · son sünnet","s2","öğle namazının son sünnetini"],
  ["ikindi_s","İkindi · sünnet","sg4","ikindi namazının sünnetini"],["ikindi_f","İkindi · farz","f4","ikindi namazının farzını"],
  ["aksam_f","Akşam · farz","f3","akşam namazının farzını"],["aksam_s","Akşam · sünnet","s2","akşam namazının sünnetini"],
  ["yatsi_s1","Yatsı · ilk sünnet","sg4","yatsı namazının ilk sünnetini"],["yatsi_f","Yatsı · farz","f4","yatsı namazının farzını"],["yatsi_s2","Yatsı · son sünnet","s2","yatsı namazının son sünnetini"],
  ["vitir","Vitir","v3","vitir namazını"],
  ["cuma_s1","Cuma · ilk sünnet","sm4","cuma namazının ilk sünnetini"],["cuma_f","Cuma · farz","cf2","cuma namazının farzını"],["cuma_s2","Cuma · son sünnet","sm4","cuma namazının son sünnetini"]
];
const L = (...ids)=>ids;
function buildNamaz(tip){
  const total = {s2:2,f2:2,cf2:2,sm4:4,f4:4,sg4:4,f3:3,v3:3}[tip];
  const farz = tip[0]==="f" || tip==="cf2";
  const R=[];
  const kiyam1 = [{t:"İftitah tekbiri: “Allâhu Ekber” diyerek ellerinizi kaldırın. Erkekler başparmaklarını kulak memelerine değdirir, kadınlar ellerini omuz hizasına kaldırır. Sonra elleri bağlayın.", k:1}];
  const rukuSecde = (last)=>[
    {t:"Rükû: “Allâhu Ekber” deyip eğilin, ellerinizi dizlerinize koyun ve 3 kez okuyun.", d:L("ruku"), k:1},
    {t:"Doğrulurken “Semi'allâhu limen hamideh”, tam doğrulunca “Rabbenâ leke'l-hamd” deyin.", d:L("kavme")},
    {t:"Birinci secde: “Allâhu Ekber” deyip secdeye varın, 3 kez okuyun.", d:L("secde"), k:1},
    {t:"Celse: “Allâhu Ekber” deyip oturun, bir “Sübhânallâh” diyecek kadar durun."},
    {t:"İkinci secde: “Allâhu Ekber” deyip tekrar secdeye varın, 3 kez okuyun.", d:L("secde"), k:1},
    last ? null : null
  ].filter(Boolean);
  for(let r=1;r<=total;r++){
    const items=[];
    if(r===1){ items.push({niyet:1}); items.push(...kiyam1); items.push({t:"Ayakta, ellerinizi bağlı tutarak okuyun.", d:L("subhaneke","euzu","fatiha")}); }
    else if(r===3 && tip==="sg4"){ items.push({t:"Ayakta, gayr-i müekked sünnet olduğu için 3. rekâta da Sübhâneke ile başlayın.", d:L("subhaneke","euzu","fatiha")}); }
    else items.push({t:"Ayakta Besmele çekip Fâtiha okuyun.", d:L("fatiha")});
    const zamm = !(farz && r>=3);
    if(zamm) items.push({t:"Zamm-ı sûre: kısa bir sure ya da en az üç kısa âyet okuyun.", d:L("kevser","ihlas","asr")});
    else items.push({t:"Farzların 3. ve 4. rekâtında Fâtiha'dan sonra sure okunmaz."});
    if(tip==="v3" && r===3) items.push({t:"“Allâhu Ekber” diyerek ellerinizi kulak hizasına kaldırıp tekrar bağlayın ve Kunut dualarını okuyun.", d:L("kunut1","kunut2"), k:1});
    items.push(...rukuSecde());
    const sonOturus = r===total, ilkOturus = r===2 && total>2;
    if(ilkOturus){
      const ds = tip==="sg4" ? L("tehiyyat","salli","barik") : L("tehiyyat");
      items.push({t:"Birinci oturuş: “Allâhu Ekber” deyip oturun ve okuyun"+(tip==="sg4"?" (gayr-i müekked sünnette Salli ve Bârik de okunur).":"."), d:ds, k:1});
      items.push({t:"“Allâhu Ekber” diyerek "+(r+1)+". rekâta kalkın."});
    } else if(sonOturus){
      items.push({t:"Son oturuş: “Allâhu Ekber” deyip oturun ve sırasıyla okuyun.", d:L("tehiyyat","salli","barik","rabbenaatina","rabbenagfirli"), k:1});
      items.push({t:"Selam: Başınızı önce sağa çevirip “Esselâmü aleyküm ve rahmetullâh”, sonra sola çevirip aynısını söyleyin. Namaz tamamlandı.", stop:1});
    } else items.push({t:"“Allâhu Ekber” diyerek "+(r+1)+". rekâta kalkın."});
    R.push(items);
  }
  return {R, farz};
}
function viewKil(){
  const n = NAMAZLAR.find(x=>x[0]===S.namaz) || NAMAZLAR[1];
  const {R, farz} = buildNamaz(n[2]);

  const step = it => {
    if(it.niyet) return '<div class="st key"><span class="dot"></span><div><p><b>Niyet:</b> Kıbleye dönüp ayakta kalbinizden niyet edin. Dilinizle söylemek de güzeldir.</p><div class="niyet">“'+esc(niyet)+'”'+(farz?'<br><small>Cemaatle kılarken: “…uydum hazır olan imama” eklenir.</small>':'')+'</div></div></div>';
    return '<div class="st'+(it.k?' key':'')+(it.stop?' stop':'')+'"><span class="dot"></span><div><p>'+esc(it.t)+'</p>'+(it.d?'<div class="links">'+it.d.map(id=>'<button class="dl" data-dua="'+id+'">'+esc(duaById(id).t)+'</button>').join("")+'</div>':'')+'</div></div>';
  };
  return '<div class="card" style="display:grid;gap:8px"><label class="label" for="namazSel">Hangi namazı kılacaksınız?</label>'+sel+

    (farz?'<p class="note">Farzdan sonra tesbihat için sayaçta “Namaz tesbihatı” modunu kullanabilirsiniz.</p>':'')+'</div>'+
    R.map((items,i)=>'<div class="card rekat"><h3><i>'+(i+1)+'. rekât</i></h3>'+items.map(step).join("")+'</div>').join("");
}

let ilmQ = "", ilmAcik = new Set();
ILMIHAL.forEach(a=>{ a.key=trNorm([a.t,a.s,a.kw||"",JSON.stringify(a.b||[])].join(" ")); });
function ilmBlocks(b){
  return b.map(x=>{
    const [k,v,o,m]=x;
    if(k==="p") return '<p>'+esc(v)+'</p>';
    if(k==="h") return '<h4 class="ilh">'+esc(v)+'</h4>';
    if(k==="not") return '<p class="note">'+esc(v)+'</p>';
    if(k==="ul"||k==="ol") return '<'+k+' class="ol">'+v.map(t=>'<li>'+esc(t)+'</li>').join("")+'</'+k+'>';
    if(k==="ar") return '<div class="ilar"><div class="arbox"><div class="ar" lang="ar">'+esc(v)+'</div></div><p class="ok">'+esc(o)+'</p><p class="ml">'+esc(m)+'</p></div>';
    if(k==="tbl") return '<div class="tablewrap"><table class="iltbl"><thead><tr>'+v.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+o.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
    return "";
  }).join("");
}
function ilmBody(a){
  if(a.special==="kil") return viewKil();
  if(a.special==="rekat") return viewRekat();
  if(a.special==="abdest") return viewAbdest();
  if(a.special==="farz") return viewFarz();
  return ilmBlocks(a.b);
}
function ilmCard(a){
  const open = ilmAcik.has(a.id);
  return '<details class="card dua ilcard" data-ilm="'+a.id+'"'+(open?' open':'')+'><summary><span>'+esc(a.t)+'<small>'+esc(a.s)+'</small></span><span class="chev">'+I.chev+'</span></summary><div class="body ilbody">'+(open?ilmBody(a):'')+'</div></details>';
}

  const q = trNorm(ilmQ.trim());
  let list = ILMIHAL;
  if(kat) list = list.filter(a=>a.k===kat);
  if(q) list = list.filter(a=>q.split(/\s+/).every(w=>a.key.includes(w)));
  const count = k => ILMIHAL.filter(a=>a.k===k).length;
  const katIcon = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><path d="'+d+'"/></svg>';
  let res;
  if(!list.length) res = '<div class="card empty">“'+esc(ilmQ.trim())+'” ile ilgili konu bulunamadı. Başka bir kelime deneyin: abdest, oruç, zekât, kurban…</div>';
  else if(!kat && !q) res = ILM_KAT.map(([k,l])=>'<div class="tsec"><h2>'+l+' <small>'+count(k)+' konu</small></h2><div class="list">'+ILMIHAL.filter(a=>a.k===k).map(ilmCard).join("")+'</div></div>').join("");

/* ================= KIBLE ================= */
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
function qibla(lat,lon){
  const p1=rad(lat), p2=rad(KABE.lat), dl=rad(KABE.lon-lon);
  const b=deg(Math.atan2(Math.sin(dl)*Math.cos(p2), Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)));
  const a=Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return {bearing:(b+360)%360, km:6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))};
}
const yon=b=>["kuzey","kuzeydoğu","doğu","güneydoğu","güney","güneybatı","batı","kuzeybatı"][Math.round(b/45)%8];
let heading=null, compassOn=false, kibleMsg="";
function dialSVG(bearing){
  const rot = heading==null ? 0 : -heading;
  let s='<svg viewBox="0 0 300 300" aria-label="Kıble yönü göstergesi"><g id="dialRot" transform="rotate('+rot.toFixed(1)+' 150 150)">';
  s+='<circle class="dbg" cx="150" cy="150" r="138" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>';
  for(let i=0;i<72;i++){ const a=rad(i*5), big=i%18===0, mid=i%6===0, r1=138, r2=big?120:mid?126:131;
    s+='<line x1="'+(150+r1*Math.sin(a)).toFixed(1)+'" y1="'+(150-r1*Math.cos(a)).toFixed(1)+'" x2="'+(150+r2*Math.sin(a)).toFixed(1)+'" y2="'+(150-r2*Math.cos(a)).toFixed(1)+'" stroke="var(--muted)" stroke-width="'+(big?2:1)+'"/>'; }
  [["K",0],["D",90],["G",180],["B",270]].forEach(([t,a])=>{ s+='<text x="'+(150+104*Math.sin(rad(a))).toFixed(1)+'" y="'+(150-104*Math.cos(rad(a))+6).toFixed(1)+'" text-anchor="middle" font-size="17" font-weight="700" fill="'+(t==="K"?'var(--coral)':'var(--muted)')+'" font-family="Bricolage Grotesque, system-ui, sans-serif">'+t+'</text>'; });
  s+='<g transform="rotate('+bearing.toFixed(1)+' 150 150)"><path class="qarrow" d="M150 36 L161 150 L150 162 L139 150 Z" fill="var(--cobalt)"/><path d="M150 162 L161 150 L150 232 L139 150 Z" fill="var(--bead-off)"/><rect x="138" y="22" width="24" height="24" rx="3" fill="var(--ink)"/><rect x="138" y="28" width="24" height="3" fill="var(--coral)"/></g>';
  s+='<circle cx="150" cy="150" r="7" fill="var(--ink)"/></g><path class="qtop" d="M150 4 L157 16 L143 16 Z" fill="var(--coral)"/></svg>';
  return s;
}
const FEET_SVG='<svg viewBox="0 0 80 64" width="74" height="60"><g class="foot" transform="translate(25 36) rotate(-8) scale(-1 1)"><path d="M0 -14c6 0 8 6 7 13-1 6-2 9-1 14 1 5-2 9-6 9s-7-4-6-9c1-5 0-8-1-13-1-8 1-14 7-14z"/><circle cx="-5" cy="-21" r="2.6"/><circle cx="-0.5" cy="-23.5" r="2.4"/><circle cx="3.8" cy="-22.5" r="2.1"/><circle cx="7" cy="-19.5" r="1.8"/><circle cx="9" cy="-15.8" r="1.5"/></g><g class="foot" transform="translate(55 36) rotate(8)"><path d="M0 -14c6 0 8 6 7 13-1 6-2 9-1 14 1 5-2 9-6 9s-7-4-6-9c1-5 0-8-1-13-1-8 1-14 7-14z"/><circle cx="-5" cy="-21" r="2.6"/><circle cx="-0.5" cy="-23.5" r="2.4"/><circle cx="3.8" cy="-22.5" r="2.1"/><circle cx="7" cy="-19.5" r="1.8"/><circle cx="9" cy="-15.8" r="1.5"/></g></svg>';
let qBearing=0, qFound=false;
function foundBell(){ if(!S.settings.sound) return; tone(659,0,0.5,0.24); tone(880,0.14,0.55,0.22); tone(1319,0.28,0.9,0.18); }
function updateQibla(){
  if(heading==null) return;
  const dial=document.getElementById("dial"), st=document.getElementById("qStatus"); if(!dial||!st) return;
  let d=((qBearing-heading)%360+540)%360-180;
  const ad=Math.abs(d);
  if(!qFound && ad<=5){ qFound=true; vibrate([200,80,200]); foundBell(); }
  else if(qFound && ad>10){ qFound=false; }
  dial.classList.toggle("found",qFound); dial.parentElement.classList.toggle("found",qFound);
  st.innerHTML = qFound ? '<b>Kıbleye döndünüz</b>' : (d>0?'Sağa dönün · ':'Sola dönün · ')+Math.round(ad)+'°';
}

}
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading;
  else if(e.absolute && typeof e.alpha==="number") h=(360-e.alpha)%360;
  if(h==null) return;
  heading=h; const g=document.getElementById("dialRot"); if(g) g.setAttribute("transform","rotate("+(-h).toFixed(1)+" 150 150)");

}
async function startCompass(){
  kibleMsg="";

    window.addEventListener("deviceorientationabsolute",onOrient,true); window.addEventListener("deviceorientation",onOrient,true);
    compassOn=true;
    setTimeout(()=>{ if(compassOn && heading==null){ kibleMsg="Pusula sensörüne ulaşılamadı. Telefon pusulasıyla gösterilen dereceye dönebilirsiniz."; if(tab==="kible") render(); } },2500);

}

function viewIstatistik(){

  const all=Object.values(totals).reduce((a,b)=>a+b,0), week=days.reduce((a,b)=>a+b.n,0);
  const gun=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
  let streak=0; for(let i=0;i<3650;i++){ const d=new Date(); d.setDate(d.getDate()-i); const o=S.daily[todayKey(d)]; if(o && Object.keys(o).length) streak++; else if(i===0) continue; else break; }

    onay._data=data.s; return;
  }
  if(b.id==="yedekVazgec"){ onay.innerHTML=""; return; }
  if(b.id==="yedekEvet"){ const d=onay._data; S=Object.assign(defaults(),d); S.settings=Object.assign(defaults().settings,d.settings||{}); save(); applyTheme(); document.documentElement.style.setProperty("--ar-scale",S.arScale||1); render(); updateBand(); document.getElementById("sheetHost").innerHTML=""; toast("Yedek yüklendi"); return; }
});
document.getElementById("openSettings").addEventListener("click",openSettings);
document.getElementById("openStats").addEventListener("click",()=>go("istatistik"));
document.getElementById("sheetHost").addEventListener("click",e=>{ if(e.target.id==="sheet"||e.target.id==="closeSettings") document.getElementById("sheetHost").innerHTML=""; });
document.getElementById("sheetHost").addEventListener("change",e=>{ const k=e.target.dataset.set; if(!k) return; S.settings[k]=e.target.checked; save(); if(k==="wake") applyWake(); if(k==="vib"&&e.target.checked) vibrate(40); if(k==="sound"&&e.target.checked) bell(); if(k==="notify"&&e.target.checked) askNotify(e.target); });

/* ================= ÇİZİM VE OLAYLAR ================= */
const main=document.getElementById("main");
const FS_MIN=0.85, FS_MAX=1.6;
function fsBar(z){
  return '<div class="fsbar" role="group" aria-label="Yazı boyutu"><span>Yazı boyutu</span>'+
    '<button data-fs="-1" aria-label="Yazıyı küçült"'+(z<=FS_MIN?' aria-disabled="true"':'')+'>A−</button>'+
    '<b>%'+Math.round(z*100)+'</b>'+
    '<button data-fs="1" aria-label="Yazıyı büyüt"'+(z>=FS_MAX?' aria-disabled="true"':'')+'>A+</button></div>';
}
function render(){
  renderTabs();
  requestAnimationFrame(()=>{ const on=document.querySelector(".steps .on"); if(on){ const p=on.parentElement; p.scrollLeft=on.offsetLeft-p.clientWidth/2+on.offsetWidth/2; } });
  const html = ({sayac:viewSayac, vakitler:viewVakitler, dualar:viewDualar, hadisler:viewHadisler, rehber:viewRehber, kible:viewKible, tesbihler:viewTesbihler, zikirler:viewZikirler, istatistik:viewIstatistik}[tab])();
  if(tab==="sayac") main.innerHTML = html;
  else { const z=S.fs||1; main.innerHTML = fsBar(z)+'<div class="zoomwrap" style="zoom:'+z+'">'+html+'</div>'; }
}
main.addEventListener("pointerdown",e=>{ if(e.target.closest("#tap")){ e.preventDefault(); doTap(); } });
main.addEventListener("keydown",e=>{ if(e.target.id==="tap" && (e.key===" "||e.key==="Enter")){ e.preventDefault(); doTap(); setTimeout(()=>{ const t=document.getElementById("tap"); t&&t.focus(); },0); } });
function openHadis(i){
  hQuery=""; hKonu=""; hFav=false; go("hadisler");
  const el=document.getElementById("hadis-"+i);
  if(el){ el.scrollIntoView({block:"center"}); el.classList.add("hl"); }
}
main.addEventListener("keydown",e=>{ const hc=e.target.closest&&e.target.closest("[data-hadis]"); if(hc && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openHadis(+hc.dataset.hadis); } });
main.addEventListener("click",e=>{
  const hc=e.target.closest("[data-hadis]"); if(hc){ openHadis(+hc.dataset.hadis); return; }
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.mode){ S.mode=b.dataset.mode; confirmReset=false; save(); render(); return; }
  if(b.dataset.open){ const it=tById(b.dataset.open); if(it.turkce) return; S.diger=it.id; S.mode="diger"; save(); go("sayac"); return; }
  if(b.dataset.met){ S.method=b.dataset.met; save(); render(); updateBand(); return; }
  if(b.dataset.go){ go(b.dataset.go); return; }
  if(b.dataset.pick){ S.current=b.dataset.pick; S.mode="serbest"; save(); go("sayac"); return; }
  if(b.dataset.del){ S.custom=S.custom.filter(z=>z.id!==b.dataset.del); if(S.current===b.dataset.del) S.current="subhanallah"; save(); render(); toast("Zikir silindi"); return; }
  if(b.dataset.grup){ S.duaGrup=b.dataset.grup; save(); render(); return; }
  if(b.dataset.kat!==undefined && tab==="rehber"){ S.ilmKat=b.dataset.kat; save(); render(); return; }
  if(b.id==="ilmClear"){ S.ilmKat=""; ilmQ=""; save(); render(); return; }
  if(b.dataset.dua){ showDua(b.dataset.dua); return; }
  if(b.dataset.fav){ const i=+b.dataset.fav; S.favH=S.favH||[]; const k=S.favH.indexOf(i); if(k>=0) S.favH.splice(k,1); else S.favH.push(i); save(); refreshHadis(); toast(k>=0?"Favorilerden çıkarıldı":"Favorilere eklendi"); return; }
  if(b.dataset.konu!==undefined && tab==="hadisler"){ hKonu = hKonu===b.dataset.konu ? "" : b.dataset.konu; hFav=false; refreshHadis(); if(!b.classList.contains("chip")) window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(b.dataset.hfav){ hFav=!hFav; hKonu=""; refreshHadis(); return; }
  if(b.id==="hClear"){ hQuery=""; hKonu=""; hFav=false; const q=document.getElementById("hQ"); if(q) q.value=""; refreshHadis(); return; }
  if(b.dataset.fs){ const z=+(Math.min(FS_MAX,Math.max(FS_MIN,(S.fs||1)+(+b.dataset.fs)*0.1))).toFixed(2); if(z===(S.fs||1)){ toast(z>=FS_MAX?"En büyük boyuttasınız":"En küçük boyuttasınız"); return; } const y=window.scrollY, r=y/Math.max(1,document.body.scrollHeight); S.fs=z; save(); render(); window.scrollTo(0, r*document.body.scrollHeight); return; }
  if(b.dataset.play){ e.preventDefault(); ac(); startPlay(b.dataset.play); return; }
  if(b.dataset.hiz){ S.hiz=+b.dataset.hiz; save(); if(player.audio){ player.audio.defaultPlaybackRate=player.audio.playbackRate=S.hiz; } document.querySelectorAll("[data-hiz]").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.hiz===S.hiz))); return; }
  if(b.dataset.gor){ S.surahGor=b.dataset.gor; save(); const y=window.scrollY; render(); window.scrollTo(0,y); playMark(); return; }
  if(b.dataset.target){
    if(b.dataset.target==="custom"){ const c=document.getElementById("customT"); c.hidden=!c.hidden; if(!c.hidden) document.getElementById("customTInput").focus(); return; }
    S.targets[curId()]=+b.dataset.target; const c=ctr(curId()); if(c.count>+b.dataset.target) c.count=0; save(); render(); return;
  }
  switch(b.id){
    case "customTOk": { const v=parseInt(document.getElementById("customTInput").value,10); if(!(v>0&&v<=100000)){ toast("1 ile 100.000 arası bir sayı girin"); return; } S.targets[curId()]=v; const c=ctr(curId()); if(c.count>v) c.count=0; save(); render(); toast("Hedef "+fmt(v)); return; }
    case "undo": doUndo(); return;
    case "reset": confirmReset=true; render(); return;
    case "noReset": confirmReset=false; render(); return;
    case "yesReset": doReset(); return;
    case "geoBtn": findGeo(); return;
    case "compassBtn": if(!compassOn) startCompass(); return;
    case "arMinus": case "arPlus": { S.arScale=Math.min(1.6,Math.max(0.8,+(S.arScale+(b.id==="arPlus"?0.1:-0.1)).toFixed(1))); document.documentElement.style.setProperty("--ar-scale",S.arScale); save(); return; }
  }
});
main.addEventListener("change",e=>{
  if(e.target.classList.contains("citySel")){ S.city=e.target.value; geoMsg=""; save(); render(); updateBand(); }
  if(e.target.id==="namazSel"){ S.namaz=e.target.value; save(); render(); }
});
main.addEventListener("submit",e=>{
  if(e.target.id!=="addForm") return; e.preventDefault();
  const tr=document.getElementById("newTr").value.trim(); if(!tr) return;
  const h=parseInt(document.getElementById("newHedef").value,10);
  const z={id:"c"+Date.now().toString(36), tr, mn:document.getElementById("newMn").value.trim(), hedef:(h>0&&h<=100000)?h:33, custom:true};
  S.custom.push(z); S.current=z.id; S.mode="serbest"; save(); toast("Eklendi, sayaçta açıldı"); go("sayac");
});

/* ================= VAKİT BİLDİRİMİ ================= */
async function askNotify(input){
  try{
    if(!("Notification" in window)) throw new Error("yok");
    const r = Notification.permission==="granted" ? "granted" : await Notification.requestPermission();
    if(r!=="granted") throw new Error("izin");
    toast("Vakit bildirimi açık");
  }catch(e){ S.settings.notify=false; save(); if(input) input.checked=false; toast("Bildirim izni verilmedi. Telefon ayarlarından izin verebilirsiniz."); }
}
function checkVakit(){
  if(!S.settings.notify) return;
  const st=nowState(), k=st.cur, t=st.today[k]; if(!t) return;
  const age=st.now-t, key=st.y+"-"+st.m+"-"+st.d+"-"+k;
  if(age<0 || age>5*60000 || S.lastNotified===key) return;
  S.lastNotified=key; save();
  bell(); vibrate([400,200,400,200,400]);
  const title = k==="gunes" ? "Güneş doğdu" : VAKIT_AD[k]+" vakti girdi";
  const body = st.p.name+" · "+hm(t,st.p.tz)+(k==="gunes"?" · Sabah namazı vakti çıktı":"");
  toast(title);
  try{ if(Notification.permission==="granted" && navigator.serviceWorker) navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body, icon:"icon-192.png", badge:"icon-192.png", tag:"vakit", renotify:true})); }catch(e){}
}
setInterval(checkVakit,15000);

applyTheme(); render(); updateBand(); applyWake(); checkVakit();
if("serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
})();
</script>

</html>
