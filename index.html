kabul edip onları affeder ya da zalim olduklarından dolayı onlara azap eder.",""],[129,"وَلِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ وَٱللَّهُ غَفُورٌ رَّحِيمٌ","Ve lillâhi mâ fis-samâvâti ve mâ fil-ard, yagfiru limay yaşâ'u ve yu'azzibu may yaşâ', vallâhu gafûrur rahîm.","Göklerde ve yerde ne varsa hepsi Allah’ındır! O, dilediğini bağışlar, dilediğine azap eder. Allah, çok bağışlayan ve merhamet edendir.",""],[130,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَأْكُلُوا۟ ٱلرِّبَوٰٓا۟ أَضْعَٰفًا مُّضَٰعَفَةً وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُفْلِحُونَ","Yâ ayyuhal-lazîna âmanû lâ ta'kulur-ribâ ad'âfam mudâ'afah, vattakullâha la'allakum tuflihûn.","Ey iman edenler! Kat kat arttırılmış olarak faiz yemeyin. Allah’a karşı gelmekten sakının ki, kurtuluşa eresiniz.",""],[131,"وَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِىٓ أُعِدَّتْ لِلْكَٰفِرِينَ","Vattakun-nâral latî u'iddat lil-kâfirîn.","Kâfirler için hazırlanmış ateşten kendinizi koruyun.",""],[132,"وَأَطِيعُوا۟ ٱللَّهَ وَٱلرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ","Ve atî'ullâha var-rasûla la'allakum turhamûn.","Allah'a ve Rasûl'e itaat edin ki, merhamete erdirilesiniz.",""],[133,"وَسَارِعُوٓا۟ إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا ٱلسَّمَٰوَٰتُ وَٱلْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ","Ve sâri'û ilâ magfiratim mir rabbikum ve cannatin 'arduhas-samâvâtu vel-ard, u'iddat lil-muttakîn.","Rabbinizin mağfiretine ve takva sahipleri için hazırlanmış, eni gökler ve yer kadar olan cennete koşuşun!",""],[134,"ٱلَّذِينَ يُنفِقُونَ فِى ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلْكَٰظِمِينَ ٱلْغَيْظَ وَٱلْعَافِينَ عَنِ ٱلنَّاسِ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ","Al-lazîna yunfikûna fis-sarrâ'i vad-darrâ'i vel-kâzimînal gayza vel-'âfîna 'anin-nâs, vallâhu yuhibbul-muhsinîn.","Muttakiler, bollukta ve darlıkta Allah yolunda harcayanlar, öfkelerini yenenler, insanları affedenlerdir. Allah, iyilik edenleri sever.",""],[135,"وَٱلَّذِينَ إِذَا فَعَلُوا۟ فَٰحِشَةً أَوْ ظَلَمُوٓا۟ أَنفُسَهُمْ ذَكَرُوا۟ ٱللَّهَ فَٱسْتَغْفَرُوا۟ لِذُنُوبِهِمْ وَمَن يَغْفِرُ ٱلذُّنُوبَ إِلَّا ٱللَّهُ وَلَمْ يُصِرُّوا۟ عَلَىٰ مَا فَعَلُوا۟ وَهُمْ يَعْلَمُونَ","Vel-lazîna izâ fa'alû fâhişatan av zalamû anfusahum zakarullâha fastagfarû lizunûbihim, ve may yagfiruz-zunûba illallâh, ve lam yusirrû 'alâ mâ fa'alû ve hum ya'lamûn.","Yine onlar, bir günah işlediklerinde veya nefislerine zulmettiklerinde Allah’ı zikredip günahları için mağfiret dilerler. Allah’tan başka günahları kim bağışlar? Onlar, yaptıklarında bile bile ısrar etmezler.",""],[136,"أُو۟لَٰٓئِكَ جَزَآؤُهُم مَّغْفِرَةٌ مِّن رَّبِّهِمْ وَجَنَّٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَا وَنِعْمَ أَجْرُ ٱلْعَٰمِلِينَ","Ulâ'ika cazâ'uhum magfiratum mir rabbihim ve cannâtun tacrî min tahtihal-anhâru hâlidîna fîhâ, ve ni'ma acrul-'âmilîn.","İşte onların mükâfatı Rableri tarafından bağışlanma ve içinden ırmaklar akan Cennetler'dir ki, orada ebedî kalacaklardır. Böyle amel edenlerin mükâfatı pek de güzeldir!",""],[137,"قَدْ خَلَتْ مِن قَبْلِكُمْ سُنَنٌ فَسِيرُوا۟ فِى ٱلْأَرْضِ فَٱنظُرُوا۟ كَيْفَ كَانَ عَٰقِبَةُ ٱلْمُكَذِّبِينَ","Kad halat min kablikum sunan, fa sîrû fil-ardi fanzurû kayfa kâna 'âkibatul-mukazzibîn.","Sizden önce nice (milletler hakkında) ilahi kanunlar gelip geçmiştir. Onun için yeryüzünde gezin de (Allah'ın ayetlerini) yalancıların sonunun ne olduğuna bir bakın!",""],[138,"هَٰذَا بَيَانٌ لِّلنَّاسِ وَهُدًى وَمَوْعِظَةٌ لِّلْمُتَّقِينَ","Hâzâ bayânul lin-nâsi ve hudav ve mav'izatul lil-muttakîn.","Bu (Kur’an), insanlar için bir açıklama, Takvâ sahipleri için bir hidayet ve öğüttür.",""],[139,"وَلَا تَهِنُوا۟ وَلَا تَحْزَنُوا۟ وَأَنتُمُ ٱلْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ","Ve lâ tahinû ve lâ tahzanû ve antumul-a'lavna in kuntum mu'minîn.","Gevşemeyin, hüzünlenmeyin. Eğer (gerçekten) iman etmiş kimseler iseniz üstün olan sizlersiniz.",""],[140,"إِن يَمْسَسْكُمْ قَرْحٌ فَقَدْ مَسَّ ٱلْقَوْمَ قَرْحٌ مِّثْلُهُۥ وَتِلْكَ ٱلْأَيَّامُ نُدَاوِلُهَا بَيْنَ ٱلنَّاسِ وَلِيَعْلَمَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَيَتَّخِذَ مِنكُمْ شُهَدَآءَ وَٱللَّهُ لَا يُحِبُّ ٱلظَّٰلِمِينَ","Iy yamsaskum karhun fakad massal-kavma karhum misluh, ve tilkal-ayyâmu nudâviluhâ binan-nâs, ve liya'lamallâhul-lazîna âmanû ve yattahiza minkum şuhadâ', vallâhu lâ yuhibbuz-zâlimîn.","Eğer siz (Uhud’da) bir yara aldıysanız, şüphesiz o topluluk da (Müşrikler de Bedir’de) benzeri bir yara almıştı. İşte (iyi veya kötü) günleri insanlar arasında (böyle) döndürür dururuz. (Bazen bir topluma iyi ya da kötü günler gösteririz, bazen öbürüne.) Allah, sizden iman edenleri ayırt etmek, sizden şahitler edinmek için böyle yapar. Allah, zalimleri sevmez.",""],[141,"وَلِيُمَحِّصَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَيَمْحَقَ ٱلْكَٰفِرِينَ","Ve liyumahhisallâhul-lazîna âmanû ve yamhakal-kâfirîn.","Bir de Allah, iman edenleri arındırmak ve kâfirleri helak etmek için böyle yapar.",""],[142,"أَمْ حَسِبْتُمْ أَن تَدْخُلُوا۟ ٱلْجَنَّةَ وَلَمَّا يَعْلَمِ ٱللَّهُ ٱلَّذِينَ جَٰهَدُوا۟ مِنكُمْ وَيَعْلَمَ ٱلصَّٰبِرِينَ","Am hasibtum an tadhulul-cannata ve lammâ ya'lamillâhul-lazîna câhadû minkum ve ya'lamas-sâbirîn.","Yoksa siz; Allah, içinizden cihad edenleri (sınayıp) ayırt etmeden ve yine sabredenleri (sınayıp) ayırt etmeden Cennet'e gireceğinizi mi sandınız?",""],[143,"وَلَقَدْ كُنتُمْ تَمَنَّوْنَ ٱلْمَوْتَ مِن قَبْلِ أَن تَلْقَوْهُ فَقَدْ رَأَيْتُمُوهُ وَأَنتُمْ تَنظُرُونَ","Ve lakad kuntum tamannavnal-mavta min kabli an talkavh, fakad ra'aytumûhu ve antum tanzurûn.","Andolsun, siz ölümle karşılaşmadan (Uhud'tan) önce (şehitliği) ölümü temenni ediyordunuz. İşte onu gördünüz, ama bakıp duruyorsunuz.",""],[144,"وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِن قَبْلِهِ ٱلرُّسُلُ أَفَإِي۟ن مَّاتَ أَوْ قُتِلَ ٱنقَلَبْتُمْ عَلَىٰٓ أَعْقَٰبِكُمْ وَمَن يَنقَلِبْ عَلَىٰ عَقِبَيْهِ فَلَن يَضُرَّ ٱللَّهَ شَيْـًٔا وَسَيَجْزِى ٱللَّهُ ٱلشَّٰكِرِينَ","Ve mâ muhammadun illâ rasûl, kad halat min kablihir-rusul, afa'im mâta av kutilankalabtum 'alâ a'kâbikum, ve may yankalib 'alâ 'akibayhi falay yadurrallâha şay'â, ve sayaczillâhuş-şâkirîn.","Muhammed, ancak bir peygamberdir. Ondan önce de peygamberler gelip geçmiştir. Şimdi o ölür veya öldürülürse gerisin geriye (eski dininize) mi döneceksiniz? Kim gerisin geriye dönerse, Allah’a hiçbir zarar veremez. Allah, şükredenleri mükâfatlandıracaktır.",""],[145,"وَمَا كَانَ لِنَفْسٍ أَن تَمُوتَ إِلَّا بِإِذْنِ ٱللَّهِ كِتَٰبًا مُّؤَجَّلًا وَمَن يُرِدْ ثَوَابَ ٱلدُّنْيَا نُؤْتِهِۦ مِنْهَا وَمَن يُرِدْ ثَوَابَ ٱلْـَٔاخِرَةِ نُؤْتِهِۦ مِنْهَا وَسَنَجْزِى ٱلشَّٰكِرِينَ","Ve mâ kâna linafsin an tamûta illâ bi'iznillâhi kitâbam mu'accalâ, ve may yurid savâbad-dun-yâ nu'tihî minhâ, ve may yurid savâbal-âhirati nu'tihî minhâ, ve sanacziş-şâkirîn.","Hiçbir kimse Allah’ın izni olmadan ölmez. Ölüm belirli bir süreye göre yazılmıştır. Kim dünya menfaatini isterse, kendisine ondan veririz. Kim de ahiret mükâfatını isterse, ona da ondan veririz. Biz şükredenleri mükâfatlandıracağız.",""],[146,"وَكَأَيِّن مِّن نَّبِىٍّ قَٰتَلَ مَعَهُۥ رِبِّيُّونَ كَثِيرٌ فَمَا وَهَنُوا۟ لِمَآ أَصَابَهُمْ فِى سَبِيلِ ٱللَّهِ وَمَا ضَعُفُوا۟ وَمَا ٱسْتَكَانُوا۟ وَٱللَّهُ يُحِبُّ ٱلصَّٰبِرِينَ","Ve ka'ayyim min nabiyyin kâtal, ma'ahû ribbiyyûna kasîr, famâ vahanû limâ asâbahum fî sabîlillâhi ve mâ da'ufû ve mastakânû, vallâhu yuhibbus-sâbirîn.","Nice peygamberler vardır ki , onunla birlikte bir çok Allah dostları savaştılar . Allah yolunda başlarına gelenlerden dolayı gevşemediler , yılmadılar , boyun eğmediler. Allah sabredenleri sever.",""],[147,"وَمَا كَانَ قَوْلَهُمْ إِلَّآ أَن قَالُوا۟ رَبَّنَا ٱغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِىٓ أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","Ve mâ kâna kavlahum illâ an kâlû rabbanagfir lanâ zunûbanâ ve isrâfanâ fî amrinâ ve sabbit akdâmanâ vansurnâ 'alal-kavmil-kâfirîn.","Onların sözleri ancak, “Rabbimiz! Bizim günahlarımızı ve işimizdeki taşkınlıklarımızı bağışla ve (yolunda) ayaklarımızı sabit kıl. Kâfir topluma karşı bize yardım et!” demekten ibaretti.",""],[148,"فَـَٔاتَىٰهُمُ ٱللَّهُ ثَوَابَ ٱلدُّنْيَا وَحُسْنَ ثَوَابِ ٱلْـَٔاخِرَةِ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ","Fa âtâhumullâhu savâbad-dun-yâ ve husna savâbil-âhirah, vallâhu yuhibbul-muhsinîn.","Bu yüzden Allah onlara dünya sevabını ve ahiret sevabının güzelliğini verdi. Allah ihsan sahiplerini sever.",""],[149,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن تُطِيعُوا۟ ٱلَّذِينَ كَفَرُوا۟ يَرُدُّوكُمْ عَلَىٰٓ أَعْقَٰبِكُمْ فَتَنقَلِبُوا۟ خَٰسِرِينَ","Yâ ayyuhal-lazîna âmanû in tutî'ul-lazîna kafarû yaruddûkum 'alâ a'kâbikum fa tankalibû hâsirîn.","Ey iman edenler! Siz eğer kâfir olanlara uyarsanız, sizi gerisin geriye (küfre) çevirirler de büsbütün hüsrana uğrarsınız.",""],[150,"بَلِ ٱللَّهُ مَوْلَىٰكُمْ وَهُوَ خَيْرُ ٱلنَّٰصِرِينَ","Balillâhu mavlâkum, ve huva hayrun-nâsirîn.","Halbuki sizin mevlanız/yardımcınız Allah’tır. O, yardımcıların en hayırlısıdır.",""],[151,"سَنُلْقِى فِى قُلُوبِ ٱلَّذِينَ كَفَرُوا۟ ٱلرُّعْبَ بِمَآ أَشْرَكُوا۟ بِٱللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ سُلْطَٰنًا وَمَأْوَىٰهُمُ ٱلنَّارُ وَبِئْسَ مَثْوَى ٱلظَّٰلِمِينَ","Sanulkî fî kulûbil-lazîna kafarur-ru'ba bimâ aşrakû billâhi mâ lam yunazzil bihî sultânâ, ve ma'vâhumun nâr, ve bi'sa masvaz-zâlimîn.","Hakkında hiçbir delil indirmediği şeyleri Allah’a şirk koştukları için kâfirlerin kalbine korku salacağız. Onların varacağı yer ateştir. Zalimlerin varacağı yer ne kötüdür.",""],[152,"وَلَقَدْ صَدَقَكُمُ ٱللَّهُ وَعْدَهُۥٓ إِذْ تَحُسُّونَهُم بِإِذْنِهِۦ حَتَّىٰٓ إِذَا فَشِلْتُمْ وَتَنَٰزَعْتُمْ فِى ٱلْأَمْرِ وَعَصَيْتُم مِّنۢ بَعْدِ مَآ أَرَىٰكُم مَّا تُحِبُّونَ مِنكُم مَّن يُرِيدُ ٱلدُّنْيَا وَمِنكُم مَّن يُرِيدُ ٱلْـَٔاخِرَةَ ثُمَّ صَرَفَكُمْ عَنْهُمْ لِيَبْتَلِيَكُمْ وَلَقَدْ عَفَا عَنكُمْ وَٱللَّهُ ذُو فَضْلٍ عَلَى ٱلْمُؤْمِنِينَ","Ve lakad sadakakumullâhu ve'dahû iz tahussûnahum bi'iznih, hattâ izâ faşiltum ve tanâza'tum fil-amri ve 'asaytum mim ba'di mâ arâkum mâ tuhibbûn, minkum may yurîdud-dun-yâ ve minkum may yurîdul-âhirah, summa sarafakum 'anhum liyabtaliyakum, ve lakad 'afâ 'ankum, vallâhu zû fadlin 'alal-mu'minîn.","Allah, elbette size verdiği sözü tuttu. O'nun izniyle düşmanlarınızı yok etmek üzereydiniz. Fakat, Allah size arzuladıklarınızı (zaferi) gösterdikten sonra zaaf gösterdiniz, ayrılığa düştünüz ve (peygamberin) emrine itaatsizlik ettiniz. İçinizden dünyayı isteyenler de vardı, ahireti isteyenler de. Sonra imtihan etmek için onların karşısında sizi bozguna uğrattı. Artık Allah sizi affetmiştir. Çünkü Allah, Müminlere karşı çok lütufkardır.",""],[153,"إِذْ تُصْعِدُونَ وَلَا تَلْوُۥنَ عَلَىٰٓ أَحَدٍ وَٱلرَّسُولُ يَدْعُوكُمْ فِىٓ أُخْرَىٰكُمْ فَأَثَٰبَكُمْ غَمًّۢا بِغَمٍّ لِّكَيْلَا تَحْزَنُوا۟ عَلَىٰ مَا فَاتَكُمْ وَلَا مَآ أَصَٰبَكُمْ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ","Iz tus'idûna ve lâ talvûna 'alâ ahadiv var-rasûlu yad'ûkum fî uhrâkum fa asâbakum gammam bigammil likaylâ tahzanû 'alâ mâ fâtakum ve lâ mâ asâbakum, vallâhu habîrum bimâ ta'malûn.","Peygamber, arkanızdan sizi çağırırken siz durmadan dağa yukarı kaçıyor, hiç kimseye dönüp bakmıyordunuz. Bundan dolayı Allah, size keder üstüne keder verdi ki, (bu durumlara alışasınız ve daha sonra) elinizden gidene ve başınıza gelene üzülmeyesiniz. Allah, yaptıklarınızdan hakkıyla haberdardır.",""],[154,"ثُمَّ أَنزَلَ عَلَيْكُم مِّنۢ بَعْدِ ٱلْغَمِّ أَمَنَةً نُّعَاسًا يَغْشَىٰ طَآئِفَةً مِّنكُمْ وَطَآئِفَةٌ قَدْ أَهَمَّتْهُمْ أَنفُسُهُمْ يَظُنُّونَ بِٱللَّهِ غَيْرَ ٱلْحَقِّ ظَنَّ ٱلْجَٰهِلِيَّةِ يَقُولُونَ هَل لَّنَا مِنَ ٱلْأَمْرِ مِن شَىْءٍ قُلْ إِنَّ ٱلْأَمْرَ كُلَّهُۥ لِلَّهِ يُخْفُونَ فِىٓ أَنفُسِهِم مَّا لَا يُبْدُونَ لَكَ يَقُولُونَ لَوْ كَانَ لَنَا مِنَ ٱلْأَمْرِ شَىْءٌ مَّا قُتِلْنَا هَٰهُنَا قُل لَّوْ كُنتُمْ فِى بُيُوتِكُمْ لَبَرَزَ ٱلَّذِينَ كُتِبَ عَلَيْهِمُ ٱلْقَتْلُ إِلَىٰ مَضَاجِعِهِمْ وَلِيَبْتَلِىَ ٱللَّهُ مَا فِى صُدُورِكُمْ وَلِيُمَحِّصَ مَا فِى قُلُوبِكُمْ وَٱللَّهُ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ","Summa anzala 'alaykum mim ba'dil-gammi amanatan nu'âsay yagşâ tâ'ifatam minkum, ve tâ'ifatun kad ahammathum anfusuhum yazunnûna billâhi gayral-hakki zanal-câhiliyyah, yakûlûna hal lanâ minal-amri min şay', kul innal-amra kullahû lillâh, yuhfûna fî anfusihim mâ lâ yubdûna lak, yakûlûna lav kâna lanâ minal-amri şay'um mâ kutilnâ hâhunâ, kul lav kuntum fî buyûtikum labarazal-lazîna kutiba 'alayhimul-katlu ilâ madâci'ihim, ve liyabtaliyallâhu mâ fî sudûrikum ve liyumahhisa mâ fî kulûbikum, vallâhu 'alîmum bizâtis-sudûr.","Sonra o kederin ardından (Allah) üzerinize içinizden bir kısmını örtüp bürüyen bir güven, bir uyku indirdi. Bir kısmınız da kendi canlarının kaygısına düşmüştü. Allah’a karşı cahiliye zannı gibi gerçek dışı zanda bulunuyorlar: “Bu işte bizim hiçbir dahlimiz yok” diyorlardı. De ki: “Bütün iş, Allah’ındır.” Onlar sana açıklayamadıklarını içlerinde saklıyorlar ve diyorlar ki: “Bu konuda bizim elimizde bir şey olsaydı, burada öldürülmezdik.” De ki: “Evlerinizde dahi olsaydınız, üzerlerine öldürülmesi yazılmış bulunanlar mutlaka yatacakları (öldürülecekleri) yerlere çıkıp gideceklerdi. Allah, bunu göğüslerinizdekini denemek, kalplerinizdekini arındırmak için yaptı. Allah, göğüslerin özünü (kalplerde olanı) bilir.",""],[155,"إِنَّ ٱلَّذِينَ تَوَلَّوْا۟ مِنكُمْ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ إِنَّمَا ٱسْتَزَلَّهُمُ ٱلشَّيْطَٰنُ بِبَعْضِ مَا كَسَبُوا۟ وَلَقَدْ عَفَا ٱللَّهُ عَنْهُمْ إِنَّ ٱللَّهَ غَفُورٌ حَلِيمٌ","Innal-lazîna tavallav minkum yavmal-takal-cam'ân, innamastazallahumuş-şaytânu biba'di mâ kasabû, ve lakad 'afallâhu 'anhum, innallâha gafûrun halîm.","İki topluluğun karşılaştığı gün, içinizden yüz çevirip kaçanları, Şeytan ancak yaptıkları bazı hatalardan dolayı yoldan kaydırmak istemişti. Ama yine de Allah onları affetti. Kuşkusuz Allah çok bağışlayandır, Halîm'dir. (Hemen cezalandırmaz, mühlet verir.)",""],[156,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَكُونُوا۟ كَٱلَّذِينَ كَفَرُوا۟ وَقَالُوا۟ لِإِخْوَٰنِهِمْ إِذَا ضَرَبُوا۟ فِى ٱلْأَرْضِ أَوْ كَانُوا۟ غُزًّى لَّوْ كَانُوا۟ عِندَنَا مَا مَاتُوا۟ وَمَا قُتِلُوا۟ لِيَجْعَلَ ٱللَّهُ ذَٰلِكَ حَسْرَةً فِى قُلُوبِهِمْ وَٱللَّهُ يُحْىِۦ وَيُمِيتُ وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ","Yâ ayyuhal-lazîna âmanû lâ takûnû kal-lazîna kafarû ve kâlû li'ihvânihim izâ darabû fil-ardi av kânû guzzal lav kânû 'indanâ mâ mâtû ve mâ kutilû, liyac'alallâhu zâlika hasratan fî kulûbihim, vallâhu yuhyî ve yumît, vallâhu bimâ ta'malûna basîr.","Ey iman edenler! Kardeşleri sefere veya savaşa çıktığında onlar hakkında: “Onlar bizim yanımızda olsalardı, ölmezlerdi ve öldürülmezlerdi” diyen kâfirler gibi olmayın. Allah, bunu onların kalplerine dayanılmaz bir üzüntü olarak koydu. Yaşatan da öldüren de Allah’tır. Allah, yaptıklarınızı görmektedir.",""],[157,"وَلَئِن قُتِلْتُمْ فِى سَبِيلِ ٱللَّهِ أَوْ مُتُّمْ لَمَغْفِرَةٌ مِّنَ ٱللَّهِ وَرَحْمَةٌ خَيْرٌ مِّمَّا يَجْمَعُونَ","Ve la'in kutiltum fî sabîlillâhi av muttum lamagfiratum minallâhi ve rahmatun hayrum mimmâ yacma'ûn.","Andolsun, eğer Allah yolunda öldürülür veya ölürseniz, Allah’ın bağışlaması ve rahmeti onların topladıkları (dünyalıkları)ndan daha hayırlıdır.",""],[158,"وَلَئِن مُّتُّمْ أَوْ قُتِلْتُمْ لَإِلَى ٱللَّهِ تُحْشَرُونَ","Ve la'im muttum av kutiltum la'ilallâhi tuhşarûn.","Andolsun, ölseniz de öldürülseniz de, Allah’ın huzurunda toplanacaksınız.",""],[159,"فَبِمَا رَحْمَةٍ مِّنَ ٱللَّهِ لِنتَ لَهُمْ وَلَوْ كُنتَ فَظًّا غَلِيظَ ٱلْقَلْبِ لَٱنفَضُّوا۟ مِنْ حَوْلِكَ فَٱعْفُ عَنْهُمْ وَٱسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِى ٱلْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى ٱللَّهِ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَوَكِّلِينَ","Fabimâ rahmatim minallâhi linta lahum, ve lav kunta fazzan galîzal-kalbi lanfaddû min havlik, fa'fu 'anhum vastagfir lahum ve şâvirhum fil-amr, fa izâ 'azamta fa tavakkal 'alallâh, innallâha yuhibbul-mutavakkilîn.","Allah’ın rahmeti sayesinde sen onlara karşı yumuşak davrandın. Eğer kaba, katı yürekli olsaydın, onlar senin etrafından dağılıp giderlerdi. Artık sen onları affet. Onlar için Allah’tan bağışlama dile. İş konusunda onlarla istişare et. Bir kere de karar verip azmettin mi artık Allah’a tevekkül et! (Ona dayanıp güven). Şüphesiz Allah, tevekkül edenleri sever.",""],[160,"إِن يَنصُرْكُمُ ٱللَّهُ فَلَا غَالِبَ لَكُمْ وَإِن يَخْذُلْكُمْ فَمَن ذَا ٱلَّذِى يَنصُرُكُم مِّنۢ بَعْدِهِۦ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ","Iy yansurkumullâhu falâ gâliba lakum, ve iy yahzulkum faman zal-lazî yansurukum mim ba'dih, ve 'alallâhi falyatavakkalil-mu'minûn.","Allah size yardım ederse, kimse size galip gelemez. Eğer sizi yardımsız bırakırsa, ondan sonra size kim yardım edebilir? Müminler, ancak Allah’a tevekkül etsinler.",""],[161,"وَمَا كَانَ لِنَبِىٍّ أَن يَغُلَّ وَمَن يَغْلُلْ يَأْتِ بِمَا غَلَّ يَوْمَ ٱلْقِيَٰمَةِ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ","Ve mâ kâna linabiyyin ay yagull, ve may yaglul ya'ti bimâ galla yavmal-kiyâmah, summa tuvaffâ kullu nafsim mâ kasabat ve hum lâ yuzlamûn.","Bir peygamberin (ganimet malına) hıyanet etmesi olur şey değildir. Kim emanete hıyanet ederse, kıyamet günü hıyanet ettiği malı yüklenerek gelir. Sonra da hiçbir haksızlığa uğratılmaksızın herkese kazandığının karşılığı tastamam ödenir.",""],[162,"أَفَمَنِ ٱتَّبَعَ رِضْوَٰنَ ٱللَّهِ كَمَنۢ بَآءَ بِسَخَطٍ مِّنَ ٱللَّهِ وَمَأْوَىٰهُ جَهَنَّمُ وَبِئْسَ ٱلْمَصِيرُ","Afamanittaba'a ridvânallâhi kamam bâ'a bisahatim minallâhi ve ma'vâhu cahannam, ve bi'sal-masîr,","Hiç, Allah’ın rızasına uyan kimse, Allah’ın gazabına uğrayan ve varacağı yer Cehennem olan kimse gibi olur mu? O, ne kötü varılacak yerdir!",""],[163,"هُمْ دَرَجَٰتٌ عِندَ ٱللَّهِ وَٱللَّهُ بَصِيرٌۢ بِمَا يَعْمَلُونَ","Hum daracâtun 'indallâh, vallâhu basîrum bimâ ya'malûn.","Onlar (insanlar) Allah’ın katında derece derecedirler. Allah, onların yaptıklarını görmektedir.",""],[164,"لَقَدْ مَنَّ ٱللَّهُ عَلَى ٱلْمُؤْمِنِينَ إِذْ بَعَثَ فِيهِمْ رَسُولًا مِّنْ أَنفُسِهِمْ يَتْلُوا۟ عَلَيْهِمْ ءَايَٰتِهِۦ وَيُزَكِّيهِمْ وَيُعَلِّمُهُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ وَإِن كَانُوا۟ مِن قَبْلُ لَفِى ضَلَٰلٍ مُّبِينٍ","Lakad mannallâhu 'alal-mu'minîna iz ba'asa fîhim rasûlam min anfusihim yatlû 'alayhim âyâtihî ve yuzakkîhim ve yu'allimuhumul-kitâba vel-hikmah, ve in kânû min kablu lafî dalâlim mubîn.","Andolsun Allah, Müminlere kendi içlerinden; onlara ayetlerini okuyan, onları arıtıp tertemiz yapan, onlara kitap ve hikmeti öğreten bir peygamber göndermekle büyük bir lütufta bulunmuştur. Oysa onlar, daha önce apaçık bir sapıklık içinde idiler.",""],[165,"أَوَلَمَّآ أَصَٰبَتْكُم مُّصِيبَةٌ قَدْ أَصَبْتُم مِّثْلَيْهَا قُلْتُمْ أَنَّىٰ هَٰذَا قُلْ هُوَ مِنْ عِندِ أَنفُسِكُمْ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Ava lammâ asâbatkum musîbatun kad asabtum mislayhâ, kultum annâ hâzâ, kul huva min 'indi anfusikum, innallâha 'alâ kulli şay'in kadîr.","Onların (müşriklerin) başına (Bedir’de) iki mislini getirdiğiniz bir musibet (Uhud’da) sizin başınıza geldiğinde, “Bu, nereden başımıza geldi?” dediniz, öyle mi? De ki: “O (musibet), kendinizdendir.” Şüphesiz Allah’ın gücü her şeye hakkıyla yeter.",""],[166,"وَمَآ أَصَٰبَكُمْ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ فَبِإِذْنِ ٱللَّهِ وَلِيَعْلَمَ ٱلْمُؤْمِنِينَ","Ve mâ asâbakum yavmal-takal-cam'âni fa bi'iznillâhi ve liya'lamal-mu'minîn.","İki ordunun çarpıştığı gün başınıza gelen ancak Allah’ın izniyle idi ve Müminleri ortaya çıkarmak içindi.",""],[167,"وَلِيَعْلَمَ ٱلَّذِينَ نَافَقُوا۟ وَقِيلَ لَهُمْ تَعَالَوْا۟ قَٰتِلُوا۟ فِى سَبِيلِ ٱللَّهِ أَوِ ٱدْفَعُوا۟ قَالُوا۟ لَوْ نَعْلَمُ قِتَالًا لَّٱتَّبَعْنَٰكُمْ هُمْ لِلْكُفْرِ يَوْمَئِذٍ أَقْرَبُ مِنْهُمْ لِلْإِيمَٰنِ يَقُولُونَ بِأَفْوَٰهِهِم مَّا لَيْسَ فِى قُلُوبِهِمْ وَٱللَّهُ أَعْلَمُ بِمَا يَكْتُمُونَ","Ve liya'lamal-lazîna nâfakû, ve kîla lahum ta'âlav kâtilû fî sabîlillâhi avidfa'û, kâlû lav na'lamu kitâlal lattaba'nâkum, hum lil-kufri yavma'izin akrabu minhum lil-îmân, yakûlûna bi'afvâhihim mâ laysa fî kulûbihim, valllâhu a'lamu bimâ yaktumûn.","Ve münafıklık edenleri de açığa vurmak içindir. Onlara (münafıklara): “Gelin, Allah yolunda savaşın veya savunmaya geçin!” denildi de onlar; “Biz savaş olacağını bilseydik, elbette sizin peşinizden gelirdik.” dediler. Onlar o gün, imandan çok küfre yakın idiler. Ağızlarıyla kalplerinde olmayanı söylüyorlardı. Oysa Allah, içlerinde gizledikleri şeyi çok iyi bilmektedir.",""],[168,"ٱلَّذِينَ قَالُوا۟ لِإِخْوَٰنِهِمْ وَقَعَدُوا۟ لَوْ أَطَاعُونَا مَا قُتِلُوا۟ قُلْ فَٱدْرَءُوا۟ عَنْ أَنفُسِكُمُ ٱلْمَوْتَ إِن كُنتُمْ صَٰدِقِينَ","Al-lazîna kâlû li'ihvânihim ve ka'adû lav atâ'ûnâ mâ kutilû, kul fadra'û 'an anfusikumul-mavta in kuntum sâdikîn.","(Onlar), kendileri oturup kaldıkları halde kardeşleri için: \"Eğer bize uysalardı, öldürülmezlerdi” diyen kimselerdir. De ki: Eğer doğru söyleyenler iseniz kendinizden ölümü savın.",""],[169,"وَلَا تَحْسَبَنَّ ٱلَّذِينَ قُتِلُوا۟ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتًۢا بَلْ أَحْيَآءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ","Ve lâ tahsabannal-lazîna kutilû fî sabîlillâhi amvâtâ, bal ahyâ'un 'inda rabbihim yurzakûn.","Allah yolunda öldürülenleri sakın ölüler sanma. Çünkü onlar, Rablerinin katında diridirler ve rızıklandırılırlar.",""],[170,"فَرِحِينَ بِمَآ ءَاتَىٰهُمُ ٱللَّهُ مِن فَضْلِهِۦ وَيَسْتَبْشِرُونَ بِٱلَّذِينَ لَمْ يَلْحَقُوا۟ بِهِم مِّنْ خَلْفِهِمْ أَلَّا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","Farihîna bimâ âtâhumullâhu min fadlih, ve yastabşirûna bil-lazîna lam yalhakû bihim min halfihim, allâ havfun 'alayhim ve lâ hum yahzanûn.","Onlar, Allah’ın kendilerine fazlından vermiş olduklarıyla sevinç içindedirler. Arkalarından gelip, henüz kendilerine katılmamış olanlara (şehitler için), bir korku olmayacağı ve üzülmeyecekleri müjdesini verirler.",""],[171,"يَسْتَبْشِرُونَ بِنِعْمَةٍ مِّنَ ٱللَّهِ وَفَضْلٍ وَأَنَّ ٱللَّهَ لَا يُضِيعُ أَجْرَ ٱلْمُؤْمِنِينَ","Yastabşirûna bini'matim minallâhi ve fadl, ve annallâha lâ yudî'u acral-mu'minîn.","Onlar Allah’tan bir nimet, bir lütuf ve Allah’ın Müminlerin ecrini boşa çıkarmayacağı müjdesinin sevinci içindedirler.",""],[172,"ٱلَّذِينَ ٱسْتَجَابُوا۟ لِلَّهِ وَٱلرَّسُولِ مِنۢ بَعْدِ مَآ أَصَابَهُمُ ٱلْقَرْحُ لِلَّذِينَ أَحْسَنُوا۟ مِنْهُمْ وَٱتَّقَوْا۟ أَجْرٌ عَظِيمٌ","Al-lazînastacâbû lillâhi var-rasûli mim ba'di mâ asâbahumul-karh, lil-lazîna ahsanû minhum vattakav acrun 'azîm.","Onlar (Uhud'da) yaralandıktan sonra Allah’ın ve peygamberinin davetine uyan kimselerdir. Onlardan iyilik eden ve takva sahibi olanlar için büyük bir ecir vardır.",""],[173,"ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدْ جَمَعُوا۟ لَكُمْ فَٱخْشَوْهُمْ فَزَادَهُمْ إِيمَٰنًا وَقَالُوا۟ حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ","Al-lazîna kâla lahumun-nâsu innan-nâsa kad cama'û lakum fahşavhum fa zâdahum îmânâ, ve kâlû hasbunallâhu ve ni'mal-vakîl.","Onlara bazı kimseler: \"İnsanlar sizinle savaşmak için toplandı; onlardan korkun!\" dediklerinde bu onların imanını arttırdı ve; “Allah bize yeter, O ne güzel vekildir” diye karşılık verdiler.",""],[174,"فَٱنقَلَبُوا۟ بِنِعْمَةٍ مِّنَ ٱللَّهِ وَفَضْلٍ لَّمْ يَمْسَسْهُمْ سُوٓءٌ وَٱتَّبَعُوا۟ رِضْوَٰنَ ٱللَّهِ وَٱللَّهُ ذُو فَضْلٍ عَظِيمٍ","Fankalabû bi ni'matim minallâhi ve fadlil lam yamsashum sû', vattaba'û ridvânallâh, vallahu zû fadlin 'azîm.","Bundan dolayı Allah’tan bir nimet ve lütufla kendilerine hiçbir fenalık dokunmadan geri döndüler ve Allah’ın rızasına uydular. Allah, büyük lütuf sahibidir",""],[175,"إِنَّمَا ذَٰلِكُمُ ٱلشَّيْطَٰنُ يُخَوِّفُ أَوْلِيَآءَهُۥ فَلَا تَخَافُوهُمْ وَخَافُونِ إِن كُنتُم مُّؤْمِنِينَ","Innamâ zâlikumuş-şaytânu yuhavvifu avliyâ'ah, falâ tahâfûhum ve hâfûni in kuntum mu'minîn.","O Şeytan sizi ancak kendi dostlarıyla korkutur. Onlardan korkmayın, eğer Mümin iseniz, sadece benden korkun.",""],[176,"وَلَا يَحْزُنكَ ٱلَّذِينَ يُسَٰرِعُونَ فِى ٱلْكُفْرِ إِنَّهُمْ لَن يَضُرُّوا۟ ٱللَّهَ شَيْـًٔا يُرِيدُ ٱللَّهُ أَلَّا يَجْعَلَ لَهُمْ حَظًّا فِى ٱلْـَٔاخِرَةِ وَلَهُمْ عَذَابٌ عَظِيمٌ","Ve lâ yahzunkal-lazîna yusâri'ûna fil-kufr, innahum lay yadurrullâha şay'â, yurîdullâhu allâ yac'ala lahum hazzan fil-âhirati ve lahum 'azâbun 'azîm.","Küfürde yarışanlar seni üzmesin. Onlar, Allah’a hiçbir şekilde zarar veremezler. Allah, onlara ahirette bir pay bırakmamak istiyor. Onlar için büyük azap vardır.",""],[177,"إِنَّ ٱلَّذِينَ ٱشْتَرَوُا۟ ٱلْكُفْرَ بِٱلْإِيمَٰنِ لَن يَضُرُّوا۟ ٱللَّهَ شَيْـًٔا وَلَهُمْ عَذَابٌ أَلِيمٌ","Innal-lazînaştaravul-kufra bil-îmâni lay yadurrullâha şay'â, ve lahum 'azâbun alîm.","Şüphe yok ki iman karşılığında küfrü satın alanlar, Allah’a hiçbir zarar veremezler. Onlar için elem verici bir azap vardır.",""],[178,"وَلَا يَحْسَبَنَّ ٱلَّذِينَ كَفَرُوٓا۟ أَنَّمَا نُمْلِى لَهُمْ خَيْرٌ لِّأَنفُسِهِمْ إِنَّمَا نُمْلِى لَهُمْ لِيَزْدَادُوٓا۟ إِثْمًا وَلَهُمْ عَذَابٌ مُّهِينٌ","Ve lâ yahsabannal-lazîna kafarû annamâ numlî lahum hayrul li'anfusihim, innamâ numlî lahum liyazdâdû ismâ, ve lahum 'azâbum muhîn.","Kâfirler, kendilerine vermiş olduğumuz mühletin sakın kendileri için hayırlı olduğunu sanmasınlar. Biz, onların ancak günahları artsın diye ömürlerini uzatıyoruz. Onlar için alçaltıcı bir azap vardır.",""],[179,"مَّا كَانَ ٱللَّهُ لِيَذَرَ ٱلْمُؤْمِنِينَ عَلَىٰ مَآ أَنتُمْ عَلَيْهِ حَتَّىٰ يَمِيزَ ٱلْخَبِيثَ مِنَ ٱلطَّيِّبِ وَمَا كَانَ ٱللَّهُ لِيُطْلِعَكُمْ عَلَى ٱلْغَيْبِ وَلَٰكِنَّ ٱللَّهَ يَجْتَبِى مِن رُّسُلِهِۦ مَن يَشَآءُ فَـَٔامِنُوا۟ بِٱللَّهِ وَرُسُلِهِۦ وَإِن تُؤْمِنُوا۟ وَتَتَّقُوا۟ فَلَكُمْ أَجْرٌ عَظِيمٌ","Mâ kânallâhu liyazaral-mu'minîna 'alâ mâ antum 'alayhi hattâ yamîzal-habîsa minat-tayyib, ve mâ kânallâhu liyutli'akum 'alal-gaybi ve lâkinnallâha yactabî mir rusulihî may yaşâ', fa âminû billâhi ve rusulih, ve in tu'minû ve tattakû fa lakum acrun 'azîm.","Allah iman edenleri üzerinde bulunduğunuz bu halde asla bırakacak değildir, sonunda temizi pisten ayıracaktır. Allah, size gaybı bildirecek de değildir. Fakat Allah, peygamberlerinden dilediğini seçer (gaybı ona bildirir). O halde, Allah’a ve peygamberlerine iman edin. Eğer iman eder ve Allah’a karşı gelmekten sakınırsanız sizin için büyük bir mükâfat vardır.",""],[180,"وَلَا يَحْسَبَنَّ ٱلَّذِينَ يَبْخَلُونَ بِمَآ ءَاتَىٰهُمُ ٱللَّهُ مِن فَضْلِهِۦ هُوَ خَيْرًا لَّهُم بَلْ هُوَ شَرٌّ لَّهُمْ سَيُطَوَّقُونَ مَا بَخِلُوا۟ بِهِۦ يَوْمَ ٱلْقِيَٰمَةِ وَلِلَّهِ مِيرَٰثُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ","Ve lâ yahsabannal-lazîna yabhalûna bimâ âtâhumullâhu min fadlihî huva hayral lahum, bal huva şarrul lahum, sayutavvakûna mâ bahilû bihî yavmal-kiyâmah, ve lillâhi mîrâsus-samâvâti vel-ard, vallâhu bimâ ta'malûna habîr.","Allah’ın kendilerine lütfundan verdiği nimetlerde cimrilik edenler, bunun, kendileri için hayırlı olduğunu sanmasınlar, aksine bu onlar için şerdir. Cimrilik ettikleri şey kıyamet gününde boyunlarına dolanacaktır. Göklerin ve yerin mirası Allah’ındır. Allah, yaptıklarınızdan hakkıyla haberdardır.",""],[181,"لَّقَدْ سَمِعَ ٱللَّهُ قَوْلَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ فَقِيرٌ وَنَحْنُ أَغْنِيَآءُ سَنَكْتُبُ مَا قَالُوا۟ وَقَتْلَهُمُ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّ وَنَقُولُ ذُوقُوا۟ عَذَابَ ٱلْحَرِيقِ","Lakad sami'allâhu kavlal-lazîna kâlû innallâha fakîruv ve nahnu agniyâ', sanaktubu mâ kâlû ve katlahumul-ambiyâ'a bigayri hakk, ve nakûlu zûkû 'azâbal-harîk.","“Allah fakirdir, biz zenginiz” diyen Yahudilerin sözünü andolsun ki, Allah duyup işitmiştir. Hem bu söylediklerini hem de haksız yere peygamberleri öldürmelerini elbette (bir tarafa) yazacağız ve “Yakıcı azabı tadın bakalım” diyeceğiz.",""],[182,"ذَٰلِكَ بِمَا قَدَّمَتْ أَيْدِيكُمْ وَأَنَّ ٱللَّهَ لَيْسَ بِظَلَّامٍ لِّلْعَبِيدِ","Zâlika bimâ kaddamat aydîkum ve annallâha laysa bizallâmil lil-'abîd.","Bu, kendi ellerinizin (önceden yapıp) gönderdiklerinin karşılığıdır. Allah, kullara asla zulmedici değildir.",""],[183,"ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ عَهِدَ إِلَيْنَآ أَلَّا نُؤْمِنَ لِرَسُولٍ حَتَّىٰ يَأْتِيَنَا بِقُرْبَانٍ تَأْكُلُهُ ٱلنَّارُ قُلْ قَدْ جَآءَكُمْ رُسُلٌ مِّن قَبْلِى بِٱلْبَيِّنَٰتِ وَبِٱلَّذِى قُلْتُمْ فَلِمَ قَتَلْتُمُوهُمْ إِن كُنتُمْ صَٰدِقِينَ","Al-lazîna kâlû innallâha 'ahida ilaynâ allâ nu'mina lirasûlin hattâ ya'tiyanâ bikurbânin ta'kuluhun-nâr, kul kad câ'akum rusulum min kablî bil-bayyinâti ve bil-lazî kultum falima kataltumûhum in kuntum sâdikîn.","'Allah, bize gökten inen, ateşin yiyeceği bir kurban getirmedikçe hiçbir rasûle iman etmememizi (Tevrat'ta) emretti'' diyenlere de ki: Benden önce size peygamberler apaçık delillerle ve söylediğiniz (mucize) ile gelmişti. Eğer sözünüzde samimi iseniz niçin onları öldürdünüz?",""],[184,"فَإِن كَذَّبُوكَ فَقَدْ كُذِّبَ رُسُلٌ مِّن قَبْلِكَ جَآءُو بِٱلْبَيِّنَٰتِ وَٱلزُّبُرِ وَٱلْكِتَٰبِ ٱلْمُنِيرِ","Fa in kazzabûka fakad kuzziba rusulum min kablika câ'û bil-bayyinâti vaz-zuburi vel-kitâbil-munîr.","Eğer onlar seni yalanlarlarsa, senden önce açık delilleri, hikmetli sayfaları ve aydınlatıcı kitabı getiren nice peygamberler de yalanlanmıştı.",""],[185,"كُلُّ نَفْسٍ ذَآئِقَةُ ٱلْمَوْتِ وَإِنَّمَا تُوَفَّوْنَ أُجُورَكُمْ يَوْمَ ٱلْقِيَٰمَةِ فَمَن زُحْزِحَ عَنِ ٱلنَّارِ وَأُدْخِلَ ٱلْجَنَّةَ فَقَدْ فَازَ وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا مَتَٰعُ ٱلْغُرُورِ","Kullu nafsin zâ'ikatul-mavt, ve innamâ tuvaffavna ucûrakum yavmal-kiyâmah, faman zuhziha 'anin-nâri ve udhilal-cannata fakad fâz, ve mal-hayâtud-dun-yâ illâ matâ'ul-gurûr.","Her canlı ölümü tadacaktır. Kıyamet günü yaptıklarınızın karşılığı size tastamam verilecektir. Kim Cehennem'den uzaklaştırılıp Cennet'e sokulursa, gerçekten kurtuluşa ermiştir. Dünya hayatı, aldatıcı metadan başka bir şey değildir.",""],[186,"لَتُبْلَوُنَّ فِىٓ أَمْوَٰلِكُمْ وَأَنفُسِكُمْ وَلَتَسْمَعُنَّ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ مِن قَبْلِكُمْ وَمِنَ ٱلَّذِينَ أَشْرَكُوٓا۟ أَذًى كَثِيرًا وَإِن تَصْبِرُوا۟ وَتَتَّقُوا۟ فَإِنَّ ذَٰلِكَ مِنْ عَزْمِ ٱلْأُمُورِ","Latublavunna fî amvâlikum ve anfusikum, ve latasma'unna minal-lazîna ûtul-kitâba min kablikum ve minal-lazîna aşrakû azan kasîrâ, ve in tasbirû ve tattakû fa inna zâlika min 'azmil-umûr.","Andolsun, mallarınız ve canlarınızla imtihana çekileceksiniz. Sizden önce kendilerine kitap verilenlerden ve müşriklerden üzücü birçok söz işiteceksiniz. Eğer sabreder ve Allah’a karşı gelmekten sakınırsanız, bilin ki bunlar (yapmaya değer) azmi gerektiren işlerdendir.",""],[187,"وَإِذْ أَخَذَ ٱللَّهُ مِيثَٰقَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ لَتُبَيِّنُنَّهُۥ لِلنَّاسِ وَلَا تَكْتُمُونَهُۥ فَنَبَذُوهُ وَرَآءَ ظُهُورِهِمْ وَٱشْتَرَوْا۟ بِهِۦ ثَمَنًا قَلِيلًا فَبِئْسَ مَا يَشْتَرُونَ","Ve iz ahazallâhu mîsâkal-lazîna ûtul-kitâba latubayyinunnahû lin-nâsi ve lâ taktumûnah, fa nabazûhu varâ'a zuhûrihim vaştarav bihî samanan kalîlâ, fa bi'sa mâ yaştarûn.","Hani Allah, kendilerine kitap verilenlerden, “Onu (Kitabı) mutlaka insanlara açıklayacaksınız, onu gizlemeyeceksiniz!” diye sağlam söz almıştı. Fakat onlar verdikleri sözü, arkalarına atıp onu az bir bedele sattılar. Yaptıkları bu alışveriş ne kadar kötüdür!",""],[188,"لَا تَحْسَبَنَّ ٱلَّذِينَ يَفْرَحُونَ بِمَآ أَتَوا۟ وَّيُحِبُّونَ أَن يُحْمَدُوا۟ بِمَا لَمْ يَفْعَلُوا۟ فَلَا تَحْسَبَنَّهُم بِمَفَازَةٍ مِّنَ ٱلْعَذَابِ وَلَهُمْ عَذَابٌ أَلِيمٌ","Lâ tahsabannal-lazîna yafrahûna bimâ atav ve yuhibbûna ay yuhmadû bimâ lam yaf'alû falâ tahsabannahum bimafâzatim minal-'azâb, ve lahum 'azâbun alîm.","Sanma ki ettiklerine sevinen, yapmadıkları ile övülmek isteyenler, evet, sanma ki onlar azaptan kurtulacaklardır. Onlar için elem verici bir azap vardır.",""],[189,"وَلِلَّهِ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Ve lillâhi mulkus-samâvâti vel-ard, vallâhu 'alâ kulli şay'in kadîr.","Göklerin ve yerin hükümranlığı Allah’ındır. Allah, her şeye hakkıyla gücü yetendir.",""],[190,"إِنَّ فِى خَلْقِ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَٰفِ ٱلَّيْلِ وَٱلنَّهَارِ لَـَٔايَٰتٍ لِّأُو۟لِى ٱلْأَلْبَٰبِ","Inna fî halkis-samâvâti vel-ardi vahtilâfil-layli van-nahâri la'âyâtil li'ulil-albâb.","Göklerin ve yerin yaratılışında, gece ile gündüzün birbiri ardınca gelip gidişinde selim akıl sahipleri için elbette ibretler vardır.",""],[191,"ٱلَّذِينَ يَذْكُرُونَ ٱللَّهَ قِيَٰمًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِى خَلْقِ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَٰذَا بَٰطِلًا سُبْحَٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ","Al-lazîna yazkurûnallâha kiyâmav ve ku'ûdav ve 'alâ cunûbihim ve yatafakkarûna fi halkis-samâvâti vel-ard, rabbanâ mâ halakta hâzâ bâtilâ, subhânaka fa kinâ 'azâban-nâr.","Onlar ayaktayken, otururken ve yanları üzerine yatarken Allah’ı zikrederler. Göklerin ve yerin yaratılışı üzerinde düşünürler. “Rabbimiz! Bunu boş yere yaratmadın, seni tüm noksanlıklardan tenzih ederiz. Bizi ateş azabından koru!” derler.",""],[192,"رَبَّنَآ إِنَّكَ مَن تُدْخِلِ ٱلنَّارَ فَقَدْ أَخْزَيْتَهُۥ وَمَا لِلظَّٰلِمِينَ مِنْ أَنصَارٍ","Rabbanâ innaka man tudhilin-nâra fakad ahzaytah, ve mâ liz-zâlimîna min ansâr.","Rabbimiz! Sen kimi Cehennem ateşine sokarsan, onu rezil etmişsindir. Zalimlerin hiç yardımcıları yoktur.",""],[193,"رَّبَّنَآ إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِى لِلْإِيمَٰنِ أَنْ ءَامِنُوا۟ بِرَبِّكُمْ فَـَٔامَنَّا رَبَّنَا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّـَٔاتِنَا وَتَوَفَّنَا مَعَ ٱلْأَبْرَارِ","Rabbanâ innanâ sami'nâ munâdiyay yunâdî lil-îmâni an âminû birabbikum fa âmannâ, rabbanâ fagfir lanâ zunûbanâ ve kaffir 'annâ sayyi'âtinâ ve tavaffanâ ma'al-abrâr.","Rabbimiz! Biz, \"Rabbinize iman edin\" diye imana çağıran bir davetçi işittik, hemen iman ettik. Rabbimiz! Günahlarımızı bağışla, kötülüklerimizi ört ve canımızı iyilerle beraber al.",""],[194,"رَبَّنَا وَءَاتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ ٱلْقِيَٰمَةِ إِنَّكَ لَا تُخْلِفُ ٱلْمِيعَادَ","Rabbanâ ve âtinâ mâ ve'attanâ 'alâ rusulika ve lâ tuhzinâ yavmal-kiyâmah, innaka lâ tuhliful-mî'âd.","Rabbimiz! Peygamberlerinle vadettiklerini bize ver, kıyamet günü bizi rezil etme. Sen şüphesiz sözünden caymazsın.",""],[195,"فَٱسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّى لَآ أُضِيعُ عَمَلَ عَٰمِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَىٰ بَعْضُكُم مِّنۢ بَعْضٍ فَٱلَّذِينَ هَاجَرُوا۟ وَأُخْرِجُوا۟ مِن دِيَٰرِهِمْ وَأُوذُوا۟ فِى سَبِيلِى وَقَٰتَلُوا۟ وَقُتِلُوا۟ لَأُكَفِّرَنَّ عَنْهُمْ سَيِّـَٔاتِهِمْ وَلَأُدْخِلَنَّهُمْ جَنَّٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ ثَوَابًا مِّنْ عِندِ ٱللَّهِ وَٱللَّهُ عِندَهُۥ حُسْنُ ٱلثَّوَابِ","Fastacâba lahum rabbuhum annî lâ udî'u 'amala 'âmilim minkum min zakarin av unsâ, ba'dukum mim ba'd, fal-lazîna hâcarû ve uhricû min diyârihim ve ûzû fî sabîlî ve kâtalû ve kutilû la'ukaffiranna 'anhum sayyi'âtihim ve la udhilannahum cannâtin tacrî min tahtihal-anhâr, savâbam min 'indillâh, vallâhu 'indahû husnus-savâb.","Rableri, onlara şu karşılığı verdi: \"İçinizden gerek erkek gerek kadın olsun (salih) amel işleyenin amelini karşılıksız bırakarak boşa çıkarmayacağım. Kiminiz kiminizdensiniz (sizler sevap ve cezada denksiniz). Hicret edenler, yurtlarından çıkarılanlar, yolumda eziyet görenler, savaşanlar ve öldürülenlerin de andolsun günahlarını elbette örteceğim. Allah katından bir mükâfat olmak üzere, onları içinden ırmaklar akan Cennetlere koyacağım. Mükâfatın en güzeli Allah katındadır.",""],[196,"لَا يَغُرَّنَّكَ تَقَلُّبُ ٱلَّذِينَ كَفَرُوا۟ فِى ٱلْبِلَٰدِ","Lâ yagurrannaka takallubul-lazîna kafarû fil-bilâd.","Kâfirlerin refah içinde diyar diyar dolaşmaları sakın seni aldatmasın.",""],[197,"مَتَٰعٌ قَلِيلٌ ثُمَّ مَأْوَىٰهُمْ جَهَنَّمُ وَبِئْسَ ٱلْمِهَادُ","Matâ'un kalîl, summa ma'vâhum cahannam, ve bi'sal-mihâd.","Az bir geçimlik sonra varacakları yer Cehennem'dir. Orası ne kötü yerleşim yeridir.",""],[198,"لَٰكِنِ ٱلَّذِينَ ٱتَّقَوْا۟ رَبَّهُمْ لَهُمْ جَنَّٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَا نُزُلًا مِّنْ عِندِ ٱللَّهِ وَمَا عِندَ ٱللَّهِ خَيْرٌ لِّلْأَبْرَارِ","Lâkinil-lazînattakav rabbahum lahum cannâtun tacrî min tahtihal-anhâru hâlidîna fîhâ nuzulam min 'indillâh, ve mâ 'indallâhi hayrul lil-abrâr.","Fakat Rablerine karşı gelmekten sakınanlar için, Allah tarafından bir ikram olarak, altlarından ırmaklar akan, ebedî olarak kalacakları Cennetler vardır. İyiler için Allah katındaki (nimetler) daha hayırlıdır.",""],[199,"وَإِنَّ مِنْ أَهْلِ ٱلْكِتَٰبِ لَمَن يُؤْمِنُ بِٱللَّهِ وَمَآ أُنزِلَ إِلَيْكُمْ وَمَآ أُنزِلَ إِلَيْهِمْ خَٰشِعِينَ لِلَّهِ لَا يَشْتَرُونَ بِـَٔايَٰتِ ٱللَّهِ ثَمَنًا قَلِيلًا أُو۟لَٰٓئِكَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ إِنَّ ٱللَّهَ سَرِيعُ ٱلْحِسَابِ","Ve inna min ahlil-kitâbi lamay yu'minu billâhi ve mâ unzila ilaykum ve mâ unzila ilayhim hâşi'îna lillâh, lâ yaştarûna bi'âyâtillâhi samanan kalîlâ, ulâ'ika lahum acruhum 'inda rabbihim, innallâha sarî'ul-hisâb.","Ehl-i Kitap'tan öyleleri var ki, Allah’a, size indirilene ve kendilerine indirilene, Allah’tan korkarak iman ederler. Allah’ın ayetlerini az bir değere satmazlar. İşte onlara Rableri katında mükâfatları vardır. Şüphesiz Allah, hesabı çabuk görendir.",""],[200,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱصْبِرُوا۟ وَصَابِرُوا۟ وَرَابِطُوا۟ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُفْلِحُونَ","Yâ ayyuhal-lazîna âmanusbirû ve sâbirû ve rabitû, vattakullâha la'allakum tuflihûn.","Ey iman edenler! Sabredin. Sabır göstermede dayanın. (Cihat için) hazırlıklı ve uyanık olun ve Allah’a karşı gelmekten sakının ki, kurtuluşa eresiniz.",""]],"18":[[1,"ٱلْحَمْدُ لِلَّهِ ٱلَّذِىٓ أَنزَلَ عَلَىٰ عَبْدِهِ ٱلْكِتَٰبَ وَلَمْ يَجْعَل لَّهُۥ عِوَجَا","Al-hamdu lillâhil-lazî anzala 'alâ 'abdihil-kitâba ve lam yac'al lahû 'ivacâ.","Hamt olsun Allah'a ki, kuluna kitabı indirdi ve onda hiçbir eğrilik koymadı.",""],[2,"قَيِّمًا لِّيُنذِرَ بَأْسًا شَدِيدًا مِّن لَّدُنْهُ وَيُبَشِّرَ ٱلْمُؤْمِنِينَ ٱلَّذِينَ يَعْمَلُونَ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ أَجْرًا حَسَنًا","Kayyimal liyunzira ba'san şadîdam mil ladunhu ve yubaşşiral-mu'minînal-lazîna ya'malûnas-sâlihâti anna lahum acran hasanâ.","Dosdoğru (bir kitap olarak), katından (gelecek) şiddetli bir azapla korkutmak ve salih amellerde bulunan Müminlere güzel bir ecir olduğunu müjde vermek için (indirdi).",""],[3,"مَّٰكِثِينَ فِيهِ أَبَدًا","Mâkisîna fîhi abadâ.","Onlar onda ebedî olarak kalıcıdırlar.",""],[4,"وَيُنذِرَ ٱلَّذِينَ قَالُوا۟ ٱتَّخَذَ ٱللَّهُ وَلَدًا","Ve yunziral-lazîna kâluttahazallâhu valadâ.","Ve; “Allah çocuk edinmiştir.” diyen kimseleri uyarması için indirmiştir.",""],[5,"مَّا لَهُم بِهِۦ مِنْ عِلْمٍ وَلَا لِـَٔابَآئِهِمْ كَبُرَتْ كَلِمَةً تَخْرُجُ مِنْ أَفْوَٰهِهِمْ إِن يَقُولُونَ إِلَّا كَذِبًا","Mâ lahum bihî min 'ilmiv ve lâ li'âbâ'ihim, kaburat kalimatan tahrucu min afvâhihim, iy yakûlûna illâ kazibâ.","Onların da atalarının da o konu hakkında bir bilgisi yoktur. Ağızlarından çıkan bu söz pek büyüktür. Onlar yalandan başkasını söylemiyorlar.",""],[6,"فَلَعَلَّكَ بَٰخِعٌ نَّفْسَكَ عَلَىٰٓ ءَاثَٰرِهِمْ إِن لَّمْ يُؤْمِنُوا۟ بِهَٰذَا ٱلْحَدِيثِ أَسَفًا","Fa la'allaka bâhi'un nafsaka 'alâ âsârihim illam yu'minû bihâzal-hadîsi asafâ.","Belki de sen, bu kitaba iman etmiyorlar diye onların arkasından üzüntüden kendini helâk edeceksin.",""],[7,"إِنَّا جَعَلْنَا مَا عَلَى ٱلْأَرْضِ زِينَةً لَّهَا لِنَبْلُوَهُمْ أَيُّهُمْ أَحْسَنُ عَمَلًا","Innâ ca'alnâ mâ 'alal-ardi zînatal lahâ linabluvahum ayyuhum ahsanu 'amalâ.","İnsanların hangisi daha güzel amel işleyecek diye imtihan etmek için yeryüzünde bulunanları, oranın süsü yaptık.",""],[8,"وَإِنَّا لَجَٰعِلُونَ مَا عَلَيْهَا صَعِيدًا جُرُزًا","Ve innâ lacâ'ilûna mâ 'alayhâ sa'îdan curuzâ.","Bununla beraber Biz bunun üstünde olan şeyleri elbet kupkuru bir toprak yaparız.",""],[9,"أَمْ حَسِبْتَ أَنَّ أَصْحَٰبَ ٱلْكَهْفِ وَٱلرَّقِيمِ كَانُوا۟ مِنْ ءَايَٰتِنَا عَجَبًا","Am hasibta anna ashâbal-kahfi var-rakîmi kânû min âyâtinâ 'acabâ.","Sen, yoksa Kehf ve Rakim ehlini bizim (tek) şaşılacak ayetlerimizden mi sandın?",""],[10,"إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ فَقَالُوا۟ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا","Iz aval-fityatu ilal-kahfi fa kâlû rabbanâ âtinâ mil ladunka rahmatav ve hayyi' lanâ min amrinâ raşadâ.","Hani bir kaç genç mağaraya sığınmıştı ve şöyle demişlerdi: \"Rabbimiz, bize katından bir rahmet ver ve bu işimizde doğruyu bize nasip et!\"",""],[11,"فَضَرَبْنَا عَلَىٰٓ ءَاذَانِهِمْ فِى ٱلْكَهْفِ سِنِينَ عَدَدًا","Fadarabnâ 'alâ âzânihim fil-kahfi sinîna 'adadâ.","Bunun üzerine Biz de nice yıllar onların kulaklarına perde koyduk (onları uyuttuk).",""],[12,"ثُمَّ بَعَثْنَٰهُمْ لِنَعْلَمَ أَىُّ ٱلْحِزْبَيْنِ أَحْصَىٰ لِمَا لَبِثُوٓا۟ أَمَدًا","Summa ba'asnâhum lina'lama ayyul-hizbayni ahsâ limâ labisû amadâ.","Sonra da iki gruptan hangisinin (mağarada) bekledikleri süreyi daha iyi hesap ettiğini ortaya çıkarmak için onları uyandırdık.",""],[13,"نَّحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُم بِٱلْحَقِّ إِنَّهُمْ فِتْيَةٌ ءَامَنُوا۟ بِرَبِّهِمْ وَزِدْنَٰهُمْ هُدًى","Nahnu nakussu 'alayka naba'ahum bil-hakk, innahum fityatun âmanû birabbihim ve zidnâhum hudâ.","Biz sana onların haberlerini hak/gerçek olarak anlatıyoruz. Onlar, Rablerine iman etmiş gençlerdi. Biz de onların hidayetini arttırmıştık.",""],[14,"وَرَبَطْنَا عَلَىٰ قُلُوبِهِمْ إِذْ قَامُوا۟ فَقَالُوا۟ رَبُّنَا رَبُّ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ لَن نَّدْعُوَا۟ مِن دُونِهِۦٓ إِلَٰهًا لَّقَدْ قُلْنَآ إِذًا شَطَطًا","Ve rabatnâ 'alâ kulûbihim iz kâmû fa kâlû rabbunâ rabbus-samâvâti vel-ardi lan nad'uva min dûnihî ilâhal lakad kulnâ izan şatatâ.","Ayağa kalkarak: \"Bizim Rabbimiz göklerin ve yerin Rabbidir. Ondan başka bir ilaha dua etmeyeceğiz\" O takdirde gerçekten son derece batıl bir söz söylemiş oluruz” dediklerinde Biz onların kalplerini sağlamlaştırdık.",""],[15,"هَٰٓؤُلَآءِ قَوْمُنَا ٱتَّخَذُوا۟ مِن دُونِهِۦٓ ءَالِهَةً لَّوْلَا يَأْتُونَ عَلَيْهِم بِسُلْطَٰنٍۭ بَيِّنٍ فَمَنْ أَظْلَمُ مِمَّنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ كَذِبًا","Hâ'ulâ'i kavmunattahazû min dûnihî âlihah, lav lâ ya'tûna 'alayhim bisultânim bayyin, faman azlamu mimmaniftarâ 'alallâhi kazibâ.","Şu bizim kavmimiz Allah'tan başka ilahlar edindiler. Onlar hakkında açık bir delil getirselerdi ya! Allah hakkında yalan uydurandan daha zalimi kimdir?",""],[16,"وَإِذِ ٱعْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا ٱللَّهَ فَأْوُۥٓا۟ إِلَى ٱلْكَهْفِ يَنشُرْ لَكُمْ رَبُّكُم مِّن رَّحْمَتِهِۦ وَيُهَيِّئْ لَكُم مِّنْ أَمْرِكُم مِّرْفَقًا","Ve izi'tazaltumûhum ve mâ ya'budûna illallâha fa'vû ilal-kahfi yanşur lakum rabbukum mir rahmatihî ve yuhayyi' lakum min amrikum mirfakâ.","(Madem ki) Onlardan ve onların Allah’tan başka ibadet ettiklerinden ayrıldınız. O halde mağaraya çekilin ki Rabbiniz size rahmetini yaysın ve işlerinizde kolaylık sağlasın.",""],[17,"وَتَرَى ٱلشَّمْسَ إِذَا طَلَعَت تَّزَٰوَرُ عَن كَهْفِهِمْ ذَاتَ ٱلْيَمِينِ وَإِذَا غَرَبَت تَّقْرِضُهُمْ ذَاتَ ٱلشِّمَالِ وَهُمْ فِى فَجْوَةٍ مِّنْهُ ذَٰلِكَ مِنْ ءَايَٰتِ ٱللَّهِ مَن يَهْدِ ٱللَّهُ فَهُوَ ٱلْمُهْتَدِ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُۥ وَلِيًّا مُّرْشِدًا","Ve taraş-şamsa izâ tala'at tazâvaru 'an kahfihim zâtal-yamîni ve izâ garabat takriduhum zâtaş-şimâli ve hum fî facvatim minh, zâlika min âyâtillâh, may yahdillâhu fa huval-muhtadi ve may yudlil falan tacida lahû valiyyam murşidâ.","(Orada olsaydın) Güneş doğduğunda; mağaralarının sağ tarafına kaydığını, battığında da sol yandan kayıp gittiğini görürdün. Kendileri ise mağaranın geniş bir yerinde idiler. Bu, Allah’ın âyetlerindendir. Allah, kime hidayet ederse işte o, doğru yolu bulandır. Kimi de şaşırtırsa, artık ona doğru yolu gösterecek bir dost bulamazsın.",""],[18,"وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ وَنُقَلِّبُهُمْ ذَاتَ ٱلْيَمِينِ وَذَاتَ ٱلشِّمَالِ وَكَلْبُهُم بَٰسِطٌ ذِرَاعَيْهِ بِٱلْوَصِيدِ لَوِ ٱطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًا وَلَمُلِئْتَ مِنْهُمْ رُعْبًا","Ve tahsabuhum aykâzav ve hum rukûd, ve nukallibuhum zâtal-yamîni ve zâtaş-şimâl, ve kalbuhum bâsitun zirâ'ayhi bil-vasîd, lavittala'ta 'alayhim lavallayta minhum firârav ve lamuli'ta minhum ru'bâ.","Uykuda oldukları halde, sen onları uyanık sanırsın. Biz onları sağa sola çeviriyorduk. Köpekleri de mağaranın girişinde ön ayaklarını uzatmış (yatmakta idi.) Onları görseydin, mutlaka onlardan yüz çevirip kaçardın ve gördüklerin yüzünden için korku ile dolardı.",""],[19,"وَكَذَٰلِكَ بَعَثْنَٰهُمْ لِيَتَسَآءَلُوا۟ بَيْنَهُمْ قَالَ قَآئِلٌ مِّنْهُمْ كَمْ لَبِثْتُمْ قَالُوا۟ لَبِثْنَا يَوْمًا أَوْ بَعْضَ يَوْمٍ قَالُوا۟ رَبُّكُمْ أَعْلَمُ بِمَا لَبِثْتُمْ فَٱبْعَثُوٓا۟ أَحَدَكُم بِوَرِقِكُمْ هَٰذِهِۦٓ إِلَى ٱلْمَدِينَةِ فَلْيَنظُرْ أَيُّهَآ أَزْكَىٰ طَعَامًا فَلْيَأْتِكُم بِرِزْقٍ مِّنْهُ وَلْيَتَلَطَّفْ وَلَا يُشْعِرَنَّ بِكُمْ أَحَدًا","Ve kazâlika ba'asnâhum liyatasâ'alû baynahum, kâla kâ'ilum minhum kam labistum, kâlû labisnâ yavman av ba'da yavm, kâlû rabbukum a'lamu bimâ labistum, fab'asû ahadakum bivarikikum hâzihî ilal-madînati falyanzur ayyuhâ azkâ ta'âman falya'tikum birizkim minhu valyatalattaf ve lâ yuş'iranna bikum ahadâ.","Böylece biz, birbirlerine sorsunlar diye onları uyandırdık. İçlerinden biri: “Ne kadar kaldınız?\" dedi. (Bir kısmı) “Bir gün, ya da bir günden az”, dediler. (Diğerleri de) şöyle dediler: “Ne kadar kaldığınızı Rabbiniz daha iyi bilir. Şimdi siz birinizi şu gümüş para ile kente gönderin de baksın; (şehir halkından) hangisinin yiyeceği daha temiz ve lezzetli ise ondan size bir rızık getirsin. Ayrıca, çok nazik davransın (da dikkat çekmesin) ve sizi hiçbir kimseye sakın sezdirmesin.''",""],[20,"إِنَّهُمْ إِن يَظْهَرُوا۟ عَلَيْكُمْ يَرْجُمُوكُمْ أَوْ يُعِيدُوكُمْ فِى مِلَّتِهِمْ وَلَن تُفْلِحُوٓا۟ إِذًا أَبَدًا","Innahum iy yazharû 'alaykum yarcumûkum av yu'îdûkum fî millatihim ve lan tuflihû izan abadâ.","'Eğer onlar sizi ele geçirirlerse ya taşlayarak öldürürler, yahut kendi dinlerine döndürürler. O zaman da bir daha asla kurtuluşa eremezsiniz.''",""],[21,"وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوٓا۟ أَنَّ وَعْدَ ٱللَّهِ حَقٌّ وَأَنَّ ٱلسَّاعَةَ لَا رَيْبَ فِيهَآ إِذْ يَتَنَٰزَعُونَ بَيْنَهُمْ أَمْرَهُمْ فَقَالُوا۟ ٱبْنُوا۟ عَلَيْهِم بُنْيَٰنًا رَّبُّهُمْ أَعْلَمُ بِهِمْ قَالَ ٱلَّذِينَ غَلَبُوا۟ عَلَىٰٓ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِم مَّسْجِدًا","Ve kazâlika a'sarnâ 'alayhim liya'lamû anna ve'dallâhi hakkuv ve annas-sâ'ata lâ rayba fîhâ, iz yatanâza'ûna baynahum amrahum fa kâlubnû 'alayhim bun-yânâ, rabbuhum a'lamu bihim, kâlal-lazîna galabû 'alâ amrihim lanattahizanna 'alayhim mascidâ.","Böylece (insanları) onlardan haberdar ettik ki, Allah'ın vâdinin hak olduğunu, kıyametin şüphe götürmez olduğunu bilsinler. Hani onlar kendi meselelerini aralarında tartışıyorlardı. Bunun üzerine: “Üzerlerine bir bina yapın” demişlerdi. Rableri onları daha iyi bilendir. Fakat onların işine galip gelenler ise, “Mutlaka onların üstüne bir Mescid edineceğiz” dediler.",""],[22,"سَيَقُولُونَ ثَلَٰثَةٌ رَّابِعُهُمْ كَلْبُهُمْ وَيَقُولُونَ خَمْسَةٌ سَادِسُهُمْ كَلْبُهُمْ رَجْمًۢا بِٱلْغَيْبِ وَيَقُولُونَ سَبْعَةٌ وَثَامِنُهُمْ كَلْبُهُمْ قُل رَّبِّىٓ أَعْلَمُ بِعِدَّتِهِم مَّا يَعْلَمُهُمْ إِلَّا قَلِيلٌ فَلَا تُمَارِ فِيهِمْ إِلَّا مِرَآءً ظَٰهِرًا وَلَا تَسْتَفْتِ فِيهِم مِّنْهُمْ أَحَدًا","Sayakûlûna salâsatur râbi'uhum kalbuhum, ve yakûlûna hamsatun sâdisuhum kalbuhum racmam bil-gayb, ve yakûlûna sab'atuv ve sâminuhum kalbuhum, kur rabbî a'lamu bi'iddatihim mâ ya'lamuhum illâ kalîl, falâ tumâri fîhim illâ mirâ'an zâhirâ, ve lâ tastafti fîhim minhum ahadâ.","\"Onlar üç kişidir; dördüncüleri de köpekleridir\" diyecekler. Yine: \"Beş kişidir; altıncıları köpekleridir\" diyecekler. (Bunlar) gayb hakkında taş atmaktır. \"Yedi kişidirler, sekizincileri köpekleridir. De ki: Onların sayısını en iyi Rabbim bilir. Onları çok az kimseden başkası bilmez. O halde, onlar hakkında açık olarak ortaya konandan başka bir şeyi tartışma. Onlar hakkında (Ehl-i Kitap'tan hiçbir) kimseye bir şey sorma!",""],[23,"وَلَا تَقُولَنَّ لِشَا۟ىْءٍ إِنِّى فَاعِلٌ ذَٰلِكَ غَدًا","Ve lâ takûlanna lişay'in innî fâ'ilun zâlika gadâ.","Hiç bir şey için “Ben onu yarın mutlaka yapacağım.” deme!",""],[24,"إِلَّآ أَن يَشَآءَ ٱللَّهُ وَٱذْكُر رَّبَّكَ إِذَا نَسِيتَ وَقُلْ عَسَىٰٓ أَن يَهْدِيَنِ رَبِّى لِأَقْرَبَ مِنْ هَٰذَا رَشَدًا","Illâ ay yaşâ'allâh, vazkur rabbaka izâ nasîta ve kul 'asâ ay yahdiyani rabbî li'akraba min hâzâ raşadâ.","Ancak, “Allah dilerse yapacağım.” de. Unuttuğun zaman Rabbini an ve “Umarım Rabbim beni, bundan daha doğru olana ulaştırır.” de.",""],[25,"وَلَبِثُوا۟ فِى كَهْفِهِمْ ثَلَٰثَ مِا۟ئَةٍ سِنِينَ وَٱزْدَادُوا۟ تِسْعًا","Ve labisû fî kahfihim salâsa mi'atin sinîna vazdâdû tis'â.","Onlar mağaralarında üç yüz yıl kaldılar. Buna dokuz daha kattılar.",""],[26,"قُلِ ٱللَّهُ أَعْلَمُ بِمَا لَبِثُوا۟ لَهُۥ غَيْبُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ أَبْصِرْ بِهِۦ وَأَسْمِعْ مَا لَهُم مِّن دُونِهِۦ مِن وَلِىٍّ وَلَا يُشْرِكُ فِى حُكْمِهِۦٓ أَحَدًا","Kulillâhu a'lamu bimâ labisû, lahû gaybus-samâvâti vel-ard, absir bihî ve asmi', mâ lahum min dûnihî miv valiyy, ve lâ yuşriku fî hukmihî ahadâ.","De ki: “Kaldıkları süreyi Allah daha iyi bilir. Göklerin ve yerin gaybını bilmek O’na aittir. O, ne güzel görür; O, ne güzel işitir! Onların, O’ndan başka hiçbir dostu da yoktur. O, hükmüne hiçbir kimseyi ortak etmez.”",""],[27,"وَٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِن كِتَابِ رَبِّكَ لَا مُبَدِّلَ لِكَلِمَٰتِهِۦ وَلَن تَجِدَ مِن دُونِهِۦ مُلْتَحَدًا","Vatlu mâ ûhiya ilayka min kitâbi rabbik, lâ mubaddila likalimâtih, ve lan tacida min dûnihî multahadâ.","Rabbinin kitabından sana vahyedileni oku. O’nun kelimelerini değiştirecek hiçbir kimse yoktur. O’ndan başka asla bir sığınak da bulamazsın.",""],[28,"وَٱصْبِرْ نَفْسَكَ مَعَ ٱلَّذِينَ يَدْعُونَ رَبَّهُم بِٱلْغَدَوٰةِ وَٱلْعَشِىِّ يُرِيدُونَ وَجْهَهُۥ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُۥ عَن ذِكْرِنَا وَٱتَّبَعَ هَوَىٰهُ وَكَانَ أَمْرُهُۥ فُرُطًا","Vasbir nafsaka ma'al-lazîna yad'ûna rabbahum bil-gadâti vel-'aşiyyi yurîdûna vachahû ve lâ ta'du 'aynâka 'anhum, turîdu zînatal-hayâtid-dun-yâ, ve lâ tuti' man agfalnâ kalbahû 'an zikrinâ vattaba'a havâhu ve kâna amruhû furutâ.","Sabah, akşam Rablerinin yüzünü dileyerek O’na dua edenlerle beraber sen de sabret. Dünya hayatının süslerini arzulayarak, gözünü onlardan ayırma. Kalbini zikrimizden gafil kıldığımız, heva/arzularına uymuş ve işi taşkınlık olan kimseye itaat etme!",""],[29,"وَقُلِ ٱلْحَقُّ مِن رَّبِّكُمْ فَمَن شَآءَ فَلْيُؤْمِن وَمَن شَآءَ فَلْيَكْفُرْ إِنَّآ أَعْتَدْنَا لِلظَّٰلِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا وَإِن يَسْتَغِيثُوا۟ يُغَاثُوا۟ بِمَآءٍ كَٱلْمُهْلِ يَشْوِى ٱلْوُجُوهَ بِئْسَ ٱلشَّرَابُ وَسَآءَتْ مُرْتَفَقًا","Ve kulil-hakku mir rabbikum, faman şâ'a falyu'miv ve man şâ'a falyakfur, innâ a'tadnâ liz-zâlimîna nârâ, ahâta bihim surâdikuhâ, ve iy yastagîsû yugâsû bimâ'in kal-muhli yaşvil-vucûh, bi'saş-şarâb, ve sâ'at murtafakâ.","De ki: “Hak, Rabbinizdendir. Artık dileyen iman etsin, dileyen kâfir olsun.” Biz zalimlere öyle bir ateş hazırladık ki, onun alevden duvarları kendilerini çepeçevre kuşatmıştır. (Susuzluktan) feryat edip yardım dilediklerinde, erimiş maden gibi yüzleri yakıp kavuran bir su ile kendilerine yardım edilir. O ne kötü bir içecektir! Cehennem ne korkunç bir sığınaktır.",""],[30,"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا","Innal-lazîna âmanû ve 'amilus-sâlihâti innâ lâ nudî'u acra man ahsana 'amalâ.","Gerçek şu ki, iman edip salih ameller yapanlara gelince, elbette biz iyi iş yapanların ecrini zayi etmeyiz.",""],[31,"أُو۟لَٰٓئِكَ لَهُمْ جَنَّٰتُ عَدْنٍ تَجْرِى مِن تَحْتِهِمُ ٱلْأَنْهَٰرُ يُحَلَّوْنَ فِيهَا مِنْ أَسَاوِرَ مِن ذَهَبٍ وَيَلْبَسُونَ ثِيَابًا خُضْرًا مِّن سُندُسٍ وَإِسْتَبْرَقٍ مُّتَّكِـِٔينَ فِيهَا عَلَى ٱلْأَرَآئِكِ نِعْمَ ٱلثَّوَابُ وَحَسُنَتْ مُرْتَفَقًا","Ulâ'ika lahum cannâtu 'adnin tacrî min tahtihimul-anhâru yuhallavna fîhâ min asâvira min zahabiv ve yalbasûna siyâban hudram min sundusiv ve istabrakim muttaki'îna fîhâ 'alal-arâ'ik, ni'mas-savâb, ve hasunat murtafakâ.","Onlara, altlarından ırmaklar akan Adn Cennetleri vardır. Orada altın bilezikler takarlar, ince ve kalın ipekten yeşil elbiseler giyerler. Orada koltuklarına yaslanırlar. Ne güzel mükâfat! (Cennet) Ne güzel bir konak!",""],[32,"وَٱضْرِبْ لَهُم مَّثَلًا رَّجُلَيْنِ جَعَلْنَا لِأَحَدِهِمَا جَنَّتَيْنِ مِنْ أَعْنَٰبٍ وَحَفَفْنَٰهُمَا بِنَخْلٍ وَجَعَلْنَا بَيْنَهُمَا زَرْعًا","Vadrib lahum masalar raculayni ca'alnâ li'ahadihimâ cannatayni min a'nâbiv ve hafafnâhumâ binahliv ve ca'alnâ baynahumâ zar'â.","Onlara iki adamı örnek ver: Onlardan birisine iki üzüm bağı vermiştik. Çevresini de hurmalıklarla çevirmiş, bu ikisinin arasında da ekinler bitirmiştik.",""],[33,"كِلْتَا ٱلْجَنَّتَيْنِ ءَاتَتْ أُكُلَهَا وَلَمْ تَظْلِم مِّنْهُ شَيْـًٔا وَفَجَّرْنَا خِلَٰلَهُمَا نَهَرًا","Kiltal-cannatayni âtat ukulahâ ve lam tazlim minhu şay'â, ve faccarnâ hilâlahumâ naharâ.","Her iki bahçe de ürünlerini vermiş, hiçbir şeyi eksik bırakmamışlardı. İkisinin arasından da bir ırmak akıtmıştık.",""],[34,"وَكَانَ لَهُۥ ثَمَرٌ فَقَالَ لِصَٰحِبِهِۦ وَهُوَ يُحَاوِرُهُۥٓ أَنَا۠ أَكْثَرُ مِنكَ مَالًا وَأَعَزُّ نَفَرًا","Ve kâna lahû samar, fa kâla lisâhibihî ve huva yuhâviruhû ana aksaru minka mâlav ve a'azzu nafarâ.","Onun başka ürünleri de vardı. İşte böyle bir halde arkadaşıyla konuşurken: \"Ben malca senden zenginim, sayıca da senden güçlüyüm.\" dedi.",""],[35,"وَدَخَلَ جَنَّتَهُۥ وَهُوَ ظَالِمٌ لِّنَفْسِهِۦ قَالَ مَآ أَظُنُّ أَن تَبِيدَ هَٰذِهِۦٓ أَبَدًا","Ve dahala cannatahû ve huva zâlimul linafsih, kâla mâ azunnu an tabîda hâzihî abadâ.","Derken kendine zulmederek bağına girdi. Şöyle dedi: “Bunun sonsuza değin yok olacağını sanmıyorum.”",""],[36,"وَمَآ أَظُنُّ ٱلسَّاعَةَ قَآئِمَةً وَلَئِن رُّدِدتُّ إِلَىٰ رَبِّى لَأَجِدَنَّ خَيْرًا مِّنْهَا مُنقَلَبًا","Ve mâ azunnus-sâ'ata kâ'imatav ve la'ir rudittu ilâ rabbî la'acidanna hayram minhâ munkalabâ.","\"Kıyametin kopacağına da hiç inanmıyorum. Eğer Rabbime döndürülecek olursam, elbette bundan daha iyi bir dönüş yeri bulurum.\" dedi.",""],[37,"قَالَ لَهُۥ صَاحِبُهُۥ وَهُوَ يُحَاوِرُهُۥٓ أَكَفَرْتَ بِٱلَّذِى خَلَقَكَ مِن تُرَابٍ ثُمَّ مِن نُّطْفَةٍ ثُمَّ سَوَّىٰكَ رَجُلًا","Kâla lahû sâhibuhû ve huva yuhâviruhû akafarta bil-lazî halakaka min turâbin summa min nutfatin summa savvâka raculâ.","Kendisiyle konuşmakta olan arkadaşı ona dedi ki: “Seni topraktan, sonra bir damla sudan yaratan, sonra da seni (eksiksiz) bir insan şeklinde yaratan Allah’a (iman etmeyerek) küfre mi düşüyorsun?”",""],[38,"لَّٰكِنَّا۠ هُوَ ٱللَّهُ رَبِّى وَلَآ أُشْرِكُ بِرَبِّىٓ أَحَدًا","Lâkinna huvallâhu rabbî ve lâ uşriku birabbî ahadâ.","Oysa, O Allah benim Rabbimdir ve ben, Rabbime hiç kimseyi şirk koşmam.",""],[39,"وَلَوْلَآ إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ إِن تَرَنِ أَنَا۠ أَقَلَّ مِنكَ مَالًا وَوَلَدًا","Ve lav lâ iz dahalta cannataka kulta mâ şâ'allâh, lâ kuvvata illâ billâh, in tarani ana akalla minka mâlav ve valadâ.","Bağına girdiğinde Mâşallah (Allah neyi dilerse o olur)! Allah'tan başka kuvvet yoktur, demen lazım değil miydi? Eğer beni mal ve çocuk bakımından senden daha az (güçte) görüyorsan.",""],[40,"فَعَسَىٰ رَبِّىٓ أَن يُؤْتِيَنِ خَيْرًا مِّن جَنَّتِكَ وَيُرْسِلَ عَلَيْهَا حُسْبَانًا مِّنَ ٱلسَّمَآءِ فَتُصْبِحَ صَعِيدًا زَلَقًا","Fa 'asâ rabbî ay yu'tiyani hayram min cannatika ve yursila 'alayhâ husbânam minas-samâ'i fa tusbiha sa'îdan zalakâ.","Belki Rabbim bana senin bağından daha hayırlısını verir. Seninkinin üzerine ise gökten felaket indiriverir de kupkuru çorak bir toprak oluverir.",""],[41,"أَوْ يُصْبِحَ مَآؤُهَا غَوْرًا فَلَن تَسْتَطِيعَ لَهُۥ طَلَبًا","Au yusbiha mâ'uhâ gavran falan tastatî'a lahû talabâ.","Yahut suyu yerin dibine çekiliverir de bir daha onu aramaya gücün yetmez.",""],[42,"وَأُحِيطَ بِثَمَرِهِۦ فَأَصْبَحَ يُقَلِّبُ كَفَّيْهِ عَلَىٰ مَآ أَنفَقَ فِيهَا وَهِىَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا وَيَقُولُ يَٰلَيْتَنِى لَمْ أُشْرِكْ بِرَبِّىٓ أَحَدًا","Ve uhîta bisamarihî fa asbaha yukallibu kaffayhi 'alâ mâ anfaka fîhâ ve hiya hâviyatun 'alâ 'urûşihâ ve yakûlu yâ laytanî lam uşrik birabbî ahadâ.","(Birden) Onun ürünleri (afetle) kuşatılıverdi. Orası için harcadıklarına karşı avuçlarını (esefle) ovuşturup duruyordu. Bahçenin çardakları yere çökmüştü. \"Ah, keşke Rabbime hiçbir şirk koşmamış olsaydım!\" diyordu.",""],[43,"وَلَمْ تَكُن لَّهُۥ فِئَةٌ يَنصُرُونَهُۥ مِن دُونِ ٱللَّهِ وَمَا كَانَ مُنتَصِرًا","Ve lam takul lahû fi'atuy yansurûnahû min dûnillâhi ve mâ kâna muntasirâ.","Onun, Allah’tan başka kendisine yardım edebilecek kimseleri yoktu. Kendi kendini kurtaracak güçte de değildi.",""],[44,"هُنَالِكَ ٱلْوَلَٰيَةُ لِلَّهِ ٱلْحَقِّ هُوَ خَيْرٌ ثَوَابًا وَخَيْرٌ عُقْبًا","Hunâlikal-valâyatu lillâhil-hakk, huva hayrun savâbav ve hayrun 'ukbâ.","İşte bu durumda velayet (yardım etmek) yalnızca hak olan Allah’a mahsustur. O’nun mükâfatı da daha hayırlıdır, vereceği sonuç da daha hayırlıdır.",""],[45,"وَٱضْرِبْ لَهُم مَّثَلَ ٱلْحَيَوٰةِ ٱلدُّنْيَا كَمَآءٍ أَنزَلْنَٰهُ مِنَ ٱلسَّمَآءِ فَٱخْتَلَطَ بِهِۦ نَبَاتُ ٱلْأَرْضِ فَأَصْبَحَ هَشِيمًا تَذْرُوهُ ٱلرِّيَٰحُ وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ مُّقْتَدِرًا","Vadrib lahum masalal-hayâtid-dun-yâ kamâ'in anzalnâhu minas-samâ'i fahtalata bihî nabâtul-ardi fa asbaha haşîman tazrûhur-riyâh, ve kânallâhu 'alâ kulli şay'im muktadirâ.","Onlara dünya hayatının örneğini ver: (Dünya hayatı), gökten indirdiğimiz yağmur gibidir ki, onun sebebiyle yeryüzünün bitkileri boy verip birbirine karışırlar. Fakat bütün bu canlılık sonunda rüzgârın savurduğu kuru bir çer çöpe döner. Allah, her şey üzerinde kudret sahibidir.",""],[46,"ٱلْمَالُ وَٱلْبَنُونَ زِينَةُ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَٱلْبَٰقِيَٰتُ ٱلصَّٰلِحَٰتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا","Al-mâlu vel-banûna zînatul-hayâtid-dun-yâ, vel-bâkiyâtus-sâlihâtu hayrun 'inda rabbika savâbav ve hayrun amalâ.","Mallar ve evlatlar, dünya hayatının süsüdür. Baki kalacak salih ameller ise, Rabbinin katında sevap olarak da, ümit olarak da daha hayırlıdır.",""],[47,"وَيَوْمَ نُسَيِّرُ ٱلْجِبَالَ وَتَرَى ٱلْأَرْضَ بَارِزَةً وَحَشَرْنَٰهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًا","Ve yavma nusayyirul-cibâla ve taral-arda bârizah, ve haşarnâhum falam nugâdir minhum ahadâ.","Dağları yürüteceğimiz ve senin yeryüzünü dümdüz göreceğin günü bir hatırla. Biz onları mahşerde toplarız da içlerinden hiçbirini bırakmayız.",""],[48,"وَعُرِضُوا۟ عَلَىٰ رَبِّكَ صَفًّا لَّقَدْ جِئْتُمُونَا كَمَا خَلَقْنَٰكُمْ أَوَّلَ مَرَّةٍۭ بَلْ زَعَمْتُمْ أَلَّن نَّجْعَلَ لَكُم مَّوْعِدًا","Ve 'uridû 'alâ rabbika saffâ, lakad ci'tumûnâ kamâ halaknâkum avvala marratim bal za'amtum allan nac'ala lakum mav'idâ.","Hepsi saf saf Rabbinin huzuruna çıkarılırlar. Onlara: “Andolsun, sizi ilk önce yarattığımız gibi bize geldiniz. Oysa siz, sizin için hesaba çekileceğiniz bir zaman belirlemediğimizi sanmıştınız.” denir.",""],[49,"وَوُضِعَ ٱلْكِتَٰبُ فَتَرَى ٱلْمُجْرِمِينَ مُشْفِقِينَ مِمَّا فِيهِ وَيَقُولُونَ يَٰوَيْلَتَنَا مَالِ هَٰذَا ٱلْكِتَٰبِ لَا يُغَادِرُ صَغِيرَةً وَلَا كَبِيرَةً إِلَّآ أَحْصَىٰهَا وَوَجَدُوا۟ مَا عَمِلُوا۟ حَاضِرًا وَلَا يَظْلِمُ رَبُّكَ أَحَدًا","Ve vudi'al-kitâbu fa taral-mucrimîna muşfikîna mimmâ fîhi ve yakûlûna yâ vaylatanâ mâ lihâzal-kitâbi lâ yugâdiru sagîratav ve lâ kabîratan illâ ahsâhâ, ve vacadû mâ 'amilû hadirâ, ve lâ yazlimu rabbuka ahadâ.","Kitap ortaya konur. Günahkârları, kitabın içindekilerden korkuya kapılmış görürsün. “Eyvah bize! Bu nasıl bir kitaptır ki; küçük, büyük hiçbir şey bırakmadan hepsini sayıp dökmüş!” derler. Onlar bütün yaptıklarını karşılarında bulurlar. Senin Rabbin hiç kimseye zulmetmez.",""],[50,"وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ ٱسْجُدُوا۟ لِـَٔادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ كَانَ مِنَ ٱلْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِۦٓ أَفَتَتَّخِذُونَهُۥ وَذُرِّيَّتَهُۥٓ أَوْلِيَآءَ مِن دُونِى وَهُمْ لَكُمْ عَدُوٌّۢ بِئْسَ لِلظَّٰلِمِينَ بَدَلًا","Ve iz kulnâ lil-malâ'ikatiscudû li'âdama fa sacadû illâ iblîs, kâna minal-cinni fa fasaka 'an amri rabbih, afa tattahizûnahû ve zurriyyatahû avliyâ'a min dûnî ve hum lakum 'aduvv, bi'sa liz-zâlimîna badalâ.","Hani biz meleklere: “Âdem için (selamlamak için) secde edin!” demiştik de İblis’ten başka hepsi secde etmişlerdi. İblis ise cinlerdendi de Rabbinin emri dışına çıktı. Şimdi siz, beni bırakıp da İblis’i ve neslini, kendinize dostlar mı ediniyorsunuz? Hâlbuki onlar, sizin için birer düşmandırlar. Bu, zalimler için ne kötü bir bedeldir!",""],[51,"مَّآ أَشْهَدتُّهُمْ خَلْقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَلَا خَلْقَ أَنفُسِهِمْ وَمَا كُنتُ مُتَّخِذَ ٱلْمُضِلِّينَ عَضُدًا","Mâ aşhattuhum halkas-samâvâti vel-ardi ve lâ halka anfusihim, ve mâ kuntu muttahizal-mudillîna 'adudâ.","Onları, göklerin ve yerin yaratılmasına veya kendilerinin yaratılışına şahit tutmadım. Saptıranları da yardımcı edinecek değilim.",""],[52,"وَيَوْمَ يَقُولُ نَادُوا۟ شُرَكَآءِىَ ٱلَّذِينَ زَعَمْتُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُوا۟ لَهُمْ وَجَعَلْنَا بَيْنَهُم مَّوْبِقًا","Ve yavma yakûlu nâdû şurakâ'iyal-lazîna za'amtum fa da'avhum falam yastacîbû lahum ve ca'alnâ baynahum mavbikâ.","O gün: \"Benim ortaklarım olduklarını sandıklarınızı çağırın\" diye buyurur. Onları çağırırlar ama cevap vermezler. Biz aralarına bir uçurum koyarız.",""],[53,"وَرَءَا ٱلْمُجْرِمُونَ ٱلنَّارَ فَظَنُّوٓا۟ أَنَّهُم مُّوَاقِعُوهَا وَلَمْ يَجِدُوا۟ عَنْهَا مَصْرِفًا","Ve ra'al-mucrimûnan nâra fa zannû annahum muvâki'ûhâ ve lam yacidû 'anhâ masrifâ.","Suçlular (o gün) ateşi görünce, onun içine düşeceklerini iyice anlayacaklar ve ondan kurtuluş yolu da bulamayacaklardır.",""],[54,"وَلَقَدْ صَرَّفْنَا فِى هَٰذَا ٱلْقُرْءَانِ لِلنَّاسِ مِن كُلِّ مَثَلٍ وَكَانَ ٱلْإِنسَٰنُ أَكْثَرَ شَىْءٍ جَدَلًا","Ve lakad sarrafnâ fî hâzal-kur'âni lin-nâsi min kulli masal, ve kânal-insânu aksara şay'in cadalâ.","And olsun ki, Biz bu Kuran'da insanlara her türlü misali gösterip açıkladık. Fakat tartışmaya en çok düşkün (varlık) insandır.",""],[55,"وَمَا مَنَعَ ٱلنَّاسَ أَن يُؤْمِنُوٓا۟ إِذْ جَآءَهُمُ ٱلْهُدَىٰ وَيَسْتَغْفِرُوا۟ رَبَّهُمْ إِلَّآ أَن تَأْتِيَهُمْ سُنَّةُ ٱلْأَوَّلِينَ أَوْ يَأْتِيَهُمُ ٱلْعَذَابُ قُبُلًا","Ve mâ mana'an-nâsa ay yu'minû iz câ'ahumul-hudâ ve yastagfirû rabbahum illâ an ta'tiyahum sunnatul-avvalîna av ya'tiyahumul-'azâbu kubulâ.","İnsanlara hidayet geldikten sonra onların iman etmelerine ve Rablerinden mağfiret dilemelerine alıkoyan tek şey; ancak öncekilerin başına gelen sünnetin kendilerine de gelip çatmasını yahut onlara gözleri önünde azabın gelmesini beklemeleridir.",""],[56,"وَمَا نُرْسِلُ ٱلْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَ وَيُجَٰدِلُ ٱلَّذِينَ كَفَرُوا۟ بِٱلْبَٰطِلِ لِيُدْحِضُوا۟ بِهِ ٱلْحَقَّ وَٱتَّخَذُوٓا۟ ءَايَٰتِى وَمَآ أُنذِرُوا۟ هُزُوًا","Ve mâ nursilul-mursalîna illâ mubaşşirîna ve munzirîn, ve yucâdilul-lazîna kafarû bil-bâtili liyudhidû bihil-hakka vattahazû âyâtî ve mâ unzirû huzuvâ.","Peygamberleri ancak müjdeci ve uyarıcı olarak göndeririz. Kâfirler, batıl ile hakkı ortadan kaldırmak için mücadele ederler. Ayetlerimizi ve kendilerine yapılan uyarıları alay konusu yaparlar.",""],[57,"وَمَنْ أَظْلَمُ مِمَّن ذُكِّرَ بِـَٔايَٰتِ رَبِّهِۦ فَأَعْرَضَ عَنْهَا وَنَسِىَ مَا قَدَّمَتْ يَدَاهُ إِنَّا جَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَن يَفْقَهُوهُ وَفِىٓ ءَاذَانِهِمْ وَقْرًا وَإِن تَدْعُهُمْ إِلَى ٱلْهُدَىٰ فَلَن يَهْتَدُوٓا۟ إِذًا أَبَدًا","Ve man azlamu mimman zukkira bi'âyâti rabbihî fa a'rada 'anhâ ve nasiya mâ kaddamat yadâh, innâ ca'alnâ 'alâ kulûbihim akinnatan ay yafkahûhu ve fî âzânihim vakrâ, ve in tad'uhum ilal-hudâ falay yahtadû izan abadâ.","Kim, kendisine Rabbinin âyetleri hatırlatılıp da onlardan yüz çeviren ve elleriyle yapıp, işlediklerini unutandan daha zalimdir? Şüphesiz biz, onu anlamamaları için kalplerine perdeler gerdik, kulaklarına da ağırlıklar koyduk. Sen onları hidayete davet etsen de artık ebediyen hidayet bulamazlar.",""],[58,"وَرَبُّكَ ٱلْغَفُورُ ذُو ٱلرَّحْمَةِ لَوْ يُؤَاخِذُهُم بِمَا كَسَبُوا۟ لَعَجَّلَ لَهُمُ ٱلْعَذَابَ بَل لَّهُم مَّوْعِدٌ لَّن يَجِدُوا۟ مِن دُونِهِۦ مَوْئِلًا","Ve rabbukal-gafûru zur-rahmah, lav yu'âhizuhum bimâ kasabû la'accala lahumul-'azâb, bal lahum mav'idul lay yacidû min dûnihî mav'ilâ.","Rabbin; çok bağışlayıcıdır, merhamet sahibidir. Eğer yaptıkları yüzünden onları (dünyada) cezaya çarptırsaydı, elbette azaplarını çarçabuk verirdi. Fakat, onlar için belirlenmiş bir gün vardır ki (o gün gelince) hiçbir kurtuluş çaresi bulamazlar.",""],[59,"وَتِلْكَ ٱلْقُرَىٰٓ أَهْلَكْنَٰهُمْ لَمَّا ظَلَمُوا۟ وَجَعَلْنَا لِمَهْلِكِهِم مَّوْعِدًا","Ve tilkal-kurâ ahlaknâhum lammâ zalamû ve ca'alnâ limahlikihim mav'idâ.","İşte şu ülkeler; zulmettikleri zaman onları helâk ettik. Onları helâk etmek için de belli bir zaman tayin etmiştik.",""],[60,"وَإِذْ قَالَ مُوسَىٰ لِفَتَىٰهُ لَآ أَبْرَحُ حَتَّىٰٓ أَبْلُغَ مَجْمَعَ ٱلْبَحْرَيْنِ أَوْ أَمْضِىَ حُقُبًا","Ve iz kâla mûsâ lifatâhu lâ abrahu hattâ abluga macma'al-bahrayni av amdiya hukubâ.","Hani Mûsâ, genç arkadaşına: \"İki denizin birleştiği yere ulaşmaya veya yıllarca yürümeye kararlıyım.\" demişti.",""],[61,"فَلَمَّا بَلَغَا مَجْمَعَ بَيْنِهِمَا نَسِيَا حُوتَهُمَا فَٱتَّخَذَ سَبِيلَهُۥ فِى ٱلْبَحْرِ سَرَبًا","Falammâ balagâ macma'a baynihimâ nasiyâ hûtahumâ fattahaza sabîlahû fil-bahri sarabâ.","Onlar, iki denizin birleştiği yere ulaştıklarında balıklarını unuttular. O da denizde bir yol tutup gitti.",""],[62,"فَلَمَّا جَاوَزَا قَالَ لِفَتَىٰهُ ءَاتِنَا غَدَآءَنَا لَقَدْ لَقِينَا مِن سَفَرِنَا هَٰذَا نَصَبًا","Falammâ câvazâ kâla lifatâhu âtinâ gadâ'anâ lakad lakînâ min safarinâ hâzâ nasabâ.","O yeri geçtikleri zaman genç arkadaşına: \"Kahvaltımızı getir, bu yolculuğumuzda bir hayli yorgun düştük.\" dedi.",""],[63,"قَالَ أَرَءَيْتَ إِذْ أَوَيْنَآ إِلَى ٱلصَّخْرَةِ فَإِنِّى نَسِيتُ ٱلْحُوتَ وَمَآ أَنسَىٰنِيهُ إِلَّا ٱلشَّيْطَٰنُ أَنْ أَذْكُرَهُۥ وَٱتَّخَذَ سَبِيلَهُۥ فِى ٱلْبَحْرِ عَجَبًا","Kâla ara'ayta iz avaynâ ilas-sahrati fa innî nasîtul-hût, ve mâ ansânîhu illaş-şaytanu an azkurah, vattahaza sabîlahû fil-bahri 'acabâ.","Genç, “Gördün mü! Kayaya sığındığımız sırada balığı unutmuşum. –Doğrusu onu sana söylememi bana ancak Şeytan unutturdu- Balık şaşılacak bir şekilde denizde yolunu tutup gitmişti.” dedi.",""],[64,"قَالَ ذَٰلِكَ مَا كُنَّا نَبْغِ فَٱرْتَدَّا عَلَىٰٓ ءَاثَارِهِمَا قَصَصًا","Kâla zâlika mâ kunnâ nabg, fartaddâ 'alâ âsârihimâ kasasâ.","Mûsâ: \"İşte, aradığımız buydu.\" dedi. Hemen izlerini takip ederek gerisin geriye döndüler.",""],[65,"فَوَجَدَا عَبْدًا مِّنْ عِبَادِنَآ ءَاتَيْنَٰهُ رَحْمَةً مِّنْ عِندِنَا وَعَلَّمْنَٰهُ مِن لَّدُنَّا عِلْمًا","Fa vacadâ 'abdam min 'ibâdinâ âtaynâhu rahmatam min 'indinâ ve 'allamnâhu mil ladunnâ 'ilmâ.","Orada kendisine tarafımızdan bir rahmet vermiş ve nezdimizden bir ilim öğretmiş olduğumuz kullarımızdan bir kul buldular.",""],[66,"قَالَ لَهُۥ مُوسَىٰ هَلْ أَتَّبِعُكَ عَلَىٰٓ أَن تُعَلِّمَنِ مِمَّا عُلِّمْتَ رُشْدًا","Kâla lahû mûsâ hal attabi'uka 'alâ an tu'allimani mimmâ 'ullimta ruşdâ.","Mûsâ ona: “Sana öğretilen bilgilerden bana, doğruya iletici bir bilgi öğretmen için sana tabi olayım mı?” dedi.",""],[67,"قَالَ إِنَّكَ لَن تَسْتَطِيعَ مَعِىَ صَبْرًا","Kâla innaka lan tastatî'a ma'iya sabrâ.","Adam, şöyle dedi: “Doğrusu sen benimle beraber olmaya asla sabredemezsin.”",""],[68,"وَكَيْفَ تَصْبِرُ عَلَىٰ مَا لَمْ تُحِطْ بِهِۦ خُبْرًا","Ve kayfa tasbiru 'alâ mâ lam tuhit bihî hubrâ.","“İç yüzünü kavrayamadığın bir şeye nasıl sabredebilirsin?”",""],[69,"قَالَ سَتَجِدُنِىٓ إِن شَآءَ ٱللَّهُ صَابِرًا وَلَآ أَعْصِى لَكَ أَمْرًا","Kâla satacidunî in şâ'allâhu sâbirav ve lâ a'sî laka amrâ.","\"İnşallah, beni sabırlı olarak bulacaksın ve senin emrine karşı gelmeyeceğim.\" dedi.",""],[70,"قَالَ فَإِنِ ٱتَّبَعْتَنِى فَلَا تَسْـَٔلْنِى عَن شَىْءٍ حَتَّىٰٓ أُحْدِثَ لَكَ مِنْهُ ذِكْرًا","Kâla fa inittaba'tanî falâ tas'alnî 'an şay'in hattâ uhdisa laka minhu zikrâ.","O da şöyle dedi: “O hâlde, eğer bana tabi olacaksan, ben sana söylemedikçe hiçbir şey hakkında bana soru sormayacaksın.”",""],[71,"فَٱنطَلَقَا حَتَّىٰٓ إِذَا رَكِبَا فِى ٱلسَّفِينَةِ خَرَقَهَا قَالَ أَخَرَقْتَهَا لِتُغْرِقَ أَهْلَهَا لَقَدْ جِئْتَ شَيْـًٔا إِمْرًا","Fantalakâ, hattâ izâ rakibâ fis-safînati hara ahâ, kâla aharaktahâ litugrika ahlahâ, lakad ci'ta şay'an imrâ.","Derken yola koyuldular. Nihayet bir gemiye bindiklerinde (adam) gemiyi deldi. Mûsâ: “Sen onu içindekileri boğmak için mi deldin? Doğrusu, sen büyük bir iş yaptın.” dedi.",""],[72,"قَالَ أَلَمْ أَقُلْ إِنَّكَ لَن تَسْتَطِيعَ مَعِىَ صَبْرًا","Kâla alam akul innaka lan tastatî'a ma'iya sabrâ.","Adam: “Sen benimle beraberliğe asla sabredemezsin, demedim mi?” dedi.",""],[73,"قَالَ لَا تُؤَاخِذْنِى بِمَا نَسِيتُ وَلَا تُرْهِقْنِى مِنْ أَمْرِى عُسْرًا","Kâla lâ tu'âhiznî bimâ nasîtu ve lâ turhiknî min amrî 'usrâ.","Mûsâ: “Unuttuğum için beni sorgulama ve bu işimde bana güçlük çıkarma!” dedi.",""],[74,"فَٱنطَلَقَا حَتَّىٰٓ إِذَا لَقِيَا غُلَٰمًا فَقَتَلَهُۥ قَالَ أَقَتَلْتَ نَفْسًا زَكِيَّةًۢ بِغَيْرِ نَفْسٍ لَّقَدْ جِئْتَ شَيْـًٔا نُّكْرًا","Fantalakâ, hattâ izâ lakiyâ gulâman fa katalah, kâla akatalta nafsan zakiyyatam bigayri nafs, lakad ci'ta şay'an nukrâ.","Yine yola koyuldular. Nihayet bir erkek çocukla karşılaştıklarında, adam (hemen) onu öldürdü. Mûsâ: “Bir cana karşılık olmaksızın masum bir cana mı kıydın? Andolsun çok kötü bir iş yaptın!” dedi.",""],[75,"قَالَ أَلَمْ أَقُل لَّكَ إِنَّكَ لَن تَسْتَطِيعَ مَعِىَ صَبْرًا","Kâla alam akul laka innaka lan tastatî'a ma'iya sabrâ.","“Ben sana benimle beraberliğe asla sabredemezsin, demedim mi?” dedi.",""],[76,"قَالَ إِن سَأَلْتُكَ عَن شَىْءٍۭ بَعْدَهَا فَلَا تُصَٰحِبْنِى قَدْ بَلَغْتَ مِن لَّدُنِّى عُذْرًا","Kâla in sa'altuka 'an şay'im ba'dahâ falâ tusâhibnî, kad balagta mil ladunnî 'uzrâ.","“Eğer bundan sonra sana bir şey soracak olursam artık benimle arkadaşlık etme; o takdirde tarafımdan mazur sayılırsın.” dedi.",""],[77,"فَٱنطَلَقَا حَتَّىٰٓ إِذَآ أَتَيَآ أَهْلَ قَرْيَةٍ ٱسْتَطْعَمَآ أَهْلَهَا فَأَبَوْا۟ أَن يُضَيِّفُوهُمَا فَوَجَدَا فِيهَا جِدَارًا يُرِيدُ أَن يَنقَضَّ فَأَقَامَهُۥ قَالَ لَوْ شِئْتَ لَتَّخَذْتَ عَلَيْهِ أَجْرًا","Fantalakâ, hattâ izâ atayâ ahla karyatinistat'amâ ahlahâ fa abav ay yudayyifûhumâ fa vacadâ fîhâ cidâray yurîdu ay yakadda fa akâmah, kâla lav şi'ta lattahazta 'alayhi acrâ.","Yine yola koyuldular, sonunda ulaştıkları kasaba halkından kendilerine yiyecek istediler. Kasaba halkı onları misafir etmek istemedi. Onlar da orada yıkılmaya yüz tutmuş bir duvar buldular. O (Hızır), bunu doğrulttu. Mûsâ: \"Eğer isteseydin buna karşılık bir ücret alabilirdin.\" dedi.",""],[78,"قَالَ هَٰذَا فِرَاقُ بَيْنِى وَبَيْنِكَ سَأُنَبِّئُكَ بِتَأْوِيلِ مَا لَمْ تَسْتَطِع عَّلَيْهِ صَبْرًا","Kâla hâzâ firâku baynî ve baynik, sa'unabbi'uka bita'vîli mâ lam tastatî' 'alayhi sabrâ.","İşte bu benimle senin aranda ayrılış (vaktidir). Şimdi sana sabredemediğin şeylerin açıklamasını haber vereceğim dedi.",""],[79,"أَمَّا ٱلسَّفِينَةُ فَكَانَتْ لِمَسَٰكِينَ يَعْمَلُونَ فِى ٱلْبَحْرِ فَأَرَدتُّ أَنْ أَعِيبَهَا وَكَانَ وَرَآءَهُم مَّلِكٌ يَأْخُذُ كُلَّ سَفِينَةٍ غَصْبًا","Ammas-safînatu fa kânat limasâkîna ya'malûna fil-bahri fa arattu an a'îbahâ, ve kâna varâ'ahum malikuy ya'huzu kulla safînatin gasbâ.","\"O gemi, denizde çalışan birtakım yoksul kimselere ait idi. Onu kusurlu kılmak istedim. (Çünkü) onların önünde, her (sağlam) gemiyi gasbetmekte olan bir kral vardı.''",""],[80,"وَأَمَّا ٱلْغُلَٰمُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَآ أَن يُرْهِقَهُمَا طُغْيَٰنًا وَكُفْرًا","Ve ammal-gulâmu fa kâna abavâhu mu'minayni fa haşînâ ay yurhikahumâ tugyânav ve kufrâ.","Gence gelince, onun anne ve babası Mümin idi. Gencin onları azgınlık ve küfre sürüklemesinden korktuk.",""],[81,"فَأَرَدْنَآ أَن يُبْدِلَهُمَا رَبُّهُمَا خَيْرًا مِّنْهُ زَكَوٰةً وَأَقْرَبَ رُحْمًا","Fa aradnâ ay yubdilahumâ rabbuhumâ hayram minhu zakâtav ve akraba ruhmâ.","'Böylece Rablerinin onlara, bu çocuğun yerine daha hayırlı ve daha merhametli bir çocuk vermesini diledik.''",""],[82,"وَأَمَّا ٱلْجِدَارُ فَكَانَ لِغُلَٰمَيْنِ يَتِيمَيْنِ فِى ٱلْمَدِينَةِ وَكَانَ تَحْتَهُۥ كَنزٌ لَّهُمَا وَكَانَ أَبُوهُمَا صَٰلِحًا فَأَرَادَ رَبُّكَ أَن يَبْلُغَآ أَشُدَّهُمَا وَيَسْتَخْرِجَا كَنزَهُمَا رَحْمَةً مِّن رَّبِّكَ وَمَا فَعَلْتُهُۥ عَنْ أَمْرِى ذَٰلِكَ تَأْوِيلُ مَا لَمْ تَسْطِع عَّلَيْهِ صَبْرًا","Ve ammal-cidâru fa kâna ligulâmayni yatîmayni fil-madînati ve kâna tahtahû kanzul lahumâ ve kâna abûhumâ sâlihâ, fa arâda rabbuka ay yablugâ aşuddahumâ ve yastahricâ kanzahumâ rahmatam mir rabbik, ve mâ fa'altuhû 'an amrî, zâlika ta'vîlu mâ lam tastî' 'alayhi sabrâ.","Duvar ise şehirdeki iki yetim gence aitti. Altında da onlara ait bir hazine vardı. Babaları salih insandı. Rabbin, onların olgunluk çağına ulaşmasını ve Rabbinden bir rahmet olarak hazinelerini çıkarmalarını istedi. Ben, bunları kendiliğimden yapmadım. İşte bu sabredemediğin şeylerin açıklamasıdır.",""],[83,"وَيَسْـَٔلُونَكَ عَن ذِى ٱلْقَرْنَيْنِ قُلْ سَأَتْلُوا۟ عَلَيْكُم مِّنْهُ ذِكْرًا","Ve yas'alûnaka 'an zil karnayn, kul sa'atlû 'alaykum minhu zikrâ.","Sana Zülkarneyn’i soruyorlar. De ki: Ona dair size bir haber okuyacağım.",""],[84,"إِنَّا مَكَّنَّا لَهُۥ فِى ٱلْأَرْضِ وَءَاتَيْنَٰهُ مِن كُلِّ شَىْءٍ سَبَبًا","Innâ makkannâ lahû fil-ardi ve âtaynâhu min kulli şay'in sababâ.","Biz onu yeryüzünde kudret sahibi kıldık ve kendisine her konuda (amacına ulaşabileceği) bir yol verdik.",""],[85,"فَأَتْبَعَ سَبَبًا","Fa atba'a sababâ.","O da bir yol tuttu.",""],[86,"حَتَّىٰٓ إِذَا بَلَغَ مَغْرِبَ ٱلشَّمْسِ وَجَدَهَا تَغْرُبُ فِى عَيْنٍ حَمِئَةٍ وَوَجَدَ عِندَهَا قَوْمًا قُلْنَا يَٰذَا ٱلْقَرْنَيْنِ إِمَّآ أَن تُعَذِّبَ وَإِمَّآ أَن تَتَّخِذَ فِيهِمْ حُسْنًا","Hattâ izâ balaga magribaş-şamsi vacadahâ tagrubu fî 'aynin hami'ativ ve vacada 'indahâ kavmâ, kulnâ yâ zal-karnayni immâ an tu'azziba ve immâ an tattahiza fîhim husnâ.","Nihayet Güneşin battığı yere ulaşınca onu kara çamurlu bir pınarda batıyor gördü. Onun yanında da bir kavim buldu. Dedik ki: “Ey Zülkarneyn! Onları istersen azaplandırabilirsin yahut onlara güzel muamelede de bulunabilirsin.''",""],[87,"قَالَ أَمَّا مَن ظَلَمَ فَسَوْفَ نُعَذِّبُهُۥ ثُمَّ يُرَدُّ إِلَىٰ رَبِّهِۦ فَيُعَذِّبُهُۥ عَذَابًا نُّكْرًا","Kâla ammâ man zalama fa savfa nu'azzibuhû summa yuraddu ilâ rabbihî fa yu'azzibuhû 'azâban nukrâ.","Dedi ki: “Kim zulmederse onu azaplandıracağız. Sonra o Rabbine döndürülecek, Rabbi de onu şiddetli bir azap ile azaplandıracak.",""],[88,"وَأَمَّا مَنْ ءَامَنَ وَعَمِلَ صَٰلِحًا فَلَهُۥ جَزَآءً ٱلْحُسْنَىٰ وَسَنَقُولُ لَهُۥ مِنْ أَمْرِنَا يُسْرًا","Ve ammâ man âmana ve 'amila sâlihan fa lahû cazâ'anil-husnâ, ve sanakûlu lahû min amrinâ yusrâ.","Fakat, kim de iman eder ve salih amel işlerse, ona da iyi bir mükâfat vardır. Ona emrimizden kolay olanı söyleriz.",""],[89,"ثُمَّ أَتْبَعَ سَبَبًا","Summa atba'a sababâ.","Sonra yine (doğuya doğru) bir yol tuttu.",""],[90,"حَتَّىٰٓ إِذَا بَلَغَ مَطْلِعَ ٱلشَّمْسِ وَجَدَهَا تَطْلُعُ عَلَىٰ قَوْمٍ لَّمْ نَجْعَل لَّهُم مِّن دُونِهَا سِتْرًا","Hattâ izâ balaga matli'aş-şamsi vacadahâ tatlu'u 'alâ kavmil lam nac'al lahum min dûnihâ sitrâ.","Güneşin doğduğu yere ulaşınca, onu kendileriyle Güneş arasına örtü koymadığımız bir millet üzerine doğar buldu.",""],[91,"كَذَٰلِكَ وَقَدْ أَحَطْنَا بِمَا لَدَيْهِ خُبْرًا","Kazâlik, ve kad ahatnâ bimâ ladayhi hubrâ.","İşte böyle. Onun yanında olan her şeyi büsbütün kuşatmıştık.",""],[92,"ثُمَّ أَتْبَعَ سَبَبًا","Summa atba'a sababâ.","Sonra bir yol tuttu.",""],[93,"حَتَّىٰٓ إِذَا بَلَغَ بَيْنَ ٱلسَّدَّيْنِ وَجَدَ مِن دُونِهِمَا قَوْمًا لَّا يَكَادُونَ يَفْقَهُونَ قَوْلًا","Hattâ izâ balaga baynas-saddayni vacada min dûnihimâ kavmal lâ yakâdûna yafkahûna kavlâ.","Nihayet iki dağ arasına ulaştığı zaman, önlerinde hemen hemen hiçbir söz anlamayan bir kavme rastladı.",""],[94,"قَالُوا۟ يَٰذَا ٱلْقَرْنَيْنِ إِنَّ يَأْجُوجَ وَمَأْجُوجَ مُفْسِدُونَ فِى ٱلْأَرْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجًا عَلَىٰٓ أَن تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سَدًّا","Kâlû yâ zal-karnayni inna ya'cûca ve ma'cûca mufsidûna fil-ardi fahal nac'alu laka harcan 'alâ an tac'alâ baynanâ ve baynahum saddâ.","Dediler ki: “Ey Zülkarneyn! Ye’cüc ve Me’cüc (adlı kavimler) yeryüzünde bozgunculuk yapmaktadırlar. Onlarla bizim aramıza bir engel yapman karşılığında sana bir vergi verelim mi?”",""],[95,"قَالَ مَا مَكَّنِّى فِيهِ رَبِّى خَيْرٌ فَأَعِينُونِى بِقُوَّةٍ أَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْمًا","Kâla mâ makkannî fîhi rabbî fa a'înûnî bikuvvatin ac'al baynakum ve baynahum radmâ.","“Rabbimin bana verdiği imkân ve kudret, (sizin vereceğiniz vergiden) daha hayırlıdır. Şimdi siz bana gücünüzle yardım edin de, sizinle onların arasına sağlam bir set yapayım” dedi.",""],[96,"ءَاتُونِى زُبَرَ ٱلْحَدِيدِ حَتَّىٰٓ إِذَا سَاوَىٰ بَيْنَ ٱلصَّدَفَيْنِ قَالَ ٱنفُخُوا۟ حَتَّىٰٓ إِذَا جَعَلَهُۥ نَارًا قَالَ ءَاتُونِىٓ أُفْرِغْ عَلَيْهِ قِطْرًا","Âtûnî zubaral-hadîd, hattâ izâ sâvâ baynas-sadafayni kâlanfuhû, hattâ izâ ca'alahû nârâ, kâla âtûnî ufrig 'alayhi kitrâ.","“Bana (yeterince) demir madeni getirin” dedi. İki yamacın arasındaki boşluğu (dağlarla) bir hizaya getirince; “Körükleyin!” dedi. Demiri eritip kor (gibi) yapınca da; “Bana erimiş bakır getirin, bunun üzerine boşaltayım.” dedi.",""],[97,"فَمَا ٱسْطَٰعُوٓا۟ أَن يَظْهَرُوهُ وَمَا ٱسْتَطَٰعُوا۟ لَهُۥ نَقْبًا","Famastâ'û ay yazharûhu ve mastatâ'û lahû nakbâ.","Artık onu ne aşabildiler, ne de delebildiler.",""],[98,"قَالَ هَٰذَا رَحْمَةٌ مِّن رَّبِّى فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ وَكَانَ وَعْدُ رَبِّى حَقًّا","Kâla hâzâ rahmatum mir rabbî, fa izâ câ'a ve'du rabbî ca'alahû dakkâ', ve kâna ve'du rabbî hakkâ.","“İşte bu, Rabbimden bir rahmettir. Rabbimin vaadi gelince onu dümdüz eder, Rabbimin vaadi haktır.” dedi.",""],[99,"وَتَرَكْنَا بَعْضَهُمْ يَوْمَئِذٍ يَمُوجُ فِى بَعْضٍ وَنُفِخَ فِى ٱلصُّورِ فَجَمَعْنَٰهُمْ جَمْعًا","Ve taraknâ ba'dahum yavma'iziy yamûcu fî ba'div ve nufiha fis-sûri fa cama'nâhum cam'â.","Günü gelince biz onları bırakırız, dalga dalga birbirlerine karışırlar. Sûr’a üflendiği zaman da hepsini bir araya toplarız.",""],[100,"وَعَرَضْنَا جَهَنَّمَ يَوْمَئِذٍ لِّلْكَٰفِرِينَ عَرْضًا","Ve 'aradnâ cahannama yavma'izil lil-kâfirîna 'ardâ.","O gün Cehennem'i kâfirlerin karşısına getirir, sunarız.",""],[101,"ٱلَّذِينَ كَانَتْ أَعْيُنُهُمْ فِى غِطَآءٍ عَن ذِكْرِى وَكَانُوا۟ لَا يَسْتَطِيعُونَ سَمْعًا","Allazîna kânat a'yunuhum fî gitâ'in 'an zikrî ve kânû lâ yastatî'ûna sam'â.","Onlar, gözleri beni anmaktan perdeli olan ve dinleyecek güçleri de olmayan kimselerdi.",""],[102,"أَفَحَسِبَ ٱلَّذِينَ كَفَرُوٓا۟ أَن يَتَّخِذُوا۟ عِبَادِى مِن دُونِىٓ أَوْلِيَآءَ إِنَّآ أَعْتَدْنَا جَهَنَّمَ لِلْكَٰفِرِينَ نُزُلًا","Afahasibal-lazîna kafarû ay yattahizû 'ibâdî min dûnî avliyâ', innâ a'tadnâ cahannama lil-kâfirîna nuzulâ.","Kâfirler, beni bırakıp da kullarımı veliler/ilahlar edineceklerini mi sandılar? Biz, Cehennem'i kâfirler için konak olarak hazırladık.",""],[103,"قُلْ هَلْ نُنَبِّئُكُم بِٱلْأَخْسَرِينَ أَعْمَٰلًا","Kul hal nunabbi'ukum bil-ahsarîna a'mâlâ.","(Ey Muhammed!) De ki: Amelleri bakımından hüsranda olan kimseleri size haber verelim mi?",""],[104,"ٱلَّذِينَ ضَلَّ سَعْيُهُمْ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَهُمْ يَحْسَبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعًا","Al-lazîna dalla sa'yuhum fil-hayâtid-dun-yâ ve hum yahsabûna annahum yuhsinûna sun'â.","Onlar, dünya hayatındaki bütün amelleri boşa gitmişken, kendilerini gerçekte güzel iş yapmakta sanan kimselerdir.",""],[105,"أُو۟لَٰٓئِكَ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِ رَبِّهِمْ وَلِقَآئِهِۦ فَحَبِطَتْ أَعْمَٰلُهُمْ فَلَا نُقِيمُ لَهُمْ يَوْمَ ٱلْقِيَٰمَةِ وَزْنًا","Ulâ'ikal-lazîna kafarû bi'âyâti rabbihim ve likâ'ihî fa habitat a'mâluhum falâ nukîma lahum yavmal-kiyâmati vaznâ.","İşte onlar, rablerinin ayetlerini ve O’na kavuşmayı inkâr eden, bu yüzden amelleri boşa gitmiş olanlardır. Bu sebeple biz kıyamet gününde onların (dünyadaki) amellerine değer vermeyiz.",""],[106,"ذَٰلِكَ جَزَآؤُهُمْ جَهَنَّمُ بِمَا كَفَرُوا۟ وَٱتَّخَذُوٓا۟ ءَايَٰتِى وَرُسُلِى هُزُوًا","Zâlika cazâ'uhum cahannamu bimâ kafarû vattahazû âyâtî ve rusulî huzuvâ.","İşte; kâfir oldukları, âyetlerimi ve rasûllerimi alaya aldıkları için onların cezası Cehennem'dir.",""],[107,"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ كَانَتْ لَهُمْ جَنَّٰتُ ٱلْفِرْدَوْسِ نُزُلًا","Innal-lazîna âmanû ve 'amilus-sâlihâti kânat lahum cannâtul-firdavsi nuzulâ.","Gerçekten iman edip salih ameller işleyenlerin ise konakları Firdevs Cennetleri'dir.",""],[108,"خَٰلِدِينَ فِيهَا لَا يَبْغُونَ عَنْهَا حِوَلًا","Hâlidîna fîhâ lâ yabgûna 'anhâ hivalâ.","Onlar orada ebedî kalıcıdırlar. Oradan ayrılmak da istemezler.",""],[109,"قُل لَّوْ كَانَ ٱلْبَحْرُ مِدَادًا لِّكَلِمَٰتِ رَبِّى لَنَفِدَ ٱلْبَحْرُ قَبْلَ أَن تَنفَدَ كَلِمَٰتُ رَبِّى وَلَوْ جِئْنَا بِمِثْلِهِۦ مَدَدًا","Kul lav kânal-bahru midâdal likalimâti rabbî lanafidal-bahru kabla an tanfada kalimâtu rabbî ve lav ci'nâ bimislihî madadâ.","De ki: “Rabbimin sözleri için deniz(ler) mürekkep olsa, buna destek olarak bir o kadar daha katsak Rabbimin sözleri tükenmeden o deniz(ler) tükenir.”",""],[110,"قُلْ إِنَّمَآ أَنَا۠ بَشَرٌ مِّثْلُكُمْ يُوحَىٰٓ إِلَىَّ أَنَّمَآ إِلَٰهُكُمْ إِلَٰهٌ وَٰحِدٌ فَمَن كَانَ يَرْجُوا۟ لِقَآءَ رَبِّهِۦ فَلْيَعْمَلْ عَمَلًا صَٰلِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِۦٓ أَحَدًۢا","Kul innamâ ana başarum mislukum yûhâ ilayya annamâ ilâhukum ilâhuv vâhid, faman kâna yarcû likâ'a rabbihî falya'mal 'amalan sâlihav ve lâ yuşrik bi'ibâdati rabbihî ahadâ.","De ki: \"Ben de ancak sizin gibi bir insanım! Bana ilahınızın sadece tek ilah olduğu vahyedi
