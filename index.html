mâ hum fî şikâk, fasayakfîkahumullâh, ve huvas-samî'ul-'alîm.","Eğer onlar (Yahudi ve Hıristiyanlar) böyle sizin iman ettiğiniz gibi iman ederlerse, gerçekten doğru yolu bulmuş olurlar; yüz çevirirlerse onlar elbette derin bir ayrılığa düşmüş olurlar. Allah, onlara karşı sana yeter. O, hakkıyla işitendir, hakkıyla bilendir.",""],[138,"صِبْغَةَ ٱللَّهِ وَمَنْ أَحْسَنُ مِنَ ٱللَّهِ صِبْغَةً وَنَحْنُ لَهُۥ عَٰبِدُونَ","Sibgatallâh, ve man ahsanu minallâhi sibgatav ve nahnu lahû 'âbidûn.","Allah’ın boyası (dini ile boyanmaya bakın) Kimin boyası/dini Allah’ınkinden daha güzel olabilir? Biz yalnız ona ibadet edenleriz.''",""],[139,"قُلْ أَتُحَآجُّونَنَا فِى ٱللَّهِ وَهُوَ رَبُّنَا وَرَبُّكُمْ وَلَنَآ أَعْمَٰلُنَا وَلَكُمْ أَعْمَٰلُكُمْ وَنَحْنُ لَهُۥ مُخْلِصُونَ","Kul atuhâccûnanâ fillâhi ve huva rabbunâ ve rabbukum, ve lanâ a'mâlunâ ve lakum a'mâlukum, ve nahnu lahû muhlisûn.","Onlara (Ehl-i kitaba) de ki: ''Allah hakkında mı bizimle tartışıp duruyorsunuz? Halbuki O, bizim de Rabbimiz, sizin de Rabbinizdir. Bizim yaptıklarımız bize, sizin yaptıklarınız da size aittir. Biz O’na gönülden bağlanmış kimseleriz.''",""],[140,"أَمْ تَقُولُونَ إِنَّ إِبْرَٰهِـۧمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ وَيَعْقُوبَ وَٱلْأَسْبَاطَ كَانُوا۟ هُودًا أَوْ نَصَٰرَىٰ قُلْ ءَأَنتُمْ أَعْلَمُ أَمِ ٱللَّهُ وَمَنْ أَظْلَمُ مِمَّن كَتَمَ شَهَٰدَةً عِندَهُۥ مِنَ ٱللَّهِ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ","Am takûlûna inna ibrâhîma ve ismâ'îla ve ishâka ve ya'kûba vel-asbâta kânû hûdan av nasârâ, kul a'antum a'lamu amillâh, ve man azlamu mimman katama şahâdatan 'indahû minallâh, ve mallâhu bigâfilin 'ammâ ta'malûn.","Yoksa siz, İbrahim’in, İsmail’in, İshak’ın, Ya'kûb'un ve torunlarının, Yahudi yahut Hristiyan olduklarını mı söylüyorsunuz? (Onlara) De ki: Siz mi daha iyi bilirsiniz, yoksa Allah mı? Allah tarafından kendisine bildirilen gerçeği gizleyenden daha zalim kim vardır? Allah yaptıklarınızdan gâfil değildir.",""],[141,"تِلْكَ أُمَّةٌ قَدْ خَلَتْ لَهَا مَا كَسَبَتْ وَلَكُم مَّا كَسَبْتُمْ وَلَا تُسْـَٔلُونَ عَمَّا كَانُوا۟ يَعْمَلُونَ","Tilka ummatun kad halat, lahâ mâ kasabat ve lakum mâ kasabtum, ve lâ tus'alûna 'ammâ kânû ya'malûn.","Onlar bir ümmetti gelip, geçti. Onların kazandıkları kendilerinin, sizin kazandıklarınız sizindir. Siz onların yaptıklarından sorumlu tutulacak değilsiniz.",""],[142,"سَيَقُولُ ٱلسُّفَهَآءُ مِنَ ٱلنَّاسِ مَا وَلَّىٰهُمْ عَن قِبْلَتِهِمُ ٱلَّتِى كَانُوا۟ عَلَيْهَا قُل لِّلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ","Sayakûlus-sufahâ'u minan-nâsi mâ vallâhum 'an kiblatihimul-latî kânû 'alayhâ, kul lillâhil-maşriku vel-magrib, yahdî may yaşâ'u ilâ sirâtim mustakîm.","İnsanlardan bazı akılsızlar şöyle diyeceklerdir: \"Onları şimdiye kadar yöneldikleri kıblelerinden çeviren nedir?\" De ki: \"Doğu da, batı da Allah'ındır. O, dilediğini doğru yola iletir.\"",""],[143,"وَكَذَٰلِكَ جَعَلْنَٰكُمْ أُمَّةً وَسَطًا لِّتَكُونُوا۟ شُهَدَآءَ عَلَى ٱلنَّاسِ وَيَكُونَ ٱلرَّسُولُ عَلَيْكُمْ شَهِيدًا وَمَا جَعَلْنَا ٱلْقِبْلَةَ ٱلَّتِى كُنتَ عَلَيْهَآ إِلَّا لِنَعْلَمَ مَن يَتَّبِعُ ٱلرَّسُولَ مِمَّن يَنقَلِبُ عَلَىٰ عَقِبَيْهِ وَإِن كَانَتْ لَكَبِيرَةً إِلَّا عَلَى ٱلَّذِينَ هَدَى ٱللَّهُ وَمَا كَانَ ٱللَّهُ لِيُضِيعَ إِيمَٰنَكُمْ إِنَّ ٱللَّهَ بِٱلنَّاسِ لَرَءُوفٌ رَّحِيمٌ","Ve kazâlika ca'alnâkum ummatav vasatal litakûnû şuhadâ'a 'alan-nâsi ve yakûnar-rasûlu 'alaykum şahîdâ, ve mâ ca'alnal-kiblatal-latî kunta 'alayhâ illâ lina'lama may yattabi'ur-rasûla mimmay yankalibu 'alâ 'akibayh, ve in kânat lakabîratan illâ 'alal-lazîna hadallâh, ve mâ kânallâhu liyudî'a îmânakum, innallâha bin-nâsi lara'ûfur rahîm.","Böylece, sizler insanlara birer şahit olasınız ve Peygamber de size şahit olsun diye, sizi orta yollu bir ümmet kıldık. Her ne kadar Allah’ın doğru yolu gösterdiği kimselerden başkasına bu ağır gelse de biz, yönelmekte olduğun kıbleyi ancak; Peygamber’e uyanlarla, yüz çevirip geri dönenleri ayırt edelim diye kıble yaptık. Allah, imanınızı (namazınızı) boşa çıkaracak değildir. Şüphesiz Allah, insanlara karşı çok şefkatli ve çok merhametlidir.",""],[144,"قَدْ نَرَىٰ تَقَلُّبَ وَجْهِكَ فِى ٱلسَّمَآءِ فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضَىٰهَا فَوَلِّ وَجْهَكَ شَطْرَ ٱلْمَسْجِدِ ٱلْحَرَامِ وَحَيْثُ مَا كُنتُمْ فَوَلُّوا۟ وُجُوهَكُمْ شَطْرَهُۥ وَإِنَّ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ لَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا يَعْمَلُونَ","Kad narâ takallubaka vachika fis-samâ', fa lanuvalliyannaka kiblatan tardâhâ, favalli vachaka şatral-mascidil-harâm, ve haysumâ kuntum favallû vucûhakum şatrah, ve innal-lazîna ûtul-kitâba laya'lamûna annahul-hakku mir rabbihim, ve mallâhu bigâfilin 'ammâ ya'malûn.","(Ey Muhammed!) Biz, senin yüzünü çok defa semaya doğru çevirip durduğunu görüyoruz. Elbette seni razı olacağın bir kıbleye döndüreceğiz. Artık yüzünü Mescid-i Haram tarafına çevir. (Ey Müslümanlar!) Sizler nerede olursanız olun, (namazda) yüzünüzü ona doğru çevirin. Şüphesiz kendilerine kitap verilenler de, bunun Rableri katından gelmiş bir gerçek olduğunu bilmektedirler. Allah onların yaptıklarından habersiz değildir.",""],[145,"وَلَئِنْ أَتَيْتَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ بِكُلِّ ءَايَةٍ مَّا تَبِعُوا۟ قِبْلَتَكَ وَمَآ أَنتَ بِتَابِعٍ قِبْلَتَهُمْ وَمَا بَعْضُهُم بِتَابِعٍ قِبْلَةَ بَعْضٍ وَلَئِنِ ٱتَّبَعْتَ أَهْوَآءَهُم مِّنۢ بَعْدِ مَا جَآءَكَ مِنَ ٱلْعِلْمِ إِنَّكَ إِذًا لَّمِنَ ٱلظَّٰلِمِينَ","Ve la'in ataytal-lazîna ûtul-kitâba bikulli âyatim mâ tabi'û kiblatak, ve mâ anta bitâbi'in kiblatahum, ve mâ ba'duhum bitâbi'in kiblata ba'd, ve la'inittaba'ta ahvâ'ahum mim ba'di mâ câ'aka minal-'ilm, innaka izal laminaz-zâlimîn.","Andolsun ki sen, kendilerine kitap verilmiş olanlara her türlü delili de getirsen, onlar yine de senin kıblene uymazlar. Sen de onların kıblesine uyacak değilsin. Zaten onlar da birbirlerinin kıblesine uymazlar. Andolsun ki, eğer sana gelen bunca ilimden sonra onların arzularına uyarsan, şüphesiz o zaman zalimlerden olursun.",""],[146,"ٱلَّذِينَ ءَاتَيْنَٰهُمُ ٱلْكِتَٰبَ يَعْرِفُونَهُۥ كَمَا يَعْرِفُونَ أَبْنَآءَهُمْ وَإِنَّ فَرِيقًا مِّنْهُمْ لَيَكْتُمُونَ ٱلْحَقَّ وَهُمْ يَعْلَمُونَ","Allazîna âtaynâhumul-kitâba ya'rifûnahû kamâ ya'rifûna abnâ'ahum, ve inna farîkam minhum layaktumûnal-hakka ve hum ya'lamûn.","Kendilerine kitap verdiklerimiz, peygamberi, kendi çocuklarını tanıdıkları gibi tanırlar. Buna rağmen onların bir kısmı, gerçeği bile bile gizlerler.",""],[147,"ٱلْحَقُّ مِن رَّبِّكَ فَلَا تَكُونَنَّ مِنَ ٱلْمُمْتَرِينَ","Al-hakku mir rabbika falâ takûnanna minal-mumtarîn.","Gerçek, senin Rabbinden gelendir. Öyleyse sakın şüpheye düşenlerden olma!",""],[148,"وَلِكُلٍّ وِجْهَةٌ هُوَ مُوَلِّيهَا فَٱسْتَبِقُوا۟ ٱلْخَيْرَٰتِ أَيْنَ مَا تَكُونُوا۟ يَأْتِ بِكُمُ ٱللَّهُ جَمِيعًا إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Ve likulliv vichatun huva muvallîhâ fastabikul-hayrât, ayna mâ takûnû ya'ti bikumullâhu camî'â, innallâha 'alâ kulli şay'in kadîr.","Her bir ümmetin yöneldiği bir yön vardır. Öyleyse sizler, hayır işlerinde yarışın. Nerede olursanız olun, sonunda Allah sizi huzurunda toplayacaktır. Şüphesiz Allah’ın her şeye gücü yeter.",""],[149,"وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ ٱلْمَسْجِدِ ٱلْحَرَامِ وَإِنَّهُۥ لَلْحَقُّ مِن رَّبِّكَ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ","Ve min haysu haracta favalli vachaka şatral-mascidil-harâm, ve innahû lal-hakku mir rabbik, ve mallâhu bigâfilin 'ammâ ta'malûn.","Nereden yola çıkarsan çık, namazda yüzünü Mescid-i Haram'a doğru çevir. Şüphesiz bu, Rabbinden gelen bir gerçektir. Allah, sizin yaptıklarınızdan asla habersiz değildir.",""],[150,"وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ ٱلْمَسْجِدِ ٱلْحَرَامِ وَحَيْثُ مَا كُنتُمْ فَوَلُّوا۟ وُجُوهَكُمْ شَطْرَهُۥ لِئَلَّا يَكُونَ لِلنَّاسِ عَلَيْكُمْ حُجَّةٌ إِلَّا ٱلَّذِينَ ظَلَمُوا۟ مِنْهُمْ فَلَا تَخْشَوْهُمْ وَٱخْشَوْنِى وَلِأُتِمَّ نِعْمَتِى عَلَيْكُمْ وَلَعَلَّكُمْ تَهْتَدُونَ","Ve min haysu haracta fa valli vachaka şatral-mascidil-harâm, ve haysumâ kuntum favallû vucûhakum şatrah, li'allâ yakûna lin-nâsi 'alaykum huccatun illal-lazîna zalamû minhum, falâ tahşavhum vahşavnî ve li'utimma ni'matî 'alaykum ve la'allakum tahtadûn.","(Ey Rasûlüm!) Nereden yola çıkarsan çık, (namazda) yüzünü Mescid-i Haram yönüne çevir. Siz de nerede olursanız olun, yüzünüzü o yöne doğru çeviriniz ki; zalim olanları müstesna, insanların aleyhinizde bir delili bulunmasın. Onlardan korkmayın, sadece benden korkun. Böylece size olan nimetimi tamamlayayım da belki doğru yolu bulursunuz.",""],[151,"كَمَآ أَرْسَلْنَا فِيكُمْ رَسُولًا مِّنكُمْ يَتْلُوا۟ عَلَيْكُمْ ءَايَٰتِنَا وَيُزَكِّيكُمْ وَيُعَلِّمُكُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ وَيُعَلِّمُكُم مَّا لَمْ تَكُونُوا۟ تَعْلَمُونَ","Kamâ arsalnâ fîkum rasûlam minkum yatlû 'alaykum âyâtinâ ve yuzakkîkum ve yu'allimukumul-kitâba vel-hikmata ve yu'allimukum mâ lam takûnû ta'lamûn.","Nitekim içinizden size ayetlerimizi okuyan, sizi tertemiz yapan, size kitabı, hikmeti ve bilmediğiniz şeyleri öğreten, sizden bir elçi gönderdik.",""],[152,"فَٱذْكُرُونِىٓ أَذْكُرْكُمْ وَٱشْكُرُوا۟ لِى وَلَا تَكْفُرُونِ","Fazkurûnî azkurkum vaşkurû lî ve lâ takfurûn.","O halde yalnız beni anın ki, ben de sizi anayım. Bana şükredin ve sakın bana nankörlük etmeyin!",""],[153,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ","Yâ ayyuhal-lazîna âmanusta'înû bis-sabri vas-salâh, innallâha ma'as-sâbirîn.","Ey iman edenler! Sabrederek ve namaz kılarak Allah'tan yardım dileyin! Şüphesiz ki Allah, sabredenlerle beraberdir.",""],[154,"وَلَا تَقُولُوا۟ لِمَن يُقْتَلُ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتٌۢ بَلْ أَحْيَآءٌ وَلَٰكِن لَّا تَشْعُرُونَ","Ve lâ takûlû limay yuktalu fî sabîlillâhi amvât, bal ahyâ'uv ve lâkil lâ taş'urûn.","Allah yolunda öldürülenlere “ölüler” demeyin. Bilakis onlar diridirler, fakat siz anlayamazsınız.",""],[155,"وَلَنَبْلُوَنَّكُم بِشَىْءٍ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ وَنَقْصٍ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ وَبَشِّرِ ٱلصَّٰبِرِينَ","Ve lanabluvannakum bişay'im minal-havfi vel-cû'i ve nakasim minal-amvâli vel-anfusi vas-samarât, ve başşiris-sâbirîn.","Andolsun ki sizi, biraz korku, biraz açlık, biraz da mallardan, canlardan ve mahsullerden yana eksiklikle imtihan edeceğiz. Sabredenleri müjdele!",""],[156,"ٱلَّذِينَ إِذَآ أَصَٰبَتْهُم مُّصِيبَةٌ قَالُوٓا۟ إِنَّا لِلَّهِ وَإِنَّآ إِلَيْهِ رَٰجِعُونَ","Allazîna izâ asâbathum musîbah, kâlû innâ lillâhi ve innâ ilayhi râci'ûn.","Onlar ki, başlarına bir musibet geldiği zaman \"Muhakkak biz Allah'a aitiz ve şüphesiz O'na geri döneceğiz\" derler.",""],[157,"أُو۟لَٰٓئِكَ عَلَيْهِمْ صَلَوَٰتٌ مِّن رَّبِّهِمْ وَرَحْمَةٌ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُهْتَدُونَ","Ulâ'ika 'alayhim salavâtum mir rabbihim ve rahmah, ve ulâ'ika humul-muhtadûn.","Onlar, Rablerinden övgü ve rahmete mazhar olanlardır. İşte onlar, doğru yolu bulanlardır.",""],[158,"إِنَّ ٱلصَّفَا وَٱلْمَرْوَةَ مِن شَعَآئِرِ ٱللَّهِ فَمَنْ حَجَّ ٱلْبَيْتَ أَوِ ٱعْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ أَن يَطَّوَّفَ بِهِمَا وَمَن تَطَوَّعَ خَيْرًا فَإِنَّ ٱللَّهَ شَاكِرٌ عَلِيمٌ","Innas-safâ vel-marvata min şa'â'irillâh, faman haccal-bayta avi'tamara falâ cunâha 'alayhi ay yattavvafa bihimâ, ve man tatavva'a hayran fa innallâha şâkirun 'alîm.","Şüphesiz Safâ ve Merve Allah'ın nişanelerindendir. Her kim Kâbe’de hac veya umre yaparsa, o ikisini tavaf etmesinde de bir sakınca yoktur. Kim gönülden bir iyilik yaparsa, muhakkak ki Allah şükrün karşılığını veren ve her şeyi bilendir.",""],[159,"إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلْنَا مِنَ ٱلْبَيِّنَٰتِ وَٱلْهُدَىٰ مِنۢ بَعْدِ مَا بَيَّنَّٰهُ لِلنَّاسِ فِى ٱلْكِتَٰبِ أُو۟لَٰٓئِكَ يَلْعَنُهُمُ ٱللَّهُ وَيَلْعَنُهُمُ ٱللَّٰعِنُونَ","Innal-lazîna yaktumûna mâ anzalnâ minal-bayyinâti vel-hudâ mim ba'di mâ bayyannâhu lin-nâsi fil-kitâb, ulâ'ika yal'anuhumullâhu ve yal'anuhumul-lâ'inûn.","İndirdiğimiz apaçık delilleri ve dosdoğru yolu, kitapta insanlara açıkladıktan sonra gizleyenlere gelince, onlara Allah da lanet eder, bütün lanet ediciler de lanet ederler.",""],[160,"إِلَّا ٱلَّذِينَ تَابُوا۟ وَأَصْلَحُوا۟ وَبَيَّنُوا۟ فَأُو۟لَٰٓئِكَ أَتُوبُ عَلَيْهِمْ وَأَنَا ٱلتَّوَّابُ ٱلرَّحِيمُ","Illal-lazîna tâbû ve aslahû ve bayyanû fa'ulâ'ika atûbu 'alayhim, ve anat-tavvâbur-rahîm.","Ancak tövbe edip ıslah edenler ve gizlediklerini beyan edenler bundan müstesnadır. Çünkü ben onların tövbelerini kabul ederim. Zira ben tövbeleri çokça kabul edip pek çok merhamet edenim.",""],[161,"إِنَّ ٱلَّذِينَ كَفَرُوا۟ وَمَاتُوا۟ وَهُمْ كُفَّارٌ أُو۟لَٰٓئِكَ عَلَيْهِمْ لَعْنَةُ ٱللَّهِ وَٱلْمَلَٰٓئِكَةِ وَٱلنَّاسِ أَجْمَعِينَ","Innal-lazîna kafarû ve mâtû ve hum kuffârun ulâ'ika 'alayhim la'natullâhi vel-malâ'ikati van-nâsi acma'în.","İnkâr etmiş ve kâfir olarak can vermiş olanlara gelince, işte Allah'ın, meleklerin ve bütün insanların laneti onların üzerinedir.",""],[162,"خَٰلِدِينَ فِيهَا لَا يُخَفَّفُ عَنْهُمُ ٱلْعَذَابُ وَلَا هُمْ يُنظَرُونَ","Hâlidîna fîhâ, lâ yuhaffafu 'anhumul-'azâbu ve lâ hum yunzarûn.","Onlar ebedî olarak lanet içinde kalırlar. Artık onların ne azapları hafifletilir, ne de bir mühlet verilir.",""],[163,"وَإِلَٰهُكُمْ إِلَٰهٌ وَٰحِدٌ لَّآ إِلَٰهَ إِلَّا هُوَ ٱلرَّحْمَٰنُ ٱلرَّحِيمُ","Ve ilâhukum ilâhuv vâhid, lâ ilâha illâ huvar-rahmânur-rahîm.","Sizin ilahınız tek bir ilahtır. Ondan bir başka hak ilah yoktur. O, Rahmân ve Rahîm olandır.",""],[164,"إِنَّ فِى خَلْقِ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَٰفِ ٱلَّيْلِ وَٱلنَّهَارِ وَٱلْفُلْكِ ٱلَّتِى تَجْرِى فِى ٱلْبَحْرِ بِمَا يَنفَعُ ٱلنَّاسَ وَمَآ أَنزَلَ ٱللَّهُ مِنَ ٱلسَّمَآءِ مِن مَّآءٍ فَأَحْيَا بِهِ ٱلْأَرْضَ بَعْدَ مَوْتِهَا وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٍ وَتَصْرِيفِ ٱلرِّيَٰحِ وَٱلسَّحَابِ ٱلْمُسَخَّرِ بَيْنَ ٱلسَّمَآءِ وَٱلْأَرْضِ لَـَٔايَٰتٍ لِّقَوْمٍ يَعْقِلُونَ","Inna fî halkis-samâvâti vel-ardi vahtilâfil-layli van-nahâri vel-fulkil-latî tacrî fil-bahri bimâ yanfa'un-nâsa ve mâ anzalallâhu minas-samâ'i mim mâ'in fa ahyâ bihil-arda ba'da mavtihâ ve bassa fîhâ min kulli dâbbah, ve tasrîfir-riyâhi vas-sahâbil-musahhari baynas-samâ'i vel-ardi la'âyâtil likavmiy ya'kilûn.","Şüphesiz göklerin ve yerin yaratılışında, gece ve gündüzün birbirinin ardınca gelişinde, insanların faydalanacağı şeyleri denizde taşıyıp giden gemilerde, Allah'ın gökten indirdirerek ölmüş olan yeryüzünü dirilttiği suda, ardından orada bütün hayvanları yaymasında, gök ile yer arasında Allah'ın emrine boyun eğmiş rüzgârları ve bulutlar yönlendirmesinde, aklını kullanan bir topluluk için nice deliller vardır.",""],[165,"وَمِنَ ٱلنَّاسِ مَن يَتَّخِذُ مِن دُونِ ٱللَّهِ أَندَادًا يُحِبُّونَهُمْ كَحُبِّ ٱللَّهِ وَٱلَّذِينَ ءَامَنُوٓا۟ أَشَدُّ حُبًّا لِّلَّهِ وَلَوْ يَرَى ٱلَّذِينَ ظَلَمُوٓا۟ إِذْ يَرَوْنَ ٱلْعَذَابَ أَنَّ ٱلْقُوَّةَ لِلَّهِ جَمِيعًا وَأَنَّ ٱللَّهَ شَدِيدُ ٱلْعَذَابِ","Ve minan-nâsi may yattahizu min dûnillâhi andâday yuhibbûnahum kahubbillâh, vel-lazîna âmanû aşaddu hubbal lillâh, ve lav yaral-lazîna zalamû iz yaravnal-'azâb, annal-kuvvata lillâhi camî'â, ve annallâha şadîdul-'azâb.","İnsanların bir kısmı da, Allah'tan başkalarını O'na denk tutarak, onları, Allah'ı sever gibi severler. İman edenlerin Allah'a olan sevgileri ise (onlarınkinden) daha fazladır. Keşke o zalimler, azapla yüz yüze geldiklerinde anlayacakları gibi bütün gücün yalnızca Allah'ın olduğunu ve Allah'ın azabının çok çetin olduğunu bir bilselerdi.",""],[166,"إِذْ تَبَرَّأَ ٱلَّذِينَ ٱتُّبِعُوا۟ مِنَ ٱلَّذِينَ ٱتَّبَعُوا۟ وَرَأَوُا۟ ٱلْعَذَابَ وَتَقَطَّعَتْ بِهِمُ ٱلْأَسْبَابُ","Iz tabarra'al-lazînattubi'û minal-lazînattaba'û ve ra'avul-'azâba ve takatta'at bihimul-asbâb.","O zaman kendilerine uyulanlar, kendilerine uyanlardan uzaklaşacak, azabı görecekler ve aralarındaki bağlar da kopmuş olacaktır.",""],[167,"وَقَالَ ٱلَّذِينَ ٱتَّبَعُوا۟ لَوْ أَنَّ لَنَا كَرَّةً فَنَتَبَرَّأَ مِنْهُمْ كَمَا تَبَرَّءُوا۟ مِنَّا كَذَٰلِكَ يُرِيهِمُ ٱللَّهُ أَعْمَٰلَهُمْ حَسَرَٰتٍ عَلَيْهِمْ وَمَا هُم بِخَٰرِجِينَ مِنَ ٱلنَّارِ","Ve kâlal-lazînattaba'û lav anna lanâ karratan fa natabarra'a minhum, kamâ tabarra'û minnâ, kazâlika yurîhimullâhu a'mâlahum hasarâtin 'alayhim, ve mâ hum bihâricîna minan-nâr.","(Kötülere) Uyanlar şöyle derler: “Keşke dünyaya bir dönüşümüz olsaydı da onların şimdi bizden uzaklaştıkları gibi, biz de onlardan uzaklaşsaydık.” Böylece Allah, onlara işledikleri fiilleri pişmanlık kaynağı olarak gösterir. Onlar ateşten çıkacak da değillerdir.",""],[168,"يَٰٓأَيُّهَا ٱلنَّاسُ كُلُوا۟ مِمَّا فِى ٱلْأَرْضِ حَلَٰلًا طَيِّبًا وَلَا تَتَّبِعُوا۟ خُطُوَٰتِ ٱلشَّيْطَٰنِ إِنَّهُۥ لَكُمْ عَدُوٌّ مُّبِينٌ","Yâ ayyuhan-nâsu kulû mimmâ fil-ardi halâlan tayyibâ, ve lâ tattabi'û hutuvâtiş-şaytân, innahû lakum 'aduvvum mubîn.","Ey insanlar! Yeryüzündeki temiz ve helal şeylerden yiyin. Şeytan'ın adımlarına uymayın! Zira o sizin için apaçık bir düşmandır.",""],[169,"إِنَّمَا يَأْمُرُكُم بِٱلسُّوٓءِ وَٱلْفَحْشَآءِ وَأَن تَقُولُوا۟ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ","Innamâ ya'murukum bis-sû'i vel-fahşâ'i ve an takûlû 'alallâhi mâ lâ ta'lamûn.","Muhakkak ki o size, kötülüğü, hayâsızlığı ve Allah hakkında bilmediğiniz şeyleri söylemenizi emreder.",""],[170,"وَإِذَا قِيلَ لَهُمُ ٱتَّبِعُوا۟ مَآ أَنزَلَ ٱللَّهُ قَالُوا۟ بَلْ نَتَّبِعُ مَآ أَلْفَيْنَا عَلَيْهِ ءَابَآءَنَآ أَوَلَوْ كَانَ ءَابَآؤُهُمْ لَا يَعْقِلُونَ شَيْـًٔا وَلَا يَهْتَدُونَ","Ve izâ kîla lahumuttabi'û mâ anzalallâhu kâlû bal nattabi'u mâ alfaynâ 'alayhi âbâ'anâ, avalav kâna âbâ'uhum lâ ya'kilûna şay'av ve lâ yahtadûn.","Onlara, (Müşriklere) “Allah'ın indirdiği kitaba uyunuz!” dendiği zaman, “Hayır, biz atalarımızın yoluna uyarız” derler. Ya ataları akıl erdiremeyen ve doğru yolda olmayan kimseler idiyseler?",""],[171,"وَمَثَلُ ٱلَّذِينَ كَفَرُوا۟ كَمَثَلِ ٱلَّذِى يَنْعِقُ بِمَا لَا يَسْمَعُ إِلَّا دُعَآءً وَنِدَآءً صُمٌّۢ بُكْمٌ عُمْىٌ فَهُمْ لَا يَعْقِلُونَ","Ve masalul-lazîna kafarû kamasalil-lazî yan'iku bimâ lâ yasma'u illâ du'â'av ve nidâ'â, summum bukmun 'umyun fahum lâ ya'kilûn.","(Hidayet çağrısına kulak vermeyen) kâfirlerin durumu, çobanların çağırdığı fakat, onun bağırıp çağırışından başka bir şey işitmeyen (bir şey anlamayan) hayvanların durumu gibidir. Onlar öyle sağır, dilsiz ve körlerdir ki akıllarını kullanmazlar.",""],[172,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُلُوا۟ مِن طَيِّبَٰتِ مَا رَزَقْنَٰكُمْ وَٱشْكُرُوا۟ لِلَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ","Yâ ayyuhal-lazîna âmanû kulû min tayyibâti mâ razaknâkum vaşkurû lillâhi in kuntum iyyâhu ta'budûn.","Ey iman edenler! Size verdiğimiz rızıkların temiz olanlarından yiyin ve eğer sadece Allah'a ibadet ediyorsanız, O'na şükredin.",""],[173,"إِنَّمَا حَرَّمَ عَلَيْكُمُ ٱلْمَيْتَةَ وَٱلدَّمَ وَلَحْمَ ٱلْخِنزِيرِ وَمَآ أُهِلَّ بِهِۦ لِغَيْرِ ٱللَّهِ فَمَنِ ٱضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَلَآ إِثْمَ عَلَيْهِ إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ","Innamâ harrama 'alaykumul-maytata vad-dama ve lahmal-hinzîri ve mâ uhilla bihî ligayrillâh, fa manidturra gayra bâgiv ve lâ 'âdin falâ isma 'alayh, innallâha gafûrur rahîm.","Allah size, ölüyü, kanı, domuz etini ve Allah'tan başkası adına kesilen hayvanları haram kıldı. Kim bunları yemeye mecbur kalırsa, taşkınlık etmemek, aşırı gitmemek şartıyla bunlardan yemesinde bir günah yoktur. Şüphesiz Allah çok bağışlayıcı ve merhametlidir.",""],[174,"إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلَ ٱللَّهُ مِنَ ٱلْكِتَٰبِ وَيَشْتَرُونَ بِهِۦ ثَمَنًا قَلِيلًا أُو۟لَٰٓئِكَ مَا يَأْكُلُونَ فِى بُطُونِهِمْ إِلَّا ٱلنَّارَ وَلَا يُكَلِّمُهُمُ ٱللَّهُ يَوْمَ ٱلْقِيَٰمَةِ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ","Innal-lazîna yaktumûna mâ anzalallâhu minal-kitâbi ve yaştarûna bihî samanan kalîlâ, ulâ'ika mâ ya'kulûna fî butûnihim illan-nâra ve lâ yukallimuhumullâhu yavmal-kiyâmati ve lâ yuzakkîhim, ve lahum 'azâbun alîm.","Allah'ın indirdiği kitaptan bir şey gizleyip de, onu az bir kazanç karşılığı değiştirenlere gelince, onlar karınlarını Cehennem ateşinden başka bir şeyle doldurmuyorlar. Kıyamet günü Allah onlarla konuşmayacak ve onları temize çıkarmayacaktır. Onlar için elem verici bir azap vardır.",""],[175,"أُو۟لَٰٓئِكَ ٱلَّذِينَ ٱشْتَرَوُا۟ ٱلضَّلَٰلَةَ بِٱلْهُدَىٰ وَٱلْعَذَابَ بِٱلْمَغْفِرَةِ فَمَآ أَصْبَرَهُمْ عَلَى ٱلنَّارِ","Ulâ'ikal-lazînaştaravud-dalâlata bil-hudâ vel-'azâba bil-magfirah, famâ asbarahum 'alan-nâr.","Onlar doğru yolu bırakıp sapıklığı; mağfireti bırakıp azabı satın alan kimselerdir. Ateşe karşı ne kadar dayanıklıdırlar!",""],[176,"ذَٰلِكَ بِأَنَّ ٱللَّهَ نَزَّلَ ٱلْكِتَٰبَ بِٱلْحَقِّ وَإِنَّ ٱلَّذِينَ ٱخْتَلَفُوا۟ فِى ٱلْكِتَٰبِ لَفِى شِقَاقٍۭ بَعِيدٍ","Zâlika bi'annallâha nazzalal-kitâba bil-hakk, ve innal-lazînahtalafû fil-kitâbi lafî şikâkim ba'îd.","Bu azabın sebebi şudur: Şüphesiz Allah, bu kitabı hak olarak indirmiştir. O kitap hakkında ihtilafa düşenler elbette haktan uzak bir ayrılık içindedirler.",""],[177,"لَّيْسَ ٱلْبِرَّ أَن تُوَلُّوا۟ وُجُوهَكُمْ قِبَلَ ٱلْمَشْرِقِ وَٱلْمَغْرِبِ وَلَٰكِنَّ ٱلْبِرَّ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ وَٱلْمَلَٰٓئِكَةِ وَٱلْكِتَٰبِ وَٱلنَّبِيِّـۧنَ وَءَاتَى ٱلْمَالَ عَلَىٰ حُبِّهِۦ ذَوِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينَ وَٱبْنَ ٱلسَّبِيلِ وَٱلسَّآئِلِينَ وَفِى ٱلرِّقَابِ وَأَقَامَ ٱلصَّلَوٰةَ وَءَاتَى ٱلزَّكَوٰةَ وَٱلْمُوفُونَ بِعَهْدِهِمْ إِذَا عَٰهَدُوا۟ وَٱلصَّٰبِرِينَ فِى ٱلْبَأْسَآءِ وَٱلضَّرَّآءِ وَحِينَ ٱلْبَأْسِ أُو۟لَٰٓئِكَ ٱلَّذِينَ صَدَقُوا۟ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُتَّقُونَ","Laysal-birra an tuvallû vucûhakum kibalal-maşriki vel-magribi ve lâkinnal-birra man âmana billâhi vel-yavmil âhiri vel-malâ'ikati vel-kitâbi van-nabiyyîn, ve âtal-mâla 'alâ hubbihî zavil-kurbâ vel-yatâmâ vel-masâkîna vabnas-sabîl, vas-sâ'ilîna ve fir-rikâb, ve akâmas-salâta ve âtaz-zakâh, val mûfûna bi'ahdihim izâ 'âhadû, vas-sâbirîna fil-ba'sâ'i vad-darrâ'i ve hînal-ba's, ulâ'ikal-lazîna sadakû, ve ulâ'ika humul-muttakûn.","Yüzlerinizi doğu ve batı yönüne döndürmeniz iyilik değildir. Fakat iyilik Allah’a, ahiret gününe, meleklere, kitaba ve peygamberlere iman eden, malına olan sevgisine rağmen; akrabaya, yetimlere, yoksullara, yolda kalmışlara, isteyenlere, kölelere ve esirlere veren, namazı dosdoğru kılan, zekâtı veren, sözleştikleri zaman sözlerini yerine getiren, sıkıntıda, hastalıkta ve savaşta sabredenlerin yaptıklarıdır. İşte doğru ve takvalı olanlar onlardır.",""],[178,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلْقِصَاصُ فِى ٱلْقَتْلَى ٱلْحُرُّ بِٱلْحُرِّ وَٱلْعَبْدُ بِٱلْعَبْدِ وَٱلْأُنثَىٰ بِٱلْأُنثَىٰ فَمَنْ عُفِىَ لَهُۥ مِنْ أَخِيهِ شَىْءٌ فَٱتِّبَاعٌۢ بِٱلْمَعْرُوفِ وَأَدَآءٌ إِلَيْهِ بِإِحْسَٰنٍ ذَٰلِكَ تَخْفِيفٌ مِّن رَّبِّكُمْ وَرَحْمَةٌ فَمَنِ ٱعْتَدَىٰ بَعْدَ ذَٰلِكَ فَلَهُۥ عَذَابٌ أَلِيمٌ","Yâ ayyuhal-lazîna âmanû kutiba 'alaykumul-kisâsu fil-katlâ, al-hurru bil-hurri vel-'abdu bil-'abdi vel-unsâ bil-unsâ, faman 'ufiya lahû min ahîhi şay'un fattibâ'um bil-ma'rûfi ve adâ'un ilayhi bi ihsân, zâlika tahfîfum mir rabbikum ve rahmah, fa mani'tadâ ba'da zâlika fa lahû 'azâbun alîm.","Ey İman edenler! Öldürülenler hakkında size kısas farz kılındı. Hür olan ile hür, köle ile köle, kadın ile kadın. Öldüren kişi, kardeşi (maktulün velisi) tarafından bağışlanmışsa artık ona örfe uymak ve bağışlayana güzellikle diyet ödemek gerekir. Bu, Rabbinizden bir hafifletme ve rahmettir. Bundan sonra da haddi aşan kimseye elem verici azap vardır.",""],[179,"وَلَكُمْ فِى ٱلْقِصَاصِ حَيَوٰةٌ يَٰٓأُو۟لِى ٱلْأَلْبَٰبِ لَعَلَّكُمْ تَتَّقُونَ","Ve lakum fil-kisâsi hayâtuy yâ ulil-albâbi la'allakum tattakûn.","Ey akıl sahipleri! Kısasta sizin için hayat vardır. Umulur ki sakınırsınız.",""],[180,"كُتِبَ عَلَيْكُمْ إِذَا حَضَرَ أَحَدَكُمُ ٱلْمَوْتُ إِن تَرَكَ خَيْرًا ٱلْوَصِيَّةُ لِلْوَٰلِدَيْنِ وَٱلْأَقْرَبِينَ بِٱلْمَعْرُوفِ حَقًّا عَلَى ٱلْمُتَّقِينَ","Kutiba 'alaykum izâ hadara ahadakumul-mavtu in taraka kahirâ, al-vasiyyatu lil-vâlidayni vel-akrabîna bil-ma'rûf, hakkan 'alal-muttakîn.","Sizden birinize ölüm geldiği zaman, eğer geriye bir mal bırakacaksa; anaya, babaya, yakınlara uygun bir biçimde vasiyet etmek, muttakiler üzerine farz kılındı.",""],[181,"فَمَنۢ بَدَّلَهُۥ بَعْدَ مَا سَمِعَهُۥ فَإِنَّمَآ إِثْمُهُۥ عَلَى ٱلَّذِينَ يُبَدِّلُونَهُۥٓ إِنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌ","Famam baddalahû ba'da mâ sami'ahû fa innamâ ismuhû 'alal-lazîna yubaddilûnah, innallâha samî'un 'alîm.","Vasiyeti işittikten sonra onu değiştiren olursa da, bunun günahı değiştirenlerin üzerinedir. Allah, şüphesiz işiten ve bilendir.",""],[182,"فَمَنْ خَافَ مِن مُّوصٍ جَنَفًا أَوْ إِثْمًا فَأَصْلَحَ بَيْنَهُمْ فَلَآ إِثْمَ عَلَيْهِ إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ","Faman hâfa mim mûsin canafan av isman fa aslaha baynahum falâ isma 'alayh, innallâha gafûrur rahîm.","Vasiyet edenin yanlış yada haksız bir paylaşım yapmasından endişe duyan kimse (tarafların) aralarını düzeltmesinde bir günah yoktur. Şüphesiz Allah, çok bağışlayıcı ve çok merhametlidir.",""],[183,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","Yâ ayyuhal-lazîna âmanû kutiba 'alaykumus-siyâmu kamâ kutiba 'alal-lazîna min kablikum la'allakum tattakûn.","Ey İman edenler! Oruç, sizden öncekilere farz kılındığı gibi, Allah’a karşı takva sahibi olursunuz diye size de farz kılındı.",""],[184,"أَيَّامًا مَّعْدُودَٰتٍ فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ وَعَلَى ٱلَّذِينَ يُطِيقُونَهُۥ فِدْيَةٌ طَعَامُ مِسْكِينٍ فَمَن تَطَوَّعَ خَيْرًا فَهُوَ خَيْرٌ لَّهُۥ وَأَن تَصُومُوا۟ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ","Ayyâmam ma'dûdât, faman kâna minkum marîdan av 'alâ safarin fa 'iddatum min ayyâmin uhar, ve 'alal-lazîna yutîkûnahû fidyatun ta'âmu miskîn, faman tatavva'a hayran fahuva hayrul lah, ve an tasûmû hayrul lakum in kuntum ta'lamûn.","Oruç, sayılı günlerdir. İçinizden hasta veya yolcu olanlar, tutamadığı günlerin sayısınca diğer günlerde tutsun. Oruca dayanamayanlar ise, bir yoksul doyuracak kadar fidye versin. Kim gönülden bir iyilik yaparsa, o iyiliği kendine yapmıştır. Şunu bilin ki; oruç tutmanız sizin için daha hayırlıdır.",""],[185,"شَهْرُ رَمَضَانَ ٱلَّذِىٓ أُنزِلَ فِيهِ ٱلْقُرْءَانُ هُدًى لِّلنَّاسِ وَبَيِّنَٰتٍ مِّنَ ٱلْهُدَىٰ وَٱلْفُرْقَانِ فَمَن شَهِدَ مِنكُمُ ٱلشَّهْرَ فَلْيَصُمْهُ وَمَن كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ يُرِيدُ ٱللَّهُ بِكُمُ ٱلْيُسْرَ وَلَا يُرِيدُ بِكُمُ ٱلْعُسْرَ وَلِتُكْمِلُوا۟ ٱلْعِدَّةَ وَلِتُكَبِّرُوا۟ ٱللَّهَ عَلَىٰ مَا هَدَىٰكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ","Şahru ramadânal-lazî unzila fîhil-kur'ânu hudal lin-nâsi ve bayyinâtim minal-hudâ vel-furkân, faman şahida minkumuş-şahra falyasumh ve man kâna marîdan av 'alâ safarin fa 'iddatum min ayyâmin uhar, yurîdullâhu bikumul-yusra ve lâ yurîdu bikumul-'usr, ve litukmilul-'iddata ve litukabbirullâha 'alâ mâ hadâkum ve la'allakum taşkurûn.","Ramazan ayı, insanlara yol gösterici, doğrunun ve doğruyu eğriden ayırmanın açık delilleri olarak Kur'an'ın indirildiği aydır. Öyle ise sizden ramazan ayını idrak edenler onda oruç tutsun. Kim o anda hasta veya yolcu olursa (tutamadığı günler sayısınca) başka günlerde kaza etsin. Allah sizin için kolaylık ister, zorluk istemez. Bütün bunlar, sayıyı tamamlamanız ve size doğru yolu göstermesine karşılık, Allah'ı tekbir/tazim etmeniz, şükretmeniz içindir",""],[186,"وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا دَعَانِ فَلْيَسْتَجِيبُوا۟ لِى وَلْيُؤْمِنُوا۟ بِى لَعَلَّهُمْ يَرْشُدُونَ","Ve izâ sa'alaka 'ibâdî 'annî fa innî karîb, ucîbu da'vatad-dâ'i izâ da'ân, falyastacîbû lî valyu'minû bî la'allahum yarşudûn.","Kullarım sana beni sorarlarsa; şüphe yok ki ben çok yakınım. Bana dua ettiği zaman, dua edenin duasına karşılık veririm. O halde onlar da benim davetime icabet etsinler ve bana iman etsinler ki, doğru yolda olsunlar.",""],[187,"أُحِلَّ لَكُمْ لَيْلَةَ ٱلصِّيَامِ ٱلرَّفَثُ إِلَىٰ نِسَآئِكُمْ هُنَّ لِبَاسٌ لَّكُمْ وَأَنتُمْ لِبَاسٌ لَّهُنَّ عَلِمَ ٱللَّهُ أَنَّكُمْ كُنتُمْ تَخْتَانُونَ أَنفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنكُمْ فَٱلْـَٰٔنَ بَٰشِرُوهُنَّ وَٱبْتَغُوا۟ مَا كَتَبَ ٱللَّهُ لَكُمْ وَكُلُوا۟ وَٱشْرَبُوا۟ حَتَّىٰ يَتَبَيَّنَ لَكُمُ ٱلْخَيْطُ ٱلْأَبْيَضُ مِنَ ٱلْخَيْطِ ٱلْأَسْوَدِ مِنَ ٱلْفَجْرِ ثُمَّ أَتِمُّوا۟ ٱلصِّيَامَ إِلَى ٱلَّيْلِ وَلَا تُبَٰشِرُوهُنَّ وَأَنتُمْ عَٰكِفُونَ فِى ٱلْمَسَٰجِدِ تِلْكَ حُدُودُ ٱللَّهِ فَلَا تَقْرَبُوهَا كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَّقُونَ","Uhilla lakum laylatas-siyâmir-rafasu ilâ nisâ'ikum, hunna libâsul lakum ve antum libâsul lahunn, 'alimallâhu annakum kuntum tahtânûna anfusakum fatâba 'alaykum ve 'afâ 'ankum, fal-âna bâşirûhunna vabtagû mâ kataballâhu lakum, ve kulû vaşrabû hattâ yatabayyana lakumul-haytul-abyadu minal-haytil-asvadi minal-facr, summa atimmus-siyâma ilal-layl, ve lâ tubâşirûhunna ve antum 'âkifûna fil-masâcid tilka hudûdullâhi falâ takrabûhâ, kazâlika yubayyinullâhu âyâtihî lin-nâsi la'allahum yattakûn.","Oruç gecesi kadınlarınıza yaklaşmanız size helal kılındı. Onlar sizin örtünüzdür, siz de onların örtüsüsünüz. Allah, nefsinize ihanet etmekte olduğunuzu biliyordu. Bu sebeple, tevbenizi kabul edip sizi bağışladı. Artık onlara yaklaşın ve Allah’ın sizin için takdir ettiğini dileyin. Fecir vakti geldiğinde beyaz iplik, siyah iplikten ayırt edilinceye kadar yiyin için, sonra geceye kadar orucu tamamlayın! Sizler, mescitlerde itikâfa çekilmiş olduğunuz halde kadınlarınıza yaklaşmayın! Bunlar, Allah'ın koyduğu sınırlardır. Bu sınırlara yaklaşmayın! İşte Allah, kötülüklerden korunmaları için insanlara ayetlerini böylece açıklar.",""],[188,"وَلَا تَأْكُلُوٓا۟ أَمْوَٰلَكُم بَيْنَكُم بِٱلْبَٰطِلِ وَتُدْلُوا۟ بِهَآ إِلَى ٱلْحُكَّامِ لِتَأْكُلُوا۟ فَرِيقًا مِّنْ أَمْوَٰلِ ٱلنَّاسِ بِٱلْإِثْمِ وَأَنتُمْ تَعْلَمُونَ","Ve lâ ta'kulû amvâlakum baynakum bil-bâtili ve tudlû bihâ ilal-hukkâmi lita'kulû farîkam min amvâlin-nâsi bil-ismi ve antum ta'lamûn.","Aranızda birbirinizin mallarını haksız yere yemeyin. İnsanların mallarından bir kısmını bile bile günaha girerek yemek için onları hâkimlere/yöneticilere (rüşvet olarak) vermeyin.",""],[189,"يَسْـَٔلُونَكَ عَنِ ٱلْأَهِلَّةِ قُلْ هِىَ مَوَٰقِيتُ لِلنَّاسِ وَٱلْحَجِّ وَلَيْسَ ٱلْبِرُّ بِأَن تَأْتُوا۟ ٱلْبُيُوتَ مِن ظُهُورِهَا وَلَٰكِنَّ ٱلْبِرَّ مَنِ ٱتَّقَىٰ وَأْتُوا۟ ٱلْبُيُوتَ مِنْ أَبْوَٰبِهَا وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُفْلِحُونَ","Yas'alûnaka 'anil-ahillah, kul hiya mavâkîtu lin-nâsi vel-hacc, ve laysal-birru bi'an ta'tul-buyûta min zuhûrihâ ve lâkinnal-birra manittakâ, ve'tul-buyûta min abvâbihâ, vattakullâha la'allakum tuflihûn.","Sana hilal şeklinde yeni doğan aylar hakkında soru sorarlar. De ki: Onlar, insanlar ve hac için vakit ölçüleridir. İyilik, evlere arkasından girmeniz değildir. Fakat iyilik, kötülükten sakınan kimsenin yaptığıdır. Evlere kapılarından girin. Allah’tan da sakının ki, kurtuluşa eresiniz.",""],[190,"وَقَٰتِلُوا۟ فِى سَبِيلِ ٱللَّهِ ٱلَّذِينَ يُقَٰتِلُونَكُمْ وَلَا تَعْتَدُوٓا۟ إِنَّ ٱللَّهَ لَا يُحِبُّ ٱلْمُعْتَدِينَ","Ve kâtilû fî sabîlillâhil-lazîna yukâtilûnakum ve lâ ta'tadû, innallâha lâ yuhibbul-mu'tadîn.","Allah yolunda sizinle savaşanlarla siz de savaşın, fakat aşırı gitmeyin. Doğrusu Allah aşırı gidenleri sevmez.",""],[191,"وَٱقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ وَأَخْرِجُوهُم مِّنْ حَيْثُ أَخْرَجُوكُمْ وَٱلْفِتْنَةُ أَشَدُّ مِنَ ٱلْقَتْلِ وَلَا تُقَٰتِلُوهُمْ عِندَ ٱلْمَسْجِدِ ٱلْحَرَامِ حَتَّىٰ يُقَٰتِلُوكُمْ فِيهِ فَإِن قَٰتَلُوكُمْ فَٱقْتُلُوهُمْ كَذَٰلِكَ جَزَآءُ ٱلْكَٰفِرِينَ","Vaktulûhum haysu sakiftumûhum ve ahricûhum min haysu ahracûkum vel-fitnatu aşaddu minal-katl, ve lâ tukâtilûhum 'indal-mascidil-harâmi hattâ yukâtilûkum fîh, fa'in kâtalûkum faktulûhum, kazâlika cazâ'ul-kâfirîn.","Sizinle savaşanları nerede yakalarsanız öldürün. Onları, sizi çıkardıkları yerden çıkarın. Fitne, öldürmekten daha kötüdür. Onlar, Mescid-i Haram’ın yanında sizinle savaşmadıkça, siz de onlarla orada savaşmayın. Fakat, onlar sizinle orada savaşırlarsa onlarla savaşın. İşte kâfirlerin cezası budur.",""],[192,"فَإِنِ ٱنتَهَوْا۟ فَإِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ","Fa'inintahav fa'innallâha gafûrur rahîm.","Eğer savaşmaktan vazgeçerlerse; şüphesiz ki Allah, çok bağışlayıcı ve çok merhametlidir.",""],[193,"وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌ وَيَكُونَ ٱلدِّينُ لِلَّهِ فَإِنِ ٱنتَهَوْا۟ فَلَا عُدْوَٰنَ إِلَّا عَلَى ٱلظَّٰلِمِينَ","Ve kâtilûhum hattâ lâ takûna fitnatuv ve yakûnad-dînu lillâh, fa inintahav falâ 'udvâna illâ 'alaz-zâlimîn.","Fitne kalmayıncaya, din/ibadet yalnız Allah'a yapılıncaya kadar, onlarla savaşın. Eğer savaşa son verirlerse zalimlerden başkasına düşmanlık yoktur.",""],[194,"ٱلشَّهْرُ ٱلْحَرَامُ بِٱلشَّهْرِ ٱلْحَرَامِ وَٱلْحُرُمَٰتُ قِصَاصٌ فَمَنِ ٱعْتَدَىٰ عَلَيْكُمْ فَٱعْتَدُوا۟ عَلَيْهِ بِمِثْلِ مَا ٱعْتَدَىٰ عَلَيْكُمْ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَعَ ٱلْمُتَّقِينَ","Aş-şahrul-harâmu biş-şahril-harâmi vel-hurumâtu kisâs, famani'tadâ 'alaykum fa'tadû 'alayhi bimisli ma'tadâ 'alaykum, vattakullâha ve'lamû annallâha ma'al-muttakîn.","Haram ay, haram aya karşılıktır ve hürmetli olan şeylere karşılık kısas vardır. O halde size saldırana, onun size saldırdığı gibi siz de saldırın. Allah’tan sakının ve Allah’ın takva sahipleriyle beraber olduğunu bilin.",""],[195,"وَأَنفِقُوا۟ فِى سَبِيلِ ٱللَّهِ وَلَا تُلْقُوا۟ بِأَيْدِيكُمْ إِلَى ٱلتَّهْلُكَةِ وَأَحْسِنُوٓا۟ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُحْسِنِينَ","Ve anfikû fî sabîlillâhi ve lâ tulkû bi'aydîkum ilat-tahlukah, ve ahsinû, innallâha yuhibbul-muhsinîn.","Allah yolunda infak edin. Kendi ellerinizle kendinizi tehlikeye atmayın. İşlerinizi iyi yapın. Şüphesiz Allah ihsan sahiplerini sever.",""],[196,"وَأَتِمُّوا۟ ٱلْحَجَّ وَٱلْعُمْرَةَ لِلَّهِ فَإِنْ أُحْصِرْتُمْ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ وَلَا تَحْلِقُوا۟ رُءُوسَكُمْ حَتَّىٰ يَبْلُغَ ٱلْهَدْىُ مَحِلَّهُۥ فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ بِهِۦٓ أَذًى مِّن رَّأْسِهِۦ فَفِدْيَةٌ مِّن صِيَامٍ أَوْ صَدَقَةٍ أَوْ نُسُكٍ فَإِذَآ أَمِنتُمْ فَمَن تَمَتَّعَ بِٱلْعُمْرَةِ إِلَى ٱلْحَجِّ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ فَمَن لَّمْ يَجِدْ فَصِيَامُ ثَلَٰثَةِ أَيَّامٍ فِى ٱلْحَجِّ وَسَبْعَةٍ إِذَا رَجَعْتُمْ تِلْكَ عَشَرَةٌ كَامِلَةٌ ذَٰلِكَ لِمَن لَّمْ يَكُنْ أَهْلُهُۥ حَاضِرِى ٱلْمَسْجِدِ ٱلْحَرَامِ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ","Ve atimmul-hacca vel-'umrata lillâh, fa'in uhsirtum famastaysara minal-hady, ve lâ tahlikû ru'ûsakum hattâ yablugal-hadyu mahillah, faman kâna minkum marîdan av bihî azam mir ra'sihî fafidyatum min siyâmin av sadakatin av nusuk, fa'izâ amintum, faman tamatta'a bil-'umrati ilal-hacci famastaysara minal-hady, famal lam yacid fasiyâmu salâsati ayyâmin fil-hacci ve sab'atin izâ raca'tum, tilka 'aşaratun kâmilah, zâlika limal lam yakun ahluhû hâdiril-mascidil-harâm, vattakullâha ve'lamû annallâha şadîdul-'ikâb.","Haccı da, umreyi de Allah için tamamlayın. Eğer haccı tamamlamaktan alıkonursanız, oraya kolayınıza gelen bir kurban gönderin. Kurban yerine ulaşıncaya kadar da başlarınızı tıraş etmeyin. İçinizden hasta olan ya da başından bir rahatsızlığı bulunan kimse, oruç, sadaka veya kurban olarak fidye ödesin. Güven içinde olduğunuzda hacca kadar umre ile faydalanmak isteyen kimse, kolayına gelen bir kurban kessin. Bunu bulamayan hac esnasında üç gün, döndüğü vakit de yedi gün -ki bu tam on gün eder- oruç tutsun. Bu, ailesi Mecsid-i Haram’da oturmayan kimseler içindir. Allah’tan sakının ve Allah’ın cezasının şiddetli olacağını bilin.",""],[197,"ٱلْحَجُّ أَشْهُرٌ مَّعْلُومَٰتٌ فَمَن فَرَضَ فِيهِنَّ ٱلْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِى ٱلْحَجِّ وَمَا تَفْعَلُوا۟ مِنْ خَيْرٍ يَعْلَمْهُ ٱللَّهُ وَتَزَوَّدُوا۟ فَإِنَّ خَيْرَ ٱلزَّادِ ٱلتَّقْوَىٰ وَٱتَّقُونِ يَٰٓأُو۟لِى ٱلْأَلْبَٰبِ","Al-haccu aşhurum ma'lûmât, faman farada fîhinnal-hacca falâ rafasa ve lâ fusûka ve lâ cidâla fil-hacc, ve mâ taf'alû min hayriy ya'lamhullâh, ve tazavvadû fa'inna hayraz-zâdit-takvâ, vattakûni yâ ulil-albâb.","Hac bilinen aylardadır. Kim bu aylarda niyet ederek hacca başlarsa bilmelidir ki, hacda hanımlarınıza yaklaşmak, günah işlemek ve tartışmak yasaktır. Allah yaptığınız bütün iyilikleri bilir. Sizler (hac için gereken masraflarınızı) yol azığınızı hazırlayın. Şüphesiz azığın en hayırlısı takvadır. Ey akıl sahipleri! Benden korkun.",""],[198,"لَيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَبْتَغُوا۟ فَضْلًا مِّن رَّبِّكُمْ فَإِذَآ أَفَضْتُم مِّنْ عَرَفَٰتٍ فَٱذْكُرُوا۟ ٱللَّهَ عِندَ ٱلْمَشْعَرِ ٱلْحَرَامِ وَٱذْكُرُوهُ كَمَا هَدَىٰكُمْ وَإِن كُنتُم مِّن قَبْلِهِۦ لَمِنَ ٱلضَّآلِّينَ","Laysa 'alaykum cunâhun an tabtagû fadlam mir rabbikum, fa'izâ afadtum min 'arafâtin fazkurullâha 'indal-maş'aril-harâm, vazkurûhu kamâ hadâkum, ve in kuntum min kablihî laminad-dâllîn.","Rabbinizden (hac ibadeti sırasında ticaret yaparak) rızık istemenizde herhangi bir günah yoktur. Arafat’tan ayrılınca Meş’ar-i Haram’da/Müzdelife'de Allah’ı zikredin. Nitekim O, size hidayet etmeden önce gerçekten dalalette olanlardan idiniz.",""],[199,"ثُمَّ أَفِيضُوا۟ مِنْ حَيْثُ أَفَاضَ ٱلنَّاسُ وَٱسْتَغْفِرُوا۟ ٱللَّهَ إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ","Summa afîdû min haysu afâdan-nâsu vastagfirullâh, innallâha gafûrur rahîm.","Sonra insanların akıp geldiği yerden siz de akıp gelin. Allah'tan bağışlanmanızı isteyin. Çünkü Allah çok bağışlayıcıdır, çok merhamet edicidir.",""],[200,"فَإِذَا قَضَيْتُم مَّنَٰسِكَكُمْ فَٱذْكُرُوا۟ ٱللَّهَ كَذِكْرِكُمْ ءَابَآءَكُمْ أَوْ أَشَدَّ ذِكْرًا فَمِنَ ٱلنَّاسِ مَن يَقُولُ رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا وَمَا لَهُۥ فِى ٱلْـَٔاخِرَةِ مِنْ خَلَٰقٍ","Fa izâ kadaytum manâsikakum fazkurullâha kazikrikum âbâ'akum av aşadda zikrâ, faminan-nâsi may yakûlu rabbanâ âtinâ fid-dun-yâ ve mâ lahû fil-âhirati min halâk.","Hac ibadetinizi bitirince atalarınızı andığınız gibi, hatta daha da kuvvetli bir anışla Allah’ı zikredin. İnsanlardan: \"Rabbimiz! Bize bu dünyada ver.\" diyen vardır. Onun ahirette hiçbir nasibi yoktur.",""],[201,"وَمِنْهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةً وَفِى ٱلْـَٔاخِرَةِ حَسَنَةً وَقِنَا عَذَابَ ٱلنَّارِ","Ve minhum may yakûlu rabbanâ âtinâ fid-dun-yâ hasanatav ve fil-âhirati hasanatav ve kinâ 'azâban-nâr.","İnsanlardan: “Rabbimiz! Bize bu dünyada da iyilik ver, ahirette de iyilik ver ve bizi ateşin azabından koru!” diyen kimseler de vardır.",""],[202,"أُو۟لَٰٓئِكَ لَهُمْ نَصِيبٌ مِّمَّا كَسَبُوا۟ وَٱللَّهُ سَرِيعُ ٱلْحِسَابِ","Ulâ'ika lahum nasîbum mimmâ kasabû, vallâhu sarî'ul-hisâb.","İşte onlara, kazançlarından ötürü bir pay/karşılık vardır. Nitekim Allah, hesabı çok çabuk görür.",""],[203,"وَٱذْكُرُوا۟ ٱللَّهَ فِىٓ أَيَّامٍ مَّعْدُودَٰتٍ فَمَن تَعَجَّلَ فِى يَوْمَيْنِ فَلَآ إِثْمَ عَلَيْهِ وَمَن تَأَخَّرَ فَلَآ إِثْمَ عَلَيْهِ لِمَنِ ٱتَّقَىٰ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّكُمْ إِلَيْهِ تُحْشَرُونَ","Vazkurullâha fî ayyâmim ma'dûdât, faman ta'accala fî yavmayni falâ isma 'alayh, ve man ta'ahhara falâ isma 'alayhi limanittakâ, vattakullâha ve'lamû annakum ilayhi tuhşarûn.","Allah’ı sayılı günlerde de anın. Günahtan sakınan kimseye, acele edip (Mina’daki ibadeti) iki günde bitirse de günah yoktur, geri kalsa da günah yoktur. Allah’tan sakının, O'nun huzurunda toplanacağınızı bilin.",""],[204,"وَمِنَ ٱلنَّاسِ مَن يُعْجِبُكَ قَوْلُهُۥ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيُشْهِدُ ٱللَّهَ عَلَىٰ مَا فِى قَلْبِهِۦ وَهُوَ أَلَدُّ ٱلْخِصَامِ","Ve minan-nâsi may yu'cibuka kavluhû fil-hayâtid-dun-yâ ve yuşhidullâha 'alâ mâ fî kalbih, ve huva aladdul-hisâm.","İnsanlardan öyleleri vardır ki, dünya hayatı hakkında konuştuklarında bu senin hoşuna gider. Hatta böylesi kalbindekilerine (samimi olduğuna) Allah'ı şahit tutar. Halbuki o, hasımların en yamanıdır.",""],[205,"وَإِذَا تَوَلَّىٰ سَعَىٰ فِى ٱلْأَرْضِ لِيُفْسِدَ فِيهَا وَيُهْلِكَ ٱلْحَرْثَ وَٱلنَّسْلَ وَٱللَّهُ لَا يُحِبُّ ٱلْفَسَادَ","Ve izâ tavallâ sa'â fil-ardi liyufsida fîhâ ve yuhlikal-harsa van-nasl, vallâhu lâ yuhibbul-fasâd.","Senin yanından ayrılınca yeryüzünde bozgunculuk yapmaya, ekini ve nesli yok etmeye çalışır. Allah bozgunculuğu sevmez.",""],[206,"وَإِذَا قِيلَ لَهُ ٱتَّقِ ٱللَّهَ أَخَذَتْهُ ٱلْعِزَّةُ بِٱلْإِثْمِ فَحَسْبُهُۥ جَهَنَّمُ وَلَبِئْسَ ٱلْمِهَادُ","Ve izâ kîla lahuttakillâha ahazathul-'izzatu bil-ismi fahasbuhû cahannam, ve labi'sal-mihâd.","Ona, Allah’tan kork, denince gururu kendisine günah işletir. Ona Cehennem yeter. Gerçekten (orası, varılacak) yerin en kötüsüdür.",""],[207,"وَمِنَ ٱلنَّاسِ مَن يَشْرِى نَفْسَهُ ٱبْتِغَآءَ مَرْضَاتِ ٱللَّهِ وَٱللَّهُ رَءُوفٌۢ بِٱلْعِبَادِ","Ve minan-nâsi may yaşrî nafsahubtigâ'a mardâtillâh, vallâhu ra'ûfum bil-'ibâd.","İnsanlar arasında, Allah’ın rızasını kazanmak için canını feda edenler vardır. Allah kullarına karşı çok merhametlidir.",""],[208,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱدْخُلُوا۟ فِى ٱلسِّلْمِ كَآفَّةً وَلَا تَتَّبِعُوا۟ خُطُوَٰتِ ٱلشَّيْطَٰنِ إِنَّهُۥ لَكُمْ عَدُوٌّ مُّبِينٌ","Yâ ayyuhal-lazîna âmanudhulû fis-silmi kâffah, ve lâ tattabi'û hutuvâtiş-şaytân, innahû lakum 'aduvvum mubîn.","Ey iman edenler! Hep birden İslam dinine tümüyle eksiksiz girin, Şeytan'ın adımlarına uymayın! O sizin apaçık düşmanınızdır.",""],[209,"فَإِن زَلَلْتُم مِّنۢ بَعْدِ مَا جَآءَتْكُمُ ٱلْبَيِّنَٰتُ فَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌ","Fa'in zalaltum mim ba'di mâ câ'atkumul-bayyinâtu fa'lamû annallâha 'azîzun hakîm.","Eğer size apaçık deliller geldiği halde yine de hata ederseniz, bilin ki Allah Azîz'dir, Hakîm'dir.",""],[210,"هَلْ يَنظُرُونَ إِلَّآ أَن يَأْتِيَهُمُ ٱللَّهُ فِى ظُلَلٍ مِّنَ ٱلْغَمَامِ وَٱلْمَلَٰٓئِكَةُ وَقُضِىَ ٱلْأَمْرُ وَإِلَى ٱللَّهِ تُرْجَعُ ٱلْأُمُورُ","Hal yanzurûna illâ ay ya'tiyahumullâhu fî zulalim minal-gamâmi vel-malâ'ikatu ve kudiyal-amr, ve ilallâhi turca'ul-umûr.","Bulut gölgeleri ile birlikte Allah’ın ve meleklerin gelmesini ve işin bitirilmesini mi bekliyorlar? Bütün işler Allah’a döndürülüp götürülecektir.",""],[211,"سَلْ بَنِىٓ إِسْرَٰٓءِيلَ كَمْ ءَاتَيْنَٰهُم مِّنْ ءَايَةٍۭ بَيِّنَةٍ وَمَن يُبَدِّلْ نِعْمَةَ ٱللَّهِ مِنۢ بَعْدِ مَا جَآءَتْهُ فَإِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ","Sal banî isrâ'îla kam âtaynâhum min âyatim bayyinah, ve may yubaddil ni'matallâhi mim ba'di mâ câ'athu fa innallâha şadîdul-'ikâb.","İsrâiloğulları'na bir sor, onlara apaçık nice ayetler verdik. Kim, Allah’ın nimeti kendisine ulaştıktan sonra onu değiştirirse, şüphesiz Allah’ın cezası çok şiddetlidir.",""],[212,"زُيِّنَ لِلَّذِينَ كَفَرُوا۟ ٱلْحَيَوٰةُ ٱلدُّنْيَا وَيَسْخَرُونَ مِنَ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ ٱتَّقَوْا۟ فَوْقَهُمْ يَوْمَ ٱلْقِيَٰمَةِ وَٱللَّهُ يَرْزُقُ مَن يَشَآءُ بِغَيْرِ حِسَابٍ","Zuyyina lil-lazîna kafarul-hayâtud-dun-yâ ve yasharûna minal-lazîna âmanû, vel-lazînattakav favkahum yavmal-kiyâmah, vallâhu yarzuku may yaşâ'u bigayri hisâb.","Dünya hayatı kâfirlere süslü gösterildi. Bu yüzden iman edenlerle alay ederler. Oysa takva sahipleri, kıyamet günü onların çok üstündedirler. Allah dilediğine hesapsız rızık verir.",""],[213,"كَانَ ٱلنَّاسُ أُمَّةً وَٰحِدَةً فَبَعَثَ ٱللَّهُ ٱلنَّبِيِّـۧنَ مُبَشِّرِينَ وَمُنذِرِينَ وَأَنزَلَ مَعَهُمُ ٱلْكِتَٰبَ بِٱلْحَقِّ لِيَحْكُمَ بَيْنَ ٱلنَّاسِ فِيمَا ٱخْتَلَفُوا۟ فِيهِ وَمَا ٱخْتَلَفَ فِيهِ إِلَّا ٱلَّذِينَ أُوتُوهُ مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَٰتُ بَغْيًۢا بَيْنَهُمْ فَهَدَى ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ لِمَا ٱخْتَلَفُوا۟ فِيهِ مِنَ ٱلْحَقِّ بِإِذْنِهِۦ وَٱللَّهُ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ","Kânan-nâsu ummatav vâhidah, fa ba'asallâhun-nabiyyîna mubaşşirîna ve munzirîn, ve anzala ma'ahumul-kitâba bil-hakki liyahkuma baynan-nâsi fîmahtalafû fîh, ve mahtalafa fîhi illal-lazîna ûtûhu mim ba'di mâ câ'athumul-bayyinâtu bagyam baynahum, fahadallâhul-lazîna âmanû limahtalafû fîhi minal-hakki bi'iznih, vallâhu yahdî may yaşâ'u ilâ sirâtim mustakîm.","İnsanlar tek bir ümmetti. Sonra Allah, müjdeleyici ve uyarıcı olarak peygamberleri gönderdi ve insanların ayrılığa düştükleri hususlarda aralarında hükmetmesi için onlarla birlikte hak olan kitaplar indirdi. Ancak kitap gönderilenler, kendilerine apaçık deliller geldikten sonra aralarındaki hırs ve kıskançlık yüzünden onda ayrılığa düştüler. Allah ise iman edenleri, onların hakkında ayrılığa düştükleri doğruya kendi izniyle ulaştırdı. Allah, dilediğini doğru yola iletir.",""],[214,"أَمْ حَسِبْتُمْ أَن تَدْخُلُوا۟ ٱلْجَنَّةَ وَلَمَّا يَأْتِكُم مَّثَلُ ٱلَّذِينَ خَلَوْا۟ مِن قَبْلِكُم مَّسَّتْهُمُ ٱلْبَأْسَآءُ وَٱلضَّرَّآءُ وَزُلْزِلُوا۟ حَتَّىٰ يَقُولَ ٱلرَّسُولُ وَٱلَّذِينَ ءَامَنُوا۟ مَعَهُۥ مَتَىٰ نَصْرُ ٱللَّهِ أَلَآ إِنَّ نَصْرَ ٱللَّهِ قَرِيبٌ","Am hasibtum an tadhulul-cannata ve lammâ ya'tikum masalul-lazîna halav min kablikum, massathumul-ba'sâ'u vad-darrâ'u ve zulzilû hattâ yakûlar-rasûlu vel-lazîna âmanû ma'ahû matâ nasrullâh, alâ inna nasrallâhi karîb.","(Ey Müminler) sizden önce gelenlerin durumu, sizin başınıza gelmeden Cennet'e gireceğinizi mi zannettiniz? Onlara öyle yoksulluk ve sıkıntı geldi ve öyle sarsıldılar ki, hatta Peygamber ve beraberindeki Müminler; \"Allah'ın yardımı ne zaman?\" dediler. İyi bilin ki Allah’ın yardımı yakındır.",""],[215,"يَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ قُلْ مَآ أَنفَقْتُم مِّنْ خَيْرٍ فَلِلْوَٰلِدَيْنِ وَٱلْأَقْرَبِينَ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ وَمَا تَفْعَلُوا۟ مِنْ خَيْرٍ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌ","Yas'alûnaka mâzâ yunfikûn, kul mâ anfaktum min hayrin falil-vâlidayni vel-akrabîna vel-yatâmâ vel-masâkîni vabnis-sabîl, ve mâ taf'alû min hayrin fa innallâha bihî 'alîm.","Sana (Allah yolunda) sadaka olarak ne vereceklerini soruyorlar. De ki: Hayırdan infak edeceğiniz şey; anaya, babaya, akrabaya, yetimlere, yoksullara ve yolda kalmışlaradır. Hayır olarak yaptığınız şeyleri, Allah şüphesiz en iyi bilendir.",""],[216,"كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ وَهُوَ كُرْهٌ لَّكُمْ وَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًٔا وَهُوَ خَيْرٌ لَّكُمْ وَعَسَىٰٓ أَن تُحِبُّوا۟ شَيْـًٔا وَهُوَ شَرٌّ لَّكُمْ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ","Kutiba 'alaykumul-kitâlu ve huva kurhul lakum, ve 'asâ an takrahû şay'av ve huva hayrul lakum, ve 'asâ an tuhibbû şay'av ve huva şarrul lakum, vallâhu ya'lamu ve antum lâ ta'lamûn.","Sizin için hoş olmasa da savaş size farz kılındı. Olabilir ki sizin hoşlanmadığınız bir şey, sizin için iyidir ve ihtimal ki sizin hoşlandığınız bir şey sizin için kötüdür. Siz bilmezsiniz Allah bilir.",""],[217,"يَسْـَٔلُونَكَ عَنِ ٱلشَّهْرِ ٱلْحَرَامِ قِتَالٍ فِيهِ قُلْ قِتَالٌ فِيهِ كَبِيرٌ وَصَدٌّ عَن سَبِيلِ ٱللَّهِ وَكُفْرٌۢ بِهِۦ وَٱلْمَسْجِدِ ٱلْحَرَامِ وَإِخْرَاجُ أَهْلِهِۦ مِنْهُ أَكْبَرُ عِندَ ٱللَّهِ وَٱلْفِتْنَةُ أَكْبَرُ مِنَ ٱلْقَتْلِ وَلَا يَزَالُونَ يُقَٰتِلُونَكُمْ حَتَّىٰ يَرُدُّوكُمْ عَن دِينِكُمْ إِنِ ٱسْتَطَٰعُوا۟ وَمَن يَرْتَدِدْ مِنكُمْ عَن دِينِهِۦ فَيَمُتْ وَهُوَ كَافِرٌ فَأُو۟لَٰٓئِكَ حَبِطَتْ أَعْمَٰلُهُمْ فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ هُمْ فِيهَا خَٰلِدُونَ","Yas'alûnaka 'aniş-şahril-harâmi kitâlin fîh, kul kitâlun fîhi kabîr, ve saddun 'an sabîlillâhi ve kufrum bihî vel-mascidil-harâm, ve ihrâcu ahlihî minhu akbaru 'indallâh, vel-fitnatu akbaru minal-katl, ve lâ yazâlûna yukâtilûnakum hattâ yaruddûkum 'an dînikum inistatâ'û, ve may yartadid minkum 'an dînihî fa yamut ve huva kâfirun fa ulâ'ika habitat a'mâluhum fid-dun-yâ vel-âhirah, ve ulâ'ika ashâbun-nâr, hum fîhâ hâlidûn.","Sana haram ayı onda savaşmayı soruyorlar. De ki: O ayda savaşmak büyük suçtur, Allah yolundan alıkoymak, onu inkâr etmek, Mescid-i Haram’a (girmeye) engel olmak ve halkını oradan çıkarmak Allah katında daha büyük suçtur. Fitne (çıkarmak)/şirk ise, öldürmekten daha büyüktür. Güçleri yeterse sizi dininizden döndürünceye kadar sizinle savaşmaya devam ederler. Sizden kim dininden dönüp, kâfir olarak ölürse, işte onlar, amelleri dünyada ve ahirette boşa gidenlerdir. İşte onlar ateş ehlidir. Orada ebedi kalacaklardır.",""],[218,"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَاجَرُوا۟ وَجَٰهَدُوا۟ فِى سَبِيلِ ٱللَّهِ أُو۟لَٰٓئِكَ يَرْجُونَ رَحْمَتَ ٱللَّهِ وَٱللَّهُ غَفُورٌ رَّحِيمٌ","Innal-lazîna âmanû vel-lazîna hâcarû ve câhadû fî sabîlillâh, ulâ'ika yarcûna rahmatallâh, vallâhu gafûrur rahîm.","Şüphesiz iman edenler, hicret edenler ve Allah yolunda cihat edenler, işte onlar Allah’ın rahmetini umarlar. Allah günahları bağışlayandır, çokça merhamet edendir.",""],[219,"يَسْـَٔلُونَكَ عَنِ ٱلْخَمْرِ وَٱلْمَيْسِرِ قُلْ فِيهِمَآ إِثْمٌ كَبِيرٌ وَمَنَٰفِعُ لِلنَّاسِ وَإِثْمُهُمَآ أَكْبَرُ مِن نَّفْعِهِمَا وَيَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ قُلِ ٱلْعَفْوَ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلْـَٔايَٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَ","Yas'alûnaka 'anil-hamri vel-maysir, kul fîhimâ ismun kabîruv ve manâfi'u lin nâs, ve ismuhumâ akbaru min naf'ihimâ, ve yas'alûnaka mâzâ yunfikûn, kulil-'afv, kazâlika yubayyinullâhu lakumul-âyâti la'allakum tatafakkarûn.","Sana içki ve kumarı soruyorlar. De ki: Onlarda büyük günah ve insanlara bazı faydalar vardır. Günahları faydasından daha büyüktür. Ne sarf edeceklerini sana soruyorlar. De ki: İhtiyaçtan fazlasını! İşte Allah, size düşünesiniz diye ayetleri (böyle) açıklıyor.",""],[220,"فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَيَسْـَٔلُونَكَ عَنِ ٱلْيَتَٰمَىٰ قُلْ إِصْلَاحٌ لَّهُمْ خَيْرٌ وَإِن تُخَالِطُوهُمْ فَإِخْوَٰنُكُمْ وَٱللَّهُ يَعْلَمُ ٱلْمُفْسِدَ مِنَ ٱلْمُصْلِحِ وَلَوْ شَآءَ ٱللَّهُ لَأَعْنَتَكُمْ إِنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌ","Fid-dun-yâ vel-âhirah, ve yas'alûnaka 'anil-yatâmâ, kul islâhul lahum hayr, ve in tuhâlitûhum fa'ihvânukum, vallâhu ya'lamul-mufsida minal-muslih, ve lav şâ'allâhu la'a'natakum innallâha 'azizun hakîm.","Hem dünya ve hem de ahiret konusunda sana yetimleri soruyorlar. De ki: Onların işlerini düzeltmek hayırlıdır. Eğer onları aranıza katarsanız artık onlar sizin kardeşlerinizdir. Allah, bozanla düzelteni bilir. Allah dileseydi (yetimlerle bir arada yaşama işiyle) sizi zora sokardı. Şüphesiz Allah güçlüdür, Hakîm'dir.",""],[221,"وَلَا تَنكِحُوا۟ ٱلْمُشْرِكَٰتِ حَتَّىٰ يُؤْمِنَّ وَلَأَمَةٌ مُّؤْمِنَةٌ خَيْرٌ مِّن مُّشْرِكَةٍ وَلَوْ أَعْجَبَتْكُمْ وَلَا تُنكِحُوا۟ ٱلْمُشْرِكِينَ حَتَّىٰ يُؤْمِنُوا۟ وَلَعَبْدٌ مُّؤْمِنٌ خَيْرٌ مِّن مُّشْرِكٍ وَلَوْ أَعْجَبَكُمْ أُو۟لَٰٓئِكَ يَدْعُونَ إِلَى ٱلنَّارِ وَٱللَّهُ يَدْعُوٓا۟ إِلَى ٱلْجَنَّةِ وَٱلْمَغْفِرَةِ بِإِذْنِهِۦ وَيُبَيِّنُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ","Ve lâ tankihul-muşrikâti hattâ yu'minn, ve la'amatum mu'minatun hayrum mim muşrikativ ve lav a'cabatkum, ve lâ tunkihul-muşrikîna hattâ yu'minû, ve la'abdum mu'minun hayrum mim muşrikiv ve lav a'cabakum, ulâ'ika yad'ûna ilan-nâr, vallâhu yad'û ilal-cannati vel-magfirati bi'iznih, ve yubayyinu âyâtihî lin-nâsi la'allahum yatazakkarûn.","İman etmedikleri sürece Allah’a ortak koşan (müşrik) kadınlarla evlenmeyin. Şundan emin olun ki Mümin bir cariye, sizin hoşunuza gitse de müşrik bir hür kadından iyidir. İman etmedikleri sürece müşrik erkeklerle de kadınlarınızı evlendirmeyin. Şundan da emin olun ki imanlı bir köle, sizin hoşunuza gitse bile müşrik bir hür kişiden daha iyidir. Onlar insanları ateşe çağırırlar, Allah ise izni ile cennete ve bağışlanmaya çağırır, gerektikçe hatırlasınlar diye insanlara ayetlerini açıklar.",""],[222,"وَيَسْـَٔلُونَكَ عَنِ ٱلْمَحِيضِ قُلْ هُوَ أَذًى فَٱعْتَزِلُوا۟ ٱلنِّسَآءَ فِى ٱلْمَحِيضِ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ ٱللَّهُ إِنَّ ٱللَّهَ يُحِبُّ ٱلتَّوَّٰبِينَ وَيُحِبُّ ٱلْمُتَطَهِّرِينَ","Ve yas'alûnaka 'anil-mahîd, kul huva azâ, fa'tazilun-nisâ'a fil-mahîd, ve lâ takrabûhunna hattâ yathurn, fa'izâ tatahharna fa'tûhunna min haysu amarakumullâh, innallâha yuhibbut-tavvâbîna ve yuhibbul-mutatahhirîn.","Sana, kadınların aybaşı halinden soruyorlar. De ki: “O bir rahatsızlıktır. Bu sebeple adet halindeyken kadınlardan uzak durun ve temizlenene kadar onlara yaklaşmayın. Temizlendikleri zaman da Allah’ın size buyurduğu yoldan yaklaşın.” Şüphesiz Allah, daima tövbe edenleri sever ve temizlenenleri de sever.",""],[223,"نِسَآؤُكُمْ حَرْثٌ لَّكُمْ فَأْتُوا۟ حَرْثَكُمْ أَنَّىٰ شِئْتُمْ وَقَدِّمُوا۟ لِأَنفُسِكُمْ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّكُم مُّلَٰقُوهُ وَبَشِّرِ ٱلْمُؤْمِنِينَ","Nisâ'ukum harsul lakum, fa'tû harsakum annâ şi'tum, ve kaddimû li anfusikum, vattakullâha ve'lamû annakum mulâkûh, ve başşiril-mu'minîn.","Kadınlar sizin tarlanızdır, o halde tarlanıza dilediğiniz gibi varın. Kendiniz için ileriye yönelik hazırlık yapın. Allah’tan korkun ve O’na kavuşacağınızı bilin. Müminlere müjde ver.",""],[224,"وَلَا تَجْعَلُوا۟ ٱللَّهَ عُرْضَةً لِّأَيْمَٰنِكُمْ أَن تَبَرُّوا۟ وَتَتَّقُوا۟ وَتُصْلِحُوا۟ بَيْنَ ٱلنَّاسِ وَٱللَّهُ سَمِيعٌ عَلِيمٌ","Ve lâ tac'alullâha 'urdatal li'aymânikum an tabarrû ve tattakû ve tuslihû baynan-nâs, vallâhu samî'un 'alîm.","Allah adına yaptığınız yeminlerinizi iyilik etmeye, günahlardan uzak durmaya ve insanların arasını düzeltmeye engel yapmayın. Allah, her şeyi hakkıyla işitendir, bilendir.",""],[225,"لَّا يُؤَاخِذُكُمُ ٱللَّهُ بِٱللَّغْوِ فِىٓ أَيْمَٰنِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا كَسَبَتْ قُلُوبُكُمْ وَٱللَّهُ غَفُورٌ حَلِيمٌ","Lâ yu'âhizukumullâhu bil-lagvi fî aymânikum ve lâkiy yu'âhizukum bimâ kasabat kulûbukum, vallâhu gafûrun halîm.","Allah sizi, kasıtsız olarak yaptığınız yeminlerden dolayı sorumlu tutmaz. Lâkin kalplerinizin kasıtlı yaptığı yeminlerden dolayı sizi sorumlu tutar. Allah çok bağışlayandır, çok şefkat ve merhamet edendir.",""],[226,"لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍ فَإِن فَآءُو فَإِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ","Lil-lazîna yu'lûna min nisâ'ihim tarabbusu arba'ati aşhur, fa'in fâ'û fa'innalâha gafûrur rahîm.","Kadınlarına yaklaşmamaya yemin edenlerin dört ay bekleme süreleri vardır. Eğer yeminlerinden dönerlerse, şüphesiz Allah, çokça bağışlayandır, çokça merhamet edendir.",""],[227,"وَإِنْ عَزَمُوا۟ ٱلطَّلَٰقَ فَإِنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌ","Ve in 'azamut-talâka fa innallâha samî'un 'alîm.","Eğer boşanmaya karar verirlerse şüphesiz Allah hakkıyla işitendir, bilendir.",""],[228,"وَٱلْمُطَلَّقَٰتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَٰثَةَ قُرُوٓءٍ وَلَا يَحِلُّ لَهُنَّ أَن يَكْتُمْنَ مَا خَلَقَ ٱللَّهُ فِىٓ أَرْحَامِهِنَّ إِن كُنَّ يُؤْمِنَّ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِى ذَٰلِكَ إِنْ أَرَادُوٓا۟ إِصْلَٰحًا وَلَهُنَّ مِثْلُ ٱلَّذِى عَلَيْهِنَّ بِٱلْمَعْرُوفِ وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌ وَٱللَّهُ عَزِيزٌ حَكِيمٌ","Vel-mutallakâtu yatarabbasna bi anfusihinna salâsata kurû', ve lâ yahillu lahunna ay yaktumna mâ halakallâhu fî arhâmihinna in kunna yu'minna billâhi vel-yavmil-âhir, ve bu'ûlatuhunna ahakku biraddiûhinna fî zâlika in arâdû islâhâ, ve lahunna mislul-lazî 'alayhinna bil-ma'rûf, ve lir-ricâli 'alayhinna daracah, vallâhu 'azîzun hakîm.","Boşanmış kadınlar, kendi başlarına üç (adet) dönemi beklerler. Eğer onlar Allah’a ve ahiret gününe iman etmişlerse, Allah’ın kendi rahimlerinde yarattığını gizlemeleri helal değildir. Eğer, bu süre içinde barışmak isterlerse kocaları onları almaya daha çok hak sahibidirler. Erkeklerin hanımları üzerinde bulunan hakları gibi, hanımların da kocaları üzerinde meşrû çerçevede hakları vardır. Erkekler, kadınlardan bir derece daha üstündürler. Allah, mutlak galiptir, Hakîm'dir.",""],[229,"ٱلطَّلَٰقُ مَرَّتَانِ فَإِمْسَاكٌۢ بِمَعْرُوفٍ أَوْ تَسْرِيحٌۢ بِإِحْسَٰنٍ وَلَا يَحِلُّ لَكُمْ أَن تَأْخُذُوا۟ مِمَّآ ءَاتَيْتُمُوهُنَّ شَيْـًٔا إِلَّآ أَن يَخَافَآ أَلَّا يُقِيمَا حُدُودَ ٱللَّهِ فَإِنْ خِفْتُمْ أَلَّا يُقِيمَا حُدُودَ ٱللَّهِ فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا ٱفْتَدَتْ بِهِۦ تِلْكَ حُدُودُ ٱللَّهِ فَلَا تَعْتَدُوهَا وَمَن يَتَعَدَّ حُدُودَ ٱللَّهِ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ","At-talâku marratân, fa imsâkum bima'rûfin av tasrîhum bi'ihsân, ve lâ yahillu lakum an ta'huzû mimmâ âtaytumûhunna şay'an illâ ay yahâfâ allâ yukîmâ hudûdullâh, fa in hiftum allâ yukîmâ hudûdullâh falâ cunâha 'alayhimâ fîmaftadat bih, tilka hudûdullâhi falâ ta'tadûhâ, ve may yata'adda hudûdullâhi fa'ulâ'ika humuz-zâlimûn.","(Dönüş yapılabilecek) boşama iki defadır. Sonrası ya iyilikle geçinmek, ya da güzellikle bırakmaktır. (Evlilikte) tarafların Allah’ın belirlediği ölçüleri koruyamama endişeleri dışında kadınlara verdiklerinizden (boşanma esnasında) bir şeyi geri almanız sizin için helâl olmaz. Eğer onlar Allah’ın belirlediği ölçüleri gözetmeyecekler diye endişe ederseniz, o zaman kadının (boşanmak için) bedel vermesinde ikisine de günah yoktur. Bunlar Allah’ın koyduğu sınırlardır. Sakın bunları aşmayın. Allah’ın koyduğu sınırları kim aşarsa, onlar zalimlerin ta kendileridir.",""],[230,"فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُۥ فَإِن طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَآ أَن يَتَرَاجَعَآ إِن ظَنَّآ أَن يُقِيمَا حُدُودَ ٱللَّهِ وَتِلْكَ حُدُودُ ٱللَّهِ يُبَيِّنُهَا لِقَوْمٍ يَعْلَمُونَ","Fa'in tallakahâ falâ tahillu lahû mim ba'du hattâ tankiha zavcan gayrah, fa'in tallakahâ falâ cunâha 'alayhimâ ay yatarâca'â in zannâ ay yukîmâ hudûdullâh, tilka hudûdullâhi yubayyinuhâ likavmiy ya'lamûn.","Eğer erkek karısını (üçüncü defa) boşarsa; kadın, onun dışında bir başka kocayla nikâhlanmadıkça ona helâl olmaz. (Bu koca da) onu boşadığı takdirde, onlar (kadın ile ilk kocası) Allah’ın koyduğu ölçüleri gözetebileceklerine inanıyorlarsa tekrar birbirlerine dönüp evlenmelerinde bir günah yoktur. İşte bunlar Allah’ın, anlayan bir toplum için açıkladığı ölçüleridir.",""],[231,"وَإِذَا طَلَّقْتُمُ ٱلنِّسَآءَ فَبَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ بِمَعْرُوفٍ أَوْ سَرِّحُوهُنَّ بِمَعْرُوفٍ وَلَا تُمْسِكُوهُنَّ ضِرَارًا لِّتَعْتَدُوا۟ وَمَن يَفْعَلْ ذَٰلِكَ فَقَدْ ظَلَمَ نَفْسَهُۥ وَلَا تَتَّخِذُوٓا۟ ءَايَٰتِ ٱللَّهِ هُزُوًا وَٱذْكُرُوا۟ نِعْمَتَ ٱللَّهِ عَلَيْكُمْ وَمَآ أَنزَلَ عَلَيْكُم مِّنَ ٱلْكِتَٰبِ وَٱلْحِكْمَةِ يَعِظُكُم بِهِۦ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ بِكُلِّ شَىْءٍ عَلِيمٌ","Ve izâ tallaktumun-nisâ'a fabalagna acalahunna fa'amsikûhunna bima'rûfin av sarrihûhunna bima'rûf, ve lâ tumsikûhunna dirâral lita'tadû, ve may yaf'al zâlika fakad zalama nafasah, ve lâ tattahizû âyâtillâhi huzuvav vazkurû ni'matallâhi 'alaykum ve mâ anzala 'alaykum minal-kitâbi vel-hikmati ya'izukum bih, vattakullâha ve'lamû annallâha bikulli şay'in 'alîm.","Kadınları boşadığınızda bekleme süreleri sona ererken ya onları güzellikle tutun, ya da güzellikle bırakın, fakat haklarına tecavüz etmek için onlara zararlı olacak şekilde tutmayın. Böyle yapan şüphesiz kendisine zulmetmiş olur. Allah’ın ayetlerini eğlence edinmeyin. Allah’ın üzerinizdeki nimetini ve size öğüt vermek için indirdiği kitabı, hikmeti düşünün. Allah’tan korkun ve bilin ki Allah, şüphesiz her şeyi bilendir.",""],[232,"وَإِذَا طَلَّقْتُمُ ٱلنِّسَآءَ فَبَلَغْنَ أَجَلَهُنَّ فَلَا تَعْضُلُوهُنَّ أَن يَنكِحْنَ أَزْوَٰجَهُنَّ إِذَا تَرَٰضَوْا۟ بَيْنَهُم بِٱلْمَعْرُوفِ ذَٰلِكَ يُوعَظُ بِهِۦ مَن كَانَ مِنكُمْ يُؤْمِنُ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ ذَٰلِكُمْ أَزْكَىٰ لَكُمْ وَأَطْهَرُ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ","Ve izâ tallaktumun-nisâ'a fabalagna acalahunna falâ ta'dulûhunna ay yankihna azvâcahunna izâ tarâdav baynahum bil-ma'rûf, zâlika yû'azu bihî man kâna minkum yu'minu billâhi vel-yavmil-âhir, zâlikum azkâ lakum ve athar, vallâhu ya'lamu ve antum lâ ta'lamûn.","Kadınları boşadığınız vakit, onlar da bekleme sürelerini bitirince aralarında meşru bir şekilde anlaştıkları takdirde, kocalarıyla birlikte (tekrardan) evlenmelerine engel olmayın. İşte, sizden Allah’a ve ahiret gününe iman edenlere, bununla öğüt veriliyor. Bu, sizin için daha faydalı ve daha temizdir. Allah bilir, siz bilmezsiniz.",""],[233,"وَٱلْوَٰلِدَٰتُ يُرْضِعْنَ أَوْلَٰدَهُنَّ حَوْلَيْنِ كَامِلَيْنِ لِمَنْ أَرَادَ أَن يُتِمَّ ٱلرَّضَاعَةَ وَعَلَى ٱلْمَوْلُودِ لَهُۥ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِٱلْمَعْرُوفِ لَا تُكَلَّفُ نَفْسٌ إِلَّا وُسْعَهَا لَا تُضَآرَّ وَٰلِدَةٌۢ بِوَلَدِهَا وَلَا مَوْلُودٌ لَّهُۥ بِوَلَدِهِۦ وَعَلَى ٱلْوَارِثِ مِثْلُ ذَٰلِكَ فَإِنْ أَرَادَا فِصَالًا عَن تَرَاضٍ مِّنْهُمَا وَتَشَاوُرٍ فَلَا جُنَاحَ عَلَيْهِمَا وَإِنْ أَرَدتُّمْ أَن تَسْتَرْضِعُوٓا۟ أَوْلَٰدَكُمْ فَلَا جُنَاحَ عَلَيْكُمْ إِذَا سَلَّمْتُم مَّآ ءَاتَيْتُم بِٱلْمَعْرُوفِ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ","Vel-vâlidâtu yurdi'na avlâdahunna havlayni kâmilayni liman arâda ay yutimmar-radâ'ah, ve 'alal-mavlûdi lahû rizkuhunna ve kisvatuhunna bil-ma'rûf, lâ tukallafu nafsun illâ vus'ahâ, lâ tudârra vâlidatum bivaladihâ ve lâ mavlûdul lahû bivaladihî ve 'alal-vârisi mislu zâlik, fa'in arâdâ fisâlan 'an tarâdim minhumâ ve taşâvurin falâ cunâha 'alayhimâ, ve in arattum an tastardi'û avlâdakum falâ cunâha 'alaykum izâ sallamtum mâ âtaytum bil-ma'rûf, vattakullâha ve'lamû annallâha bimâ ta'malûna basîr.","Emzirmeyi tamamlamak isteyenler için anneler çocuklarını iki tam yıl emzirirler. Onların (annelerin) yiyeceği, giyeceği, örfe uygun olarak babaya aittir. Hiçbir kimseye gücünün üstünde bir yük ve sorumluluk teklif edilmez. -Hiçbir anne ve hiçbir baba çocuğu sebebiyle zarara uğratılmasın- (Baba ölmüşse) mirasçı da aynı şeyle sorumludur. Eğer (anne ve baba) kendi aralarında danışıp anlaşarak (iki yıl dolmadan) çocuğu sütten kesmek isterlerse, onlara günah yoktur. Eğer çocuklarınızı (bir sütanneye) emzirtmek isterseniz örfe uygun olarak vereceğiniz ücreti güzelce ödediğiniz takdirde size bir günah yoktur. Allah’a karşı gelmekten sakının ve bilin ki Allah, yapmakta olduklarınızı hakkıyla görendir.",""],[234,"وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًا يَتَرَبَّصْنَ بِأَنفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍ وَعَشْرًا فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ بِٱلْمَعْرُوفِ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ","Vel-lazîna yutavaffavna minkum ve yazarûna azvâcay yatarabbasna bi'anfusihinna arba'ata aşhuriv ve 'aşrâ, fa'izâ balagna acalahunna falâ cunâha 'alaykum fîmâ fa'alna fî anfusihinna bil-ma'rûf,vallâhu bimâ ta'malûna habîr.","İçinizden ölenlerin (geride) bırakmış olduğu hanımlar, kendi kendilerine dört ay on gün beklerler. Bekleme müddetlerini bitirdikleri vakit, kendileri hakkında yaptıkları meşru işlerde size bir günah yoktur. Allah yapmakta olduklarınızı bilir.",""],[235,"وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُم بِهِۦ مِنْ خِطْبَةِ ٱلنِّسَآءِ أَوْ أَكْنَنتُمْ فِىٓ أَنفُسِكُمْ عَلِمَ ٱللَّهُ أَنَّكُمْ سَتَذْكُرُونَهُنَّ وَلَٰكِن لَّا تُوَاعِدُوهُنَّ سِرًّا إِلَّآ أَن تَقُولُوا۟ قَوْلًا مَّعْرُوفًا وَلَا تَعْزِمُوا۟ عُقْدَةَ ٱلنِّكَاحِ حَتَّىٰ يَبْلُغَ ٱلْكِتَٰبُ أَجَلَهُۥ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ يَعْلَمُ مَا فِىٓ أَنفُسِكُمْ فَٱحْذَرُوهُ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَفُورٌ حَلِيمٌ","Ve lâ cunâha 'alaykum fîmâ 'arradtum bihî min hitbatin-nisâ'i av aknantum fî anfusikum, 'alimallâhu annakum satazkurûnahunna ve lâkil lâ tuvâ'idûhunna sirran illâ an takûlû kavlam ma'rûfâ, ve lâ ta'zimû 'ukdatan-nikâhi hattâ yablugal-kitâbu acalah, ve'lamû annallâha ya'lamu mâ fî anfusikum fahzarûh, ve'lamû annallâha gafûrun halîm.","Böyle (iddet beklemekte olan) kadınlara kapalı bir şekilde evlenme teklif etmenizde veya içinizden onlarla evlenmeyi geçirmenizde size bir günah yoktur. Allah, sizin onları anacağınızı bilmektedir. Fakat meşru sözler dışında onlarla gizlice sözleşmeyin, müddet sona erene kadar nikâh akdine kalkışmayın. İçinizde olanı Allah’ın bildiğini bilin de, O’ndan çekinin. Allah’ın çokça bağışlayan ve Halim (Kullarına azabı göndermede acele etmez) olduğunu bilin.",""],[236,"لَّا جُنَاحَ عَلَيْكُمْ إِن طَلَّقْتُمُ ٱلنِّسَآءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ تَفْرِضُوا۟ لَهُنَّ فَرِيضَةً وَمَتِّعُوهُنَّ عَلَى ٱلْمُوسِعِ قَدَرُهُۥ وَعَلَى ٱلْمُقْتِرِ قَدَرُهُۥ مَتَٰعًۢا بِٱلْمَعْرُوفِ حَقًّا عَلَى ٱلْمُحْسِنِينَ","Lâ cunâha 'alaykum in tallaktumun-nisâ'a mâ lam tamassûhunna av tafridû lahunna farîdah, ve matti'ûhunna 'alal-mûsi'i kadaruhû ve 'alal-muktiri kadaruhû matâ'am bil-ma'rûf, hakkan 'alal-muhsinîn.","Kadınlara temas edip, dokunmadan ve mehirlerini biçmeden, onları boşarsanız sizin üzerinize bir günah yoktur. Zengin olanlar kendi halince, fakir olanlar da yine kendi halince uygun bir şekilde onları (bir şeyler vererek) faydalandırın. Bu, iyilik sahiplerinin üzerine bir yükümlülüktür.",""],[237,"وَإِن طَلَّقْتُمُوهُنَّ مِن قَبْلِ أَن تَمَسُّوهُنَّ وَقَدْ فَرَضْتُمْ لَهُنَّ فَرِيضَةً فَنِصْفُ مَا فَرَضْتُمْ إِلَّآ أَن يَعْفُونَ أَوْ يَعْفُوَا۟ ٱلَّذِى بِيَدِهِۦ عُقْدَةُ ٱلنِّكَاحِ وَأَن تَعْفُوٓا۟ أَقْرَبُ لِلتَّقْوَىٰ وَلَا تَنسَوُا۟ ٱلْفَضْلَ بَيْنَكُمْ إِنَّ ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ","Ve in tallaktumûhunna min kabli an tamassûhunna ve kad faradtum lahunna farîdatan fanisfu mâ faradtum illâ ay ya'fûna av ya'fuval-lazî biyadihî 'ukdatun-nikâh, ve an ta'fû akrabu lit-takvâ, ve lâ tansavul-fadla baynakum, innallâha bimâ ta'malûna basîr.","Eğer onlara mehir biçer de, temas etmeden onları boşarsanız mehrin yarısı onların hakkıdır. Ancak kadınlar bundan vazgeçer ya da nikâh bağı elinde bulunan erkek, mehrin yarısını ve daha fazlasını bağışlarsa o başka. Mehrin hepsini bağışlamanız takvaya daha uygundur. Aranızdaki iyiliği unutmayın. Allah, şüphesiz yaptıklarınızı hakkıyla görendir.",""],[238,"حَٰفِظُوا۟ عَلَى ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ ٱلْوُسْطَىٰ وَقُومُوا۟ لِلَّهِ قَٰنِتِينَ","Hâfizû 'alas-salavâti vas-salâtil-vustâ, ve kûmû lillâhi kânitîn.","Namazlara ve orta namaza (ikindi namazına) devam edin. Gönülden bağlılık ve saygı ile Allah’ın huzuruna durun.",""],[239,"فَإِنْ خِفْتُمْ فَرِجَالًا أَوْ رُكْبَانًا فَإِذَآ أَمِنتُمْ فَٱذْكُرُوا۟ ٱللَّهَ كَمَا عَلَّمَكُم مَّا لَمْ تَكُونُوا۟ تَعْلَمُونَ","Fa'in hiftum faricâlan av rukbânâ, fa'izâ amintum fazkurullâha kamâ 'allamakum mâ lam takûnû ta'lamûn.","Eğer herhangi bir tehlikeden korkarsanız yaya yahut binek üzerinde namaz kılın. Güvene kavuştuğunuz zaman ise, daha önce bilmediğiniz şeyleri size öğrettiği gibi Allah’ı zikredin.",""],[240,"وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًا وَصِيَّةً لِّأَزْوَٰجِهِم مَّتَٰعًا إِلَى ٱلْحَوْلِ غَيْرَ إِخْرَاجٍ فَإِنْ خَرَجْنَ فَلَا جُنَاحَ عَلَيْكُمْ فِى مَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ مِن مَّعْرُوفٍ وَٱللَّهُ عَزِيزٌ حَكِيمٌ","Vel-lazîna yutavaffavna minkum ve yazarûna azvâcâ, vasiyyatal li'azvâcihim matâ'an ilal-havli gayra ihrâc, fa'in haracna falâ cunâha 'alaykum fî mâ fa'alna fî anfusihinna mim ma'rûf, vallâhu 'azîzun hakîm.","İçinizden ölüp geriye eşler bırakan erkekler, bir seneye kadar eşleri evlerinden (mirasçılar tarafından) çıkarılmayacak bir geçimlik vasiyet etmiş olmalıdırlar. Şayet kadınlar kendileri çıkarlarsa, kendi haklarında uygun olanı yapmalarından dolayı size bir mesuliyet (günah) yoktur. Allah mutlak galiptir, hüküm ve hikmet sahibidir.",""],[241,"وَلِلْمُطَلَّقَٰتِ مَتَٰعٌۢ بِٱلْمَعْرُوفِ حَقًّا عَلَى ٱلْمُتَّقِينَ","Ve lil-mutallakâti matâ'um bil-ma'rûf, hakkan 'alal-muttakîn.","Boşanmış kadınlara örfe uygun şekilde bir geçimlik sağlanmalıdır. Bu muttakiler üzerine bir görevdir. Bu, iyilik sahiplerinin üzerine bir yükümlülüktür.",""],[242,"كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَعْقِلُونَ","Kazâlika yubayyinullâhu lakum âyâtihî la'allakum ta'kilûn.","Düşünesiniz diye Allah, size ayetlerini işte böyle açıklıyor.",""],[243,"أَلَمْ تَرَ إِلَى ٱلَّذِينَ خَرَجُوا۟ مِن دِيَٰرِهِمْ وَهُمْ أُلُوفٌ حَذَرَ ٱلْمَوْتِ فَقَالَ لَهُمُ ٱللَّهُ مُوتُوا۟ ثُمَّ أَحْيَٰهُمْ إِنَّ ٱللَّهَ لَذُو فَضْلٍ عَلَى ٱلنَّاسِ وَلَٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَشْكُرُونَ","Alam tara ilal-lazîna haracû min diyârihim ve hum ulûfun hazaral-mavt, fakâla lahumullâhu mûtû, summa ahyâhum, inallâha lazû fadlin 'alan-nâsi ve lâkinna aksaran-nâsi lâ yaşkurûn.","Binlerce kişi iken ölüm korkusuyla yurtlarından çıkanları görmedin mi? Allah onlara: “Ölün!” dedi, sonra da onları tekrar diriltti. Şüphesiz Allah, insanlara karşı lütuf sahibidir. Ama insanların çoğu şükretmezler.",""],[244,"وَقَٰتِلُوا۟ فِى سَبِيلِ ٱللَّهِ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌ","Ve kâtilû fî sabîlillâhi ve'lamû annallâha samî'un 'alîm.","Allah yolunda savaşın ve bilin ki; Allah her şeyi işiten ve bilendir.",""],[245,"مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًا فَيُضَٰعِفَهُۥ لَهُۥٓ أَضْعَافًا كَثِيرَةً وَٱللَّهُ يَقْبِضُ وَيَبْصُۜطُ وَإِلَيْهِ تُرْجَعُونَ","Man zal-lazî yukridullâha kardan hasanan fayudâ'ifahû lahû ad'âfan kasîrah, vallâhu yakbidu ve yabsut, ve ilayhi turca'ûn.","Kim Allah rızası için ( karşılığını beklemeden ) gönlünden bir borç verirse ( veya Allah yolunda harcama yaparsa ) bilsin ki ; Allah bunun karşılığını, mükâfaatını kat kat fazlasıyla öder. Rızkı daraltan da genişleten de Allah’tır ve O ‘na döndürüleceksiniz.",""],[246,"أَلَمْ تَرَ إِلَى ٱلْمَلَإِ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ مِنۢ بَعْدِ مُوسَىٰٓ إِذْ قَالُوا۟ لِنَبِىٍّ لَّهُمُ ٱبْعَثْ لَنَا مَلِكًا نُّقَٰتِلْ فِى سَبِيلِ ٱللَّهِ قَالَ هَلْ عَسَيْتُمْ إِن كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ أَلَّا تُقَٰتِلُوا۟ قَالُوا۟ وَمَا لَنَآ أَلَّا نُقَٰتِلَ فِى سَبِيلِ ٱللَّهِ وَقَدْ أُخْرِجْنَا مِن دِيَٰرِنَا وَأَبْنَآئِنَا فَلَمَّا كُتِبَ عَلَيْهِمُ ٱلْقِتَالُ تَوَلَّوْا۟ إِلَّا قَلِيلًا مِّنْهُمْ وَٱللَّهُ عَلِيمٌۢ بِٱلظَّٰلِمِينَ","Alam tara ilal-mala'i mim banî isrâ'îla mim ba'di mûsâ, iz kâlû linabiyyil lahumub'as lanâ malikan nukâtil fî sabîlillâh, kâla hal 'asaytum in kutiba 'alaykumul-kitâlu allâ tukâtilû, kâlû ve mâ lanâ allâ nukâtila fî sabîlillâhi ve kad uhricnâ min diyârinâ ve abnâ'inâ, falammâ kutiba 'alayhimul-kitâlu tavallav illâ kalîlam minhum, vallâhu 'alîmum biz-zâlimîn.","Mûsâ'dan sonra İsrailoğulları'nın ileri gelenlerini görmedin mi? Peygamberlerinden birine: \"Bize bir hükümdar gönder de Allah yolunda savaşalım\" demişlerdi. Peygamberleri:\" Ya, savaş size farz olunca savaşmazsanız?\" demişti. \"Bizler neden Allah yolunda savaşmayalım ki, biz yurtlarımızdan ve oğullarımızdan uzaklaştırıldık\" demişlerdi. Fakat üzerlerine savaş farz kılınınca içlerinden pek azı hariç yüz çevirdiler. Allah, zalimleri şüphesiz bilir.",""],[247,"وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ ٱللَّهَ قَدْ بَعَثَ لَكُمْ طَالُوتَ مَلِكًا قَالُوٓا۟ أَنَّىٰ يَكُونُ لَهُ ٱلْمُلْكُ عَلَيْنَا وَنَحْنُ أَحَقُّ بِٱلْمُلْكِ مِنْهُ وَلَمْ يُؤْتَ سَعَةً مِّنَ ٱلْمَالِ قَالَ إِنَّ ٱللَّهَ ٱصْطَفَىٰهُ عَلَيْكُمْ وَزَادَهُۥ بَسْطَةً فِى ٱلْعِلْمِ وَٱلْجِسْمِ وَٱللَّهُ يُؤْتِى مُلْكَهُۥ مَن يَشَآءُ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ","Ve kâla lahum nabiyyuhum innallâha kad ba'asa lakum tâlûta malikâ, kâlû annâ yakûnu lahul-mulku 'alaynâ ve nahnu ahakku bil-mulki minhu ve lam yu'ta sa'atam minal-mâl, kâla innallâhastafâhu 'alaykum ve zâdahû bastatan fil-'ilmi vel-cism, vallâhu yu'tî mulkahû may yaşâ', vallâhu vâsi'un 'alîm.","Peygamberleri onlara, dedi ki: Allah, Tâlût’u size hükümdar gönderdi. O bizim üzerimize nasıl hükümdar olabilir? Biz hükümdarlığa ondan daha layığız. Ona, malca da bir bolluk verilmemiştir, dediler. Peygamber de: Allah, onu sizin üzerinize seçti, onun bilgisini ve gücünü artırdı. Allah, mülkünü dilediğine verir. Allah’ın lütfu geniştir. O, her şeyi bilendir, dedi.",""],[248,"وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ ءَايَةَ مُلْكِهِۦٓ أَن يَأْتِيَكُمُ ٱلتَّابُوتُ فِيهِ سَكِينَةٌ مِّن رَّبِّكُمْ وَبَقِيَّةٌ مِّمَّا تَرَكَ ءَالُ مُوسَىٰ وَءَالُ هَٰرُونَ تَحْمِلُهُ ٱلْمَلَٰٓئِكَةُ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ","Ve kâla lahum nabiyyuhum inna âyata mulkihî ay ya'tiyakumut-tâbûtu fîhi sakînatum mir rabbikum ve bakiyyatum mimmâ taraka âlu mûsâ ve âlu hârûna tahmiluhul-malâ'ikah, inna fî zâlika la âyatal lakum in kuntum mu'minîn.","Peygamberleri onlara, “Onun hükümdarlığının alameti, size sandığın gelmesidir. Onda Rabbinizden gelen bir huzur, Mûsâ ailesinin ve Hârûn ailesinin bıraktıklarından kalanlar vardır ve onu melekler taşır. Eğer iman etmişseniz, bunda sizin için apaçık delil vardır” dedi.",""],[249,"فَلَمَّا فَصَلَ طَالُوتُ بِٱلْجُنُودِ قَالَ إِنَّ ٱللَّهَ مُبْتَلِيكُم بِنَهَرٍ فَمَن شَرِبَ مِنْهُ فَلَيْسَ مِنِّى وَمَن لَّمْ يَطْعَمْهُ فَإِنَّهُۥ مِنِّىٓ إِلَّا مَنِ ٱغْتَرَفَ غُرْفَةًۢ بِيَدِهِۦ فَشَرِبُوا۟ مِنْهُ إِلَّا قَلِيلًا مِّنْهُمْ فَلَمَّا جَاوَزَهُۥ هُوَ وَٱلَّذِينَ ءَامَنُوا۟ مَعَهُۥ قَالُوا۟ لَا طَاقَةَ لَنَا ٱلْيَوْمَ بِجَالُوتَ وَجُنُودِهِۦ قَالَ ٱلَّذِينَ يَظُنُّونَ أَنَّهُم مُّلَٰقُوا۟ ٱللَّهِ كَم مِّن فِئَةٍ قَلِيلَةٍ غَلَبَتْ فِئَةً كَثِيرَةًۢ بِإِذْنِ ٱللَّهِ وَٱللَّهُ مَعَ ٱلصَّٰبِرِينَ","Falammâ fasala tâlûtu bil-cunûd, kâla innallâha mubtalîkum binahar, faman şariba minhu falaysa minnî, ve mal lam yat'amhu fa innahû minnî illâ manigtarafa gurfatam biyadih, fa şaribû minhu illâ kalîlam minhum, falammâ câvazahû huva vel-lazîna âmanû ma'ah, kâlû lâ tâkata lanal-yavma bicâlûta ve cunûdih, kâlal-lazîna yazunnûna annahum mulâkullâh, kam min fi'atin kalîlatin galabat fi'atan kasîratam bi'iznillâh, vallâhu ma'as-sâbirîn.","Tâlût, ordusuyla birlikte ayrıldığında: \"Allah, sizi bir ırmakla imtihan edecektir. Kim sudan içerse benden değildir, sadece eliyle bir avuç almasından başka ondan tatmayan bendendir.\" dedi. Onlardan pek azı hariç o sudan içtiler. Nihayet Tâlût ve kendisiyle beraber iman edenler ırmağı geçince, ötekiler: \"Bugün Câlût’a ve onun ordusuna karşı koyacak gücümüz yok.\" dediler. Rablerine kavuşacaklarını düşünenler ise: \"Nice sayıca az topluluklar, Allah’ın izni ile sayıca çok olan toplulukları yenmişlerdir. Allah sabredenlerle beraberdir.\" dediler.",""],[250,"وَلَمَّا بَرَزُوا۟ لِجَالُوتَ وَجُنُودِهِۦ قَالُوا۟ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","Ve lammâ barazû licâlûta ve cunûdihî kâlû rabbanâ afrig 'alaynâ sabrav ve sabbit akdâmanâ vansurnâ 'alal-kavmil-kâfirîn.","Câlût ve ordusuna karşı çıktıklarında: \"Rabbimiz! üzerimize sabır yağdır. Ayaklarımıza sebat ver, bu kâfir topluma karşı bize yardım et, zafer ver!\" dediler.",""],[251,"فَهَزَمُوهُم بِإِذْنِ ٱللَّهِ وَقَتَلَ دَاوُۥدُ جَالُوتَ وَءَاتَىٰهُ ٱللَّهُ ٱلْمُلْكَ وَٱلْحِكْمَةَ وَعَلَّمَهُۥ مِمَّا يَشَآءُ وَلَوْلَا دَفْعُ ٱللَّهِ ٱلنَّاسَ بَعْضَهُم بِبَعْضٍ لَّفَسَدَتِ ٱلْأَرْضُ وَلَٰكِنَّ ٱللَّهَ ذُو فَضْلٍ عَلَى ٱلْعَٰلَمِينَ","Fahazamûhum bi'iznillâh, ve katala dâvûdu câlûta ve âtâhullâhul-mulka vel-hikmata ve 'allamahû mimmâ yaşâ', ve lav lâ daf'ullâhin-nâsa ba'dahum biba'dil lafasadatil-ardu ve lâkinnallâha zû fadlin 'alal-'âlamîn.","Neticede Allah’ın izniyle onları bozguna uğrattılar. Dâvut da, Câlût’u öldürdü. Allah, Davut’a hükümdarlık ve hikmet verdi, ona dilediğinden öğretti. Allah’ın insanları birbirleriyle savması olmasaydı, yeryüzünün düzeni bozulurdu. Fakat Allah, âlemlere karşı lütuf sahibidir.",""],[252,"تِلْكَ ءَايَٰتُ ٱللَّهِ نَتْلُوهَا عَلَيْكَ بِٱلْحَقِّ وَإِنَّكَ لَمِنَ ٱلْمُرْسَلِينَ","Tilka âyâtullâhi natlûhâ 'alayka bil-hakk, ve innaka laminal-mursalîn.","İşte bunlar Allah’ın ayetleridir. Biz onları sana hakkıyla okuyoruz. Şüphesiz sen de gönderilmiş peygamberlerdensin.",""],[253,"تِلْكَ ٱلرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ مِّنْهُم مَّن كَلَّمَ ٱللَّهُ وَرَفَعَ بَعْضَهُمْ دَرَجَٰتٍ وَءَاتَيْنَا عِيسَى ٱبْنَ مَرْيَمَ ٱلْبَيِّنَٰتِ وَأَيَّدْنَٰهُ بِرُوحِ ٱلْقُدُسِ وَلَوْ شَآءَ ٱللَّهُ مَا ٱقْتَتَلَ ٱلَّذِينَ مِنۢ بَعْدِهِم مِّنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَٰتُ وَلَٰكِنِ ٱخْتَلَفُوا۟ فَمِنْهُم مَّنْ ءَامَنَ وَمِنْهُم مَّن كَفَرَ وَلَوْ شَآءَ ٱللَّهُ مَا ٱقْتَتَلُوا۟ وَلَٰكِنَّ ٱللَّهَ يَفْعَلُ مَا يُرِيدُ","Tilkar-rusulu faddalnâ ba'dahum 'alâ ba'd, minhum man kallamallâhu ve rafa'a ba'dahum daracât, ve âtaynâ 'îsabna maryamal-bayyinâti ve ayyadnâhu birûhil-kudus, ve lav şâ'allâhu maktatalal-lazîna mim ba'dihim mim ba'di mâ câ'athumul-bayyinâtu ve lâkinihtalafû fa minhum man âmana ve minhum man kafar, ve lav şâ'allâhu maktatalû, ve lâkinnallâha yaf'alu mâ yurîd.","İşte bu rasûller yok mu, biz onların bazısını bazısından üstün kıldık. Allah'ın konuştuğu ve bazılarının da derecelerini yükselttiği kimseler onlardandır. Meryemoğlu İsa'ya apaçık deliller vermiş ve onu Ruhu'l-Kudüs (Cebrâil) ile desteklemişizdir. Eğer Allah dileseydi, bu peygamberlerden sonra gelen milletler, kendilerine gelen apaçık delillerden sonra birbirlerini öldürmezlerdi. Fakat onlar ihtilâfa düştüler. Onlardan bir kısmı iman etti; bir kısmı da küfre girdi. Eğer Allah dileseydi, birbirlerini öldürmezlerdi. Fakat Allah, dilediğini yapar.",""],[254,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَنفِقُوا۟ مِمَّا رَزَقْنَٰكُم مِّن قَبْلِ أَن يَأْتِىَ يَوْمٌ لَّا بَيْعٌ فِيهِ وَلَا خُلَّةٌ وَلَا شَفَٰعَةٌ وَٱلْكَٰفِرُونَ هُمُ ٱلظَّٰلِمُونَ","Yâ ayyuhal-lazîna âmanû anfikû mimmâ razaknâkum min kabli ay ya'tiya yavmul lâ bay'un fîhi ve lâ hullatuv ve lâ şafâ'ah, vel-kâfirûna humuz-zâlimûn.","Ey iman edenler! İçinde hiçbir alışverişin, hiçbir dostluğun ve şefâatin olmadığı gün gelmeden önce, size rızık olarak verdiğimiz şeylerden Allah yolunda harcayın. Kâfirler ise, onlar zalimlerdir.",""],[255,"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ","Allâhu lâ ilâha illâ huv, al-hayyul-kayyûm, lâ ta'huzuhû sinatuv ve lâ navm, lahû mâ fis-samâvâti ve mâ fil-ard, man zal-lazî yaşfa'u 'indahû illâ bi'iznih, ya'lamu mâ bayna aydîhim ve mâ halfahum, ve lâ yuhîtûna bişay'im min 'ilmihî illâ bimâ şâ', vasi'a kursiyyuhus-samâvâti vel-ard, ve lâ ya'ûduhû hifzuhumâ, ve huval-'aliyyul-'azîm.","Allah; O'ndan başka hakkıyla ibadete layık hiçbir hak ilâh olmayandır; Hayy'dır (diridir); Kayyûm'dur. (kendi zâtiyle kâimdir.) O'nu ne bir uyuklama, ne de bir uyku tutar. Göklerde ve yerde ne varsa hepsi O'nundur. İzni olmadan, O'nun yanında kim şefaat edebilir? Onların önünde ve arkasında olan her şeyi bilir. Onlar ise, O'nun dilediği kadarından başka ilminden hiçbir şey kavrayamazlar. O'nun Kürsü'sü gökleri ve yeri kaplamıştır. Onların her ikisini de görüp gözetmek O'na ağır gelmez. O, çok yücedir, çok büyüktür.",""],[256,"لَآ إِكْرَاهَ فِى ٱلدِّينِ قَد تَّبَيَّنَ ٱلرُّشْدُ مِنَ ٱلْغَىِّ فَمَن يَكْفُرْ بِٱلطَّٰغُوتِ وَيُؤْمِنۢ بِٱللَّهِ فَقَدِ ٱسْتَمْسَكَ بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ لَا ٱنفِصَامَ لَهَا وَٱللَّهُ سَمِيعٌ عَلِيمٌ","Lâ ikrâha fid-dîn, kat tabayyanar-ruşdu minal-gayy, famay yakfur bit-tâgûti ve yu'mim billâhi fa kadistamsaka bil-'urvatil-vuskâ, lanfisâma lahâ, vallâhu samî'un 'alîm.","Dinde zorlama yoktur. Hak yol, bâtıl yoldan ayrılmıştır. Kim tâğûtu inkâr eder, Allah'a iman ederse, kopması mümkün olmayan en sağlam kulpa tutunmuş olur. Allah, hakkıyla işiten ve hakkıyla bilendir.",""],[257,"ٱللَّهُ وَلِىُّ ٱلَّذِينَ ءَامَنُوا۟ يُخْرِجُهُم مِّنَ ٱلظُّلُمَٰتِ إِلَى ٱلنُّورِ وَٱلَّذِينَ كَفَرُوٓا۟ أَوْلِيَآؤُهُمُ ٱلطَّٰغُوتُ يُخْرِجُونَهُم مِّنَ ٱلنُّورِ إِلَى ٱلظُّلُمَٰتِ أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ هُمْ فِيهَا خَٰلِدُونَ","Allâhu valiyyul-lazîna âmanû yuhricuhum minaz-zulumâti ilan-nûr, vel-lazîna kafarû avliyâ'uhumut-tâgûtu yuhricûnahum minan-nûri ilaz-zulumât, ulâ'ika ashâbun-nâr, hum fîhâ hâlidûn.","Allah, iman edenlerin dostudur; onları karanlıklardan aydınlığa çıkarır. Kâfirlerin dostları ise tâğûttur, onları aydınlıktan karanlıklara çıkarırlar. İşte onlar cehennemliklerdir. Orada ebedî olarak kalırlar.",""],[258,"أَلَمْ تَرَ إِلَى ٱلَّذِى حَآجَّ إِبْرَٰهِـۧمَ فِى رَبِّهِۦٓ أَنْ ءَاتَىٰهُ ٱللَّهُ ٱلْمُلْكَ إِذْ قَالَ إِبْرَٰهِـۧمُ رَبِّىَ ٱلَّذِى يُحْىِۦ وَيُمِيتُ قَالَ أَنَا۠ أُحْىِۦ وَأُمِيتُ قَالَ إِبْرَٰهِـۧمُ فَإِنَّ ٱللَّهَ يَأْتِى بِٱلشَّمْسِ مِنَ ٱلْمَشْرِقِ فَأْتِ بِهَا مِنَ ٱلْمَغْرِبِ فَبُهِتَ ٱلَّذِى كَفَرَ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ","Alam tara ilal-lazî hâcca ibrâhîma fî rabbihî an âtâhullâhul-mulk, iz kâla ibrâhîmu rabbiyal-lazî yuhyî ve yumît, kâla ana uhyî ve umît, kâla ibrâhîmu fa innallâha ya'tî biş-şamsi minal-maşriki fa'ti bihâ minal-magribi fabuhital-lazî kafar, vallâhu lâ yahdil-kavmaz-zâlimîn.","Allah'ın kendisine hükümranlık vermesinden dolayı, rabbi hakkında İbrahim'le tartışanı görmedin mi? İbrahim (ona): \"Rabbim hem diriltir, hemde öldürür\" deyince; o, \"Ben de diriltir ve öldürürüm\" demişti. Fakat İbrahim: \"Allah, Güneşi doğudan getirir; sen de onu batıdan getir.\" deyince, o inkâr eden şaşırıp kalmıştı. Allah, zâlimler topluluğunu doğru yola iletmez.",""],[259,"أَوْ كَٱلَّذِى مَرَّ عَلَىٰ قَرْيَةٍ وَهِىَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا قَالَ أَنَّىٰ يُحْىِۦ هَٰذِهِ ٱللَّهُ بَعْدَ مَوْتِهَا فَأَمَاتَهُ ٱللَّهُ مِا۟ئَةَ عَامٍ ثُمَّ بَعَثَهُۥ قَالَ كَمْ لَبِثْتَ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍ قَالَ بَل لَّبِثْتَ مِا۟ئَةَ عَامٍ فَٱنظُرْ إِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ وَٱنظُرْ إِلَىٰ حِمَارِكَ وَلِنَجْعَلَكَ ءَايَةً لِّلنَّاسِ وَٱنظُرْ إِلَى ٱلْعِظَامِ كَيْفَ نُنشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًا فَلَمَّا تَبَيَّنَ لَهُۥ قَالَ أَعْلَمُ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Au kal-lazî marra 'alâ karyativ ve hiya hâviyatun 'alâ 'urûşihâ, kâla annâ yuhyî hâzihillâhu ba'da mavtihâ, fa'amâtahullâhu mi'ata 'âmin summa ba'asah, kâla kam labist, kâla labistu yavman av ba'da yavm, kâla bal labista mi'ata 'âmin fanzur ilâ ta'âmika ve şarâbika lam yatasannah, vanzur ilâ himârik, ve linac'alaka âyatal lin-nâsi vanzur ilal-'izâmi kayfa nunşizuhâ summa naksûhâ lahmâ, falammâ tabayyana lah, kâla a'lamu annallâha 'alâ kulli şay'in kadîr.","Yahut altı üstüne gelmiş bir kasabaya uğrayan kimse gibisini görmedin mi? Allah, bunu ölümünden
