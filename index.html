liyor. Kim Rabbine kavuşmayı umuyorsa, salih amel işlesin ve Rabbine ibadetinde kimseyi ortak koşmasın!\"",""]]};

const HADISLER=[{"ar":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى","ok":"İnneme'l-a'mâlü bi'n-niyyât, ve innemâ li-külli'mriin mâ nevâ.","ml":"Ameller ancak niyetlere göredir. Herkese ancak niyet ettiği şey vardır.","src":"Buhârî, Müslim","tags":["niyet","amel","ihlas"]},{"ar":"الدِّينُ النَّصِيحَةُ","ok":"Ed-dînü'n-nasîha.","ml":"Din, samimiyet ve iyilik dilemektir.","src":"Müslim","tags":["din","nasihat","samimiyet"]},{"ar":"مِنْ حُسْنِ إِسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ","ok":"Min hüsni İslâmi'l-mer'i terkühû mâ lâ ya'nîh.","ml":"Kendisini ilgilendirmeyen şeyi bırakması, kişinin Müslümanlığının güzelliğindendir.","src":"Tirmizî, İbn Mâce","tags":["ahlak","boş söz","edep"]},{"ar":"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ","ok":"Lâ yü'minü ehadüküm hattâ yuhibbe li-ehîhi mâ yuhibbü li-nefsih.","ml":"Sizden biriniz kendisi için istediğini kardeşi için de istemedikçe gerçek anlamda iman etmiş olmaz.","src":"Buhârî, Müslim","tags":["kardeşlik","iman","sevgi"]},{"ar":"مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ","ok":"Men kâne yü'minü billâhi ve'l-yevmi'l-âhiri fe'l-yekul hayran ev li-yasmüt.","ml":"Allah'a ve ahiret gününe iman eden ya hayır söylesin ya da sussun.","src":"Buhârî, Müslim","tags":["söz","dil","susmak","ahlak"]},{"ar":"لَا تَغْضَبْ","ok":"Lâ tağdab.","ml":"Öfkelenme.","src":"Buhârî","tags":["öfke","sabır","ahlak"]},{"ar":"الطُّهُورُ شَطْرُ الْإِيمَانِ","ok":"Et-tuhûru şatru'l-îmân.","ml":"Temizlik imanın yarısıdır.","src":"Müslim","tags":["temizlik","iman","abdest"]},{"ar":"اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ","ok":"İttekıllâhe haysümâ künte, ve etbi'i's-seyyiete'l-hasenete temhuhâ, ve hâliki'n-nâse bi-hulukın hasen.","ml":"Nerede olursan ol Allah'tan kork. Kötülüğün arkasından bir iyilik yap ki onu silsin. İnsanlara güzel ahlakla davran.","src":"Tirmizî","tags":["takva","tövbe","ahlak","iyilik"]},{"ar":"إِذَا لَمْ تَسْتَحْيِ فَاصْنَعْ مَا شِئْتَ","ok":"İzâ lem testahyi fasna' mâ şi't.","ml":"Utanmıyorsan dilediğini yap.","src":"Buhârî","tags":["hayâ","utanmak","ahlak"]},{"ar":"الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ","ok":"El-müslimü men selime'l-müslimûne min lisânihî ve yedih.","ml":"Müslüman, elinden ve dilinden Müslümanların güvende olduğu kimsedir.","src":"Buhârî, Müslim","tags":["dil","komşu","güven","ahlak"]},{"ar":"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ","ok":"Hayruküm men teallema'l-Kur'âne ve allemeh.","ml":"Sizin en hayırlınız Kur'an'ı öğrenen ve öğretendir.","src":"Buhârî","tags":["Kur'an","ilim","öğretmek"]},{"ar":"الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ","ok":"El-kelimetü't-tayyibetü sadaka.","ml":"Güzel söz sadakadır.","src":"Buhârî, Müslim","tags":["söz","sadaka","iyilik"]},{"ar":"تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ","ok":"Tebessümüke fî vechi ehîke leke sadaka.","ml":"Kardeşinin yüzüne gülümsemen senin için sadakadır.","src":"Tirmizî","tags":["sadaka","tebessüm","kardeşlik"]},{"ar":"لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ","ok":"Leyse'ş-şedîdü bi's-sura'a, inneme'ş-şedîdü'llezî yemlikü nefsehû inde'l-ğadab.","ml":"Güçlü kimse güreşte rakibini yenen değildir. Asıl güçlü, öfke anında kendine hâkim olandır.","src":"Buhârî, Müslim","tags":["öfke","sabır","güç"]},{"ar":"مَنْ لَا يَرْحَمُ لَا يُرْحَمُ","ok":"Men lâ yerhamü lâ yürham.","ml":"Merhamet etmeyene merhamet edilmez.","src":"Buhârî, Müslim","tags":["merhamet","şefkat"]},{"ar":"الرَّاحِمُونَ يَرْحَمُهُمُ الرَّحْمَنُ","ok":"Er-râhimûne yerhamühümü'r-Rahmân.","ml":"Merhamet edenlere Rahmân olan Allah da merhamet eder.","src":"Ebû Dâvûd, Tirmizî","tags":["merhamet","şefkat"]},{"ar":"إِنَّ اللَّهَ رَفِيقٌ يُحِبُّ الرِّفْقَ فِي الْأَمْرِ كُلِّهِ","ok":"İnnallâhe rafîkun yuhibbü'r-rıfka fi'l-emri küllih.","ml":"Allah yumuşak davranandır, her işte yumuşaklığı sever.","src":"Buhârî","tags":["yumuşaklık","nezaket","ahlak"]},{"ar":"يَسِّرُوا وَلَا تُعَسِّرُوا، وَبَشِّرُوا وَلَا تُنَفِّرُوا","ok":"Yessirû ve lâ tuassirû, ve beşşirû ve lâ tüneffirû.","ml":"Kolaylaştırın, zorlaştırmayın. Müjdeleyin, nefret ettirmeyin.","src":"Buhârî, Müslim","tags":["kolaylık","tebliğ","müjde"]},{"ar":"أَحَبُّ الْأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ","ok":"Ehabbü'l-a'mâli ila'llâhi edvemühâ ve in kall.","ml":"Allah'a en sevimli gelen amel, az da olsa devamlı olanıdır.","src":"Buhârî, Müslim","tags":["ibadet","amel","devamlılık"]},{"ar":"كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ","ok":"Kelimetâni hafîfetâni ale'l-lisân, sakîletâni fi'l-mîzân, habîbetâni ila'r-Rahmân: Sübhânallâhi ve bi-hamdihî, sübhânallâhi'l-azîm.","ml":"İki kelime vardır ki dile hafif, mizanda ağır, Rahmân'a sevimlidir: Sübhânallâhi ve bi-hamdihî, Sübhânallâhi'l-azîm.","src":"Buhârî, Müslim","tags":["zikir","tesbih","mizan"]},{"ar":"أَفْضَلُ الذِّكْرِ لَا إِلَهَ إِلَّا اللَّهُ","ok":"Efdalü'z-zikri lâ ilâhe illallâh.","ml":"Zikrin en faziletlisi Lâ ilâhe illallâh'tır.","src":"Tirmizî, İbn Mâce","tags":["zikir","tevhid"]},{"ar":"مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ","ok":"Men kâle sübhânallâhi ve bi-hamdihî fî yevmin mi'ete merratin huttat hatâyâhü ve in kânet misle zebedi'l-bahr.","ml":"Kim günde yüz defa Sübhânallâhi ve bi-hamdihî derse, deniz köpüğü kadar olsa bile günahları silinir.","src":"Buhârî, Müslim","tags":["zikir","tesbih","günah","bağışlanma"]},{"ar":"الدُّعَاءُ هُوَ الْعِبَادَةُ","ok":"Ed-duâü hüve'l-ibâde.","ml":"Dua ibadetin ta kendisidir.","src":"Ebû Dâvûd, Tirmizî","tags":["dua","ibadet"]},{"ar":"أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ، فَأَكْثِرُوا الدُّعَاءَ","ok":"Akrabü mâ yekûnü'l-abdü min rabbihî ve hüve sâcid, fe-eksirü'd-duâ.","ml":"Kulun Rabbine en yakın olduğu an secdede olduğu andır. Öyleyse secdede çokça dua edin.","src":"Müslim","tags":["namaz","secde","dua"]},{"ar":"الصَّلَوَاتُ الْخَمْسُ، وَالْجُمْعَةُ إِلَى الْجُمْعَةِ، وَرَمَضَانُ إِلَى رَمَضَانَ، مُكَفِّرَاتٌ مَا بَيْنَهُنَّ إِذَا اجْتَنَبَ الْكَبَائِرَ","ok":"Es-salavâtü'l-hams, ve'l-cüm'atü ile'l-cüm'a, ve Ramazânü ilâ Ramazân, mükeffirâtün mâ beynehünne izecteneba'l-kebâir.","ml":"Beş vakit namaz, cumadan cumaya ve Ramazan'dan Ramazan'a, büyük günahlardan kaçınıldıkça aralarında işlenen günahlara kefarettir.","src":"Müslim","tags":["namaz","cuma","ramazan","oruç","bağışlanma"]},{"ar":"مَنْ صَلَّى عَلَيَّ وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرًا","ok":"Men sallâ aleyye vâhideten sallallâhü aleyhi aşrâ.","ml":"Kim bana bir salavat getirirse Allah ona on rahmet eder.","src":"Müslim","tags":["salavat","peygamber","zikir"]},{"ar":"مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ","ok":"Men sâme Ramazâne îmânen ve'htisâben ğufira lehû mâ tekaddeme min zenbih.","ml":"Kim inanarak ve sevabını Allah'tan bekleyerek Ramazan orucunu tutarsa geçmiş günahları bağışlanır.","src":"Buhârî, Müslim","tags":["oruç","ramazan","bağışlanma"]},{"ar":"مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ","ok":"Mâ nakasat sadakatün min mâl.","ml":"Sadaka maldan hiçbir şey eksiltmez.","src":"Müslim","tags":["sadaka","mal","cömertlik"]},{"ar":"الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى","ok":"El-yedü'l-ulyâ hayrun mine'l-yedi's-süflâ.","ml":"Veren el, alan elden hayırlıdır.","src":"Buhârî, Müslim","tags":["sadaka","cömertlik","emek"]},{"ar":"اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ","ok":"İttekü'n-nâra ve lev bi-şıkkı temra.","ml":"Yarım hurmayla da olsa kendinizi ateşten koruyun.","src":"Buhârî, Müslim","tags":["sadaka","cömertlik"]},{"ar":"رِضَا الرَّبِّ فِي رِضَا الْوَالِدِ، وَسَخَطُ الرَّبِّ فِي سَخَطِ الْوَالِدِ","ok":"Rıda'r-rabbi fî rıda'l-vâlid, ve sehatu'r-rabbi fî sehati'l-vâlid.","ml":"Rabbin rızası anne babanın rızasında, Rabbin öfkesi anne babanın öfkesindedir.","src":"Tirmizî","tags":["anne baba","aile","rıza"]},{"ar":"خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ، وَأَنَا خَيْرُكُمْ لِأَهْلِي","ok":"Hayruküm hayruküm li-ehlih, ve ene hayruküm li-ehlî.","ml":"Sizin en hayırlınız ailesine karşı en iyi olanınızdır. Ben de aileme karşı en iyi olanınızım.","src":"Tirmizî","tags":["aile","eş","ahlak"]},{"ar":"أَكْمَلُ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنُهُمْ خُلُقًا","ok":"Ekmelü'l-mü'minîne îmânen ahsenühüm hulukâ.","ml":"İman bakımından müminlerin en olgunu, ahlakı en güzel olanıdır.","src":"Ebû Dâvûd, Tirmizî","tags":["ahlak","iman"]},{"ar":"إِنَّمَا بُعِثْتُ لِأُتَمِّمَ صَالِحَ الْأَخْلَاقِ","ok":"İnnemâ bu'istü li-ütemmime sâliha'l-ahlâk.","ml":"Ben ancak güzel ahlakı tamamlamak için gönderildim.","src":"Ahmed b. Hanbel","tags":["ahlak","peygamber"]},{"ar":"طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ","ok":"Talebü'l-ilmi farîdatün alâ külli müslim.","ml":"İlim öğrenmek her Müslümana farzdır.","src":"İbn Mâce","tags":["ilim","öğrenmek"]},{"ar":"مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ","ok":"Men seleke tarîkan yeltemisü fîhi ilmen sehhelallâhü lehû bihî tarîkan ile'l-cenneh.","ml":"Kim ilim öğrenmek için bir yola girerse, Allah ona bu sayede cennete giden yolu kolaylaştırır.","src":"Müslim","tags":["ilim","cennet","öğrenmek"]},{"ar":"الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا","ok":"El-mü'minü li'l-mü'mini ke'l-bünyân, yeşüddü ba'duhû ba'dâ.","ml":"Mümin mümine karşı, parçaları birbirini tutan bir bina gibidir.","src":"Buhârî, Müslim","tags":["kardeşlik","birlik","dayanışma"]},{"ar":"إِيَّاكُمْ وَالظَّنَّ، فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ","ok":"İyyâküm ve'z-zann, fe-inne'z-zanne ekzebü'l-hadîs.","ml":"Kötü zandan sakının. Çünkü zan, sözlerin en yalanıdır.","src":"Buhârî, Müslim","tags":["zan","dedikodu","ahlak"]},{"ar":"عَلَيْكُمْ بِالصِّدْقِ، فَإِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ","ok":"Aleyküm bi's-sıdk, fe-inne's-sıdka yehdî ile'l-birr, ve inne'l-birra yehdî ile'l-cenneh.","ml":"Doğruluktan ayrılmayın. Çünkü doğruluk iyiliğe, iyilik de cennete götürür.","src":"Müslim","tags":["doğruluk","iyilik","cennet"]},{"ar":"آيَةُ الْمُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ","ok":"Âyetü'l-münâfıkı selâs: izâ haddese kezeb, ve izâ vaade ahlef, ve izâ'tümine hân.","ml":"Münafığın alameti üçtür: Konuşunca yalan söyler, söz verince sözünde durmaz, kendisine bir şey emanet edilince hıyanet eder.","src":"Buhârî, Müslim","tags":["yalan","emanet","söz","münafık"]},{"ar":"الْحَيَاءُ مِنَ الْإِيمَانِ","ok":"El-hayâü mine'l-îmân.","ml":"Hayâ imandandır.","src":"Buhârî, Müslim","tags":["hayâ","iman"]},{"ar":"عَجَبًا لِأَمْرِ الْمُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ","ok":"Aceben li-emri'l-mü'min, inne emrahû küllehû hayr.","ml":"Müminin durumu ne hoştur! Onun her işi kendisi için hayırlıdır.","src":"Müslim","tags":["sabır","şükür","tevekkül"]},{"ar":"الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ","ok":"El-mü'minü'l-kaviyyü hayrun ve ehabbü ila'llâhi mine'l-mü'mini'd-daîf.","ml":"Güçlü mümin, Allah katında zayıf müminden daha hayırlı ve daha sevimlidir.","src":"Müslim","tags":["güç","azim","çalışmak"]},{"ar":"ازْهَدْ فِي الدُّنْيَا يُحِبَّكَ اللَّهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّكَ النَّاسُ","ok":"İzhed fi'd-dünyâ yuhibbekellâh, vezhed fîmâ inde'n-nâsi yuhibbeke'n-nâs.","ml":"Dünyaya gönül bağlama ki Allah seni sevsin. İnsanların elindekine göz dikme ki insanlar seni sevsin.","src":"İbn Mâce","tags":["dünya","zühd","kanaat"]},{"ar":"كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ","ok":"Kün fi'd-dünyâ ke-enneke ğarîbün ev âbiru sebîl.","ml":"Dünyada bir garip ya da bir yolcu gibi ol.","src":"Buhârî","tags":["dünya","zühd","ahiret"]},{"ar":"نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالْفَرَاغُ","ok":"Ni'metâni mağbûnün fîhimâ kesîrün mine'n-nâs: es-sıhhatü ve'l-ferâğ.","ml":"İki nimet vardır ki insanların çoğu bunlarda aldanmıştır: Sağlık ve boş vakit.","src":"Buhârî","tags":["zaman","sağlık","nimet"]},{"ar":"إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ، وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ","ok":"İnnallâhe lâ yenzuru ilâ suveriküm ve emvâliküm, ve lâkin yenzuru ilâ kulûbiküm ve a'mâliküm.","ml":"Allah sizin dış görünüşünüze ve mallarınıza bakmaz, kalplerinize ve amellerinize bakar.","src":"Müslim","tags":["kalp","niyet","amel"]},{"ar":"أَفْشُوا السَّلَامَ بَيْنَكُمْ","ok":"Efşü's-selâme beyneküm.","ml":"Aranızda selamı yayın.","src":"Müslim","tags":["selam","sevgi","kardeşlik"]},{"ar":"مَنْ غَشَّنَا فَلَيْسَ مِنَّا","ok":"Men ğaşşenâ fe-leyse minnâ.","ml":"Bizi aldatan bizden değildir.","src":"Müslim","tags":["ticaret","dürüstlük","hile"]},{"ar":"أَعْطُوا الْأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ","ok":"A'tu'l-ecîra ecrahû kable en yeciffe arakuh.","ml":"İşçiye ücretini alnının teri kurumadan verin.","src":"İbn Mâce","tags":["işçi","ticaret","hak","emek"]},{"ar":"مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ","ok":"Men delle alâ hayrin fe-lehû mislü ecri fâilih.","ml":"Kim bir hayra yol gösterirse, ona o hayrı yapanın sevabı kadar sevap vardır.","src":"Müslim","tags":["hayır","iyilik","sevap"]},{"ar":"إِنَّ اللَّهَ جَمِيلٌ يُحِبُّ الْجَمَالَ","ok":"İnnallâhe cemîlün yuhibbü'l-cemâl.","ml":"Allah güzeldir, güzelliği sever.","src":"Müslim","tags":["güzellik","temizlik"]},{"ar":"لَيْسَ مِنَّا مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَيُوَقِّرْ كَبِيرَنَا","ok":"Leyse minnâ men lem yerham sağîranâ ve yüvakkir kebîranâ.","ml":"Küçüklerimize merhamet etmeyen, büyüklerimize saygı göstermeyen bizden değildir.","src":"Tirmizî","tags":["merhamet","saygı","aile","çocuk"]},{"ar":"مَا مَلَأَ آدَمِيٌّ وِعَاءً شَرًّا مِنْ بَطْنٍ","ok":"Mâ mele'e âdemiyyün viâen şerran min batn.","ml":"İnsanoğlu midesinden daha kötü bir kap doldurmamıştır.","src":"Tirmizî","tags":["sağlık","yemek","ölçü"]},{"ar":"مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَيُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ","ok":"Men ehabbe en yübsata lehû fî rızkıhî ve yünse'e lehû fî eserihî fe'l-yesıl rahimeh.","ml":"Rızkının bollaşmasını ve ömrünün bereketlenmesini isteyen, akrabasını gözetsin.","src":"Buhârî, Müslim","tags":["akraba","rızık","sıla-i rahim","aile"]},{"ar":"الْمَرْءُ مَعَ مَنْ أَحَبَّ","ok":"El-mer'ü mea men ehabb.","ml":"Kişi sevdiğiyle beraberdir.","src":"Buhârî, Müslim","tags":["sevgi","dostluk"]},{"ar":"دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ","ok":"Da' mâ yerîbüke ilâ mâ lâ yerîbük.","ml":"Şüpheli olanı bırak, şüphe vermeyene yönel.","src":"Tirmizî, Nesâî","tags":["şüphe","helal","takva"]}];

   ml:"Allah'ım! İbrahim'e ve ailesine rahmet ettiğin gibi Muhammed'e ve ailesine de rahmet eyle. Şüphesiz sen övülmeye layıksın, şanı yücesin."},
  {id:"barik", g:"namaz", t:"Allâhümme Bârik", s:"Son oturuşta",
   ar:"اَللّٰهُمَّ بَارِكْ عَلٰى مُحَمَّدٍ وَعَلٰى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلٰى إِبْرَاهِيمَ وَعَلٰى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ",
   ok:"Allâhümme bârik alâ Muhammedin ve alâ âli Muhammed. Kemâ bârekte alâ İbrâhîme ve alâ âli İbrâhîm. İnneke hamîdün mecîd.",
   ml:"Allah'ım! İbrahim'e ve ailesine bereket verdiğin gibi Muhammed'e ve ailesine de bereket ver. Şüphesiz sen övülmeye layıksın, şanı yücesin."},
  {id:"rabbenaatina", q:[2,201,201], g:"namaz", t:"Rabbenâ Âtinâ", s:"Son oturuşta · Bakara 201",
   ar:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
   ok:"Rabbenâ âtinâ fi'd-dünyâ haseneten ve fi'l-âhireti haseneten ve kınâ azâbe'n-nâr.",
   ml:"Rabbimiz! Bize dünyada da iyilik ver, ahirette de iyilik ver ve bizi ateşin azabından koru."},
  {id:"rabbenagfirli", q:[14,41,41], g:"namaz", t:"Rabbenağfirlî", s:"Son oturuşta · İbrâhîm 41",
   ar:"رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ",
   ok:"Rabbenağfirlî ve li-vâlideyye ve li'l-mü'minîne yevme yekûmü'l-hisâb.",
   ml:"Rabbimiz! Hesap gününde beni, anamı babamı ve bütün müminleri bağışla."},
  {id:"kunut1", g:"namaz", t:"Kunut Duası – 1", s:"Vitir namazının 3. rekâtında",
   ar:"اَللّٰهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ وَنَسْتَهْدِيكَ ۝ وَنُؤْمِنُ بِكَ وَنَتُوبُ إِلَيْكَ ۝ وَنَتَوَكَّلُ عَلَيْكَ وَنُثْنِي عَلَيْكَ الْخَيْرَ كُلَّهُ نَشْكُرُكَ ۝ وَلَا نَكْفُرُكَ وَنَخْلَعُ وَنَتْرُكُ مَنْ يَفْجُرُكَ",
   ok:"Allâhümme innâ nesteînüke ve nestağfirüke ve nestehdîk. Ve nü'minü bike ve netûbü ileyk. Ve netevekkelü aleyke ve nüsnî aleyke'l-hayra küllehû neşkürük. Ve lâ nekfürüke ve nahleu ve netrükü men yefcürük.",
   ml:"Allah'ım! Senden yardım ister, bağışlanma diler ve hidayet isteriz. Sana inanır, sana tövbe eder ve sana dayanırız. Bütün hayırlarla seni överiz, sana şükreder, nankörlük etmeyiz. Sana karşı geleni bırakır, ondan uzak dururuz."},
  {id:"kunut2", g:"namaz", t:"Kunut Duası – 2", s:"Birinci kunut duasından sonra",
   ar:"اَللّٰهُمَّ إِيَّاكَ نَعْبُدُ وَلَكَ نُصَلِّي وَنَسْجُدُ ۝ وَإِلَيْكَ نَسْعٰى وَنَحْفِدُ ۝ نَرْجُو رَحْمَتَكَ وَنَخْشٰى عَذَابَكَ ۝ إِنَّ عَذَابَكَ بِالْكُفَّارِ مُلْحِقٌ",
   ok:"Allâhümme iyyâke na'büdü ve leke nüsallî ve nescüdü ve ileyke nes'â ve nahfidü nercû rahmeteke ve nahşâ azâbeke inne azâbeke bi'l-küffâri mülhık.",
   ml:"Allah'ım! Yalnız sana ibadet eder, senin için namaz kılar ve secde ederiz. Sana koşar, sana yöneliriz. Rahmetini umar, azabından korkarız. Şüphesiz senin azabın inkârcılara ulaşacaktır."},

  {id:"fil", q:[105,1,5], g:"sure", t:"Fîl Sûresi", s:"105. sure",
   ar:"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ ۝ أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ ۝ وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ ۝ تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ ۝ فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ",
   ok:"Elem tera keyfe fe'ale rabbüke bi-ashâbi'l-fîl. Elem yec'al keydehüm fî tadlîl. Ve ersele aleyhim tayran ebâbîl. Termîhim bi-hıcâratin min siccîl. Fe-ce'alehüm ke-asfin me'kûl.",
   ml:"Rabbinin fil sahiplerine ne yaptığını görmedin mi? Onların tuzağını boşa çıkarmadı mı? Üzerlerine sürü sürü kuşlar gönderdi. O kuşlar onlara pişmiş çamurdan taşlar atıyordu. Sonunda onları yenilmiş ekin yaprağı gibi yaptı."},
  {id:"kureys", q:[106,1,4], g:"sure", t:"Kureyş Sûresi", s:"106. sure",
   ar:"لِإِيلَافِ قُرَيْشٍ ۝ إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ ۝ فَلْيَعْبُدُوا رَبَّ هٰذَا الْبَيْتِ ۝ الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ",
   ok:"Li-îlâfi Kureyş. Îlâfihim rihlete'ş-şitâi ve's-sayf. Fe'l-ya'büdû rabbe hâze'l-beyt. Ellezî et'amehüm min cû'in ve âmenehüm min havf.",
   ml:"Kureyş'e kolaylık sağlandığı, kış ve yaz yolculuklarında onlara kolaylık sağlandığı için, bu evin Rabbine ibadet etsinler. O ki onları açlıktan doyurdu ve korkudan emin kıldı."},
  {id:"maun", q:[107,1,7], g:"sure", t:"Mâûn Sûresi", s:"107. sure",
   ar:"أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ ۝ فَذٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ ۝ وَلَا يَحُضُّ عَلٰى طَعَامِ الْمِسْكِينِ ۝ فَوَيْلٌ لِلْمُصَلِّينَ ۝ الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ ۝ الَّذِينَ هُمْ يُرَاءُونَ ۝ وَيَمْنَعُونَ الْمَاعُونَ",
   ok:"Era'eyte'llezî yükezzibü bi'd-dîn. Fe-zâlike'llezî yedu'u'l-yetîm. Ve lâ yehuddu alâ taâmi'l-miskîn. Fe-veylün li'l-musallîn. Ellezîne hüm an salâtihim sâhûn. Ellezîne hüm yürâûn. Ve yemne'ûne'l-mâ'ûn.",
   ml:"Dini yalanlayanı gördün mü? İşte o, yetimi itip kakan ve yoksulu doyurmaya teşvik etmeyendir. Yazıklar olsun o namaz kılanlara ki namazlarını ciddiye almazlar, gösteriş yaparlar ve en küçük yardımı bile esirgerler."},
  {id:"kevser", q:[108,1,3], g:"sure", t:"Kevser Sûresi", s:"108. sure",
   ar:"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ۝ فَصَلِّ لِرَبِّكَ وَانْحَرْ ۝ إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ",
   ok:"İnnâ a'taynâke'l-kevser. Fe-salli li-rabbike ve'nhar. İnne şânieke hüve'l-ebter.",
   ml:"Şüphesiz biz sana Kevser'i verdik. Öyleyse Rabbin için namaz kıl ve kurban kes. Asıl soyu kesik olan, sana kin besleyendir."},
  {id:"kafirun", q:[109,1,6], g:"sure", t:"Kâfirûn Sûresi", s:"109. sure",
   ar:"قُلْ يَا أَيُّهَا الْكَافِرُونَ ۝ لَا أَعْبُدُ مَا تَعْبُدُونَ ۝ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ ۝ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ لَكُمْ دِينُكُمْ وَلِيَ دِينِ",
   ok:"Kul yâ eyyühe'l-kâfirûn. Lâ a'büdü mâ ta'büdûn. Ve lâ entüm âbidûne mâ a'büd. Ve lâ ene âbidün mâ abedtüm. Ve lâ entüm âbidûne mâ a'büd. Leküm dînüküm ve liye dîn.",
   ml:"De ki: Ey inkâr edenler! Ben sizin taptıklarınıza tapmam. Siz de benim taptığıma tapmıyorsunuz. Ben sizin taptıklarınıza tapacak değilim. Siz de benim taptığıma tapacak değilsiniz. Sizin dininiz size, benim dinim bana."},
  {id:"nasr", q:[110,1,3], g:"sure", t:"Nasr Sûresi", s:"110. sure",
   ar:"إِذَا جَاءَ نَصْرُ اللّٰهِ وَالْفَتْحُ ۝ وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللّٰهِ أَفْوَاجًا ۝ فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا",
   ok:"İzâ câe nasrullâhi ve'l-feth. Ve raeyte'n-nâse yedhulûne fî dînillâhi efvâcâ. Fe-sebbih bi-hamdi rabbike ve'stağfirh, innehû kâne tevvâbâ.",
   ml:"Allah'ın yardımı ve fetih geldiğinde ve insanların bölük bölük Allah'ın dinine girdiğini gördüğünde, Rabbini hamd ile tesbih et ve O'ndan bağışlanma dile. Çünkü O, tövbeleri çokça kabul edendir."},
  {id:"tebbet", q:[111,1,5], g:"sure", t:"Tebbet Sûresi", s:"111. sure",
   ar:"تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ ۝ مَا أَغْنٰى عَنْهُ مَالُهُ وَمَا كَسَبَ ۝ سَيَصْلٰى نَارًا ذَاتَ لَهَبٍ ۝ وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ ۝ فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ",
   ok:"Tebbet yedâ ebî lehebin ve tebb. Mâ ağnâ anhü mâlühû ve mâ keseb. Se-yaslâ nâran zâte leheb. Vemraetühû hammâlete'l-hatab. Fî cîdihâ hablün min mesed.",
   ml:"Ebû Leheb'in elleri kurusun, kurudu da. Ne malı ne kazandıkları ona fayda verdi. O alevli bir ateşe girecek. Odun taşıyıcı karısı da; boynunda hurma lifinden bir ip olduğu halde."},
  {id:"ihlas", q:[112,1,4], g:"sure", t:"İhlâs Sûresi", s:"112. sure",
   ar:"قُلْ هُوَ اللّٰهُ أَحَدٌ ۝ اَللّٰهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",
   ok:"Kul hüvallâhü ehad. Allâhü's-samed. Lem yelid ve lem yûled. Ve lem yekün lehû küfüven ehad.",
   ml:"De ki: O Allah birdir. Allah sameddir; her şey O'na muhtaçtır, O hiçbir şeye muhtaç değildir. Doğurmamış ve doğurulmamıştır. Hiçbir şey O'na denk değildir."},
  {id:"felak", q:[113,1,5], g:"sure", t:"Felak Sûresi", s:"113. sure",
   ar:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ",
   ok:"Kul eûzü bi-rabbi'l-felak. Min şerri mâ halak. Ve min şerri ğâsikın izâ vekab. Ve min şerri'n-neffâsâti fi'l-ukad. Ve min şerri hâsidin izâ hased.",
   ml:"De ki: Yarattığı şeylerin şerrinden, karanlığı çöktüğünde gecenin şerrinden, düğümlere üfleyenlerin şerrinden ve haset ettiğinde hasetçinin şerrinden sabahın Rabbine sığınırım."},
  {id:"nas", q:[114,1,6], g:"sure", t:"Nâs Sûresi", s:"114. sure",
   ar:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",
   ok:"Kul eûzü bi-rabbi'n-nâs. Meliki'n-nâs. İlâhi'n-nâs. Min şerri'l-vesvâsi'l-hannâs. Ellezî yüvesvisü fî sudûri'n-nâs. Mine'l-cinneti ve'n-nâs.",
   ml:"De ki: İnsanların Rabbine, insanların Hükümdarına, insanların İlahına sığınırım; insanların göğüslerine vesvese veren sinsi vesvesecinin şerrinden. O ister cinlerden ister insanlardan olsun."},
  {id:"asr", q:[103,1,3], g:"sure", t:"Asr Sûresi", s:"103. sure",
   ar:"وَالْعَصْرِ ۝ إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ ۝ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ",
   ok:"Ve'l-asr. İnne'l-insâne lefî husr. İlle'llezîne âmenû ve amilü's-sâlihâti ve tevâsav bi'l-hakkı ve tevâsav bi's-sabr.",
   ml:"Asra yemin olsun ki insan gerçekten ziyandadır. Ancak iman edip salih amel işleyenler, birbirlerine hakkı ve sabrı tavsiye edenler bunun dışındadır."},

  {id:"entesselam", g:"sonra", t:"Allâhümme ente's-selâm", s:"Farzdan sonra",
   ar:"اَللّٰهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ",
   ok:"Allâhümme ente's-selâmü ve minke's-selâm, tebârakte yâ ze'l-celâli ve'l-ikrâm.",
   ml:"Allah'ım! Esenlik sensin, esenlik ancak sendendir. Ey celâl ve ikram sahibi, sen yücesin."},
  {id:"ayetelkursi", q:[2,255,255], g:"sonra", t:"Âyetü'l-Kürsî", s:"Tesbihattan önce · Bakara 255",
   ar:"اَللّٰهُ لَا إِلٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",
   ok:"Allâhü lâ ilâhe illâ hüve'l-hayyü'l-kayyûm. Lâ te'huzühû sinetün ve lâ nevm. Lehû mâ fi's-semâvâti ve mâ fi'l-ard. Men ze'llezî yeşfeu indehû illâ bi-iznih. Ya'lemü mâ beyne eydîhim ve mâ halfehüm, ve lâ yuhîtûne bi-şey'in min ilmihî illâ bimâ şâ'. Vesia kürsiyyühü's-semâvâti ve'l-ard, ve lâ yeûdühû hıfzuhumâ, ve hüve'l-aliyyü'l-azîm.",
   ml:"Allah, kendisinden başka ilah olmayan, diri ve her şeyi ayakta tutandır. Onu ne uyuklama ne uyku tutar. Göklerde ve yerde ne varsa O'nundur. İzni olmadan O'nun katında kim şefaat edebilir? İnsanların önlerindekini ve arkalarındakini bilir; onlar O'nun dilediği dışında ilminden hiçbir şeyi kavrayamazlar. Kürsüsü gökleri ve yeri kaplar, onları korumak O'na ağır gelmez. O yücedir, büyüktür."},
  {id:"tesbihat", g:"sonra", t:"Tesbihat", s:"Âyetü'l-Kürsî'den sonra · Sayaçta “Namaz tesbihatı” modu",
   ar:"سُبْحَانَ اللّٰهِ ۝ اَلْحَمْدُ لِلّٰهِ ۝ اَللّٰهُ أَكْبَرُ",
   ok:"33 kez Sübhânallâh, 33 kez Elhamdülillâh, 33 kez Allâhu Ekber.",
   ml:"Allah'ı eksikliklerden uzak tutarım. Hamd Allah'a mahsustur. Allah en büyüktür."},
  {id:"tevhid", g:"sonra", t:"Tesbihatın sonu", s:"Tesbihattan sonra 1 kez",
   ar:"لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلٰى كُلِّ شَيْءٍ قَدِيرٌ",
   ok:"Lâ ilâhe illallâhu vahdehû lâ şerîke leh, lehü'l-mülkü ve lehü'l-hamdü ve hüve alâ külli şey'in kadîr.",
   ml:"Allah'tan başka ilah yoktur. O tektir, ortağı yoktur. Mülk O'nundur, hamd O'na aittir ve O her şeye gücü yetendir."},
  {id:"ezanduasi", g:"sonra", t:"Ezan duası", s:"Ezandan sonra",
   ar:"اَللّٰهُمَّ رَبَّ هٰذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ",

let AC = null;
let acUnlocked=false;
function ac(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state!=="running") AC.resume();
    if(!acUnlocked){ const b=AC.createBuffer(1,1,22050), src=AC.createBufferSource(); src.buffer=b; src.connect(AC.destination); src.start(0); acUnlocked=true; }
  }catch(e){ AC=null; }
  return AC;
}
/* Telefonlarda ses ancak parmak kalkınca (dokunuş bitince) açılabiliyor; her dokunuşun sonunda sesi hazır tut. */
["pointerup","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ if(!AC||AC.state!=="running"||!acUnlocked) ac(); },{passive:true,capture:true}));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && AC && AC.state!=="running"){ try{ AC.resume(); }catch(e){} } });
try{ if(navigator.audioSession) navigator.audioSession.type="transient"; }catch(e){}
function tone(freq, start, dur, vol){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, a.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol, a.currentTime+start+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+start+dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime+start); o.stop(a.currentTime+start+dur+0.05);
}

function bugunKey(){ const [y,m,d]=localToday(); return y+"-"+m+"-"+d; }
function bitenler(){ if(!S.biten || S.biten.d!==bugunKey()) S.biten={d:bugunKey(),ids:[]}; return S.biten.ids; }
function bitir(id){ const b=bitenler(); if(!b.includes(id)) b.push(id); }
function siradakiler(){
  const b=bitenler();
  if(S.mode==="diger") return TESBIHLER.filter(t=>t.id!==S.diger && !b.includes(t.id));

}

const TG_AD={vird:"Sabah - Akşam Okunacak",nebi:"Peygamber duaları",ozel:"Özel okumalar",esma:"Esmâü'l-Hüsnâ",turkce:"Türkçe dualar"};
function openNext(){
  const list=siradakiler();
  const nm=t=>t.t||t.tr, adet=t=>t.steps?t.steps.reduce((a,x)=>a+x.n,0):targetOf(t.id);
  const cur=zById(curId());

    '<div class="nexthead"><span class="okbadge">✓</span><div><h2 style="margin:0">'+esc((cur.t||cur.tr||"Tesbih"))+' tamamlandı</h2><small>Kabul olsun. Sıradakini seçin.</small></div></div>'+

}
function secNext(id){
  if(S.mode==="diger") S.diger=id; else S.current=id;
  const c=S.counters[id]; if(c && c.count>=targetOf(id)) c.count=0;
  const it=tById(id); if(it && it.steps && S.seqs[id]){ const st=S.seqs[id]; if(st.step>=it.steps.length-1 && st.count>=it.steps[it.steps.length-1].n) S.seqs[id]={step:0,count:0}; }
  save(); document.getElementById("sheetHost").innerHTML=""; if(tab!=="sayac") go("sayac"); else render(); window.scrollTo({top:0,behavior:"smooth"});
}
function doTap(){
  ac();
  const seq=seqCtx();
  if(seq){
    const {steps, st}=seq;
    if(st.count>=steps[st.step].n){ if(st.step<steps.length-1){ st.step++; st.count=0; } else { st.step=0; st.count=0; } }
    st.count++; addDaily(seq.statId(st.step),1);
    const idx=st.step, cur=steps[idx];
    if(st.count>=cur.n){
      if(idx===steps.length-1){ if(seq.item){ bitir(seq.item.id); if(S.mode==="diger"||S.mode==="serbest") setTimeout(()=>{ if(tab==="sayac" && !document.getElementById("sheetHost").firstElementChild) openNext(); },900); } vibrate([300,120,300,120,500]); bell(); toast(S.mode==="tesbihat"?"Tesbihat tamamlandı. Kabul olsun.":"Hepsi tamamlandı. Kabul olsun."); }
      else { vibrate([200,80,200]); chime(); setTimeout(()=>{ if(st.step===idx && st.count>=cur.n){ st.step++; st.count=0; save(); if(tab==="sayac") render(); } },700); }
    } else { vibrate(18); tick(); }
  } else {
    const id=curId(), z=zById(id), c=ctr(id), t=targetOf(id);
    if(c.count>=t) c.count=0;
    c.count++; c.total++; addDaily(id,1);
    if(c.count>=t){ c.laps++; bitir(id); if(S.mode==="diger"||S.mode==="serbest") setTimeout(()=>{ if(tab==="sayac" && !document.getElementById("sheetHost").firstElementChild) openNext(); },900); vibrate([300,120,300,120,500]); bell(); toast(fmt(t)+" tamamlandı · "+c.laps+". tur"); }
    else if(z.kasem && c.count%z.kasem.her===0){ vibrate([250,100,250,100,250]); kasemBell(); toast(fmt(c.count)+" · Kasem: "+z.kasem.tr); }
    else if(!z.kasem && S.settings.every33 && t>33 && t%33===0 && c.count%33===0){ vibrate([120,60,120]); chime(); }
    else { vibrate(18); tick(); }
  }
  save(); render();
}
function doUndo(){
  const seq=seqCtx();
  if(seq){
    const {steps, st}=seq;
    if(st.count>0){ st.count--; addDaily(seq.statId(st.step),-1); }
    else if(st.step>0){ st.step--; st.count=steps[st.step].n-1; addDaily(seq.statId(st.step),-1); }
    else { toast("Geri alınacak sayım yok"); return; }
  } else {
    const id=curId(), c=ctr(id), t=targetOf(id);
    if(c.count>0){ if(c.count===t && c.laps>0) c.laps--; c.count--; c.total=Math.max(0,c.total-1); addDaily(id,-1); }
    else { toast("Geri alınacak sayım yok"); return; }
  }
  vibrate(10); save(); render();
}
function doReset(){
  const seq=seqCtx();
  if(seq){ seq.st.step=0; seq.st.count=0; } else { const c=ctr(curId()); c.count=0; c.laps=0; }
  confirmReset=false; save(); render(); toast("Sıfırlandı");
}

const player = {audio:null, id:null, queue:[], i:0, rowMap:[]};
const HIZLAR=[1,1.25,1.5,2];
function ayahUrl(n){ return "https://cdn.islamic.network/quran/audio/64/ar.alafasy/"+n+".mp3"; }
function playMark(){
  document.querySelectorAll(".ay.playing,.arbox.playing").forEach(x=>x.classList.remove("playing"));
  document.querySelectorAll("[data-play]").forEach(b=>{ const on=b.dataset.play===player.id; b.setAttribute("aria-pressed",String(on)); b.innerHTML=(on?I.stop+'<span>Durdur</span>':I.play+'<span>Dinle</span>'); });
  if(!player.id) return;
  const row=player.rowMap[player.i]; if(row==null) return;
  const el=document.getElementById("ay-"+player.id+"-"+row);
  if(el){ el.classList.add("playing"); const r=el.getBoundingClientRect(); if(r.top<80||r.bottom>innerHeight-90) el.scrollIntoView({block:"center",behavior:"smooth"}); }
}
function stopPlay(){ if(player.audio){ player.audio.pause(); player.audio.src=""; } player.id=null; player.queue=[]; playMark(); }
function startPlay(id){
  const d=duaById(id); if(!d||!d.q) return;
  if(player.id===id){ stopPlay(); return; }
  stopPlay();
  const [s,a0,a1]=d.q, base=AYAH_OFF[s-1];
  player.queue=[]; player.rowMap=[];
  if(a0===1 && s!==1 && s!==9){ player.queue.push(1); player.rowMap.push(null); }
  const multi=!!ayahRows(d);
  for(let a=a0;a<=a1;a++){ player.queue.push(base+a); player.rowMap.push(multi?a-a0:0); }
  player.id=id; player.i=0;
  if(!player.audio){
    player.audio=new Audio(); player.audio.preload="auto";
    player.audio.addEventListener("ended",()=>{ player.i++; if(player.i>=player.queue.length){ const done=player.id; stopPlay(); if(done) toast("Okuma tamamlandı"); return; } loadAyah(); });
    player.audio.addEventListener("error",()=>{ if(!player.id) return; stopPlay(); toast(SES_OK?"Ses yüklenemedi. İnternet bağlantınızı kontrol edin.":"Sesli okuma telefona kurduğunuz uygulamada çalışır, bu önizlemede çalmaz."); });
  }

}
function loadAyah(){
  const a=player.audio; a.src=ayahUrl(player.queue[player.i]);
  a.defaultPlaybackRate=a.playbackRate=S.hiz||1; try{ a.preservesPitch=true; }catch(e){}
  const p=a.play(); if(p&&p.catch) p.catch(()=>{});
  playMark();

}

const trNorm = s => String(s).toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/[’'`]/g,"").replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");

const H_KONULAR = (()=>{ const c={}; HADISLER.forEach(h=>h.tags.forEach(t=>c[t]=(c[t]||0)+1)); return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"tr")).map(x=>x[0]); })();

    '<div class="hhead"><span class="hsrc">'+esc(h.src)+'</span><button class="fav" data-fav="'+h.i+'" aria-pressed="'+fav+'" aria-label="'+(fav?"Favorilerden çıkar":"Favorilere ekle")+'">'+(fav?I.starOn:I.star)+'</button></div>'+

  try{ const p=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{timeZone:"UTC",day:"numeric",month:"numeric",year:"numeric"}).formatToParts(new Date(Date.UTC(y,m-1,d,12)));

function rumiStr(y,m,d){
  const j=new Date(Date.UTC(y,m-1,d-13)), jy=j.getUTCFullYear(), jm=j.getUTCMonth()+1, jd=j.getUTCDate();
  return jd+" "+RUMI_AY[(jm-3+12)%12]+" "+(jm>=3?jy-584:jy-585);
}
function kasimHizir(y,m,d){
  const n=dayNo(y,m,d), hz=dayNo(y,5,6), ks=dayNo(y,11,8);
  if(n>=hz && n<ks) return "Hızır'ın "+(n-hz+1)+". günü";
  const ksStart = n>=ks ? ks : dayNo(y-1,11,8);
  return "Kasım'ın "+(n-ksStart+1)+". günü";
}
const byDay = (arr,y,m,d,salt=0) => arr[(dayNo(y,m,d)+salt)%arr.length];
function hadisFor(y,m,d){ return byDay(HADISLER,y,m,d); }
function gunlerYakin(y,m,d){
  const n=dayNo(y,m,d);
  return GUNLER.map(g=>{ const [a,b,c]=g[0].split("-").map(Number); return {g,diff:dayNo(a,b,c)-n,a,b,c}; }).filter(x=>x.diff>=0);
}
function localToday(){ const t=new Date(); return [t.getFullYear(),t.getMonth()+1,t.getDate()]; }

let takvimOff=0, takvimYuz="on";
const GUN_DUALARI = DUALAR.filter(d=>(d.g==="namaz"||d.g==="sonra") && d.ar && d.ml && d.ml.length<260 && !/^(subhaneke|euzu|fatiha|ruku|kavme|secde|tesbihat)$/.test(d.id));
function gunTavsiye(y,m,d){
  const wd=new Date(Date.UTC(y,m-1,d)).getUTCDay(), h=hijriParts(y,m,d), out=[];
  if(wd===5) out.push("Cuma günü: Kehf Sûresi okumak, çokça salavat getirmek ve dua etmek sünnettir.");
  if(wd===1||wd===4) out.push("Bugün "+GUN_ADLARI[wd]+": Peygamberimizin tuttuğu nafile oruç günlerindendir.");
  if(h && h.d>=13 && h.d<=15) out.push("Eyyâm-ı biyz: Hicri ayın 13, 14 ve 15. günlerinde oruç tutmak sünnettir.");
  if(h && h.m===1 && (h.d===9||h.d===10||h.d===11)) out.push("Aşure günleri: Muharrem'in 9-10 ya da 10-11. günlerinde oruç tutulur.");
  if(h && (h.m===7||h.m===8)) out.push("Üç aylar: Bu aylarda oruç, tövbe ve istiğfar çoğaltılır.");
  if(!out.length) out.push("Günün güzel ameli: Beş vakit namazı vaktinde kılmak, sabah ve akşam virdini okumak.");
  return out;
}
function viewTakvim(){
  const [ty,tm,td]=localToday(); const [y,m,d]=addDays(ty,tm,td,takvimOff);
  const wd=new Date(Date.UTC(y,m-1,d)).getUTCDay(), p=place(), t=dayTimes(p,y,m,d);
  const mub=GUNLER.find(g=>g[0]===y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"));
  const yak=gunlerYakin(y,m,d)[0];
  const nav='<div class="tknav"><button class="btn" data-tk="-1" aria-label="Önceki gün">‹ Önceki</button><button class="btn'+(takvimOff?'':' primary')+'" data-tk="0">Bugün</button><button class="btn" data-tk="1" aria-label="Sonraki gün">Sonraki ›</button></div>';
  const yuz='<div class="seg" role="group" aria-label="Yaprak"><button data-yuz="on" aria-pressed="'+(takvimYuz==="on")+'">Ön yaprak</button><button data-yuz="arka" aria-pressed="'+(takvimYuz==="arka")+'">Arka yaprak</button></div>';
  let leaf;
  if(takvimYuz==="on"){
    leaf='<article class="leaf'+(wd===5?' cuma':'')+'">'+
      '<div class="lf-top"><span>'+AYLAR[m-1]+' '+y+'</span><span>'+GUN_ADLARI[wd]+'</span></div>'+
      '<div class="lf-day">'+d+'</div>'+
      (mub?'<div class="lf-mub">'+esc(mub[1])+'</div>':'')+
      '<div class="lf-cal"><div><small>Hicrî</small><b>'+esc(hicriStr(y,m,d))+'</b></div><div><small>Rûmî</small><b>'+esc(rumiStr(y,m,d))+'</b></div></div>'+
      '<div class="lf-kh">'+esc(kasimHizir(y,m,d))+' · '+esc(p.name)+'</div>'+
      '<div class="lf-vk">'+MET().keys.map(k=>'<div><small>'+VAKIT_AD[k]+'</small><b>'+hm(t[k],p.tz)+'</b></div>').join("")+'</div>'+
    '</article>';
  } else {
    const h=hadisFor(y,m,d), e=byDay(ESMA,y,m,d,7), du=byDay(GUN_DUALARI,y,m,d,3);
    leaf='<article class="leaf arka">'+
      '<div class="lf-top"><span>'+d+' '+AYLAR[m-1]+' '+y+' · '+GUN_ADLARI[wd]+'</span><span>Arka yaprak</span></div>'+
      '<section><h3>Günün Hadis-i Şerifi</h3><div class="ar" lang="ar">'+esc(h.ar)+'</div><p class="ok">'+esc(h.ok)+'</p><p>'+esc(h.ml)+' <small class="muted">('+esc(h.src)+')</small></p></section>'+
      '<section><h3>Günün Esmâsı</h3><div class="lf-esma"><span class="ar" lang="ar">'+esc(e.ar)+'</span><span><b>'+esc(e.tr)+'</b><br>'+esc(e.ml)+'</span></div></section>'+
      '<section><h3>Günün Duası · '+esc(du.t)+'</h3><div class="ar" lang="ar">'+esc(du.ar)+'</div><p class="ok">'+esc(du.ok)+'</p><p>'+esc(du.ml)+'</p></section>'+
      '<section><h3>Bugün için</h3><ul class="ol">'+gunTavsiye(y,m,d).map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></section>'+
      (yak?'<section><h3>Yaklaşan mübarek gün</h3><p><b>'+esc(yak.g[1])+'</b> · '+yak.c+' '+AYLAR[yak.b-1]+(yak.diff?' · '+yak.diff+' gün sonra':' · bugün')+'</p></section>':'')+
    '</article>';
  }
  return '<section class="view">'+nav+yuz+leaf+'<p class="note">Takvim yaprağı her gün kendiliğinden yenilenir. Rûmî tarih ve Kasım–Hızır günleri geleneksel takvim hesabına göredir.</p></section>';
}

const remDef = id => REM_DEFS.find(r=>r.id===id);
function remCfg(id){ S.rem ||= {}; const d=remDef(id); const c=S.rem[id]||{}; return {on:!!c.on, off: c.off!=null?c.off:d.off, time: c.time||d.time}; }
const remOn = id => remCfg(id).on;
function offTxt(o){ return o===0?"vakit girince":o<0?(-o)+" dk önce":o+" dk sonra"; }
function remDesc(id){
  const d=remDef(id), c=remCfg(id), gun=d.gun!=null?GUN_ADLARI[d.gun]+" günleri · ":"";
  if(d.type==="vakit") return gun+VAKIT_AD[d.k]+" · "+offTxt(c.off);
  if(d.type==="gece") return "Gecenin son üçte biri başlayınca";
  if(d.type==="once") return "Bir gün önce saat "+c.time;
  return gun+"Her gün saat "+c.time;
}
function remTimes(d,c,p){
  // bugün ve dün için olası zamanlar (gece yarısını geçenler için)
  const out=[], now=new Date(), [y,m,dd]=ymdIn(p.tz,now);
  for(const k of [-1,0]){
    const [a,b,e]=addDays(y,m,dd,k), wd=new Date(Date.UTC(a,b-1,e)).getUTCDay(), key=d.id+"@"+a+"-"+b+"-"+e;
    if(d.gun!=null && wd!==d.gun) continue;
    if(d.type==="vakit"){ const t=dayTimes(p,a,b,e)[d.k]; if(t) out.push({t:new Date(+t+c.off*6e4), key}); }
    else if(d.type==="gece"){ const t=dayTimes(p,a,b,e), [a2,b2,e2]=addDays(a,b,e,1), imsak=dayTimes(p,a2,b2,e2).imsak; out.push({t:new Date(+imsak-(imsak-t.aksam)/3), key}); }
    else { const [hh,mm]=c.time.split(":").map(Number); const t=new Date(a,b-1,e,hh,mm);
      if(d.type==="once"){ const [a2,b2,e2]=addDays(a,b,e,1); if(!d.cond(a2,b2,e2)) continue; }
      out.push({t, key}); }
  }
  return out;
}
function remText(d,c,p){
  if(d.type==="vakit"){ const v=VAKIT_AD[d.k]; if(d.id==="cuma") return ["Cuma namazına "+(-c.off)+" dk kaldı","Hazırlanma vakti · "+p.name];
    if(d.g==="namaz") return [c.off<0?v+" vaktine "+(-c.off)+" dk kaldı":c.off===0?v+" vakti girdi":v+" vakti "+c.off+" dk önce girdi", d.t+" · "+p.name];
    return [d.t+" vakti", remDesc(d.id)]; }
  if(d.id==="hadis"){ const [y,m,dd]=localToday(), h=hadisFor(y,m,dd); return ["Günün hadisi", h.ml]; }
  if(d.id==="esma"){ const [y,m,dd]=localToday(), e=byDay(ESMA,y,m,dd,7); return ["Günün esmâsı: "+e.tr, e.ml]; }
  if(d.id==="mubarek"){ const [y,m,dd]=localToday(), [a,b,e]=addDays(y,m,dd,1), g=GUNLER.find(g=>g[0]===a+"-"+String(b).padStart(2,"0")+"-"+String(e).padStart(2,"0")); return ["Yarın: "+(g?g[1]:"mübarek gün"), "Hazırlanmayı unutmayın. Kandiller akşamdan idrak edilir."]; }
  if(d.type==="once") return [d.t, d.msg||""];
  return [d.t, "Hatırlatma"];
}
function bildir(title, body, goTab){

      if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r=>r.showNotification(title,opt)).catch(()=>{ new Notification(title,opt); });
      else new Notification(title,opt);
    }
  }catch(e){}
}
function remTick(){
  S.rem ||= {}; S.remFired ||= {};
  const p=place(), now=Date.now(); let ch=false;
  for(const d of REM_DEFS){
    const c=remCfg(d.id); if(!c.on) continue;
    for(const x of remTimes(d,c,p)){
      const age=now-x.t; if(age<0 || age>10*6e4 || S.remFired[x.key]) continue;
      S.remFired[x.key]=Date.now(); ch=true;
      const [t,b]=remText(d,c,p); bildir(t,b,d.go);
    }
  }
  for(const k in S.remFired) if(now-S.remFired[k]>3*864e5){ delete S.remFired[k]; ch=true; }
  if(ch) save();
}

const NAMAZLAR = [

const L = (...ids)=>ids;
function buildNamaz(tip){
  const total = {s2:2,f2:2,cf2:2,sm4:4,f4:4,sg4:4,f3:3,v3:3}[tip];
  const farz = tip[0]==="f" || tip==="cf2";
  const R=[];
  const kiyam1 = [{t:"İftitah tekbiri: “Allâhu Ekber” diyerek ellerinizi kaldırın. Erkekler başparmaklarını kulak memelerine değdirir, kadınlar ellerini omuz hizasına kaldırır. Sonra elleri bağlayın.", k:1}];
  const rukuSecde = (last)=>[
    {t:"Rükû: “Allâhu Ekber” deyip eğilin, ellerinizi dizlerinize koyun ve 3 kez okuyun.", d:L("ruku"), k:1},
    {t:"Doğrulurken “Semi'allâhu limen hamideh”, tam doğrulunca “Rabbenâ leke'l-hamd” deyin.", d:L("kavme")},
    {t:"Birinci secde: “Allâhu Ekber” deyip secdeye varın, 3 kez okuyun.", d:L("secde"), k:1},
    {t:"Celse: “Allâhu Ekber” deyip oturun, bir “Sübhânallâh” diyecek kadar durun."},
    {t:"İkinci secde: “Allâhu Ekber” deyip tekrar secdeye varın, 3 kez okuyun.", d:L("secde"), k:1},
    last ? null : null
  ].filter(Boolean);
  for(let r=1;r<=total;r++){
    const items=[];
    if(r===1){ items.push({niyet:1}); items.push(...kiyam1); items.push({t:"Ayakta, ellerinizi bağlı tutarak okuyun.", d:L("subhaneke","euzu","fatiha")}); }
    else if(r===3 && tip==="sg4"){ items.push({t:"Ayakta, gayr-i müekked sünnet olduğu için 3. rekâta da Sübhâneke ile başlayın.", d:L("subhaneke","euzu","fatiha")}); }
    else items.push({t:"Ayakta Besmele çekip Fâtiha okuyun.", d:L("fatiha")});
    const zamm = !(farz && r>=3);
    if(zamm) items.push({t:"Zamm-ı sûre: kısa bir sure ya da en az üç kısa âyet okuyun.", d:L("kevser","ihlas","asr")});
    else items.push({t:"Farzların 3. ve 4. rekâtında Fâtiha'dan sonra sure okunmaz."});
    if(tip==="v3" && r===3) items.push({t:"“Allâhu Ekber” diyerek ellerinizi kulak hizasına kaldırıp tekrar bağlayın ve Kunut dualarını okuyun.", d:L("kunut1","kunut2"), k:1});
    items.push(...rukuSecde());
    const sonOturus = r===total, ilkOturus = r===2 && total>2;
    if(ilkOturus){
      const ds = tip==="sg4" ? L("tehiyyat","salli","barik") : L("tehiyyat");
      items.push({t:"Birinci oturuş: “Allâhu Ekber” deyip oturun ve okuyun"+(tip==="sg4"?" (gayr-i müekked sünnette Salli ve Bârik de okunur).":"."), d:ds, k:1});
      items.push({t:"“Allâhu Ekber” diyerek "+(r+1)+". rekâta kalkın."});
    } else if(sonOturus){
      items.push({t:"Son oturuş: “Allâhu Ekber” deyip oturun ve sırasıyla okuyun.", d:L("tehiyyat","salli","barik","rabbenaatina","rabbenagfirli"), k:1});
      items.push({t:"Selam: Başınızı önce sağa çevirip “Esselâmü aleyküm ve rahmetullâh”, sonra sola çevirip aynısını söyleyin. Namaz tamamlandı.", stop:1});
    } else items.push({t:"“Allâhu Ekber” diyerek "+(r+1)+". rekâta kalkın."});
    R.push(items);
  }
  return {R, farz};
}

function ilmBlocks(b){
  return b.map(x=>{
    const [k,v,o,m]=x;
    if(k==="p") return '<p>'+esc(v)+'</p>';
    if(k==="h") return '<h4 class="ilh">'+esc(v)+'</h4>';
    if(k==="not") return '<p class="note">'+esc(v)+'</p>';
    if(k==="ul"||k==="ol") return '<'+k+' class="ol">'+v.map(t=>'<li>'+esc(t)+'</li>').join("")+'</'+k+'>';
    if(k==="ar") return '<div class="ilar"><div class="arbox"><div class="ar" lang="ar">'+esc(v)+'</div></div><p class="ok">'+esc(o)+'</p><p class="ml">'+esc(m)+'</p></div>';
    if(k==="tbl") return '<div class="tablewrap"><table class="iltbl"><thead><tr>'+v.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+o.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
    return "";
  }).join("");
}
function ilmBody(a){
  if(a.special==="kil") return viewKil();
  if(a.special==="rekat") return viewRekat();
  if(a.special==="abdest") return viewAbdest();
  if(a.special==="farz") return viewFarz();
  return ilmBlocks(a.b);
}
function ilmCard(a){
  const open = ilmAcik.has(a.id);
  return '<details class="card dua ilcard" data-ilm="'+a.id+'"'+(open?' open':'')+'><summary><span>'+esc(a.t)+'<small>'+esc(a.s)+'</small></span><span class="chev">'+I.chev+'</span></summary><div class="body ilbody">'+(open?ilmBody(a):'')+'</div></details>';
}
function viewRehber(){
  const kat = S.ilmKat || "";
  const q = trNorm(ilmQ.trim());
  let list = ILMIHAL;
  if(kat) list = list.filter(a=>a.k===kat);
  if(q) list = list.filter(a=>q.split(/\s+/).every(w=>a.key.includes(w)));
  const count = k => ILMIHAL.filter(a=>a.k===k).length;
  const katIcon = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><path d="'+d+'"/></svg>';
  let res;
  if(!list.length) res = '<div class="card empty">“'+esc(ilmQ.trim())+'” ile ilgili konu bulunamadı. Başka bir kelime deneyin: abdest, oruç, zekât, kurban…</div>';
  else if(!kat && !q) res = ILM_KAT.map(([k,l])=>'<div class="tsec"><h2>'+l+' <small>'+count(k)+' konu</small></h2><div class="list">'+ILMIHAL.filter(a=>a.k===k).map(ilmCard).join("")+'</div></div>').join("");
  else res = '<div class="list">'+list.map(ilmCard).join("")+'</div>';
  return '<section class="view">'+
    '<div class="hsearch"><span class="hsi">'+I.search+'</span><input id="ilmQ" type="search" autocomplete="off" placeholder="İlmihalde ara: abdest, kaza, nisap…" value="'+esc(ilmQ)+'" aria-label="İlmihalde ara"></div>'+
    '<div class="katgrid" role="group" aria-label="Bölümler">'+
      '<button class="kat" data-kat="" aria-pressed="'+(!kat)+'">'+katIcon("M4 6h16M4 12h16M4 18h16")+'<b>Tümü</b><small>'+ILMIHAL.length+' konu</small></button>'+
      ILM_KAT.map(([k,l,d])=>'<button class="kat" data-kat="'+k+'" aria-pressed="'+(kat===k)+'">'+katIcon(d)+'<b>'+l+'</b><small>'+count(k)+' konu</small></button>').join("")+'</div>'+
    ((kat||q)?'<div class="toolbar"><span class="note">'+list.length+' konu'+(kat?' · '+esc(ILM_KAT.find(x=>x[0]===kat)[1]):'')+'</span><button class="change" id="ilmClear">Temizle</button></div>':'')+
    '<div id="ilmRes">'+res+'</div>'+
    '<p class="note">Bilgiler Hanefî mezhebine göre, Diyanet ilmihali esas alınarak özet olarak hazırlanmıştır. Ayrıntılı ve kişisel durumlar için güvendiğiniz bir hocaya danışın.</p></section>';
}
document.getElementById("main").addEventListener("toggle",e=>{
  const el=e.target; if(!el.dataset || !el.dataset.ilm) return;
  const a=ILMIHAL.find(x=>x.id===el.dataset.ilm);
  if(el.open){ ilmAcik.add(a.id); const bd=el.querySelector(".ilbody"); if(bd && !bd.innerHTML) bd.innerHTML=ilmBody(a); } else ilmAcik.delete(a.id);

    '<div class="card"><h2 class="sec" style="margin-bottom:4px">Mübarek gün ve geceler</h2><p class="note" style="margin-bottom:6px">Diyanet takvimine göre. Kandiller bir önceki günün akşamından itibaren idrak edilir.</p>'+

/* ================= KIBLE ================= */
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
function qibla(lat,lon){
  const p1=rad(lat), p2=rad(KABE.lat), dl=rad(KABE.lon-lon);
  const b=deg(Math.atan2(Math.sin(dl)*Math.cos(p2), Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)));
  const a=Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return {bearing:(b+360)%360, km:6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))};
}
const yon=b=>["kuzey","kuzeydoğu","doğu","güneydoğu","güney","güneybatı","batı","kuzeybatı"][Math.round(b/45)%8];
let heading=null, compassOn=false, kibleMsg="";
function dialSVG(bearing){
  const rot = heading==null ? 0 : -heading;
  let s='<svg viewBox="0 0 300 300" aria-label="Kıble yönü göstergesi"><g id="dialRot" transform="rotate('+rot.toFixed(1)+' 150 150)">';
  s+='<circle class="dbg" cx="150" cy="150" r="138" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>';
  for(let i=0;i<72;i++){ const a=rad(i*5), big=i%18===0, mid=i%6===0, r1=138, r2=big?120:mid?126:131;
    s+='<line x1="'+(150+r1*Math.sin(a)).toFixed(1)+'" y1="'+(150-r1*Math.cos(a)).toFixed(1)+'" x2="'+(150+r2*Math.sin(a)).toFixed(1)+'" y2="'+(150-r2*Math.cos(a)).toFixed(1)+'" stroke="var(--muted)" stroke-width="'+(big?2:1)+'"/>'; }
  [["K",0],["D",90],["G",180],["B",270]].forEach(([t,a])=>{ s+='<text x="'+(150+104*Math.sin(rad(a))).toFixed(1)+'" y="'+(150-104*Math.cos(rad(a))+6).toFixed(1)+'" text-anchor="middle" font-size="17" font-weight="700" fill="'+(t==="K"?'var(--coral)':'var(--muted)')+'" font-family="Bricolage Grotesque, system-ui, sans-serif">'+t+'</text>'; });
  s+='<g transform="rotate('+bearing.toFixed(1)+' 150 150)"><path class="qarrow" d="M150 36 L161 150 L150 162 L139 150 Z" fill="var(--cobalt)"/><path d="M150 162 L161 150 L150 232 L139 150 Z" fill="var(--bead-off)"/><rect x="138" y="22" width="24" height="24" rx="3" fill="var(--ink)"/><rect x="138" y="28" width="24" height="3" fill="var(--coral)"/></g>';
  s+='<circle cx="150" cy="150" r="7" fill="var(--ink)"/></g><path class="qtop" d="M150 4 L157 16 L143 16 Z" fill="var(--coral)"/></svg>';
  return s;
}
const FEET_SVG='<svg viewBox="0 0 80 64" width="74" height="60"><g class="foot" transform="translate(25 36) rotate(-8) scale(-1 1)"><path d="M0 -14c6 0 8 6 7 13-1 6-2 9-1 14 1 5-2 9-6 9s-7-4-6-9c1-5 0-8-1-13-1-8 1-14 7-14z"/><circle cx="-5" cy="-21" r="2.6"/><circle cx="-0.5" cy="-23.5" r="2.4"/><circle cx="3.8" cy="-22.5" r="2.1"/><circle cx="7" cy="-19.5" r="1.8"/><circle cx="9" cy="-15.8" r="1.5"/></g><g class="foot" transform="translate(55 36) rotate(8)"><path d="M0 -14c6 0 8 6 7 13-1 6-2 9-1 14 1 5-2 9-6 9s-7-4-6-9c1-5 0-8-1-13-1-8 1-14 7-14z"/><circle cx="-5" cy="-21" r="2.6"/><circle cx="-0.5" cy="-23.5" r="2.4"/><circle cx="3.8" cy="-22.5" r="2.1"/><circle cx="7" cy="-19.5" r="1.8"/><circle cx="9" cy="-15.8" r="1.5"/></g></svg>';
let qBearing=0, qFound=false;
function foundBell(){ if(!S.settings.sound) return; tone(659,0,0.5,0.24); tone(880,0.14,0.55,0.22); tone(1319,0.28,0.9,0.18); }
function updateQibla(){
  if(heading==null) return;
  const dial=document.getElementById("dial"), st=document.getElementById("qStatus"); if(!dial||!st) return;
  let d=((qBearing-heading)%360+540)%360-180;
  const ad=Math.abs(d);
  if(!qFound && ad<=5){ qFound=true; vibrate([200,80,200]); foundBell(); }
  else if(qFound && ad>10){ qFound=false; }
  dial.classList.toggle("found",qFound); dial.parentElement.classList.toggle("found",qFound);
  st.innerHTML = qFound ? '<b>Kıbleye döndünüz</b>' : (d>0?'Sağa dönün · ':'Sola dönün · ')+Math.round(ad)+'°';
}
function viewKible(){
  const p=place(), q=qibla(p.lat,p.lon); qBearing=q.bearing; qFound=false;
  return '<section class="view">'+
    '<div class="card" style="display:grid;gap:10px"><label class="label" for="citySelK">Konum</label>'+citySelect("citySelK")+
      '<div class="actions"><button class="btn" id="geoBtn">Konumumu bul</button><button class="btn primary" id="compassBtn">'+(compassOn?"Pusula açık":"Pusulayı başlat")+'</button></div>'+
      ((kibleMsg||geoMsg)?'<p class="note warn" role="status">'+esc(kibleMsg||geoMsg)+'</p>':'')+'</div>'+
    '<div class="dialwrap"><div class="dial" id="dial">'+dialSVG(q.bearing)+'</div>'+
      '<div class="feet" aria-hidden="true">'+FEET_SVG+'</div>'+
      '<div class="qstatus" id="qStatus" role="status">'+(heading==null?'Pusulayı başlatın, telefonu yere paralel tutun':'')+'</div></div>'+
    '<div class="qnum"><div class="big">'+q.bearing.toFixed(1)+'°</div><div class="sub">'+esc(p.name)+' için kuzeyden saat yönünde · '+yon(q.bearing)+' · Kâbe\'ye '+fmt(Math.round(q.km))+' km</div></div>'+
    '<div class="card"><p class="note">'+(heading==null
      ? 'Telefonunuzun pusula uygulamasını açın ve <b style="color:var(--ink)">'+q.bearing.toFixed(0)+'°</b> yönüne dönün. Pusula sensörü çalıştığında ok kendiliğinden kıbleyi gösterir.'
      : 'Telefonu yere paralel tutun. Mavi ok üstteki kırmızı işarete geldiğinde kıbleye dönmüşsünüz demektir. Metal eşyalardan ve mıknatıstan uzak durun.')+'</p></div></section>';
}
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading;
  else if(e.absolute && typeof e.alpha==="number") h=(360-e.alpha)%360;
  if(h==null) return;
  heading=h; const g=document.getElementById("dialRot"); if(g) g.setAttribute("transform","rotate("+(-h).toFixed(1)+" 150 150)");
  updateQibla();
}
async function startCompass(){
  kibleMsg="";
  try{
    if(typeof DeviceOrientationEvent==="undefined") throw new Error("yok");
    if(typeof DeviceOrientationEvent.requestPermission==="function"){ const r=await DeviceOrientationEvent.requestPermission(); if(r!=="granted") throw new Error("izin"); }
    window.addEventListener("deviceorientationabsolute",onOrient,true); window.addEventListener("deviceorientation",onOrient,true);
    compassOn=true;
    setTimeout(()=>{ if(compassOn && heading==null){ kibleMsg="Pusula sensörüne ulaşılamadı. Telefon pusulasıyla gösterilen dereceye dönebilirsiniz."; if(tab==="kible") render(); } },2500);
  }catch(e){ kibleMsg="Pusula sensörüne ulaşılamadı. Telefon pusulasıyla gösterilen dereceye dönebilirsiniz."; }
  render();
}
function stopCompass(){ window.removeEventListener("deviceorientationabsolute",onOrient,true); window.removeEventListener("deviceorientation",onOrient,true); compassOn=false; heading=null; kibleMsg=""; }
function findGeo(){
  geoMsg="";
  if(!navigator.geolocation){ geoMsg="Konum alınamadı. Listeden şehrinizi seçin."; render(); return; }
  toast("Konum aranıyor…");
  navigator.geolocation.getCurrentPosition(pos=>{ S.coords={lat:pos.coords.latitude,lon:pos.coords.longitude}; S.city="konum"; save(); render(); updateBand(); toast("Konum bulundu"); },
    ()=>{ geoMsg="Konum izni verilmedi ya da alınamadı. Listeden şehrinizi seçin."; render(); }, {enableHighAccuracy:false,timeout:8000,maximumAge:600000});
}

function viewIstatistik(){
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const o=S.daily[todayKey(d)]||{}; days.push({d, n:Object.values(o).reduce((a,b)=>a+b,0)}); }
  const max=Math.max(1,...days.map(x=>x.n));
  const totals={}; Object.values(S.daily).forEach(o=>Object.entries(o).forEach(([id,n])=>totals[id]=(totals[id]||0)+n));
  const all=Object.values(totals).reduce((a,b)=>a+b,0), week=days.reduce((a,b)=>a+b.n,0);
  const gun=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
  let streak=0; for(let i=0;i<3650;i++){ const d=new Date(); d.setDate(d.getDate()-i); const o=S.daily[todayKey(d)]; if(o && Object.keys(o).length) streak++; else if(i===0) continue; else break; }
  const ranked=Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return '<section class="view"><button class="back" data-go="sayac">‹ Sayaca dön</button><div class="tiles"><div class="tile"><b>'+fmt(days[6].n)+'</b><span>Bugün</span></div><div class="tile"><b>'+fmt(week)+'</b><span>Son 7 gün</span></div><div class="tile"><b>'+streak+'</b><span>Gün serisi</span></div></div>'+
    '<div class="card"><div class="label">Son 7 gün</div>'+(week?'<div class="bars">'+days.map((x,i)=>'<div class="bar'+(i===6?' today':'')+'"><em>'+(x.n?fmt(x.n):"")+'</em><i style="height:'+(x.n/max*100).toFixed(1)+'%"></i><small>'+(i===6?"Bugün":gun[x.d.getDay()])+'</small></div>').join("")+'</div>'
      :'<p class="empty">Henüz sayım yok. Sayaç sekmesinde ilk zikrinizi çektiğinizde burada görünür.</p>')+'</div>'+
    '<div class="card"><div class="label" style="margin-bottom:10px">Zikre göre toplam · '+fmt(all)+'</div>'+(ranked.length?'<div class="rank">'+ranked.map(([id,n])=>'<div><span>'+esc(nameOf(id))+'</span><b>'+fmt(n)+'</b></div>').join("")+'</div>':'<p class="empty">Zikir çektikçe liste dolacak.</p>')+'</div></section>';
}

function render(){
  renderTabs();
  requestAnimationFrame(()=>{ const on=document.querySelector(".steps .on"); if(on){ const p=on.parentElement; p.scrollLeft=on.offsetLeft-p.clientWidth/2+on.offsetWidth/2; } });
  const html = ({takvim:viewTakvim, mubarek:viewMubarek, nafile:viewNafile, hatirlatici:viewHatirlatici, kaza:viewKaza, esma:viewEsma, sayac:viewSayac, vakitler:viewVakitler, dualar:viewDualar, hadisler:viewHadisler, rehber:viewRehber, kible:viewKible, tesbihler:viewTesbihler, zikirler:viewZikirler, istatistik:viewIstatistik}[tab])();
  if(tab==="sayac") main.innerHTML = html;
  else { const z=S.fs||1; main.innerHTML = fsBar(z)+'<div class="zoomwrap" style="zoom:'+z+'">'+html+'</div>'; }
}
main.addEventListener("click",e=>{
  const t=e.target.closest && e.target.closest("#tap"); if(!t) return;
  if(e.detail!==0){ const r=t.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; if(Math.hypot(e.clientX-cx,e.clientY-cy) > r.width/2) return; }
  doTap();
  if(e.detail===0) setTimeout(()=>{ const n=document.getElementById("tap"); n&&n.focus(); },0);
});
function openHadis(i){
  hQuery=""; hKonu=""; hFav=false; go("hadisler");
  const el=document.getElementById("hadis-"+i);
  if(el){ el.scrollIntoView({block:"center"}); el.classList.add("hl"); }
}
main.addEventListener("keydown",e=>{ const hc=e.target.closest&&e.target.closest("[data-hadis]"); if(hc && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openHadis(+hc.dataset.hadis); } });
main.addEventListener("click",e=>{
  const hc=e.target.closest("[data-hadis]"); if(hc){ openHadis(+hc.dataset.hadis); return; }
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.mode){ S.mode=b.dataset.mode; confirmReset=false; save(); render(); return; }
  if(b.dataset.open){ const it=tById(b.dataset.open); if(!it) return; S.diger=it.id; S.mode="diger"; save(); go("sayac"); return; }
  if(b.dataset.met){ S.method=b.dataset.met; save(); render(); updateBand(); return; }
  if(b.dataset.go){ go(b.dataset.go); return; }
  if(b.dataset.pick){ S.current=b.dataset.pick; S.mode="serbest"; save(); go("sayac"); return; }
  if(b.dataset.del){ S.custom=S.custom.filter(z=>z.id!==b.dataset.del); if(S.current===b.dataset.del) S.current="subhanallah"; save(); render(); toast("Zikir silindi"); return; }
  if(b.dataset.grup){ S.duaGrup=b.dataset.grup; save(); render(); return; }
  if(b.dataset.kat!==undefined && tab==="rehber"){ S.ilmKat=b.dataset.kat; save(); render(); return; }
  if(b.id==="ilmClear"){ S.ilmKat=""; ilmQ=""; save(); render(); return; }
  if(b.dataset.dua){ showDua(b.dataset.dua); return; }
  if(b.dataset.fav){ const i=+b.dataset.fav; S.favH=S.favH||[]; const k=S.favH.indexOf(i); if(k>=0) S.favH.splice(k,1); else S.favH.push(i); save(); refreshHadis(); toast(k>=0?"Favorilerden çıkarıldı":"Favorilere eklendi"); return; }
  if(b.dataset.konu!==undefined && tab==="hadisler"){ hKonu = hKonu===b.dataset.konu ? "" : b.dataset.konu; hFav=false; refreshHadis(); if(!b.classList.contains("chip")) window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(b.dataset.hfav){ hFav=!hFav; hKonu=""; refreshHadis(); return; }
  if(b.id==="hClear"){ hQuery=""; hKonu=""; hFav=false; const q=document.getElementById("hQ"); if(q) q.value=""; refreshHadis(); return; }
  if(b.dataset.fs){ const z=+(Math.min(FS_MAX,Math.max(FS_MIN,(S.fs||1)+(+b.dataset.fs)*0.1))).toFixed(2); if(z===(S.fs||1)){ toast(z>=FS_MAX?"En büyük boyuttasınız":"En küçük boyuttasınız"); return; } const y=window.scrollY, r=y/Math.max(1,document.body.scrollHeight); S.fs=z; save(); render(); window.scrollTo(0, r*document.body.scrollHeight); return; }
  if(b.dataset.tk!==undefined){ takvimOff = b.dataset.tk==="0" ? 0 : takvimOff+(+b.dataset.tk); render(); return; }
  if(b.dataset.yuz){ takvimYuz=b.dataset.yuz; render(); return; }
  if(b.id==="izinIste"){ izinIste(); return; }
  if(b.id==="remTest"){ ac(); bildir("Deneme hatırlatması","Hatırlatıcılar bu şekilde görünecek.","hatirlatici"); return; }
  if(b.dataset.kz){ S.kaza ||= {}; const k=b.dataset.kz; S.kaza[k]=Math.max(0,(S.kaza[k]||0)+(+b.dataset.kzd)); save(); render(); if(+b.dataset.kzd<0) toast("Kabul olsun"); return; }
  if(b.dataset.opennext){ openNext(); return; }
  if(b.dataset.play){ e.preventDefault(); ac(); startPlay(b.dataset.play); return; }
  if(b.dataset.hiz){ S.hiz=+b.dataset.hiz; save(); if(player.audio){ player.audio.defaultPlaybackRate=player.audio.playbackRate=S.hiz; } document.querySelectorAll("[data-hiz]").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.hiz===S.hiz))); return; }
  if(b.dataset.gor){ S.surahGor=b.dataset.gor; save(); const y=window.scrollY; render(); window.scrollTo(0,y); playMark(); return; }
  if(b.dataset.target){
    if(b.dataset.target==="custom"){ const c=document.getElementById("customT"); c.hidden=!c.hidden; if(!c.hidden) document.getElementById("customTInput").focus(); return; }
    S.targets[curId()]=+b.dataset.target; const c=ctr(curId()); if(c.count>+b.dataset.target) c.count=0; save(); render(); return;
  }
  switch(b.id){
    case "customTOk": { const v=parseInt(document.getElementById("customTInput").value,10); if(!(v>0&&v<=100000)){ toast("1 ile 100.000 arası bir sayı girin"); return; } S.targets[curId()]=v; const c=ctr(curId()); if(c.count>v) c.count=0; save(); render(); toast("Hedef "+fmt(v)); return; }
    case "undo": doUndo(); return;
    case "reset": confirmReset=true; render(); return;
    case "noReset": confirmReset=false; render(); return;
    case "yesReset": doReset(); return;
    case "geoBtn": findGeo(); return;
    case "compassBtn": if(!compassOn) startCompass(); return;
    case "arMinus": case "arPlus": { S.arScale=Math.min(1.6,Math.max(0.8,+(S.arScale+(b.id==="arPlus"?0.1:-0.1)).toFixed(1))); document.documentElement.style.setProperty("--ar-scale",S.arScale); save(); return; }
  }
});
main.addEventListener("change",e=>{
  const el=e.target; S.rem ||= {};
  if(el.dataset.rem){ const id=el.dataset.rem; S.rem[id]=Object.assign({},S.rem[id]||{},{on:el.checked}); save();
    if(el.checked && "Notification" in window && Notification.permission==="default"){ Notification.requestPermission().then(()=>{ if(tab==="hatirlatici") render(); }).catch(()=>{}); }
    toast(el.checked?"Hatırlatıcı açıldı":"Hatırlatıcı kapatıldı"); if(tab==="hatirlatici") render(); return; }
  if(el.dataset.remoff){ const id=el.dataset.remoff; S.rem[id]=Object.assign({},S.rem[id]||{},{off:+el.value}); save(); render(); return; }
  if(el.dataset.remtime){ const id=el.dataset.remtime; if(el.value){ S.rem[id]=Object.assign({},S.rem[id]||{},{time:el.value}); save(); render(); } return; }
  if(el.dataset.kzset){ S.kaza ||= {}; S.kaza[el.dataset.kzset]=Math.max(0,parseInt(el.value,10)||0); save(); render(); return; }
  if(e.target.classList.contains("citySel")){ S.city=e.target.value; geoMsg=""; save(); render(); updateBand(); }
  if(e.target.id==="namazSel"){ S.namaz=e.target.value; save(); render(); }
});
main.addEventListener("submit",e=>{
  if(e.target.id!=="addForm") return; e.preventDefault();
  const tr=document.getElementById("newTr").value.trim(); if(!tr) return;
  const h=parseInt(document.getElementById("newHedef").value,10);
  const z={id:"c"+Date.now().toString(36), tr, mn:document.getElementById("newMn").value.trim(), hedef:(h>0&&h<=100000)?h:33, custom:true};
  S.custom.push(z); S.current=z.id; S.mode="serbest"; save(); toast("Eklendi, sayaçta açıldı"); go("sayac");
});

applyTheme(); render(); updateBand(); applyWake();
if("serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
if(S.lastVer && S.lastVer!==APP_VER) setTimeout(()=>toast("Uygulama "+APP_VER+" sürümüne güncellendi"),900);
if(S.lastVer!==APP_VER){ S.lastVer=APP_VER; save(); }
})();
</script>
</body>
</html>
