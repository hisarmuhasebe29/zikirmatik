ermek isterse; kim sizin için bir şeye sahip olabilir? Oysa hayır! Allah yapmakta olduklarınızdan haberdardır.\"",""],[12,"بَلْ ظَنَنتُمْ أَن لَّن يَنقَلِبَ ٱلرَّسُولُ وَٱلْمُؤْمِنُونَ إِلَىٰٓ أَهْلِيهِمْ أَبَدًا وَزُيِّنَ ذَٰلِكَ فِى قُلُوبِكُمْ وَظَنَنتُمْ ظَنَّ ٱلسَّوْءِ وَكُنتُمْ قَوْمًۢا بُورًا","Bal zanantum allay yankalibar-rasûlu vel-mu'minûna ilâ ahlîhim abadav ve zuyyina zâlika fî kulûbikum ve zanantum zannas-sav', ve kuntum kavmam bûrâ.","Aslında siz Peygamberin ve Müminlerin ailelerine bir daha dönmeyeceklerini sanmıştınız. Bu sizin gönüllerinize güzel göründü de kötü zanda bulundunuz ve helâkı hak etmiş bir topluluk oldunuz.",""],[13,"وَمَن لَّمْ يُؤْمِنۢ بِٱللَّهِ وَرَسُولِهِۦ فَإِنَّآ أَعْتَدْنَا لِلْكَٰفِرِينَ سَعِيرًا","Ve mal lam yu'mim billâhi ve rasûlihî fa'innâ a'tadnâ lil-kâfirîna sa'îrâ.","Kim Allah’a ve Peygamberine iman etmezse, biz o kâfirlere alevli bir ateş hazırladık.",""],[14,"وَلِلَّهِ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ وَكَانَ ٱللَّهُ غَفُورًا رَّحِيمًا","Ve lillâhi mulkus-samâvâti vel-ard, yagfiru limay yaşâ'u ve yu'azzibu may yaşâ', ve kânallâhu gafûrar rahîmâ.","Göklerin ve yerin mülkü Allah’a aittir. Dilediğini bağışlar, dilediğini cezalandırır. Allah çokça bağışlayıcıdır, çokça merhametlidir.",""],[15,"سَيَقُولُ ٱلْمُخَلَّفُونَ إِذَا ٱنطَلَقْتُمْ إِلَىٰ مَغَانِمَ لِتَأْخُذُوهَا ذَرُونَا نَتَّبِعْكُمْ يُرِيدُونَ أَن يُبَدِّلُوا۟ كَلَٰمَ ٱللَّهِ قُل لَّن تَتَّبِعُونَا كَذَٰلِكُمْ قَالَ ٱللَّهُ مِن قَبْلُ فَسَيَقُولُونَ بَلْ تَحْسُدُونَنَا بَلْ كَانُوا۟ لَا يَفْقَهُونَ إِلَّا قَلِيلًا","Sayakûlul-muhallafûna izantalaktum ilâ magânima lita'huzûhâ zarûnâ nattabi'kum, yurîdûna ay yubaddilû kalâmallâh, kul lan tattabi'ûnâ kazâlikum kâlallâhu min kabl, fasayakûlûna bal tahsudûnanâ, bal kânû lâ yafkahûna illâ kalîlâ.","Geride kalanlar, siz ganimetleri almaya giderken diyecekler ki: \"Bizi bırakın da size uyalım/ardınızdan gelelim.\" Allah’ın sözünü değiştirmek istiyorlar. De ki: Asla bizim ardımızdan gelmeyeceksiniz. Daha önce Allah da böyle buyurmuştu. Hayır! Siz bizi çekemiyorsunuz/kıskanıyorsunuz, diyecekler. Hayır! Onlar pek az anlarlar.",""],[16,"قُل لِّلْمُخَلَّفِينَ مِنَ ٱلْأَعْرَابِ سَتُدْعَوْنَ إِلَىٰ قَوْمٍ أُو۟لِى بَأْسٍ شَدِيدٍ تُقَٰتِلُونَهُمْ أَوْ يُسْلِمُونَ فَإِن تُطِيعُوا۟ يُؤْتِكُمُ ٱللَّهُ أَجْرًا حَسَنًا وَإِن تَتَوَلَّوْا۟ كَمَا تَوَلَّيْتُم مِّن قَبْلُ يُعَذِّبْكُمْ عَذَابًا أَلِيمًا","Kul lil-muhallafîna minal-a'râbi satud'avna ilâ kavmin ulî ba'sin şadîdin tukâtilûnahum av yuslimûn, fa'in tutî'û yu'tikumullâhu acran hasanâ, ve in tatavallav kamâ tavallaytum min kablu yu'azzibkum 'azâban alîmâ.","Bedevilerden (seferden) geri kalanlara de ki: \"Çok güçlü bir kavme karşı savaşmak için çağrılacaksınız ya da onlar Müslüman olacaklar. Eğer itaat ederseniz, Allah size güzel bir mükâfat verir. Eğer daha önce yüz çevirdiğiniz gibi yüz çevirirseniz, sizi acı bir azapla cezalandırır.\"",""],[17,"لَّيْسَ عَلَى ٱلْأَعْمَىٰ حَرَجٌ وَلَا عَلَى ٱلْأَعْرَجِ حَرَجٌ وَلَا عَلَى ٱلْمَرِيضِ حَرَجٌ وَمَن يُطِعِ ٱللَّهَ وَرَسُولَهُۥ يُدْخِلْهُ جَنَّٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ وَمَن يَتَوَلَّ يُعَذِّبْهُ عَذَابًا أَلِيمًا","Laysa 'alal-a'mâ haracuv ve lâ 'alal-a'raci haracuv ve lâ 'alal-marîdi harac, ve may yuti'illâha ve rasûlahû yudhilhu cannâtin tacrî min tahtihal-anhâr, ve may yatavalla yu'azzibhu 'azâban alîmâ.","Kör olana güçlük (sorumluluk) yoktur, topal olana güçlük yoktur ve hasta olana da güçlük yoktur. Kim Allah'a ve resulüne itaat ederse, (Allah) onu, altından ırmaklar akan cennetlere sokar. Kim de yüz çevirirse onu da acı bir azapla cezalandırır.",""],[18,"لَّقَدْ رَضِىَ ٱللَّهُ عَنِ ٱلْمُؤْمِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ ٱلشَّجَرَةِ فَعَلِمَ مَا فِى قُلُوبِهِمْ فَأَنزَلَ ٱلسَّكِينَةَ عَلَيْهِمْ وَأَثَٰبَهُمْ فَتْحًا قَرِيبًا","Lakad radiyallâhu 'anil-mu'minîna iz yubâyi'ûnaka tahtaş-şacarati fa'alima mâ fî kulûbihim fa'anzalas-sakînata 'alayhim ve asâbahum fathan karîbâ.","Muhakkak o ağacın altında sana biat ederlerken Allah, o Müminlerden razı olmuştur. Kalplerinde olanı bilmiş, üzerlerine huzur indirmiş ve onlara yakın bir fetih vermiştir.",""],[19,"وَمَغَانِمَ كَثِيرَةً يَأْخُذُونَهَا وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا","Ve magânima kasîratay ya'huzûnahâ, ve kânallâhu 'azîzan hakîmâ.","Ve alacakları birçok ganimetlerle de. Allah Azîzdir, Hakîmdir.",""],[20,"وَعَدَكُمُ ٱللَّهُ مَغَانِمَ كَثِيرَةً تَأْخُذُونَهَا فَعَجَّلَ لَكُمْ هَٰذِهِۦ وَكَفَّ أَيْدِىَ ٱلنَّاسِ عَنكُمْ وَلِتَكُونَ ءَايَةً لِّلْمُؤْمِنِينَ وَيَهْدِيَكُمْ صِرَٰطًا مُّسْتَقِيمًا","Ve'adakumullâhu magânima kasîratan ta'huzûnahâ fa'accala lakum hâzihî ve kaffa aydiyan-nâsi 'ankum, ve litakûna âyatal lil-mu'minîna ve yahdiyakum sirâtam mustakîmâ.","Allah, size elde edeceğiniz bir çok ganimet vaadi vermiştir. Bunu sizin için çabuklaştırmış ve Müminlere bir işaret olması, sizin de doğru yolu bulmanız için insanların ellerini sizden çekmiştir.",""],[21,"وَأُخْرَىٰ لَمْ تَقْدِرُوا۟ عَلَيْهَا قَدْ أَحَاطَ ٱللَّهُ بِهَا وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرًا","Ve uhrâ lam takdirû 'alayhâ kad ahâtallâhu bihâ, ve kânallâhu 'alâ kulli şay'in kadîrâ.","Henüz elde edemediğiniz başka ganimetler de vardır ki, onları Allah kuşatmıştır. Allah’ın her şeye gücü yeter.",""],[22,"وَلَوْ قَٰتَلَكُمُ ٱلَّذِينَ كَفَرُوا۟ لَوَلَّوُا۟ ٱلْأَدْبَٰرَ ثُمَّ لَا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا","Ve lav kâtalakumul-lazîna kafarû lavallavul-adbâra summa lâ yacidûna valiyyav ve lâ nasîrâ.","Kâfirler sizinle savaşmış olsalardı, arkalarını dönüp kaçarlardı da bir dost ve yardımcı bulamazlardı.",""],[23,"سُنَّةَ ٱللَّهِ ٱلَّتِى قَدْ خَلَتْ مِن قَبْلُ وَلَن تَجِدَ لِسُنَّةِ ٱللَّهِ تَبْدِيلًا","Sunnatallâhil-latî kad halat min kabl, ve lan tacida lisunnatillâhi tabdîlâ.","(Bu,) Allah'ın öteden beri süregelen sünnetidir. Sen Allah'ın sünnetinde kesinlikle hiç bir değişiklik bulamazsın.",""],[24,"وَهُوَ ٱلَّذِى كَفَّ أَيْدِيَهُمْ عَنكُمْ وَأَيْدِيَكُمْ عَنْهُم بِبَطْنِ مَكَّةَ مِنۢ بَعْدِ أَنْ أَظْفَرَكُمْ عَلَيْهِمْ وَكَانَ ٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرًا","Ve huval-lazî kaffa aydiyahum 'ankum ve aydiyakum 'anhum bibatni makkata mim ba'di an azfarakum 'alayhim, ve kânallâh bimâ ta'malûna basîrâ.","Sizi onlara karşı zafere ulaştırdıktan sonra, Mekke’nin içinde (Hudeybiye'de) onların ellerini sizden, sizin elinizi de onlardan çeken O’dur. Allah, bütün işlediğiniz amelleri hakkıyla görendir.",""],[25,"هُمُ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوكُمْ عَنِ ٱلْمَسْجِدِ ٱلْحَرَامِ وَٱلْهَدْىَ مَعْكُوفًا أَن يَبْلُغَ مَحِلَّهُۥ وَلَوْلَا رِجَالٌ مُّؤْمِنُونَ وَنِسَآءٌ مُّؤْمِنَٰتٌ لَّمْ تَعْلَمُوهُمْ أَن تَطَـُٔوهُمْ فَتُصِيبَكُم مِّنْهُم مَّعَرَّةٌۢ بِغَيْرِ عِلْمٍ لِّيُدْخِلَ ٱللَّهُ فِى رَحْمَتِهِۦ مَن يَشَآءُ لَوْ تَزَيَّلُوا۟ لَعَذَّبْنَا ٱلَّذِينَ كَفَرُوا۟ مِنْهُمْ عَذَابًا أَلِيمًا","Humul-lazîna kafarû ve saddûkum 'anil-mascidil-harâmi vel-hadya ma'kûfan ay yabluga mahillah, ve lav lâ ricâlum mu'minûna ve nisâ'um mu'minâtul lam ta'lamûhum an tata'ûhum fa tusîbakum minhum ma'arratum bigayri 'ilm, liyudhilallâhu fî rahmatihî may yaşâ', lav tazayyalû la'azzabnal-lazîna kafarû minhum 'azâban alîmâ.","Onlar, sizin Kâbe’yi ziyaret etmenize ve bekletilen kurbanların yerlerine ulaşmasına engel olan kâfirlerdir. Eğer, oradaki henüz tanımadığınız iman etmiş erkeklerle iman etmiş kadınları bilmeyerek ezmeniz ve böylece size bir vebal gelecek olmasaydı, (Allah, Mekke’ye girmenize izin verirdi). Allah, dilediğini rahmetine koymak için böyle yapmıştır. Eğer (Müminler) seçilip ayrılmış olsalardı elbette kâfirleri elem verici bir azaba çarptırırdık.",""],[26,"إِذْ جَعَلَ ٱلَّذِينَ كَفَرُوا۟ فِى قُلُوبِهِمُ ٱلْحَمِيَّةَ حَمِيَّةَ ٱلْجَٰهِلِيَّةِ فَأَنزَلَ ٱللَّهُ سَكِينَتَهُۥ عَلَىٰ رَسُولِهِۦ وَعَلَى ٱلْمُؤْمِنِينَ وَأَلْزَمَهُمْ كَلِمَةَ ٱلتَّقْوَىٰ وَكَانُوٓا۟ أَحَقَّ بِهَا وَأَهْلَهَا وَكَانَ ٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمًا","Iz ca'alal-lazîna kafarû fî kulûbihimul-hamiyyata hamiyyatal-câhiliyyati fa anzalallâhu sakînatahû 'alâ rasûlihî ve 'alal-mu'minîna ve alzamahum kalimatat-takvâ ve kânû ahakka bihâ ve ahlahâ, ve kânallâhu bikulli şay'in 'alîmâ.","Zira kâfirler, kalplerine taassubu/bağnazlığı, (hem de) cahiliye bağnazlığını yerleştirmişlerdi. Allah da Rasûlüne ve Müminlere sükûnet ve güvenini indirdi, onları takva sözüne (kelime-i tevhide) bağlı kıldı. Zaten onlar buna layık ve ehil kimselerdi. Allah her şeyi bilendir.",""],[27,"لَّقَدْ صَدَقَ ٱللَّهُ رَسُولَهُ ٱلرُّءْيَا بِٱلْحَقِّ لَتَدْخُلُنَّ ٱلْمَسْجِدَ ٱلْحَرَامَ إِن شَآءَ ٱللَّهُ ءَامِنِينَ مُحَلِّقِينَ رُءُوسَكُمْ وَمُقَصِّرِينَ لَا تَخَافُونَ فَعَلِمَ مَا لَمْ تَعْلَمُوا۟ فَجَعَلَ مِن دُونِ ذَٰلِكَ فَتْحًا قَرِيبًا","Lakad sadakallâhu rasûlahur-ru'yâ bil-hakk, latadhulunnal-mascidal-harâma in şâ'allâhu âminîn, muhallikîna ru'ûsakum ve mukassirîn, lâ tahâfûn, fa'alima mâ lam ta'lamû faca'ala min dûni zâlika fathan karîbâ.","Evet! Allah, elçisinin rüyasını hakkıyla doğruladı. Allah’ın dilemesiyle güven içinde, başlarınızı tıraş etmiş ve saçlarınızı kısaltmış olarak, korkusuzca Mescid-i Haram’a gireceksiniz. Allah, sizin bilmediğinizi bilir. Oraya girmeden önce de yakın bir fetih vermiştir.",""],[28,"هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ وَكَفَىٰ بِٱللَّهِ شَهِيدًا","Huval-lazî arsala rasûlahû bil-hudâ ve dînil-hakki liyuzhirahû 'alad-dîni kullih, ve kafâ billâhi şahîdâ.","Bütün dinlerden üstün kılmak üzere, Peygamberini hidayet ve hak din ile gönderen O'dur. Şahit olarak Allah yeter.",""],[29,"مُّحَمَّدٌ رَّسُولُ ٱللَّهِ وَٱلَّذِينَ مَعَهُۥٓ أَشِدَّآءُ عَلَى ٱلْكُفَّارِ رُحَمَآءُ بَيْنَهُمْ تَرَىٰهُمْ رُكَّعًا سُجَّدًا يَبْتَغُونَ فَضْلًا مِّنَ ٱللَّهِ وَرِضْوَٰنًا سِيمَاهُمْ فِى وُجُوهِهِم مِّنْ أَثَرِ ٱلسُّجُودِ ذَٰلِكَ مَثَلُهُمْ فِى ٱلتَّوْرَىٰةِ وَمَثَلُهُمْ فِى ٱلْإِنجِيلِ كَزَرْعٍ أَخْرَجَ شَطْـَٔهُۥ فَـَٔازَرَهُۥ فَٱسْتَغْلَظَ فَٱسْتَوَىٰ عَلَىٰ سُوقِهِۦ يُعْجِبُ ٱلزُّرَّاعَ لِيَغِيظَ بِهِمُ ٱلْكُفَّارَ وَعَدَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ مِنْهُم مَّغْفِرَةً وَأَجْرًا عَظِيمًۢا","Muhammadur rasûlullâh, vel-lazîna ma'ahû aşiddâ'u 'alal-kuffâri ruhamâ'u baynahum tarâhum rukka'an succaday yabtagûna fadlam minallâhi ve ridvânâ, sîmâhum fî vucûhihim min asaris-sucûd, zâlika masaluhum fit-tavrâh, ve masaluhum fil-incîl, kazar'in ahraca şat'ahû fa âzarahû fastaglaza fastavâ 'alâ sûkihî yu'cibuz-zurrâ'a liyagîza bihimul-kuffâr, ve'adallâhul-lazîna âmanû ve 'amilus-sâlihâti minhum magfiratav ve acran 'azîmâ.","Muhammed, Allah’ın Rasûlüdür. Onunla beraber olanlar; kâfirlere karşı şiddetli, kendi aralarında merhametlidirler. Onların rükû ve secde ederek Allah’ın lütuf ve rızasını arzuladıklarını görürsün. Onların işareti yüzlerindeki secde izleridir. İşte bu onların Tevrat’taki örneğidir. İncil'deki örneği ise filizini yarıp çıkarmış, gittikçe onu kuvvetlendirerek kalınlaşmış, gövdesi üzerine dikilmiş bir ekin gibidir ki, bu çiftçilerin de hoşuna gider. (Bu) Onunla kâfirleri öfkelendirmek içindir. Onlardan iman eden ve salih amellerde bulunanlara mağfiret ve büyük bir mükâfat vadetmiştir.",""]],"59":[[22,"هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَٰهَ إِلَّا هُوَ عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ هُوَ ٱلرَّحْمَٰنُ ٱلرَّحِيمُ","Huvallâhul-lazî lâ ilâha illâ huv, 'âlimul-gaybi vaş-şahâdah, huvar-rahmânur-rahîm.","O öyle Allah'tır ki, O'ndan başka (hakkıyla ibadete layık hiçbir) ilah yoktur. Görülmeyeni (gaybı) ve görüleni bilendir. O; çok bağışlayıcıdır, çok merhametlidir.",""],[23,"هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَٰهَ إِلَّا هُوَ ٱلْمَلِكُ ٱلْقُدُّوسُ ٱلسَّلَٰمُ ٱلْمُؤْمِنُ ٱلْمُهَيْمِنُ ٱلْعَزِيزُ ٱلْجَبَّارُ ٱلْمُتَكَبِّرُ سُبْحَٰنَ ٱللَّهِ عَمَّا يُشْرِكُونَ","Huvallâhul-lazî lâ ilâha illâ huv, al-malikul-kuddûsus-salâmul-mu'minul-muhayminul-'azîzul-cabbârul-mutakabbir, subhânallâhi 'ammâ yuşrikûn.","O Allah’tır ki ondan başka hiçbir ilah yoktur. Melik’tir, Kuddüs’tür, Selam’dır, Mümin’dir, Muheymin’dir, Aziz’dir, Cebbar’dır, Mütekkebbir’dir. Allah koştukları ortaklardan münezzehtir.",""],[24,"هُوَ ٱللَّهُ ٱلْخَٰلِقُ ٱلْبَارِئُ ٱلْمُصَوِّرُ لَهُ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ يُسَبِّحُ لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ","Huvallâhul-hâlikul-bâri'ul-musavviru lahul-asmâ'ul-husnâ, yusabbihu lahû mâ fis-samâvâti vel-ard, ve huval-'azîzul-hakîm.","O Allah; yaratan, yoktan var eden, şekil verendir. En güzel isimler O’nundur. Göklerde ve yerde ne varsa O’nu tesbih eder. O; çok güçlüdür, Hakîm’dir.",""]],"2":[[1,"الٓمٓ","Alif lâm mîm.","Elif, Lâm, Mîm.","Surelerin başında bulunan (Hurûf-u Mukatta) ayrılmış harfler, Kur'an'ın mucizevi yapısını göstermektedir. Müşrikler Kur'an'a meydan okumuşlar, ancak onu çürütememişlerdir. Zira o (Kur'an), Arapça'yı meydana getiren harflerden oluşmaktadır. Arapların -en belagatli insanlar olmalarına rağmen- ona benzer bir şey ortaya koyamamış olmaları, Kur'an'ın Allah tarafından bir vahiy olduğunu göstermektedir."],[2,"ذَٰلِكَ ٱلْكِتَٰبُ لَا رَيْبَ فِيهِ هُدًى لِّلْمُتَّقِينَ","Zâlikal-kitâbu lâ rayba fîh, hudal lil-muttakîn.","Hiç kuşkusuz bu kitap, takva sahipleri için yol göstericidir.",""],[3,"ٱلَّذِينَ يُؤْمِنُونَ بِٱلْغَيْبِ وَيُقِيمُونَ ٱلصَّلَوٰةَ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَ","Al-lazîna yu'minûna bil-gaybi ve yukîmûnas-salâta ve mimmâ razaknâhum yunfikûn.","Onlar gaybe inanırlar, namazı dosdoğru kılarlar, kendilerine rızık olarak verdiğimizden de Allah yolunda harcarlar.",""],[4,"وَٱلَّذِينَ يُؤْمِنُونَ بِمَآ أُنزِلَ إِلَيْكَ وَمَآ أُنزِلَ مِن قَبْلِكَ وَبِٱلْـَٔاخِرَةِ هُمْ يُوقِنُونَ","Vel-lazîna yu'minûna bimâ unzila ilayka ve mâ unzila min kablik, vabil-âhirati hum yûkinûn.","Onlar, sana indirilene, senden önce indirilenlere ve ahirete de kesin olarak iman ederler.",""],[5,"أُو۟لَٰٓئِكَ عَلَىٰ هُدًى مِّن رَّبِّهِمْ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ","Ulâ'ika 'alâ hudam mir rabbihim ve ulâ'ika humul-muflihûn.","İşte onlar Rableri katından bir hidayet üzeredir ve kurtuluşa erecek olanlar onlardır.",""],[6,"إِنَّ ٱلَّذِينَ كَفَرُوا۟ سَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ","Innal-lazîna kafarû savâ'un 'alayhim a'anzartahum am lam tunzirhum lâ yu'minûn.","Kâfirlere gelince, onları uyarsan da uyarmasan da birdir, iman etmezler.",""],[7,"خَتَمَ ٱللَّهُ عَلَىٰ قُلُوبِهِمْ وَعَلَىٰ سَمْعِهِمْ وَعَلَىٰٓ أَبْصَٰرِهِمْ غِشَٰوَةٌ وَلَهُمْ عَذَابٌ عَظِيمٌ","Hatamallâhu 'alâ kulûbihim ve 'alâ sam'ihim ve 'alâ absârihim gişâvatuv ve lahum 'azâbun 'azîm.","Allah, onların kalplerini ve kulaklarını mühürlemiştir, gözlerinde de perde vardır. Onlar için büyük bir azap vardır.",""],[8,"وَمِنَ ٱلنَّاسِ مَن يَقُولُ ءَامَنَّا بِٱللَّهِ وَبِٱلْيَوْمِ ٱلْـَٔاخِرِ وَمَا هُم بِمُؤْمِنِينَ","Ve minan-nâsi may yakûlu âmannâ billâhi ve bil-yavmil-âhiri ve mâ hum bimu'minîn.","İnsanlardan bir kısmı da iman etmediği halde; \"Allah’a ve ahiret gününe iman ettik\" derler.",""],[9,"يُخَٰدِعُونَ ٱللَّهَ وَٱلَّذِينَ ءَامَنُوا۟ وَمَا يَخْدَعُونَ إِلَّآ أَنفُسَهُمْ وَمَا يَشْعُرُونَ","Yuhâdi'ûnallâha vel-lazîna âmanû ve mâ yahda'ûna illâ anfusahum ve mâ yaş'urûn.","Allah’ı ve Müminleri aldatmaya çalışırlar. Oysa sadece kendilerini aldatırlar da bunun farkında değillerdir.",""],[10,"فِى قُلُوبِهِم مَّرَضٌ فَزَادَهُمُ ٱللَّهُ مَرَضًا وَلَهُمْ عَذَابٌ أَلِيمٌۢ بِمَا كَانُوا۟ يَكْذِبُونَ","Fî kulûbihim maradun fa zâdahumullâhu maradâ, ve lahum 'azâbun alîmum bimâ kânû yakzibûn.","Onların kalplerinde bir hastalık vardır. Allah da onların hastalığını artırmıştır. Söyledikleri yalana karşılık da onlara acı veren bir azap vardır.",""],[11,"وَإِذَا قِيلَ لَهُمْ لَا تُفْسِدُوا۟ فِى ٱلْأَرْضِ قَالُوٓا۟ إِنَّمَا نَحْنُ مُصْلِحُونَ","Ve izâ kîla lahum lâ tufsidû fil-ard, kâlû innamâ nahnu muslihûn.","Onlara: \"Yeryüzünde bozgunculuk yapmayın!\" dendiği zaman; \"Bizler sadece ıslah edicileriz.\" derler.",""],[12,"أَلَآ إِنَّهُمْ هُمُ ٱلْمُفْسِدُونَ وَلَٰكِن لَّا يَشْعُرُونَ","Alâ innahum humul-mufsidûna ve lâkil lâ yaş'urûn.","İyi bilin ki, onlar bozguncuların ta kendileridir. Fakat farkında değillerdir.",""],[13,"وَإِذَا قِيلَ لَهُمْ ءَامِنُوا۟ كَمَآ ءَامَنَ ٱلنَّاسُ قَالُوٓا۟ أَنُؤْمِنُ كَمَآ ءَامَنَ ٱلسُّفَهَآءُ أَلَآ إِنَّهُمْ هُمُ ٱلسُّفَهَآءُ وَلَٰكِن لَّا يَعْلَمُونَ","Ve izâ kîla lahum âminû kamâ âmanan nâsu kâlû anu'minu kamâ âmanas-sufahâ', alâ innahum humus-sufahâ'u ve lâkil lâ ya'lamûn.","Onlara: \"Siz de insanların iman ettiği gibi iman edin!\" denilince; \"Akılsızların iman ettiği gibi mi iman edelim?\" derler. Dikkat edin! Asıl akılsızlar kendileridir, fakat bilmezler.",""],[14,"وَإِذَا لَقُوا۟ ٱلَّذِينَ ءَامَنُوا۟ قَالُوٓا۟ ءَامَنَّا وَإِذَا خَلَوْا۟ إِلَىٰ شَيَٰطِينِهِمْ قَالُوٓا۟ إِنَّا مَعَكُمْ إِنَّمَا نَحْنُ مُسْتَهْزِءُونَ","Ve izâ lakul-lazîna âmanû kâlû âmannâ, ve izâ halav ilâ şayâtînihim kâlû innâ ma'akum, innamâ nahnu mustahzi'ûn.","(Bu münafıklar) İman edenlere rastladıkları zaman; \"Biz de iman ettik\", derler. Şeytanları ile baş başa kalınca da: \"Biz, sizin yanınızdayız. Onlarla (Müminlerle) sadece alay ediyoruz.\" derler.",""],[15,"ٱللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِى طُغْيَٰنِهِمْ يَعْمَهُونَ","Allâhu yastahzi'u bihim ve yamudduhum fî tugyânihim ya'mahûn.","Allah da onlarla alay eder ve onları taşkınlıkları içinde şaşkın bir halde bırakır.",""],[16,"أُو۟لَٰٓئِكَ ٱلَّذِينَ ٱشْتَرَوُا۟ ٱلضَّلَٰلَةَ بِٱلْهُدَىٰ فَمَا رَبِحَت تِّجَٰرَتُهُمْ وَمَا كَانُوا۟ مُهْتَدِينَ","Ulâ'ikal-lazînaştaravud-dalâlata bil-hudâ, famâ rabihat ticâratuhum ve mâ kânû muhtadîn.","İşte onlar, hidayete karşılık sapıklığı satın almış kimselerdir. Bu yüzden alışverişleri onlara kâr getirmemiş ve (sonuçta) doğru yolu bulamamışlardır.",""],[17,"مَثَلُهُمْ كَمَثَلِ ٱلَّذِى ٱسْتَوْقَدَ نَارًا فَلَمَّآ أَضَآءَتْ مَا حَوْلَهُۥ ذَهَبَ ٱللَّهُ بِنُورِهِمْ وَتَرَكَهُمْ فِى ظُلُمَٰتٍ لَّا يُبْصِرُونَ","Masaluhum kamasalil-lazistavkada nârâ, falammâ adâ'at mâ havlahûû zahaballâhu binûrihim ve tarakahum fî zulumâtil lâ yubsirûn.","Onların (münafıkların) hali, (geceleyin) ateş yakan kimsenin haline benzer. Ateş etrafını aydınlattığı sırada Allah, onun ışığını giderir ve onları karanlıklar içerisinde görmez bir halde bırakır.",""],[18,"صُمٌّۢ بُكْمٌ عُمْىٌ فَهُمْ لَا يَرْجِعُونَ","Summum bukmun 'umyun fahum lâ yarci'ûn.","Onlar sağır, dilsiz ve körlerdir. Bu sebeple onlar asla dönmezler.",""],[19,"أَوْ كَصَيِّبٍ مِّنَ ٱلسَّمَآءِ فِيهِ ظُلُمَٰتٌ وَرَعْدٌ وَبَرْقٌ يَجْعَلُونَ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِم مِّنَ ٱلصَّوَٰعِقِ حَذَرَ ٱلْمَوْتِ وَٱللَّهُ مُحِيطٌۢ بِٱلْكَٰفِرِينَ","Au kasayyibim minas-samâ'i fîhi zulumâtuv ve ra'duv ve bark, yac'alûna asâbi'ahum fî âzânihim minas-savâ'iki hazaral-mavt, vallâhu muhîtum bil- kâfirîn.","Yahut onlar gökten boşalan bir yağmura tutulmuş kimselere benzerler. O yağmurda karanlıklar, gök gürültüsü ve şimşek vardır. Onlar yıldırımın şiddetinden ve ölüm korkusundan dolayı parmaklarıyla kulaklarını tıkayıp, kapatırlar. Şüphesiz Allah, kâfirleri çepeçevre kuşatmıştır.",""],[20,"يَكَادُ ٱلْبَرْقُ يَخْطَفُ أَبْصَٰرَهُمْ كُلَّمَآ أَضَآءَ لَهُم مَّشَوْا۟ فِيهِ وَإِذَآ أَظْلَمَ عَلَيْهِمْ قَامُوا۟ وَلَوْ شَآءَ ٱللَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَٰرِهِمْ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Yakâdul-barku yahtafu absârahum, kullamâ adâ'a lahum maşav fîh, ve izâ azlama 'alayhim kâmû, ve lav şâ'allâhu lazahaba bisam'ihim ve absârihim, innallâha 'alâ kulli şay'in kadîr.","(O esnada) şimşek onların gözlerini aniden alacakmış gibi olur. Şimşek parıldadığında yürürler, ortalık birden kararınca da orada dikilip kalıverirler. Eğer Allah isteseydi onların kulaklarını sağır ve gözlerini kör ederdi. Şüphesiz Allah her şeye gücü yetendir.",""],[21,"يَٰٓأَيُّهَا ٱلنَّاسُ ٱعْبُدُوا۟ رَبَّكُمُ ٱلَّذِى خَلَقَكُمْ وَٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","Yâ ayyuhan-nâsu'budû rabbakumul-lazî halakakum vel-lazîna min kablikum la'allakum tattakûn.","Ey insanlar! Sizi ve sizden öncekileri yaratan Rabbinize ibadet ediniz ki, böylece takva sahibi olur, sakınırsınız.",""],[22,"ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ فِرَٰشًا وَٱلسَّمَآءَ بِنَآءً وَأَنزَلَ مِنَ ٱلسَّمَآءِ مَآءً فَأَخْرَجَ بِهِۦ مِنَ ٱلثَّمَرَٰتِ رِزْقًا لَّكُمْ فَلَا تَجْعَلُوا۟ لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ","Allazî ca'ala lakumul-arda firâşav vas-samâ'a binâ'â, ve anzala minas-samâ'i mâ'an fa ahraca bihî minas-samarâti rizkal lakum, falâ tac'alû lillâhi andâdav ve antum ta'lamûn.","O, sizin için yeryüzünü döşedi ve gökyüzünü bina etti. Gökten su indirip onunla size rızık olsun diye ürünler yetiştirdi. Öyleyse, bunları bile bile Allah’a ortak koşmayın.",""],[23,"وَإِن كُنتُمْ فِى رَيْبٍ مِّمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا۟ بِسُورَةٍ مِّن مِّثْلِهِۦ وَٱدْعُوا۟ شُهَدَآءَكُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَٰدِقِينَ","Ve in kuntum fî raybim mimmâ nazzalnâ 'alâ 'abdinâ fa'tû bisûratim mim mislih, vad'û şuhadâ'akum min dûnillâhi in kuntum sâdikîn.","Kulumuza indirdiğimiz (Kur’an) dan bir şüpheniz varsa; haydi siz de ona benzer bir sûre getirin. Eğer doğru sözlüler iseniz, Allah’tan başka güvendiklerinizi de yardıma çağırın.",""],[24,"فَإِن لَّمْ تَفْعَلُوا۟ وَلَن تَفْعَلُوا۟ فَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِى وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ أُعِدَّتْ لِلْكَٰفِرِينَ","Fa'illam taf'alû ve lan taf'alû fattakun-nâral-latî vakûduhan-nâsu vel-hicârah, u'iddat lil-kâfirîn.","Eğer bu işi yapamazsanız ki, elbette yapamayacaksınız. O zaman, kâfirler için hazırlanan (ve) yakıtı insanlar ve taşlar olan ateşten kendinizi koruyun.",""],[25,"وَبَشِّرِ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ جَنَّٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ كُلَّمَا رُزِقُوا۟ مِنْهَا مِن ثَمَرَةٍ رِّزْقًا قَالُوا۟ هَٰذَا ٱلَّذِى رُزِقْنَا مِن قَبْلُ وَأُتُوا۟ بِهِۦ مُتَشَٰبِهًا وَلَهُمْ فِيهَآ أَزْوَٰجٌ مُّطَهَّرَةٌ وَهُمْ فِيهَا خَٰلِدُونَ","Ve başşiril-lazîna âmanû ve 'amilus-sâlihâti anna lahum cannâtin tacrî min tahtihal- anhâr, kullamâ ruzikû minhâ min samaratir rizkâ, kâlû hâzal-lazî ruziknâ min kablu ve utû bihî mutaşâbihâ, ve lahum fîhâ azvâcum mutahharatuv ve hum fîhâ hâlidûn.","İman eden ve salih amel işleyen kimselere, içinden ırmaklar akan cennetler olduğunu müjdele! Ne zaman oradaki meyvelerden rızıklandırılsalar: \"Bu, daha önce de rızıklandığımız şey\" diyecekler. O meyveler kendilerine (dünyadakilerin) bir benzeri olarak verilecektir ve orada onlar için tertemiz eşler de vardır ve onlar orada ebedî kalacaklardır.",""],[26,"إِنَّ ٱللَّهَ لَا يَسْتَحْىِۦٓ أَن يَضْرِبَ مَثَلًا مَّا بَعُوضَةً فَمَا فَوْقَهَا فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ فَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ وَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَيَقُولُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًا يُضِلُّ بِهِۦ كَثِيرًا وَيَهْدِى بِهِۦ كَثِيرًا وَمَا يُضِلُّ بِهِۦٓ إِلَّا ٱلْفَٰسِقِينَ","Innallâha lâ yastahyî ay yadriba masalam mâ ba'ûdatan famâ favkahâ, fa'ammal- lazîna âmanû faya'lamûna annahul-hakku mir rabbihim, ve ammal-lazîna kafarû fayakûlûna mâzâ arâdallâhu bihâzâ masalâ, yudillu bihî kasîrav ve yahdî bihî kasîrâ, ve mâ yudillu bihî illal-fâsikîn.","Allah, bir sivrisineği ve onun üzerinde bir şeyi örnek vermekten haya etmez. İman edenler, onun Rablerinden gelen bir gerçek olduğunu bilirler, ama kâfirler; \"Allah bu misalle ne demek istiyor?\" derler. Allah, bu misalle birçoklarını dalalette bırakır, birçoklarını da hidayete erdirir. Onunla ancak fasıkları saptırır.",""],[27,"ٱلَّذِينَ يَنقُضُونَ عَهْدَ ٱللَّهِ مِنۢ بَعْدِ مِيثَٰقِهِۦ وَيَقْطَعُونَ مَآ أَمَرَ ٱللَّهُ بِهِۦٓ أَن يُوصَلَ وَيُفْسِدُونَ فِى ٱلْأَرْضِ أُو۟لَٰٓئِكَ هُمُ ٱلْخَٰسِرُونَ","Allazîna yankudûna 'ahdallâhi mim ba'di mîsâkih, ve yakta'ûna mâ amarallâhu bihî ay yûsala ve yufsidûna fil-ard, ulâ'ika humul-hâsirûn.","Onlar, Allah ile yapılan sözleşmeyi kabul ettikten sonra bozan, Allah’ın, birleştirilmesini emrettiği şeyi koparan ve yeryüzünde bozgunculuk yapanlardır. İşte kaybedecek olanlar onlardır.",""],[28,"كَيْفَ تَكْفُرُونَ بِٱللَّهِ وَكُنتُمْ أَمْوَٰتًا فَأَحْيَٰكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ثُمَّ إِلَيْهِ تُرْجَعُونَ","Kayfa takfurûna billâhi ve kuntum amvâtan fa'ahyâkum, summa yumîtukum summa yuhyîkum summa ilayhi turca'ûn.","Allah'ı nasıl inkâr edersiniz? Hâlbuki ölü idiniz de sizleri diriltti, sonra öldürecek, sonra tekrar diriltecek ve sonunda O'na döndürüleceksiniz.",""],[29,"هُوَ ٱلَّذِى خَلَقَ لَكُم مَّا فِى ٱلْأَرْضِ جَمِيعًا ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ فَسَوَّىٰهُنَّ سَبْعَ سَمَٰوَٰتٍ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ","Huval-lazî halaka lakum mâ fil-ardi camî'â, summastavâ ilas-samâ'i fasavvâhunna sab'a samâvât, ve huva bikulli şay'in 'alîm.","O, yeryüzündeki her şeyi sizin için yaratan, sonra gökyüzüne yönelip yedi kat gök olarak düzenleyendir. O, her şeyi hakkıyla bilendir.",""],[30,"وَإِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ إِنِّى جَاعِلٌ فِى ٱلْأَرْضِ خَلِيفَةً قَالُوٓا۟ أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ ٱلدِّمَآءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قَالَ إِنِّىٓ أَعْلَمُ مَا لَا تَعْلَمُونَ","Ve iz kâla rabbuka lil-malâ'ikati innî câ'ilun fil-ardi halîfah, kâlû atac'alu fîhâ may yufsidu fîhâ ve yasfikud-dimâ', ve nahnu nusabbihu bihamdika ve nukaddisu lak, kâla innî a'lamu mâ lâ ta'lamûn.","Hani Rabbin meleklere: \"Ben yeryüzünde bir halife yaratacağım.\" demişti. Melekler de: \"Yeryüzünde bozgunculuk edecek, kanlar dökecek birini mi yaratacaksın? Oysa biz seni (durmadan) hamt ile tesbih ve takdis ediyoruz.\" dediler. Allah da \"Sizin bilmediğiniz şeyleri ben bilirim.\" buyurmuştu.",""],[31,"وَعَلَّمَ ءَادَمَ ٱلْأَسْمَآءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى ٱلْمَلَٰٓئِكَةِ فَقَالَ أَنۢبِـُٔونِى بِأَسْمَآءِ هَٰٓؤُلَآءِ إِن كُنتُمْ صَٰدِقِينَ","Ve 'allama âdamal-asmâ'a kullahâ summa 'aradahum 'alal-malâ'ikati fakâla ambi'ûnî bi'asmâ'i hâ'ulâ'i in kuntum sâdikîn.","Allah, Âdem’e bütün varlıkların isimlerini öğretti. Sonra onları meleklere göstererek: “Eğer doğru söyleyenler iseniz, haydi bana bunların isimlerini bildirin.” dedi.",""],[32,"قَالُوا۟ سُبْحَٰنَكَ لَا عِلْمَ لَنَآ إِلَّا مَا عَلَّمْتَنَآ إِنَّكَ أَنتَ ٱلْعَلِيمُ ٱلْحَكِيمُ","Kâlû subhânaka lâ 'ilma lanâ illâ mâ 'allamtanâ, innaka antal-'alîmul-hakîm.","(Melekler) \"Sen yücesin! Seni eksiklikten tenzih ederiz. Senin bize öğrettiğinden başka hiçbir ilmimiz yoktur. Şüphesiz her şeyi hakkıyla bilen, her şeyi hikmetle yapan sensin.” dediler.",""],[33,"قَالَ يَٰٓـَٔادَمُ أَنۢبِئْهُم بِأَسْمَآئِهِمْ فَلَمَّآ أَنۢبَأَهُم بِأَسْمَآئِهِمْ قَالَ أَلَمْ أَقُل لَّكُمْ إِنِّىٓ أَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَمَا كُنتُمْ تَكْتُمُونَ","Kâla yâ âdamu ambi'hum bi'asmâ'ihim, falammâ amba'ahum bi'asmâ'ihim, kâla alam akul lakum innî a'lamu gaybas-samâvâti vel-ard, ve a'lamu mâ tubdûna ve mâ kuntum taktumûn.","Allah şöyle dedi: “Ey Âdem! Onlara bunların isimlerini söyle.” Âdem, meleklere onların isimlerini bildirince Allah: “Size, göklerin ve yerin gaybını şüphesiz ki ben bilirim, yine açığa vurduklarınızı da, gizli tuttuklarınızı da ben bilirim demedim mi?” buyurdu.",""],[34,"وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ ٱسْجُدُوا۟ لِـَٔادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ أَبَىٰ وَٱسْتَكْبَرَ وَكَانَ مِنَ ٱلْكَٰفِرِينَ","Ve iz kulnâ lil-malâ'ikatiscudû li âdama fasacadû illâ iblîs, abâ vastakbara ve kâna minal-kâfirîn.","Hani Meleklere: \"Âdem'e (saygı ve hürmet için) secde edin!\" demiştik de İblis hariç bütün melekler hemen secde edivermişlerdi. İblis bundan kaçınmış, büyüklenmiş ve kâfirlerden olmuştu.",""],[35,"وَقُلْنَا يَٰٓـَٔادَمُ ٱسْكُنْ أَنتَ وَزَوْجُكَ ٱلْجَنَّةَ وَكُلَا مِنْهَا رَغَدًا حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَٰذِهِ ٱلشَّجَرَةَ فَتَكُونَا مِنَ ٱلظَّٰلِمِينَ","Ve kulnâ yâ âdamuskun anta ve zavcukal-cannata ve kulâ minhâ ragadan haysu şi'tumâ, ve lâ takrabâ hâzihiş-şacarata fa takûnâ minaz-zâlimîn.","Ve demiştik ki: \"Ey Âdem! Sen ve eşin Cennet'e yerleşin, dilediğiniz yerden bol bol yiyin. Yalnız şu ağaca yaklaşmayın, yoksa zalimlerden olursunuz.\"",""],[36,"فَأَزَلَّهُمَا ٱلشَّيْطَٰنُ عَنْهَا فَأَخْرَجَهُمَا مِمَّا كَانَا فِيهِ وَقُلْنَا ٱهْبِطُوا۟ بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ وَلَكُمْ فِى ٱلْأَرْضِ مُسْتَقَرٌّ وَمَتَٰعٌ إِلَىٰ حِينٍ","Fa'azallahumaş-şaytânu 'anhâ fa ahracahumâ mimmâ kânâ fîh, ve kulnahbitû ba'dukum liba'din 'aduvv, ve lakum fil-ardi mustakarruv ve matâ'un ilâ hîn.","Derken şeytan oradan ikisinin de ayağını kaydırdı, onları bulundukları yerden çıkardı. Biz de onlara: \"Birbirinize düşman olarak inin, yeryüzünde sizin için bir barınak ve belli bir süreye kadar orada yaşamak vardır.\" dedik.",""],[37,"فَتَلَقَّىٰٓ ءَادَمُ مِن رَّبِّهِۦ كَلِمَٰتٍ فَتَابَ عَلَيْهِ إِنَّهُۥ هُوَ ٱلتَّوَّابُ ٱلرَّحِيمُ","Fatalakkâ âdamu mir rabbihî kalimâtin fatâba 'alayh, innahû huvat-tavvâbur- rahîm.","Derken, Âdem (vahy yoluyla) Rabbinden birtakım kelimeler aldı, (onlarla amel edip Rabbine yalvardı). O da bunun üzerine tövbesini kabul etti. Şüphesiz O, tövbeleri çok kabul edendir, çok bağışlayandır.",""],[38,"قُلْنَا ٱهْبِطُوا۟ مِنْهَا جَمِيعًا فَإِمَّا يَأْتِيَنَّكُم مِّنِّى هُدًى فَمَن تَبِعَ هُدَاىَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","Kulnahbitû minhâ camî'â, fa'immâ ya'tiyannakum minnî hudan faman tabi'a hudâya falâ havfun 'alayhim ve lâ hum yahzanûn.","Dedik ki: \"Hepiniz oradan (Cennet'ten) inin.Tarafımdan size bir yol gösterici gelir de kim ona uyarsa, onlar için hiçbir korku yoktur ve onlar üzülmeyeceklerdir.\"",""],[39,"وَٱلَّذِينَ كَفَرُوا۟ وَكَذَّبُوا۟ بِـَٔايَٰتِنَآ أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ هُمْ فِيهَا خَٰلِدُونَ","Vel-lazîna kafarû ve kazzabû bi'âyâtinâ ulâ'ika ashâbun-nâr, hum fîhâ hâlidûn.","Ayetlerimizi yalanlayıp, inkâr edenler cehennemliktirler. Onlar, orada ebedi kalacaklardır.",""],[40,"يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَوْفُوا۟ بِعَهْدِىٓ أُوفِ بِعَهْدِكُمْ وَإِيَّٰىَ فَٱرْهَبُونِ","Yâ banî isrâ'îlazkurû ni'matiyal-latî an'amtu 'alaykum ve avfû bi'ahdî ûfi bi'ahdikum, ve iyyâya farhabûn.","Ey İsrailoğulları! Size verdiğim nimeti hatırlayın. Bana verdiğiniz sözü yerine getirin ki ben de size verdiğim vaadi yerine getireyim. Yalnızca benden korkun.",""],[41,"وَءَامِنُوا۟ بِمَآ أَنزَلْتُ مُصَدِّقًا لِّمَا مَعَكُمْ وَلَا تَكُونُوٓا۟ أَوَّلَ كَافِرٍۭ بِهِۦ وَلَا تَشْتَرُوا۟ بِـَٔايَٰتِى ثَمَنًا قَلِيلًا وَإِيَّٰىَ فَٱتَّقُونِ","Ve âminû bimâ anzaltu musaddikal limâ ma'akum ve lâ takûnû avvala kâfirim bih, ve lâ taştarû bi'âyâtî samanan kalîlâ, ve iyyâya fattakûn.","Elinizde bulunan Tevrat’ı tasdik edici olarak indirdiğim Kur’an’a iman edin ve onu inkâr edenlerin ilki siz olmayın. Ayetlerimi az bir paha karşılığında satmayın; yalnızca benden sakının!",""],[42,"وَلَا تَلْبِسُوا۟ ٱلْحَقَّ بِٱلْبَٰطِلِ وَتَكْتُمُوا۟ ٱلْحَقَّ وَأَنتُمْ تَعْلَمُونَ","Ve lâ talbisul-hakka bil-bâtili ve taktumul-hakka ve antum ta'lamûn.","Hakka batılı karıştırmayın, bile bile hakkı gizlemeyin.",""],[43,"وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَٱرْكَعُوا۟ مَعَ ٱلرَّٰكِعِينَ","Ve akîmus-salâta ve âtuz-zakâta varka'û ma'ar-râki'în.","Namazı kılın, zekâtı verin, rükû edenlerle birlikte rükû edin.",""],[44,"أَتَأْمُرُونَ ٱلنَّاسَ بِٱلْبِرِّ وَتَنسَوْنَ أَنفُسَكُمْ وَأَنتُمْ تَتْلُونَ ٱلْكِتَٰبَ أَفَلَا تَعْقِلُونَ","Ata'murûnan-nâsa bil-birri ve tansavna anfusakum ve antum tatlûnal-kitâb, afalâ ta'kilûn.","İnsanlara iyiliği emredersiniz de, kendinizi unutur musunuz? Kitabı (Tevrat'ı) okuyup durduğunuz halde düşünmez misiniz?",""],[45,"وَٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى ٱلْخَٰشِعِينَ","Vasta'înû bis-sabri vas-salâh, ve innahâ lakabîratun illâ 'alal-hâşi'în.","Sabır ve namazla Allah’tan yardım isteyin ve şüphesiz bu (namaz), huşu duyanlardan başkasına ağır gelir.",""],[46,"ٱلَّذِينَ يَظُنُّونَ أَنَّهُم مُّلَٰقُوا۟ رَبِّهِمْ وَأَنَّهُمْ إِلَيْهِ رَٰجِعُونَ","Allazîna yazunnûna annahum mulâkû rabbihim ve annahum ilayhi râci'ûn.","Onlar, Rablerine kavuşacaklarını ve gerçekten O’na döneceklerini bilirler.",""],[47,"يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَنِّى فَضَّلْتُكُمْ عَلَى ٱلْعَٰلَمِينَ","Yâ banî isrâ'îlazkurû ni'matiyal-latî an'amtu 'alaykum ve annî faddaltukum 'alal- 'âlamîn.","Ey İsrailoğulları! Size verdiğim nimetimi ve sizi diğer toplumlara üstün kıldığımı hatırlayıp, anın.",""],[48,"وَٱتَّقُوا۟ يَوْمًا لَّا تَجْزِى نَفْسٌ عَن نَّفْسٍ شَيْـًٔا وَلَا يُقْبَلُ مِنْهَا شَفَٰعَةٌ وَلَا يُؤْخَذُ مِنْهَا عَدْلٌ وَلَا هُمْ يُنصَرُونَ","Vattakû yavmal lâ taczî nafsun 'an nafsin şay'av ve lâ yukbalu minhâ şafâ'atuv ve lâ yu'hazu minhâ 'adluv ve lâ hum yunsarûn.","Kimsenin kimseden faydalanamayacağı, hiç kimseden (Allah izin vermedikçe) bir şefaatin kabul edilmeyeceği, kimseden bir fidyenin alınmayacağı ve yardım da görülmeyeceği bir günden kendinizi koruyun.",""],[49,"وَإِذْ نَجَّيْنَٰكُم مِّنْ ءَالِ فِرْعَوْنَ يَسُومُونَكُمْ سُوٓءَ ٱلْعَذَابِ يُذَبِّحُونَ أَبْنَآءَكُمْ وَيَسْتَحْيُونَ نِسَآءَكُمْ وَفِى ذَٰلِكُم بَلَآءٌ مِّن رَّبِّكُمْ عَظِيمٌ","Ve iz naccaynâkum min âli fir'avna yasûmûnakum sû'al-'azâbi yuzabbihûna abnâ'akum ve yastahyûna nisâ'akum, ve fî zâlikum balâ'um mir rabbikum 'azîm.","Hani size azabın en kötüsünü tattıran, yeni doğan oğullarınızı boğazlayan ve kızlarınızı hayatta bırakan Firavun ailesinden sizi kurtarmıştık ve bunda sizin için Rabbiniz tarafından büyük bir imtihan vardı.",""],[50,"وَإِذْ فَرَقْنَا بِكُمُ ٱلْبَحْرَ فَأَنجَيْنَٰكُمْ وَأَغْرَقْنَآ ءَالَ فِرْعَوْنَ وَأَنتُمْ تَنظُرُونَ","Ve iz faraknâ bikumul-bahra fa'ancaynâkum ve agraknâ âla fir'avna ve antum tanzurûn.","Hani, sizin için denizi yarmış, sizi kurtarmış, gözlerinizin önünde Firavun hanedanını suda boğmuştuk.",""],[51,"وَإِذْ وَٰعَدْنَا مُوسَىٰٓ أَرْبَعِينَ لَيْلَةً ثُمَّ ٱتَّخَذْتُمُ ٱلْعِجْلَ مِنۢ بَعْدِهِۦ وَأَنتُمْ ظَٰلِمُونَ","Ve iz vâ'adnâ mûsâ arba'îna laylatan summattahaztumul-'icla mim ba'dihî ve antum zâlimûn.","Hani, biz Mûsâ ile kırk gece için sözleşmiştik. Ama siz zalimlik ederek onun ardından buzağıya tapınmıştınız.",""],[52,"ثُمَّ عَفَوْنَا عَنكُم مِّنۢ بَعْدِ ذَٰلِكَ لَعَلَّكُمْ تَشْكُرُونَ","Summa 'afavnâ 'ankum mim ba'di zâlika la'allakum taşkurûn.","Bundan sonra da yine belki şükredersiniz diye sizi affetmiştik.",""],[53,"وَإِذْ ءَاتَيْنَا مُوسَى ٱلْكِتَٰبَ وَٱلْفُرْقَانَ لَعَلَّكُمْ تَهْتَدُونَ","Ve iz âtaynâ mûsal-kitâba vel-furkâna la'allakum tahtadûn.","Hani, doğru yolu bulasınız diye size Kitab’ı (Tevrat’ı) ve Furkan’ı (Hak ile bâtılı ayıran ilahî hükümleri) vermiştik.",""],[54,"وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦ يَٰقَوْمِ إِنَّكُمْ ظَلَمْتُمْ أَنفُسَكُم بِٱتِّخَاذِكُمُ ٱلْعِجْلَ فَتُوبُوٓا۟ إِلَىٰ بَارِئِكُمْ فَٱقْتُلُوٓا۟ أَنفُسَكُمْ ذَٰلِكُمْ خَيْرٌ لَّكُمْ عِندَ بَارِئِكُمْ فَتَابَ عَلَيْكُمْ إِنَّهُۥ هُوَ ٱلتَّوَّابُ ٱلرَّحِيمُ","Ve iz kâla mûsâ likavmihî yâ kavmi innakum zalamtum anfusakum bittihâzikumul- 'icla fatûbû ilâ bâri'ikum faktulû anfusakum, zâlikum hayrul lakum 'inda bâri'ikum, fatâba 'alaykum, innahû huvat-tavvâbur-rahîm.","Mûsâ, kavmine dedi ki: “Ey kavmim! Sizler, buzağıyı ilâh edinmekle kendinize yazık ettiniz. Gelin yaratıcınıza tövbe edin ve birbirinizi öldürün. Bu, yaratıcınız katında sizin için daha iyidir.\" Böylece Allah da onların tövbesini kabul etti. Çünkü O, tövbeleri çok kabul edendir, çok merhametlidir.",""],[55,"وَإِذْ قُلْتُمْ يَٰمُوسَىٰ لَن نُّؤْمِنَ لَكَ حَتَّىٰ نَرَى ٱللَّهَ جَهْرَةً فَأَخَذَتْكُمُ ٱلصَّٰعِقَةُ وَأَنتُمْ تَنظُرُونَ","Ve iz kultum yâ mûsâ lan nu'mina laka hattâ narallâha cahratan fa'ahazatkumus-sâ'ikatu ve antum tanzurûn.","\"Ey Mûsâ! Allah’ı apaçık görmedikçe sana inanmayacağız.\" demiştiniz de, bunun üzerine bakıp dururken sizi yıldırım çarpmıştı",""],[56,"ثُمَّ بَعَثْنَٰكُم مِّنۢ بَعْدِ مَوْتِكُمْ لَعَلَّكُمْ تَشْكُرُونَ","Summa ba'asnâkum mim ba'di mavtikum la'allakum taşkurûn.","Sonra, şükredesiniz diye ölümünüzün ardından sizi tekrar dirilttik.",""],[57,"وَظَلَّلْنَا عَلَيْكُمُ ٱلْغَمَامَ وَأَنزَلْنَا عَلَيْكُمُ ٱلْمَنَّ وَٱلسَّلْوَىٰ كُلُوا۟ مِن طَيِّبَٰتِ مَا رَزَقْنَٰكُمْ وَمَا ظَلَمُونَا وَلَٰكِن كَانُوٓا۟ أَنفُسَهُمْ يَظْلِمُونَ","Ve zallalnâ 'alaykumul-gamâma ve anzalnâ 'alaykumul-manna vas-salvâ, kulû min tayyibâti mâ razaknâkum, ve mâ zalamûnâ ve lâkin kânû anfusahum yazlimûn.","Bulutlarla sizi gölgelendirdik, kudret helvası ve bıldırcın gönderdik. Size rızık olarak verdiğimiz güzel şeylerden yiyin, dedik. Fakat onlar bize değil ancak kendilerine zulmediyorlardı.",""],[58,"وَإِذْ قُلْنَا ٱدْخُلُوا۟ هَٰذِهِ ٱلْقَرْيَةَ فَكُلُوا۟ مِنْهَا حَيْثُ شِئْتُمْ رَغَدًا وَٱدْخُلُوا۟ ٱلْبَابَ سُجَّدًا وَقُولُوا۟ حِطَّةٌ نَّغْفِرْ لَكُمْ خَطَٰيَٰكُمْ وَسَنَزِيدُ ٱلْمُحْسِنِينَ","Ve iz kulnadhulû hâzihil-karyata fakulû minhâ haysu şi'tum ragadav vadhulul- bâba succadav ve kûlû hittatun nagfir lakum hatâyâkum, ve sanazîdul-muhsinîn.","Hani: (İsrailoğullarına) \"Şu kasabaya girip, dilediğiniz yerden istediğinizi bol bol yiyin. Kapısından secde ederek/boynu bükük, zelil olarak girin ve “Bağışla” deyin de sizi bağışlayalım. Güzel davrananların mükâfatını da artıracağız.\" demiştik.",""],[59,"فَبَدَّلَ ٱلَّذِينَ ظَلَمُوا۟ قَوْلًا غَيْرَ ٱلَّذِى قِيلَ لَهُمْ فَأَنزَلْنَا عَلَى ٱلَّذِينَ ظَلَمُوا۟ رِجْزًا مِّنَ ٱلسَّمَآءِ بِمَا كَانُوا۟ يَفْسُقُونَ","Fabaddalal-lazîna zalamû kavlan gayral-lazî kîla lahum fa anzalnâ 'alal-lazîna zalamû riczam minas-samâ'i bimâ kânû yafsukûn.","Fakat, zulmedenler kendilerine söylenmiş olan sözü başka bir sözle değiştirdiler. Biz de, zalimlere, günah işleyerek yoldan çıktıkları için gökten kahredici bir azap indirmiştik.",""],[60,"وَإِذِ ٱسْتَسْقَىٰ مُوسَىٰ لِقَوْمِهِۦ فَقُلْنَا ٱضْرِب بِّعَصَاكَ ٱلْحَجَرَ فَٱنفَجَرَتْ مِنْهُ ٱثْنَتَا عَشْرَةَ عَيْنًا قَدْ عَلِمَ كُلُّ أُنَاسٍ مَّشْرَبَهُمْ كُلُوا۟ وَٱشْرَبُوا۟ مِن رِّزْقِ ٱللَّهِ وَلَا تَعْثَوْا۟ فِى ٱلْأَرْضِ مُفْسِدِينَ","Ve izistaskâ mûsâ likavmihî fakulnadrib bi'asâkal-hacar, fanfacarat minhusnatâ 'aşrata 'aynâ, kad 'alima kullu unâsim maşrabahum, kulû vaşrabû mir rizkillâhi ve lâ ta'sav fil-ardi mufsidîn.","Mûsâ, (çölde) halkı için su aradığında: \"Değneğinle taşa vur!\" dedik. Ondan on iki pınar fışkırdı ve her grup su içeceği pınarı öğrenmişti. Allah’ın rızkından yiyin, için; fakat yeryüzünde bozguncular olarak taşkınlık yapmayın!",""],[61,"وَإِذْ قُلْتُمْ يَٰمُوسَىٰ لَن نَّصْبِرَ عَلَىٰ طَعَامٍ وَٰحِدٍ فَٱدْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ مِنۢ بَقْلِهَا وَقِثَّآئِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَا قَالَ أَتَسْتَبْدِلُونَ ٱلَّذِى هُوَ أَدْنَىٰ بِٱلَّذِى هُوَ خَيْرٌ ٱهْبِطُوا۟ مِصْرًا فَإِنَّ لَكُم مَّا سَأَلْتُمْ وَضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ وَٱلْمَسْكَنَةُ وَبَآءُو بِغَضَبٍ مِّنَ ٱللَّهِ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلنَّبِيِّـۧنَ بِغَيْرِ ٱلْحَقِّ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ","Ve iz kultum yâ mûsâ lan nasbira 'alâ ta'âmiv vâhidin fad'u lanâ rabbaka yuhric lanâ mimmâ tumbitul-ardu mim baklihâ ve kissâ'ihâ ve fûmihâ ve 'adasihâ ve basalihâ, kâla atastabdilûnal-lazî huva adnâ bil-lazî huva hayr, ihbitû misran fa inna lakum mâ sa'altum, ve duribat 'alayhimuz-zillatu vel-maskanatu ve bâ'û bigadabim minallâh, zâlika bi'annahum kânû yakfurûna bi'âyâtillâhi ve yaktulûnan- nabiyyîna bi gayril-hakk, zâlika bimâ 'asav ve kânû ya'tadûn.","Hani, “Ey Mûsâ! Biz bir çeşit yemeğe asla katlanamayız. O hâlde bizim için Rabbine yalvar da, o bize yerden biten sebze, salatalık, sarımsak, mercimek, soğan versin” demiştiniz. O da size: “İyi olanı düşük olanla değiştirmek mi istiyorsunuz? Öyle ise inin şehre! İstedikleriniz orada var.\" demişti. Böylece zillet ve yoksulluk onları kapladı. Onlar, Allah’ın gazabına uğradılar. Bunun sebebi; onların, Allah’ın ayetlerini inkâr ediyor, peygamberleri de haksız yere öldürüyor olmaları idi. Bunların hepsi isyanları ve taşkınlıkları sebebiyledir.",""],[62,"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَادُوا۟ وَٱلنَّصَٰرَىٰ وَٱلصَّٰبِـِٔينَ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ وَعَمِلَ صَٰلِحًا فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","Innal-lazîna âmanû vel-lazîna hâdû van-nasârâ vas-sâbi'îna man âmana billâhi vel- yavmil-âhiri ve 'amila sâlihan fa lahum acruhum 'inda rabbihim, ve lâ havfun 'alayhim ve lâ hum yahzanûn.","Şüphesiz iman edenler, Yahudiler, Hristiyanlar ve Sâbiîlerden kim Allah’a ve ahiret gününe iman eder ve salih amel işlerse; onlara Rableri katında mükâfatlar vardır. Onlara bir korku yoktur, üzülmeyeceklerdir.",""],[63,"وَإِذْ أَخَذْنَا مِيثَٰقَكُمْ وَرَفَعْنَا فَوْقَكُمُ ٱلطُّورَ خُذُوا۟ مَآ ءَاتَيْنَٰكُم بِقُوَّةٍ وَٱذْكُرُوا۟ مَا فِيهِ لَعَلَّكُمْ تَتَّقُونَ","Ve iz ahaznâ mîsâkakum ve rafa'nâ favkakumut-tûr, huzû mâ âtaynâkum bikuvvativ vazkurû mâ fîhi la'allakum tattakûn.","Hani, sizden sağlam bir söz almış, Tûr dağını da üzerinize kaldırmış ve “Sakınasınız diye, size verdiğimiz kitabı sıkı tutun, onun içindekileri düşünün” demiştik.",""],[64,"ثُمَّ تَوَلَّيْتُم مِّنۢ بَعْدِ ذَٰلِكَ فَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ لَكُنتُم مِّنَ ٱلْخَٰسِرِينَ","Summa tavallaytum mim ba'di zâlika falav lâ fadlullâhi 'alaykum ve rahmatuhû lakuntum minal-hâsirîn.","Bundan sonra yine yüz çevirmiştiniz. Eğer Allah’ın size bol lütfu ve merhameti olmasaydı, elbette hüsrana uğrayanlardan olurdunuz.",""],[65,"وَلَقَدْ عَلِمْتُمُ ٱلَّذِينَ ٱعْتَدَوْا۟ مِنكُمْ فِى ٱلسَّبْتِ فَقُلْنَا لَهُمْ كُونُوا۟ قِرَدَةً خَٰسِـِٔينَ","Ve lakad 'alimtumul-lazîna'tadav minkum fis-sabti fakulnâ lahum kûnû kiradatan hâsi'în.","Şüphesiz siz, içinizden cumartesi yasağını çiğneyenleri biliyorsunuz. İşte biz onlara, “Aşağılık maymunlar olun!” demiştik.",""],[66,"فَجَعَلْنَٰهَا نَكَٰلًا لِّمَا بَيْنَ يَدَيْهَا وَمَا خَلْفَهَا وَمَوْعِظَةً لِّلْمُتَّقِينَ","Faca'alnâhâ nakâlal limâ bayna yadayhâ ve mâ halfahâ ve mav'izatal lil-muttakîn.","Böylece onların (maymunlara çevrilmiş insanların) akıbetini hem onu görenlere, hem de kendilerinden sonra geleceklere bir ibret ve Allah’tan korkanlar için de bir öğüt vesilesi kıldık.",""],[67,"وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦٓ إِنَّ ٱللَّهَ يَأْمُرُكُمْ أَن تَذْبَحُوا۟ بَقَرَةً قَالُوٓا۟ أَتَتَّخِذُنَا هُزُوًا قَالَ أَعُوذُ بِٱللَّهِ أَنْ أَكُونَ مِنَ ٱلْجَٰهِلِينَ","Ve iz kâla mûsâ likavmihî innallâha ya'murukum an tazbahû bakarah, kâlû atattahizunâ huzuvâ, kâla a'ûzu billâhi an akûna minal-câhilîn.","Hani Mûsâ kavmine: \"Allah, size bir inek kesmenizi emrediyor\" demişti. Onlar: \"Bizimle alay mı ediyorsun?\" demişlerdi. Mûsâ da: \"Ben cahillerden olmaktan Allah’a sığınırım\" demişti",""],[68,"قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِىَ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌ لَّا فَارِضٌ وَلَا بِكْرٌ عَوَانٌۢ بَيْنَ ذَٰلِكَ فَٱفْعَلُوا۟ مَا تُؤْمَرُونَ","Kâlud'u lanâ rabbaka yubayyil lanâ mâ hiy, kâla innahû yakûlu innahâ bakaratul lâ fâriduv ve lâ bikr, 'avânum bayna zâlik, faf'alû mâ tu'marûn.","Bizim için Rabbine dua et de bize onun nasıl bir şey olduğunu açıklasın, dediler. Mûsâ şöyle dedi: “(Rabbim) diyor ki: O, ne yaşlı, ne körpe, ikisi arası bir inektir. Haydi, emrolunduğunuz işi yapın.”",""],[69,"قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا لَوْنُهَا قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌ صَفْرَآءُ فَاقِعٌ لَّوْنُهَا تَسُرُّ ٱلنَّٰظِرِينَ","Kâlud'u lanâ rabbaka yubayyil lanâ mâ lavnuhâ, kâla innahû yakûlu innahâ bakaratun safrâ'u fâki'ul lavnuhâ tasurrun-nâzirîn.","Onlar: “Bizim için Rabbine dua et de, rengi neymiş, açıklasın.” dediler. Mûsâ: \"Allah, onun, bakanların içini açan, parlak sarı bir inek olduğunu söylüyor.\" dedi.",""],[70,"قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِىَ إِنَّ ٱلْبَقَرَ تَشَٰبَهَ عَلَيْنَا وَإِنَّآ إِن شَآءَ ٱللَّهُ لَمُهْتَدُونَ","Kâlud'u lanâ rabbaka yubayyil lanâ mâ hiy, innal-bakara taşâbaha 'alaynâ, ve innâ in şâ'allâhu lamuhtadûn.","Onlar: (Ey Mûsâ) Rabbine dua et, bize açıkça bildirsin. Nasıl bir inek olduğunu anlayamadık. Allah dilerse elbette biz hidayete erenlerden oluruz, dediler.",""],[71,"قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌ لَّا ذَلُولٌ تُثِيرُ ٱلْأَرْضَ وَلَا تَسْقِى ٱلْحَرْثَ مُسَلَّمَةٌ لَّا شِيَةَ فِيهَا قَالُوا۟ ٱلْـَٰٔنَ جِئْتَ بِٱلْحَقِّ فَذَبَحُوهَا وَمَا كَادُوا۟ يَفْعَلُونَ","Kâla innahû yakûlu innahâ bakaratul lâ zalûlun tusîrul-arda ve lâ taskil-hars, musallamatul lâ şiyata fîhâ, kâlul-'âna ci'ta bil-hakki fazabahûhâ ve mâ kâdû yaf'alûn.","Mûsâ şöyle dedi: “Rabbim diyor ki; o, çift sürmek, ekin sulamak için boyunduruğa vurulmamış, kusursuz, hiç alacası olmayan bir inektir.” Onlar: “İşte, şimdi tam doğrusunu bildirdin” dediler. Nihayet o ineği kestiler. Neredeyse bunu yapmayacaklardı.",""],[72,"وَإِذْ قَتَلْتُمْ نَفْسًا فَٱدَّٰرَْٰٔتُمْ فِيهَا وَٱللَّهُ مُخْرِجٌ مَّا كُنتُمْ تَكْتُمُونَ","Ve iz kultum nafsan faddâra'tum fîhâ, vallâhu muhricum mâ kuntum taktumûn.","Hani, bir kimseyi öldürmüştünüz de suçu birbirinizin üstüne atmıştınız. Halbuki Allah, gizlemekte olduğunuzu ortaya çıkaracaktır.",""],[73,"فَقُلْنَا ٱضْرِبُوهُ بِبَعْضِهَا كَذَٰلِكَ يُحْىِ ٱللَّهُ ٱلْمَوْتَىٰ وَيُرِيكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَعْقِلُونَ","Fakulnadribûhu biba'dihâ, kazâlika yuhyillâhul-mavtâ ve yurîkum âyâtihî la'allakum ta'kilûn.","“İneğin bir parçası ile öldürülene vurun” dedik. İşte, Allah ölüleri böyle diriltir, düşünesiniz diye mucizelerini de size böyle gösterir.",""],[74,"ثُمَّ قَسَتْ قُلُوبُكُم مِّنۢ بَعْدِ ذَٰلِكَ فَهِىَ كَٱلْحِجَارَةِ أَوْ أَشَدُّ قَسْوَةً وَإِنَّ مِنَ ٱلْحِجَارَةِ لَمَا يَتَفَجَّرُ مِنْهُ ٱلْأَنْهَٰرُ وَإِنَّ مِنْهَا لَمَا يَشَّقَّقُ فَيَخْرُجُ مِنْهُ ٱلْمَآءُ وَإِنَّ مِنْهَا لَمَا يَهْبِطُ مِنْ خَشْيَةِ ٱللَّهِ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ","Summa kasat kulûbukum mim ba'di zâlika fahiya kal-hicârati av aşaddu kasvah, ve inna minal-hicârati lamâ yatafaccaru minhul-anhâr, ve inna minhâ lamâ yaşşakkaku fayahrucu minhul-mâ', ve inna minhâ lamâ yahbitu min haş-yatillâh, ve mallâhu bigâfilin 'ammâ ta'malûn.","(Ne var ki) bunlardan sonra yine kalpleriniz taş gibi yahut daha sert bir şekilde katılaşmıştı. Halbuki içinden nehirler kaynayan, yarılıp (içlerinden) sular çıkan ve Allah korkusundan yuvarlanan nice taşlar vardır! Allah yapmakta olduklarınızdan gafil değildir.",""],[75,"أَفَتَطْمَعُونَ أَن يُؤْمِنُوا۟ لَكُمْ وَقَدْ كَانَ فَرِيقٌ مِّنْهُمْ يَسْمَعُونَ كَلَٰمَ ٱللَّهِ ثُمَّ يُحَرِّفُونَهُۥ مِنۢ بَعْدِ مَا عَقَلُوهُ وَهُمْ يَعْلَمُونَ","Afa tatma'ûna ay yu'minû lakum ve kad kâna farîkum minhum yasma'ûna kalâmallâhi summa yuharrifûnahû mim ba'di mâ 'akalûhu ve hum ya'lamûn.","Şimdi (ey Müminler) size iman edeceklerini mi umuyorsunuz? Oysa onlardan bir grup vardı ki, Allah’ın sözünü işitirlerdi de düşünüp akıl erdirdikten sonra, bile bile onu tahrif ederlerdi.",""],[76,"وَإِذَا لَقُوا۟ ٱلَّذِينَ ءَامَنُوا۟ قَالُوٓا۟ ءَامَنَّا وَإِذَا خَلَا بَعْضُهُمْ إِلَىٰ بَعْضٍ قَالُوٓا۟ أَتُحَدِّثُونَهُم بِمَا فَتَحَ ٱللَّهُ عَلَيْكُمْ لِيُحَآجُّوكُم بِهِۦ عِندَ رَبِّكُمْ أَفَلَا تَعْقِلُونَ","Ve izâ lakul-lazîna âmanû kâlû âmannâ, ve izâ halâ ba'duhum ilâ ba'din kâlû atuhaddisûnahum bimâ fatahallâhu 'alaykum liyuhâccûkum bihî 'inda rabbikum, afalâ ta'kilûn.","(Münafıklar) iman edenlerle karşılaştıkları zaman “İman ettik” derler, birbirleriyle yalnız kaldıklarında; \"Rabbinizin yanında size karşı delil getirsinler diye mi, Allah’ın size açıkladığını onlara anlatıp duruyorsunuz?\" derlerdi. Bunu akıl etmiyor musunuz?",""],[77,"أَوَلَا يَعْلَمُونَ أَنَّ ٱللَّهَ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ","Avalâ ya'lamûna annallâha ya'lamu mâ yusirrûna ve mâ yu'linûn.","Onlar bilmiyorlar mı ki, Allah onların gizli tuttuklarını da, açığa vurduklarını da bilir.",""],[78,"وَمِنْهُمْ أُمِّيُّونَ لَا يَعْلَمُونَ ٱلْكِتَٰبَ إِلَّآ أَمَانِىَّ وَإِنْ هُمْ إِلَّا يَظُنُّونَ","Ve minhum umiyyûna lâ ya'lamûnal-kitâba illâ amâniyya ve in hum illâ yazunnûn.","Onların bir kısmının okuyup yazması yoktur. Kitabı (Tevrat'ı) bilmezler, bildikleri sadece bir takım yalan ve kuruntulardır. Onlar yalnızca zanneder dururlar.",""],[79,"فَوَيْلٌ لِّلَّذِينَ يَكْتُبُونَ ٱلْكِتَٰبَ بِأَيْدِيهِمْ ثُمَّ يَقُولُونَ هَٰذَا مِنْ عِندِ ٱللَّهِ لِيَشْتَرُوا۟ بِهِۦ ثَمَنًا قَلِيلًا فَوَيْلٌ لَّهُم مِّمَّا كَتَبَتْ أَيْدِيهِمْ وَوَيْلٌ لَّهُم مِّمَّا يَكْسِبُونَ","Favaylul lil-lazîna yaktubûnal-kitâba bi'aydîhim summa yakûlûna hâzâ min 'indillâhi liyaştarû bihî samanan kalîlâ, favaylul lahum mimmâ katabat aydîhim ve vaylul lahum mimmâ yaksibûn.","Kitabı kendi elleriyle yazıp sonra onu az bir bedel karşılığında satabilmek için: «Bu, Allah katındandır» diyenlerin vay haline! Vay ellerinin yazmış olduğundan dolayı başlarına geleceklere! Kazandıklarından dolayı vay onların haline!",""],[80,"وَقَالُوا۟ لَن تَمَسَّنَا ٱلنَّارُ إِلَّآ أَيَّامًا مَّعْدُودَةً قُلْ أَتَّخَذْتُمْ عِندَ ٱللَّهِ عَهْدًا فَلَن يُخْلِفَ ٱللَّهُ عَهْدَهُۥٓ أَمْ تَقُولُونَ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ","Ve kâlû lan tamassanan-nâru illâ ayyâmam ma'dûdah, kul attahaztum 'indallâhi 'ahdan falay yuhlifallâhu 'ahdahû am takûlûna 'alallâhi mâ lâ ta'lamûn.","İsrailoğulları \"Ateş bize sayılı bir kaç günden başka dokunmayacaktır\" derler. Onlara: \"Allah katından bir söz mü aldınız? Eğer, öyle ise Allah sözünden dönmez; yoksa Allah hakkında bilmediğiniz bir şey mi söylüyorsunuz?\" de.",""],[81,"بَلَىٰ مَن كَسَبَ سَيِّئَةً وَأَحَٰطَتْ بِهِۦ خَطِيٓـَٔتُهُۥ فَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ هُمْ فِيهَا خَٰلِدُونَ","Balâ man kasaba sayyi'atav ve ahâtat bihî hatî'atuhû fa ulâ'ika ashâbun-nâr, hum fîhâ hâlidûn.","Hayır! günah işleyip günahı kendisini kuşatmış olan kimseler, cehennemlikler işte onlardır. Onlar orada ebedi kalacaklardır.",""],[82,"وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلْجَنَّةِ هُمْ فِيهَا خَٰلِدُونَ","Vel-lazîna âmanû ve 'amilus-sâlihâti ulâ'ika ashâbul-cannah, hum fîhâ hâlidûn.","İman edip salih ameller işleyenler ise cennetliklerdir. Onlar orada ebedî kalacaklardır.",""],[83,"وَإِذْ أَخَذْنَا مِيثَٰقَ بَنِىٓ إِسْرَٰٓءِيلَ لَا تَعْبُدُونَ إِلَّا ٱللَّهَ وَبِٱلْوَٰلِدَيْنِ إِحْسَانًا وَذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَقُولُوا۟ لِلنَّاسِ حُسْنًا وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ ثُمَّ تَوَلَّيْتُمْ إِلَّا قَلِيلًا مِّنكُمْ وَأَنتُم مُّعْرِضُونَ","Ve iz ahaznâ mîsâka banî isrâ'îla lâ ta'budûna illallâha ve bil-vâlidayni ihsânav ve zil-kurbâ vel-yatâmâ vel-masâkîni ve kûlû lin-nâsi husnav ve akîmus-salâta ve âtuz-zakâh, summa tavallaytum illâ kalîlam minkum ve antum mu'ridûn.","İsrailoğulları'ndan: \"Allah’tan başkasına ibadet etmeyin, anaya, babaya, yakın akrabaya, yetimlere, yoksullara iyilik edin, insanlara güzel söz söyleyin, namazı kılın, zekâtı verin!\" diye söz almıştık. Sonra siz pek azınız dışında sözünüzden döndünüz ve hala da dönmeye devam ediyorsunuz.",""],[84,"وَإِذْ أَخَذْنَا مِيثَٰقَكُمْ لَا تَسْفِكُونَ دِمَآءَكُمْ وَلَا تُخْرِجُونَ أَنفُسَكُم مِّن دِيَٰرِكُمْ ثُمَّ أَقْرَرْتُمْ وَأَنتُمْ تَشْهَدُونَ","Ve iz ahaznâ mîsâkakum lâ tasfikûna dimâ'akum ve lâ tuhricûna anfusakum min diyârikum summa akrartum ve antum taşhadûn.","(Ey İsrailoğulları!) “Birbirinizin kanını dökmeyeceksiniz, birbirinizi yurtlarınızdan çıkarmayacaksınız” diye de sizden kesin söz almıştık. Sonra bunu böylece kabul etmiştiniz. Kendiniz de buna hâlâ şahitlik etmektesiniz.",""],[85,"ثُمَّ أَنتُمْ هَٰٓؤُلَآءِ تَقْتُلُونَ أَنفُسَكُمْ وَتُخْرِجُونَ فَرِيقًا مِّنكُم مِّن دِيَٰرِهِمْ تَظَٰهَرُونَ عَلَيْهِم بِٱلْإِثْمِ وَٱلْعُدْوَٰنِ وَإِن يَأْتُوكُمْ أُسَٰرَىٰ تُفَٰدُوهُمْ وَهُوَ مُحَرَّمٌ عَلَيْكُمْ إِخْرَاجُهُمْ أَفَتُؤْمِنُونَ بِبَعْضِ ٱلْكِتَٰبِ وَتَكْفُرُونَ بِبَعْضٍ فَمَا جَزَآءُ مَن يَفْعَلُ ذَٰلِكَ مِنكُمْ إِلَّا خِزْىٌ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيَوْمَ ٱلْقِيَٰمَةِ يُرَدُّونَ إِلَىٰٓ أَشَدِّ ٱلْعَذَابِ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ","Summa antum hâ'ulâ'i taktulûna anfusakum ve tuhricûna farîkam minkum min diyârihim tazâharûna 'alayhim bil-ismi vel-'udvân, ve iy ya'tûkum usârâ tufâdûhum ve huva muharramun 'alaykum ihrâcuhum, afa tu'minûna biba'dil-kitâbi ve takfurûna bi ba'd, famâ cazâ'u may yaf'alu zâlika minkum illâ hizyun fil-hayâtid-dun-yâ, ve yavmal-kiyâmati yuraddûna ilâ aşaddil-'azâb, ve mallâhu bigâfilin 'ammâ ta'malûn.","Ama siz, birbirinizi öldüren, içinizden bir kesime karşı kötülük ve zulümde yardımlaşarak size haram olduğu hâlde onları yurtlarından çıkaran, size esir olarak geldiklerinde ise fidye verip kendilerini kurtaran kimselersiniz. Yoksa siz kitabın (Tevrat’ın) bir kısmına inanıp, bir kısmını inkâr mı ediyorsunuz? Şu hâlde içinizden böyle yapanın cezası dünya hayatında rezil olmak ve kıyamet gününde azabın en şiddetlisine uğratılmaktan başka bir şey değildir. Çünkü Allah, yaptıklarınızdan habersiz değildir.",""],[86,"أُو۟لَٰٓئِكَ ٱلَّذِينَ ٱشْتَرَوُا۟ ٱلْحَيَوٰةَ ٱلدُّنْيَا بِٱلْـَٔاخِرَةِ فَلَا يُخَفَّفُ عَنْهُمُ ٱلْعَذَابُ وَلَا هُمْ يُنصَرُونَ","Ulâ'ikal-lazînaştaravul-hayâtad-dun-yâ bil-âhirah, falâ yuhaffafu 'anhumul-'azâbu ve lâ hum yunsarûn.","İşte onlar, ahirete karşılık dünya hayatını satın alan kimselerdir. Onlardan azap hiç hafifletilmeyecektir. Ve onlar, hiçbir yardım da göremeyeceklerdir.",""],[87,"وَلَقَدْ ءَاتَيْنَا مُوسَى ٱلْكِتَٰبَ وَقَفَّيْنَا مِنۢ بَعْدِهِۦ بِٱلرُّسُلِ وَءَاتَيْنَا عِيسَى ٱبْنَ مَرْيَمَ ٱلْبَيِّنَٰتِ وَأَيَّدْنَٰهُ بِرُوحِ ٱلْقُدُسِ أَفَكُلَّمَا جَآءَكُمْ رَسُولٌۢ بِمَا لَا تَهْوَىٰٓ أَنفُسُكُمُ ٱسْتَكْبَرْتُمْ فَفَرِيقًا كَذَّبْتُمْ وَفَرِيقًا تَقْتُلُونَ","Ve lakad âtaynâ mûsal-kitâba ve kaffaynâ mim ba'dihî bir-rusul, ve âtaynâ 'îsabna maryamal-bayyinâti ve ayyadnâhu birûhil-kudus, afakullamâ câ'akum rasûlum bimâ lâ tahvâ anfusukumustakbartum, fafarîkan kazzabtum ve farîkan taktulûn.","Andolsun biz Mûsâ'ya kitabı (Tevrat'ı) verdik. Ondan sonra art arda peygamberler gönderdik. Meryemoğlu İsa'ya da deliller verdik. Ve onu, Rûhu'l-Kudüs (Cebrâil) ile destekledik. Ama ne zaman size bir peygamber nefislerinizin hoşlanmadığı bir şey getirdiyse büyüklük taslayarak kimini yalanladığınız, kimini de öldürdüğünüz doğru değil mi",""],[88,"وَقَالُوا۟ قُلُوبُنَا غُلْفٌۢ بَل لَّعَنَهُمُ ٱللَّهُ بِكُفْرِهِمْ فَقَلِيلًا مَّا يُؤْمِنُونَ","Ve kâlû kulûbunâ gulf, bal la'anahumullâhu bikufrihim fakalîlam mâ yu'minûn.","(Yahudiler Peygamberlerle alay ederek) Kalplerimiz perdelidir! dediler. Hayır! Allah, küfürleri yüzünden onları lanetlemiştir. Ancak onların çok az bir kısmı iman eder.",""],[89,"وَلَمَّا جَآءَهُمْ كِتَٰبٌ مِّنْ عِندِ ٱللَّهِ مُصَدِّقٌ لِّمَا مَعَهُمْ وَكَانُوا۟ مِن قَبْلُ يَسْتَفْتِحُونَ عَلَى ٱلَّذِينَ كَفَرُوا۟ فَلَمَّا جَآءَهُم مَّا عَرَفُوا۟ كَفَرُوا۟ بِهِۦ فَلَعْنَةُ ٱللَّهِ عَلَى ٱلْكَٰفِرِينَ","Ve lammâ câ'akum kitâbum min 'indillâhi musaddikul limâ ma'ahum, ve kânû min kablu yastaftihûna 'alal-lazîna kafarû, falammâ câ'ahum mâ 'arafû kafarû bih, fala'natullâhi 'alal-kâfirîn.","Allah katından kendilerine ellerindekini (Tevrat’ı) tasdik eden bir kitap (Kur’an) gelince onu inkâr ettiler. Oysa, daha önce (bu kitabı getirecek peygamber ile) inkârcılara karşı yardım istiyorlardı. (Tevrat’tan) tanıyıp bildikleri (bu peygamber) kendilerine gelince onu inkâr ettiler. Allah’ın lâneti inkârcıların üzerine olsun.",""],[90,"بِئْسَمَا ٱشْتَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ أَن يَكْفُرُوا۟ بِمَآ أَنزَلَ ٱللَّهُ بَغْيًا أَن يُنَزِّلَ ٱللَّهُ مِن فَضْلِهِۦ عَلَىٰ مَن يَشَآءُ مِنْ عِبَادِهِۦ فَبَآءُو بِغَضَبٍ عَلَىٰ غَضَبٍ وَلِلْكَٰفِرِينَ عَذَابٌ مُّهِينٌ","Bi'samaştarav bihî anfusahum ay yakfurû bimâ anzalallâhu bagyan ay yunazzilallâhu min fadlihî 'alâ may yaşâ'u min 'ibâdih, fabâ'û bigadabin 'alâ gadab, ve lil-kâfirîna 'azâbum muhîn.","Allah'ın kullarından dilediğine, (Kitap) indirmesini çekemeyerek, Allah'ın indirdiğini (Kur'an'ı) inkâr etmekle, kendilerini ne kötü bir şey karşılığında sattılar. Bu yüzden gazab üstüne gazaba uğradılar. Kâfirlere alçaltıcı bir azap vardır.",""],[91,"وَإِذَا قِيلَ لَهُمْ ءَامِنُوا۟ بِمَآ أَنزَلَ ٱللَّهُ قَالُوا۟ نُؤْمِنُ بِمَآ أُنزِلَ عَلَيْنَا وَيَكْفُرُونَ بِمَا وَرَآءَهُۥ وَهُوَ ٱلْحَقُّ مُصَدِّقًا لِّمَا مَعَهُمْ قُلْ فَلِمَ تَقْتُلُونَ أَنۢبِيَآءَ ٱللَّهِ مِن قَبْلُ إِن كُنتُم مُّؤْمِنِينَ","Ve izâ kîla lahum âminû bimâ anzalallâhu kâlû nu'minu bimâ unzila 'alaynâ ve yakfurûna bimâ varâ'ah, ve huval-hakku musaddikal limâ ma'ahum, kul falima taktulûna ambiyâ'allâhi min kablu in kuntum mu'minîn.","Onlara: “Allah’ın indirdiğine (Kur’an’a) iman edin” denilince, “Biz sadece bize indirilene (Tevrat’a) iman ederiz” deyip, ondan sonra geleni (Kur’an’ı) inkâr ederler. Halbuki o, ellerinde bulunanı (Tevrat’ı) tasdik eden hak bir kitaptır. De ki: “Eğer iman eden kimseler idiyseniz, daha önce niçin Allah’ın peygamberlerini öldürüyordunuz?”",""],[92,"وَلَقَدْ جَآءَكُم مُّوسَىٰ بِٱلْبَيِّنَٰتِ ثُمَّ ٱتَّخَذْتُمُ ٱلْعِجْلَ مِنۢ بَعْدِهِۦ وَأَنتُمْ ظَٰلِمُونَ","Ve lakad câ'akum mûsâ bil-bayyinâti summattahaztumul-'icla mim ba'dihî ve antum zâlimûn.","Andolsun, Mûsâ size açık mucizeler getirmişti de, sonra onun ardından buzağıyı ilah edinmiştiniz. Siz işte o zalimlersiniz.",""],[93,"وَإِذْ أَخَذْنَا مِيثَٰقَكُمْ وَرَفَعْنَا فَوْقَكُمُ ٱلطُّورَ خُذُوا۟ مَآ ءَاتَيْنَٰكُم بِقُوَّةٍ وَٱسْمَعُوا۟ قَالُوا۟ سَمِعْنَا وَعَصَيْنَا وَأُشْرِبُوا۟ فِى قُلُوبِهِمُ ٱلْعِجْلَ بِكُفْرِهِمْ قُلْ بِئْسَمَا يَأْمُرُكُم بِهِۦٓ إِيمَٰنُكُمْ إِن كُنتُم مُّؤْمِنِينَ","Ve iz ahaznâ mîsâkakum ve rafa'nâ favkakumut-tûr, huzû mâ âtaynâkum bikuvvativ vasma'û, kâlû sami'nâ ve 'asaynâ, ve uşribû fî kulûbihimul-'icla bikufrihim, kul bi'samâ ya'murukum bihî îmânukum in kuntum mu'minîn.","Hani, Tûr dağını tepenize dikerek sizden söz almıştık, “Size verdiğimize (Kitab’a) sımsıkı sarılın; ona kulak verin” demiştik. Onlar: “İşittik, karşı geldik” demişlerdi. Küfürleri yüzünden buzağı sevgisi onların kalplerine içirilip, sindirilmişti. Onlara de ki: \"(Tevrat’a beslediğinizi iddia ettiğiniz) imanınızın size emrettiği şey ne kötüdür, eğer inanan kimselerseniz!\"",""],[94,"قُلْ إِن كَانَتْ لَكُمُ ٱلدَّارُ ٱلْـَٔاخِرَةُ عِندَ ٱللَّهِ خَالِصَةً مِّن دُونِ ٱلنَّاسِ فَتَمَنَّوُا۟ ٱلْمَوْتَ إِن كُنتُمْ صَٰدِقِينَ","Kul in kânat lakumud-dârul-âhiratu 'indallâhi hâlisatam min dûnin-nâsi fatamannavul-mavta in kuntum sâdikîn.","(Ey Muhammed, onlara:) De ki: “Eğer (iddia ettiğiniz gibi) Allah katındaki ahiret yurdu (Cennet) diğer insanlar için değil de yalnız sizinse ve doğru söyleyenler iseniz haydi ölümü temenni edin!”",""],[95,"وَلَن يَتَمَنَّوْهُ أَبَدًۢا بِمَا قَدَّمَتْ أَيْدِيهِمْ وَٱللَّهُ عَلِيمٌۢ بِٱلظَّٰلِمِينَ","Ve lay yatamannavhu abadam bima kaddamat aydîhim, vallâhu 'alîmum biz-zâlimîn.","Fakat kendi elleriyle önceden yaptıkları işler yüzünden ölümü hiçbir zaman temenni edemezler. Allah, o zalimleri en iyi bilendir.",""],[96,"وَلَتَجِدَنَّهُمْ أَحْرَصَ ٱلنَّاسِ عَلَىٰ حَيَوٰةٍ وَمِنَ ٱلَّذِينَ أَشْرَكُوا۟ يَوَدُّ أَحَدُهُمْ لَوْ يُعَمَّرُ أَلْفَ سَنَةٍ وَمَا هُوَ بِمُزَحْزِحِهِۦ مِنَ ٱلْعَذَابِ أَن يُعَمَّرَ وَٱللَّهُ بَصِيرٌۢ بِمَا يَعْمَلُونَ","Ve latacidannahum ahrasan-nâsi 'alâ hayâh, ve minal-lazîna aşrakû, yavaddu ahaduhum lav yu'ammaru alfa sanah, ve mâ huva bi muzahzihihî minal-'azâbi ay yu'ammar, vallâhu basîrum bimâ ya'malûn.","Sen onları diğer insanların hayata en düşkünlerinden; hatta, Allah’a ortak koşanlardan bile yaşamaya daha düşkün olduklarını görürsün. Onların her biri bin yıl yaşamak ister. Halbuki uzun yaşamak, onları azaptan kurtaracak değildir. Zira Allah, onların bütün yaptıklarını görendir.",""],[97,"قُلْ مَن كَانَ عَدُوًّا لِّجِبْرِيلَ فَإِنَّهُۥ نَزَّلَهُۥ عَلَىٰ قَلْبِكَ بِإِذْنِ ٱللَّهِ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ وَهُدًى وَبُشْرَىٰ لِلْمُؤْمِنِينَ","Kul man kâna 'aduvval licibrîla fa'innahû nazzalahû 'alâ kalbika bi iznillâhi musaddikal limâ bayna yadayhi ve hudav ve buşrâ lil-mu'minîn.","De ki: “Her kim Cebrâîl’e düşman ise, bilsin ki o, Allah’ın izni ile Kur’an’ı; önceki kitapları doğrulayıcı, Müminler için de bir hidayet rehberi ve müjde verici olarak senin kalbine indirmiştir.”",""],[98,"مَن كَانَ عَدُوًّا لِّلَّهِ وَمَلَٰٓئِكَتِهِۦ وَرُسُلِهِۦ وَجِبْرِيلَ وَمِيكَىٰلَ فَإِنَّ ٱللَّهَ عَدُوٌّ لِّلْكَٰفِرِينَ","Man kâna 'aduvval lillâhi ve malâ'ikatihî ve rusulihî ve cibrîla ve mîkâla fa innallâha 'aduvvul lil-kâfirîn.","Her kim Allah’a, meleklerine, rasûllerine, Cebrâil’e ve Mîkâil’e düşman olursa, şüphesiz Allah da o kâfirlerin düşmanıdır.",""],[99,"وَلَقَدْ أَنزَلْنَآ إِلَيْكَ ءَايَٰتٍۭ بَيِّنَٰتٍ وَمَا يَكْفُرُ بِهَآ إِلَّا ٱلْفَٰسِقُونَ","Ve lakad anzalnâ ilayka âyâtim bayyinât, ve mâ yakfuru bihâ illal-fâsikûn.","Andolsun biz, sana apaçık ayetler indirdik. Onları fasıklardan başkası inkâr etmez.",""],[100,"أَوَكُلَّمَا عَٰهَدُوا۟ عَهْدًا نَّبَذَهُۥ فَرِيقٌ مِّنْهُم بَلْ أَكْثَرُهُمْ لَا يُؤْمِنُونَ","Ava kullamâ 'âhadû 'ahdan nabazahû farîkum minhum, bal aksaruhum lâ yu'minûn.","Onlar ne zaman bir söz vermişlerse, içlerinden bir grup bu sözü bozup atmadı mı? Zaten onların çoğu iman etmezler.",""],[101,"وَلَمَّا جَآءَهُمْ رَسُولٌ مِّنْ عِندِ ٱللَّهِ مُصَدِّقٌ لِّمَا مَعَهُمْ نَبَذَ فَرِيقٌ مِّنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ كِتَٰبَ ٱللَّهِ وَرَآءَ ظُهُورِهِمْ كَأَنَّهُمْ لَا يَعْلَمُونَ","Ve lammâ câ'ahum rasûlum min 'indillâhi musaddikul limâ ma'ahum nabaza farîkum minal-lazîna ûtul-kitâb, kitâballâhi varâ'a zuhûrihim ka'annahum lâ ya'lamûn.","Onlara ne zaman ellerinde bulunanı (Tevrat'ı) tasdik eden bir rasûl gelse kendilerine kitap verilenlerden bir grup, sanki Allah’ın kitabını bilmiyorlarmış gibi arkalarına attılar.",""],[102,"وَٱتَّبَعُوا۟ مَا تَتْلُوا۟ ٱلشَّيَٰطِينُ عَلَىٰ مُلْكِ سُلَيْمَٰنَ وَمَا كَفَرَ سُلَيْمَٰنُ وَلَٰكِنَّ ٱلشَّيَٰطِينَ كَفَرُوا۟ يُعَلِّمُونَ ٱلنَّاسَ ٱلسِّحْرَ وَمَآ أُنزِلَ عَلَى ٱلْمَلَكَيْنِ بِبَابِلَ هَٰرُوتَ وَمَٰرُوتَ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَآ إِنَّمَا نَحْنُ فِتْنَةٌ فَلَا تَكْفُرْ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِۦ بَيْنَ ٱلْمَرْءِ وَزَوْجِهِۦ وَمَا هُم بِضَآرِّينَ بِهِۦ مِنْ أَحَدٍ إِلَّا بِإِذْنِ ٱللَّهِ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ وَلَقَدْ عَلِمُوا۟ لَمَنِ ٱشْتَرَىٰهُ مَا لَهُۥ فِى ٱلْـَٔاخِرَةِ مِنْ خَلَٰقٍ وَلَبِئْسَ مَا شَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ لَوْ كَانُوا۟ يَعْلَمُونَ","Vattaba'û mâ tatluş-şayâtînu 'alâ mulki sulaymân, ve mâ kafara sulaymânu ve lâkinnnaş-şayâtîna kafarû yu'allimûnan-nâsas sihr, ve mâ unzila 'alal-malakayni bibâbila hârûta ve mârût, ve mâ yu'allimâni min ahadin hattâ yakûlâ innamâ nahnu fitnatun falâ takfur, fayata'allamûna minhumâ mâ yufarrikûna bihî baynal-mar'i ve zavcih, ve mâ hum bidarrîna bihî min ahadin illâ bi'iznillâh, ve yata'allamûna mâ yadurruhum ve lâ yanfa'uhum, ve lakad 'alimû lamaniştarâhu mâ lahû fil-âhirati min halâk, ve labi'sa mâ şarav bihî anfusahum, lav kânû ya'lamûn.","Onlar şeytanların, Süleyman’ın saltanatı hakkında uydurdukları şeylere tabi oldular. Oysa Süleyman kâfir değildi. (Fakat insanlara sihri öğreten) şeytanlar kâfir idi. Onlar insanlara büyüyü Babil'deki iki meleğe, Hârut ile Mârut’a indirileni öğretiyorlardı. O ikisi: Biz bir imtihan vesilesiyiz, sakın kâfir olma! demedikçe, hiç kimseye bir şey öğretmiyorlardı. O ikisinden karı ile kocanın arasını ayıracak şeyler öğreniyorlardı. Halbuki onlar, Allah'ın izni olmadıkça o sihirle hiç kimseye zarar veremezlerdi. Onlar kendilerine faydalı olanı değil zararlı olanı öğreniyorlardı. Andolsun onlar, o büyüyü satın alanın ahirette bir nasibi olmadığını gayet iyi biliyorlardı. Kendilerini sattıkları şeyin ne kadar kötü olduğunu keşke anlasalardı!",""],[103,"وَلَوْ أَنَّهُمْ ءَامَنُوا۟ وَٱتَّقَوْا۟ لَمَثُوبَةٌ مِّنْ عِندِ ٱللَّهِ خَيْرٌ لَّوْ كَانُوا۟ يَعْلَمُونَ","Ve lav annahum âmanû vattakav lamasûbatum min 'indillâhi hayr, lav kânû ya'lamûn.","Eğer onlar iman edip takva sahibi olsalardı, elbette Allah katında verilecek sevap daha hayırlı olurdu. Keşke bilselerdi!",""],[104,"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَقُولُوا۟ رَٰعِنَا وَقُولُوا۟ ٱنظُرْنَا وَٱسْمَعُوا۟ وَلِلْكَٰفِرِينَ عَذَابٌ أَلِيمٌ","Yâ ayyuhal-lazîna âmanû lâ takûlû râ'inâ ve kûlunzurnâ vasma'û ve lil-kâfirîna 'azâbun alîm.","Ey iman edenler! “Râinâ” (bizi gözet) demeyin! “Unzurnâ” (bize bak) deyin ve sözü dinleyin. Kâfirler için çok acı bir azap vardır.",""],[105,"مَّا يَوَدُّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَلَا ٱلْمُشْرِكِينَ أَن يُنَزَّلَ عَلَيْكُم مِّنْ خَيْرٍ مِّن رَّبِّكُمْ وَٱللَّهُ يَخْتَصُّ بِرَحْمَتِهِۦ مَن يَشَآءُ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ","Mâ yavaddul-lazîna kafarû min ahlil-kitâbi ve lal-muşrikîna ay yunazzila 'alaykum min hayrim mir rabbikum, vallâhu yahtassu birahmatihî may yaşâ', vallâhu zul fadlil-'azîm.","(Ey Müminler!) Kitap ehli olan kâfirler de, müşrikler de size Rabbinizden hiçbir hayır indirilmesini istemezler. Allah ise rahmetiyle dilediği kimseyi seçerek ihsanda bulunur. Şüphesiz Allah en büyük lütuf ve ihsan sahibidir.",""],[106,"مَا نَنسَخْ مِنْ ءَايَةٍ أَوْ نُنسِهَا نَأْتِ بِخَيْرٍ مِّنْهَآ أَوْ مِثْلِهَآ أَلَمْ تَعْلَمْ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Mâ nansah min âyatin av nunsihâ na'ti bi hayrim minhâ av mislihâ, alam ta'lam annallâha 'alâ kulli şay'in kadîr.","Biz neshettiğimiz veya unutturduğumuz bir ayetin yerine ya ondan daha hayırlısını veya onun benzerini getiririz. Allah’ın her şeye gücünün yettiğini bilmez misin?",""],[107,"أَلَمْ تَعْلَمْ أَنَّ ٱللَّهَ لَهُۥ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا لَكُم مِّن دُونِ ٱللَّهِ مِن وَلِىٍّ وَلَا نَصِيرٍ","Alam ta'lam annallâha lahû mulkus-samâvâti val ard, ve mâ lakum min dûnillâhi miv valiyyiv ve lâ nasîr.","Bilmez misin ki, göklerin ve yerin hükümranlığı Allah’ındır. Sizin için Allah’tan başka ne bir dost, ne de bir yardımcı vardır.",""],[108,"أَمْ تُرِيدُونَ أَن تَسْـَٔلُوا۟ رَسُولَكُمْ كَمَا سُئِلَ مُوسَىٰ مِن قَبْلُ وَمَن يَتَبَدَّلِ ٱلْكُفْرَ بِٱلْإِيمَٰنِ فَقَدْ ضَلَّ سَوَآءَ ٱلسَّبِيلِ","Am turîdûna an tas'alû rasûlakum kamâ su'ila mûsâ min kabl, ve may yatabaddalil-kufra bil-îmâni fakad dalla savâ'as-sabîl.","Yoksa siz de daha önce Mûsâ’nın sorguya çekildiği gibi peygamberinizi sorguya çekmek mi istiyorsunuz? Kim imanı, küfür ile değiştirirse doğru yoldan sapmış olur.",""],[109,"وَدَّ كَثِيرٌ مِّنْ أَهْلِ ٱلْكِتَٰبِ لَوْ يَرُدُّونَكُم مِّنۢ بَعْدِ إِيمَٰنِكُمْ كُفَّارًا حَسَدًا مِّنْ عِندِ أَنفُسِهِم مِّنۢ بَعْدِ مَا تَبَيَّنَ لَهُمُ ٱلْحَقُّ فَٱعْفُوا۟ وَٱصْفَحُوا۟ حَتَّىٰ يَأْتِىَ ٱللَّهُ بِأَمْرِهِۦٓ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Vadda kasîrum min ahlil-kitâbi lav yaruddûnakum mim ba'di îmânikum kuffârâ, hasadam min 'indi anfusihim mim ba'di mâ tabayyana lahumul-hakk, fa'fû vasfahû hattâ ya'tiyallâhu bi amrih, innallâha 'alâ kulli şay'in kadîr.","Kitap ehlinden bir çoğu, hak kendilerine apaçık belli olduktan sonra, içlerindeki haset yüzünden, sizi imanınızdan sonra tekrar küfre döndürmeyi arzu ederler. Öyleyse onlara Allah’ın emri gelinceye kadar bırakıp, terk edin. Kendi hallerine bırakınız. Şüphesiz Allah’ın gücü her şeye yeter.",""],[110,"وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَمَا تُقَدِّمُوا۟ لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ ٱللَّهِ إِنَّ ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ","Ve akîmus-salâta ve âtuz-zakâh, ve mâ tukaddimû li'anfusikum min hayrin tacidûhu 'indallâh, innallâha bimâ ta'malûna basîr.","Namazı kılın, zekâtı verin, kendiniz için önden ne hayır yollarsanız Allah katında onu bulursunuz. Şüphesiz Allah, yaptıklarınızı en iyi görendir!",""],[111,"وَقَالُوا۟ لَن يَدْخُلَ ٱلْجَنَّةَ إِلَّا مَن كَانَ هُودًا أَوْ نَصَٰرَىٰ تِلْكَ أَمَانِيُّهُمْ قُلْ هَاتُوا۟ بُرْهَٰنَكُمْ إِن كُنتُمْ صَٰدِقِينَ","Ve kâlû lay yadhulal-cannata illâ man kâna hûdan av nasârâ, tilka amâniyyuhum, kul hâtû burhânakum in kuntum sâdikîn.","(Ehl-i kitap:) Bir de; “Yahudi ve Hristiyanlardan başkası Cennet’e giremeyecek” dediler. Bu, onların kuruntusudur. De ki: “Eğer doğru söylüyorsanız (iddianızı ispat edecek) delilinizi getirin.”",""],[112,"بَلَىٰ مَنْ أَسْلَمَ وَجْهَهُۥ لِلَّهِ وَهُوَ مُحْسِنٌ فَلَهُۥٓ أَجْرُهُۥ عِندَ رَبِّهِۦ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","Balâ man aslama vachahû lillâhi ve huva muhsinun falahû acruhû 'inda rabbih, ve lâ havfun 'alayhim ve lâ hum yahzanûn.","Bilâkis, kim muhsin olarak yüzünü Allah'a döndürürse (Allah'a hakkıyla kulluk ederse) ecri Rabbi katındadır. Onlar için ne bir korku vardır, ne de üzülürler.",""],[113,"وَقَالَتِ ٱلْيَهُودُ لَيْسَتِ ٱلنَّصَٰرَىٰ عَلَىٰ شَىْءٍ وَقَالَتِ ٱلنَّصَٰرَىٰ لَيْسَتِ ٱلْيَهُودُ عَلَىٰ شَىْءٍ وَهُمْ يَتْلُونَ ٱلْكِتَٰبَ كَذَٰلِكَ قَالَ ٱلَّذِينَ لَا يَعْلَمُونَ مِثْلَ قَوْلِهِمْ فَٱللَّهُ يَحْكُمُ بَيْنَهُمْ يَوْمَ ٱلْقِيَٰمَةِ فِيمَا كَانُوا۟ فِيهِ يَخْتَلِفُونَ","Ve kâlatil-yahûdu laysatin-nasârâ 'alâ şay', ve kâlatin-nasârâ laysatil-yahûdu 'alâ şay', ve hum yatlûnal-kitâb, kazâlika kâlal-lazîna lâ ya'lamûna misla kavlihim, fallâhu yahkumu baynahum yavmal-kiyâmati fîmâ kânû fîhi yahtalifûn.","Yahudiler: “Hristiyanlar hiçbir şey üzere değildir” dediler. Hristiyanlar da, “Yahudiler hiçbir şey üzere değildir” dediler. Oysa hepsi kitabı okuyorlar. (Kitabı) bilmeyenler de birbirleri hakkında tıpkı onların söylediklerini söylediler. Allah, ihtilâfa düştükleri hususlarda kıyamet günü onlar hakkında hükmünü verecektir.",""],[114,"وَمَنْ أَظْلَمُ مِمَّن مَّنَعَ مَسَٰجِدَ ٱللَّهِ أَن يُذْكَرَ فِيهَا ٱسْمُهُۥ وَسَعَىٰ فِى خَرَابِهَآ أُو۟لَٰٓئِكَ مَا كَانَ لَهُمْ أَن يَدْخُلُوهَآ إِلَّا خَآئِفِينَ لَهُمْ فِى ٱلدُّنْيَا خِزْىٌ وَلَهُمْ فِى ٱلْـَٔاخِرَةِ عَذَابٌ عَظِيمٌ","Ve man azlamu mim mam mana'a masâcidallâhi ay yuzkara fîhasmuhû ve sa'â fî harâbihâ, ulâ'ika mâ kâna lahum ay yadhulûhâ illâ hâ'ifîn, lahum fid-dun-yâ hizyuv ve lahum fil-âhirati 'azâbun 'azîm.","Allah’ın mescitlerinde, Allah’ın isminin anılmasını yasaklayanlardan ve onların harap olmalarına çalışanlardan daha zalim kim olabilir? Böyleleri oralara (eğer girerlerse) ancak korka korka girebilmelidirler. Bunlar için dünyada rezillik, ahirette de büyük bir azap vardır.",""],[115,"وَلِلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ فَأَيْنَمَا تُوَلُّوا۟ فَثَمَّ وَجْهُ ٱللَّهِ إِنَّ ٱللَّهَ وَٰسِعٌ عَلِيمٌ","Ve lillâhil-maşriku vel-magrib, fa'aynamâ tuvallû fasamma vachullâh, innallâha vâsi'un 'alîm.","Doğu da Allah’ındır batı da. Ne tarafa yönelirseniz yönelin Allah’ın yüzü oradadır. Şüphesiz Allah, her şeyi kuşatandır, bilendir.",""],[116,"وَقَالُوا۟ ٱتَّخَذَ ٱللَّهُ وَلَدًا سُبْحَٰنَهُۥ بَل لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ كُلٌّ لَّهُۥ قَٰنِتُونَ","Ve kâluttahazallâhu valadan subhânah, bal lahû mâ fis-samâvâti vel-ard, kullul lahû kânitûn.","\"Allah çocuk edindi\" diyorlar. Hâşâ! O bundan münezzehtir. Bilakis, göklerde ve yerde olanların hepsi O’nundur. Hepsi O’na boyun eğmiştir.",""],[117,"بَدِيعُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَإِذَا قَضَىٰٓ أَمْرًا فَإِنَّمَا يَقُولُ لَهُۥ كُن فَيَكُونُ","Badî'us-samâvâti vel-ard, ve izâ kadâ amran fa'innamâ yakûlu lahû kun fayakûn.","O, göklerin ve yerin yaratıcısıdır. Bir şeyin olmasını istediği zaman ona sadece “Ol!” der, o da hemen oluverir.",""],[118,"وَقَالَ ٱلَّذِينَ لَا يَعْلَمُونَ لَوْلَا يُكَلِّمُنَا ٱللَّهُ أَوْ تَأْتِينَآ ءَايَةٌ كَذَٰلِكَ قَالَ ٱلَّذِينَ مِن قَبْلِهِم مِّثْلَ قَوْلِهِمْ تَشَٰبَهَتْ قُلُوبُهُمْ قَدْ بَيَّنَّا ٱلْـَٔايَٰتِ لِقَوْمٍ يُوقِنُونَ","Ve kâlal-lazîna lâ ya'lamûna lav lâ yukallimunallâhu av ta'tînâ âyah, kazâlika kâlal-lazîna min kablihim misla kavlihim, taşâbahat kulûbuhum, kad bayyannal-âyâti likavmiy yûkinûn.","Bilmeyenler: \"Ne olur Allah bizimle konuşsa veya bize bir mucize gelse?\" demektedirler. Onlardan öncekiler de tıpkı onların söyledikleri gibi söylemişlerdi. Kalpleri (nasıl da) birbirine benzemiş. Oysa biz, iyice bilmek isteyen bir toplum için ayetlerimizi apaçık göstermişizdir.",""],[119,"إِنَّآ أَرْسَلْنَٰكَ بِٱلْحَقِّ بَشِيرًا وَنَذِيرًا وَلَا تُسْـَٔلُ عَنْ أَصْحَٰبِ ٱلْجَحِيمِ","Innâ arsalnâka bil-hakki başîrav ve nazîrâ, ve lâ tus'alu 'an ashâbil-cahîm.","Şüphesiz biz seni hak ile müjdeleyici ve uyarıcı olarak gönderdik. Cehennem halkından sen sorumlu değilsin.",""],[120,"وَلَن تَرْضَىٰ عَنكَ ٱلْيَهُودُ وَلَا ٱلنَّصَٰرَىٰ حَتَّىٰ تَتَّبِعَ مِلَّتَهُمْ قُلْ إِنَّ هُدَى ٱللَّهِ هُوَ ٱلْهُدَىٰ وَلَئِنِ ٱتَّبَعْتَ أَهْوَآءَهُم بَعْدَ ٱلَّذِى جَآءَكَ مِنَ ٱلْعِلْمِ مَا لَكَ مِنَ ٱللَّهِ مِن وَلِىٍّ وَلَا نَصِيرٍ","Ve lan tardâ 'ankal-yahûdu ve lan-nasârâ hattâ tattabi'a millatahum, kul inna hudallâhi huval-hudâ, ve la'inittaba'ta ahvâ'ahum ba'dal-lazî câ'aka minal-'ilm, mâ laka minallâhi miv valiyyiv ve lâ nasîr.","Yahudiler de Hristiyanlar da, sen onların dinine uymadıkça, asla senden hoşnut olmazlar. De ki: Asıl doğru yol Allah’ın gösterdiği yoldur. Sana gelen ilimden sonra eğer onların arzularına uyacak olursan, Allah’tan seni koruyacak bir veli de bir yardımcı da yoktur.",""],[121,"ٱلَّذِينَ ءَاتَيْنَٰهُمُ ٱلْكِتَٰبَ يَتْلُونَهُۥ حَقَّ تِلَاوَتِهِۦٓ أُو۟لَٰٓئِكَ يُؤْمِنُونَ بِهِۦ وَمَن يَكْفُرْ بِهِۦ فَأُو۟لَٰٓئِكَ هُمُ ٱلْخَٰسِرُونَ","Allazîna âtaynâhumul-kitâba yatlûnahû hakka tilâvatih, ulâ'ika yu'minûna bih, ve may yakfur bihî fa ulâ'ika humul-hâsirûn.","Kendilerine kitap verdiğimiz kimseler, onu hakkıyla okurlar. İşte bunlar ona iman eden kimselerdir. Onu inkâr edenlere gelince, işte onlar hüsrana uğrayanların ta kendileridir.",""],[122,"يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَنِّى فَضَّلْتُكُمْ عَلَى ٱلْعَٰلَمِينَ","Yâ banî isrâ'îlazkurû ni'matiyal-latî an'amtu 'alaykum ve annî faddaltukum 'alal-'âlamîn.","Ey İsrailoğulları! Size verdiğim nimeti ve sizi (bir zamanlar) diğer toplumlara üstün kıldığımı hatırlayın.",""],[123,"وَٱتَّقُوا۟ يَوْمًا لَّا تَجْزِى نَفْسٌ عَن نَّفْسٍ شَيْـًٔا وَلَا يُقْبَلُ مِنْهَا عَدْلٌ وَلَا تَنفَعُهَا شَفَٰعَةٌ وَلَا هُمْ يُنصَرُونَ","Vattakû yavmal lâ taczî nafsun 'an nafsin şay'av ve lâ yukbalu minhâ 'adluv ve lâ tanfa'uhâ şafâ'atuv ve lâ hum yunsarûn.","Kimsenin kimse adına bir şey ödemeyeceği, kimseden fidye kabul edilmeyeceği, kimseye şefaatin fayda vermeyeceği ve kendilerine yardım da edilmeyeceği bir günden kendinizi koruyun!",""],[124,"وَإِذِ ٱبْتَلَىٰٓ إِبْرَٰهِـۧمَ رَبُّهُۥ بِكَلِمَٰتٍ فَأَتَمَّهُنَّ قَالَ إِنِّى جَاعِلُكَ لِلنَّاسِ إِمَامًا قَالَ وَمِن ذُرِّيَّتِى قَالَ لَا يَنَالُ عَهْدِى ٱلظَّٰلِمِينَ","Ve izibtalâ ibrâhîma rabbuhû bikalimâtin fa atammahunn, kâla innî câ'iluka lin-nâsi imâmâ, kâla ve min zurriyyatî, kâla lâ yanâlu 'ahdiz-zâlimîn.","Hani Rabbi, İbrahim’i birtakım emirlerle imtihan etmiş, İbrahim onların hepsini yerine getirmiş de Rabbi şöyle buyurmuştu: “Ben seni insanlara önder yapacağım.” İbrahim de, “Soyumdan gelenlerden de (önderler yap, ya Rabbi!)” demişti. Bunun üzerine Rabbi: \"Benim ahdime (verdiğim söze) zalimler nail olamaz.\" diye buyurdu.",""],[125,"وَإِذْ جَعَلْنَا ٱلْبَيْتَ مَثَابَةً لِّلنَّاسِ وَأَمْنًا وَٱتَّخِذُوا۟ مِن مَّقَامِ إِبْرَٰهِـۧمَ مُصَلًّى وَعَهِدْنَآ إِلَىٰٓ إِبْرَٰهِـۧمَ وَإِسْمَٰعِيلَ أَن طَهِّرَا بَيْتِىَ لِلطَّآئِفِينَ وَٱلْعَٰكِفِينَ وَٱلرُّكَّعِ ٱلسُّجُودِ","Ve iz ca'alnal-bayta masâbatal lin-nâsi ve amnâ, vattahizû mim makâmi ibrâhîma musallâ, ve 'ahidnâ ilâ ibrâhîma ve ismâ'îla an tahhirâ baytiya lit-tâ'ifîna vel-'âkifîna var-rukka'is-sucûd.","Hani, biz Kâbe’yi insanlara dönüş/toplantı ve güven yeri kılmıştık. Siz de Makam-ı İbrahim’den kendinize bir namaz yeri edinin. İbrahim ve İsmail’e: “Tavaf edenler, kendini ibadete verenler, rükû ve secde edenler için evimi (Kâbe’yi) tertemiz tutun!\" diye emrettik.",""],[126,"وَإِذْ قَالَ إِبْرَٰهِـۧمُ رَبِّ ٱجْعَلْ هَٰذَا بَلَدًا ءَامِنًا وَٱرْزُقْ أَهْلَهُۥ مِنَ ٱلثَّمَرَٰتِ مَنْ ءَامَنَ مِنْهُم بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ قَالَ وَمَن كَفَرَ فَأُمَتِّعُهُۥ قَلِيلًا ثُمَّ أَضْطَرُّهُۥٓ إِلَىٰ عَذَابِ ٱلنَّارِ وَبِئْسَ ٱلْمَصِيرُ","Ve iz kâla ibrâhîmu rabbic'al hâzâ baladan âminav varzuk ahlahû minas-samarâti man âmana minhum billâhi vel-yavmil-âhir, kâla ve man kafara fa umatti'uhû kalîlan summa adtarruhû ilâ 'azâbin-nâr, ve bi'sal-masîr.","Hani İbrahim: \"Rabbim! Bu şehri güvenli bir şehir kıl! Halkından Allah’a ve ahiret gününe iman edenleri çeşitli ürünlerle rızıklandır\" demişti. Allah da: “İnkâr edeni az bir süre (bu geçici kısa hayatta) rızıklandırır, sonra onu Cehennem azabına girmek zorunda bırakırım. Ne kötü varılacak yerdir orası!” demişti.",""],[127,"وَإِذْ يَرْفَعُ إِبْرَٰهِـۧمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَٰعِيلُ رَبَّنَا تَقَبَّلْ مِنَّآ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ","Ve iz yarfa'u ibrâhîmul-kavâ'ida minal-bayti ve ismâ'îl, rabbanâ takabbal minnâ, innaka antas-samî'ul-'alîm.","Hani İbrahim, İsmail’le birlikte Kâbe’nin temellerini yükseltiyor (ve şöyle dua ediyorlardı): \"Rabbimiz! Bizden bu (amelimizi) kabul buyur. Şüphesiz sen hakkıyla işitensin, hakkıyla bilensin.\"",""],[128,"رَبَّنَا وَٱجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَآ أُمَّةً مُّسْلِمَةً لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَآ إِنَّكَ أَنتَ ٱلتَّوَّابُ ٱلرَّحِيمُ","Rabbanâ vac'alnâ muslimayni laka ve min zurriyyatinâ ummatam muslimatal lak, ve arinâ manâsikanâ ve tub 'alaynâ, innaka antat-tavvâbur-rahîm.","Rabbimiz! Bizi sana teslim olan iki kul eyle ve soyumuzdan da sana teslim olan bir ümmet çıkar. Bize ibadet yollarımızı göster ve tevbelerimizi kabul et! Zira tevbeleri kabul edip, çokça rahmet eden ancak sensin!",""],[129,"رَبَّنَا وَٱبْعَثْ فِيهِمْ رَسُولًا مِّنْهُمْ يَتْلُوا۟ عَلَيْهِمْ ءَايَٰتِكَ وَيُعَلِّمُهُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ وَيُزَكِّيهِمْ إِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ","Rabbanâ vab'as fîhim rasûlam minhum yatlû 'alayhim âyâtika ve yu'allimuhumul-kitâba vel-hikmata ve yuzakkîhim, innaka antal-'azîzul-hakîm.","Rabbimiz! İçlerinden senin ayetlerini onlara okuyan, kitap ve hikmeti öğreten ve onları (şirkten) arındıran bir rasûl gönder. Şüphesiz Aziz ve Hakim olan ancak sensin.",""],[130,"وَمَن يَرْغَبُ عَن مِّلَّةِ إِبْرَٰهِـۧمَ إِلَّا مَن سَفِهَ نَفْسَهُۥ وَلَقَدِ ٱصْطَفَيْنَٰهُ فِى ٱلدُّنْيَا وَإِنَّهُۥ فِى ٱلْـَٔاخِرَةِ لَمِنَ ٱلصَّٰلِحِينَ","Ve may yargabu 'an millati ibrâhîma illâ man safiha nafsah, ve lakad-istafaynâhu fid-dun-yâ, ve innahû fil-âhirati laminas-sâlihîn.","Kendini bilmezden başka İbrahim’in dininden kim yüz çevirir? Andolsun, biz İbrahim’i bu dünyada seçkin kıldık. Şüphesiz o ahirette de salih kimselerdendir.",""],[131,"إِذْ قَالَ لَهُۥ رَبُّهُۥٓ أَسْلِمْ قَالَ أَسْلَمْتُ لِرَبِّ ٱلْعَٰلَمِينَ","Iz kâla lahû rabbuhû aslim, kâla aslamtu lirabbil-'âlamîn.","Rabbi ona: “Teslim ol”! dediğinde, \"Âlemlerin Rabbine teslim oldum\" demişti.",""],[132,"وَوَصَّىٰ بِهَآ إِبْرَٰهِـۧمُ بَنِيهِ وَيَعْقُوبُ يَٰبَنِىَّ إِنَّ ٱللَّهَ ٱصْطَفَىٰ لَكُمُ ٱلدِّينَ فَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ","Ve vassâ bihâ ibrâhîmu banîhi ve ya'kûb, yâ baniyya innallâhastafâ lakumud-dîna falâ tamûtunna illâ ve antum muslimûn.","İbrahim, bunu kendi oğullarına da vasiyet etti. Ya'kûb da öyle yaptı ve: “Oğullarım! Allah, sizin için bu dini (İslâm’ı) seçti. Siz de ancak Müslümanlar olarak can verin!” dedi.",""],[133,"أَمْ كُنتُمْ شُهَدَآءَ إِذْ حَضَرَ يَعْقُوبَ ٱلْمَوْتُ إِذْ قَالَ لِبَنِيهِ مَا تَعْبُدُونَ مِنۢ بَعْدِى قَالُوا۟ نَعْبُدُ إِلَٰهَكَ وَإِلَٰهَ ءَابَآئِكَ إِبْرَٰهِـۧمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ إِلَٰهًا وَٰحِدًا وَنَحْنُ لَهُۥ مُسْلِمُونَ","Am kuntum şuhadâ'a iz hadara ya'kûbal-mavt, iz kâla libanîhi mâ ta'budûna mim ba'dî, kâlû na'budu ilâhaka ve ilâha âbâ'ika ibrâhîma ve ismâ'îla ve ishâka ilâhav vâhidâ, ve nahnu lahû muslimûn.","Yoksa siz Ya'kûb’un, ölüm döşeğinde iken çocuklarına: “Benden sonra kime ibadet edeceksiniz?” dediği, onların da: “Senin ilâhına ve ataların İbrahim, İsmail ve İshak’ın ilâhı olan tek bir ilâha ibadet edeceğiz. Bizler O’na boyun eğmiş müslümanlarız.” dedikleri zaman orada hazır mı bulunuyordunuz?",""],[134,"تِلْكَ أُمَّةٌ قَدْ خَلَتْ لَهَا مَا كَسَبَتْ وَلَكُم مَّا كَسَبْتُمْ وَلَا تُسْـَٔلُونَ عَمَّا كَانُوا۟ يَعْمَلُونَ","Tilka ummatun kad halat, lahâ mâ kasabat ve lakum mâ kasabtum, ve lâ tus'alûna 'ammâ kânû ya'malûn.","Onlar bir ümmetti gelip, geçti. Onların kazandıkları kendilerinin, sizin kazandıklarınız sizindir. Siz onların yaptıklarından sorumlu tutulacak değilsiniz.",""],[135,"وَقَالُوا۟ كُونُوا۟ هُودًا أَوْ نَصَٰرَىٰ تَهْتَدُوا۟ قُلْ بَلْ مِلَّةَ إِبْرَٰهِـۧمَ حَنِيفًا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ","Ve kâlû kûnû hûdan av nasârâ tahtadû, kul bal millata ibrâhîma hanîfâ, ve mâ kâna minal-muşrikîn.","Yahudi ve Hıristiyan olun ki, doğru yolu bulasınız, demektedirler. Sen de ki: \"Hayır! Hanif (her türlü batıl dinden uzak durup, yalnızca hak dine yönelen kimse) olarak, İbrahim’in dinine (tabi oluruz). O, müşriklerden değildi.\"",""],[136,"قُولُوٓا۟ ءَامَنَّا بِٱللَّهِ وَمَآ أُنزِلَ إِلَيْنَا وَمَآ أُنزِلَ إِلَىٰٓ إِبْرَٰهِـۧمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ وَيَعْقُوبَ وَٱلْأَسْبَاطِ وَمَآ أُوتِىَ مُوسَىٰ وَعِيسَىٰ وَمَآ أُوتِىَ ٱلنَّبِيُّونَ مِن رَّبِّهِمْ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّنْهُمْ وَنَحْنُ لَهُۥ مُسْلِمُونَ","Kûlû âmannâ billâhi ve mâ unzila ilaynâ ve mâ unzila ilâ ibrâhîma ve ismâ'îla ve ishâka ve ya'kûba vel-asbâti ve mâ ûtiya mûsâ ve 'îsâ ve mâ ûtiyan-nabiyyûna mir rabbihim, lâ nufarriku bayna ahadim minhum ve nahnu lahû muslimûn.","Deyin ki: ''Biz Allah’a, bize indirilene (Kur’an’a), İbrahim, İsmail, İshak, Ya'kûb ve torunlarına indirilene, Mûsâ ve İsa’ya verilen (Tevrat ve İncil) ile bütün diğer peygamberlere Rablerinden verilene iman ettik. Onlardan hiçbirini diğerinden ayırt etmeyiz ve biz ona teslim olmuş kimseleriz.''",""],[137,"فَإِنْ ءَامَنُوا۟ بِمِثْلِ مَآ ءَامَنتُم بِهِۦ فَقَدِ ٱهْتَدَوا۟ وَّإِن تَوَلَّوْا۟ فَإِنَّمَا هُمْ فِى شِقَاقٍ فَسَيَكْفِيكَهُمُ ٱللَّهُ وَهُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ","Fa'in âmanû bimisli mâ âmantum bihî fakadihtadav, ve in tavallav fa'inna
