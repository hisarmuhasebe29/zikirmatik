(function(){
"use strict";

/* ================= VERİ ================= */
const ZIKIRLER = [
  {id:"subhanallah", tr:"Sübhânallâh", ar:"سُبْحَانَ اللّٰهِ", mn:"Allah'ı her türlü eksiklikten uzak tutarım.", hedef:33},
  {id:"elhamdulillah", tr:"Elhamdülillâh", ar:"اَلْحَمْدُ لِلّٰهِ", mn:"Hamd yalnızca Allah'a aittir.", hedef:33},
  {id:"allahuekber", tr:"Allâhu Ekber", ar:"اَللّٰهُ أَكْبَرُ", mn:"Allah en büyüktür.", hedef:33},
  {id:"kelimetevhid", tr:"Lâ ilâhe illallâh", ar:"لَا إِلٰهَ إِلَّا اللّٰهُ", mn:"Allah'tan başka ilah yoktur.", hedef:100},
  {id:"estagfirullah", tr:"Estağfirullâh", ar:"أَسْتَغْفِرُ اللّٰهَ", mn:"Allah'tan bağışlanma dilerim.", hedef:100},
  {id:"salavat", tr:"Allâhumme salli alâ Muhammed", ar:"اَللّٰهُمَّ صَلِّ عَلٰى مُحَمَّدٍ", mn:"Allah'ım, Hz. Muhammed'e rahmet eyle.", hedef:100},
  {id:"subhanallahivebihamdihi", tr:"Sübhânallâhi ve bihamdihî", ar:"سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ", mn:"Allah'ı hamd ile tesbih ederim.", hedef:100},
  {id:"lahavle", tr:"Lâ havle velâ kuvvete illâ billâh", ar:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ", mn:"Güç ve kuvvet ancak Allah'ın yardımıyladır.", hedef:100},
  {id:"hasbunallah", tr:"Hasbunallâhu ve ni'mel vekîl", ar:"حَسْبُنَا اللّٰهُ وَنِعْمَ الْوَكِيلُ", mn:"Allah bize yeter, O ne güzel vekildir.", hedef:100},
  {id:"yalatif", tr:"Yâ Latîf", ar:"يَا لَطِيفُ", mn:"Ey lütfu bol olan Allah'ım.", hedef:129}
];
const TESBIHAT = [
  {id:"subhanallah", n:33},
  {id:"elhamdulillah", n:33},
  {id:"allahuekber", n:33},
  {id:"tevhid_son", n:1, tr:"Lâ ilâhe illallâhu vahdehû lâ şerîke leh", ar:"لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ", mn:"Allah'tan başka ilah yoktur, O tektir, ortağı yoktur. Mülk O'nundur, hamd O'nadır, O her şeye gücü yetendir."}
];

const QD={"36":[[1,"يسٓ","Yâ sîn.","Yâ Sîn.",""],[2,"وَٱلْقُرْءَانِ ٱلْحَكِيمِ","Vel-kur'ânil-hakîm.","Hakîm olan Kur'an'a yemin olsun!",""],[3,"إِنَّكَ لَمِنَ ٱلْمُرْسَلِينَ","Innaka laminal-mursalîn.","Şüphesiz sen elbette gönderilen rasûllerdensin.",""],[4,"عَلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ","'Alâ sirâtim mustakîm.","Dosdoğru bir yol üzerinesin.",""],[5,"تَنزِيلَ ٱلْعَزِيزِ ٱلرَّحِيمِ","Tanzîlal-'azîzir-rahîm.","(Bu Kur'an) üstün, güçlü ve çok merhametli olan (Allah) tarafından indirilmiştir.",""],[6,"لِتُنذِرَ قَوْمًا مَّآ أُنذِرَ ءَابَآؤُهُمْ فَهُمْ غَٰفِلُونَ","Litunzira kavmam mâ unzira âbâ'uhum fahum gâfilûn.","Ataları uyarılmamış, bu yüzden kendileri de gaflet içinde kalmış bir toplumu uyarman için (bu kitap indirilmiştir.)",""],[7,"لَقَدْ حَقَّ ٱلْقَوْلُ عَلَىٰٓ أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ","Lakad hakkal-kavlu 'alâ aksarihim fahum lâ yu'minûn.","Andolsun, onların çoğu üzerine o söz (azap) hak olmuştur. Artık onlar iman etmezler.",""],[8,"إِنَّا جَعَلْنَا فِىٓ أَعْنَٰقِهِمْ أَغْلَٰلًا فَهِىَ إِلَى ٱلْأَذْقَانِ فَهُم مُّقْمَحُونَ","Innâ ca'alnâ fî a'nâkihim aglâlan fa hiya ilal-azkâni fahum mukmahûn.","Biz, onların boyunlarına halkalar geçirdik. O halkalar çenelere kadar dayanmaktadır. Bu yüzden başları yukarı kalkıktır.",""],[9,"وَجَعَلْنَا مِنۢ بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَٰهُمْ فَهُمْ لَا يُبْصِرُونَ","Ve ca'alnâ mim bayni aydîhim saddav ve min halfihim saddan fa agşaynâhum fahum lâ yubsirûn.","Biz onların önlerine bir set, arkalarına da bir set çektik. Böylelikle onları örtüverdik, artık görmezler.",""],[10,"وَسَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ","Ve savâ'un 'alayhim a'anzartahum am lam tunzirhum lâ yu'minûn.","Kâfirlere gelince; onları uyarsan da uyarmasan da birdir, iman etmezler.",""],[11,"إِنَّمَا تُنذِرُ مَنِ ٱتَّبَعَ ٱلذِّكْرَ وَخَشِىَ ٱلرَّحْمَٰنَ بِٱلْغَيْبِ فَبَشِّرْهُ بِمَغْفِرَةٍ وَأَجْرٍ كَرِيمٍ","Innamâ tunziru manittaba'az-zikra ve haşiyar-rahmâna bil-gayb, fa başşirhu bimagfirativ ve acrin karîm.","Sen, ancak zikre (Kur'an'a) uyan ve görmeden Rahman'dan korkan kimseyi uyarabilirsin. İşte böylesini bir mağfiret ve güzel bir mükâfatla müjdele.",""],[12,"إِنَّا نَحْنُ نُحْىِ ٱلْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا۟ وَءَاثَٰرَهُمْ وَكُلَّ شَىْءٍ أَحْصَيْنَٰهُ فِىٓ إِمَامٍ مُّبِينٍ","Innâ nahnu nuhyil-mavtâ ve naktubu mâ kaddamû ve âsârahum, ve kulla şay'in ahsaynâhu fî imâmim mubîn.","Muhakkak biz ölüleri diriltiriz. Onların ileri gönderdiklerini de, geride bıraktıklarını (izlerini) da yazarız. Biz, her şeyi apaçık bir kitapta (Levh-i Mahfûz'da) sayıp yazmışızdır.",""],[13,"وَٱضْرِبْ لَهُم مَّثَلًا أَصْحَٰبَ ٱلْقَرْيَةِ إِذْ جَآءَهَا ٱلْمُرْسَلُونَ","Vadrib lahum masalan ashâbal-karyah, iz câ'ahal-mursalûn.","Onlara, şu şehir halkını misal getir: Hani onlara elçiler gelmişti.",""],[14,"إِذْ أَرْسَلْنَآ إِلَيْهِمُ ٱثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٍ فَقَالُوٓا۟ إِنَّآ إِلَيْكُم مُّرْسَلُونَ","Iz arsalnâ ilayhimusnayni fa kazzabûhumâ fa 'azzaznâ bisâlisin fakâlû innâ ilaykum mursalûn.","Hani onlara iki elçi göndermiştik de onları yalanlamışlardı. Bir üçüncüsü ile onlara destek vermiştik. (Onlar:) \"Biz, size gönderilen elçileriz.\" demişlerdi.",""],[15,"قَالُوا۟ مَآ أَنتُمْ إِلَّا بَشَرٌ مِّثْلُنَا وَمَآ أَنزَلَ ٱلرَّحْمَٰنُ مِن شَىْءٍ إِنْ أَنتُمْ إِلَّا تَكْذِبُونَ","Kâlû mâ antum illâ başarum mislunâ, ve mâ anzalar-rahmânu min şay', in antum illâ takzibûn.","Elçilere dediler ki: Siz de ancak bizim gibi birer insansınız. Rahman, herhangi bir şey indirmedi. Siz sadece yalan söylüyorsunuz.",""],[16,"قَالُوا۟ رَبُّنَا يَعْلَمُ إِنَّآ إِلَيْكُمْ لَمُرْسَلُونَ","Kâlû rabbunâ ya'lamu innâ ilaykum lamursalûn.","Elçiler ise: \"Rabbimiz biliyor ki biz, size gönderilen elçileriz.\" diye karşılık verdiler.",""],[17,"وَمَا عَلَيْنَآ إِلَّا ٱلْبَلَٰغُ ٱلْمُبِينُ","Ve mâ 'alaynâ illal-balâgul-mubîn.","\"Bizim görevimiz apaçık tebliğden başka bir şey değildir.\"",""],[18,"قَالُوٓا۟ إِنَّا تَطَيَّرْنَا بِكُمْ لَئِن لَّمْ تَنتَهُوا۟ لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُم مِّنَّا عَذَابٌ أَلِيمٌ","Kâlû innâ tatayyarnâ bikum, la'il lam tantahû lanarcumannakum ve layamassannakum minnâ 'azâbun alîm.","Onlar dediler ki: \"Doğrusu siz, bize uğursuz geldiniz. Eğer bu işe bir son vermezseniz, sizi taşlarız ve bizden size acı bir azap dokunur.\"",""],[19,"قَالُوا۟ طَٰٓئِرُكُم مَّعَكُمْ أَئِن ذُكِّرْتُم بَلْ أَنتُمْ قَوْمٌ مُّسْرِفُونَ","Kâlû tâ'irukum ma'akum, a'in zukkirtum, bal antum kavmum musrifûn.","(Elçiler) dediler ki: \"Sizin uğursuzluğunuz kendinizdendir. Size öğüt verildi diye mi (uğursuzluğa uğradınız)? Doğrusu siz çok ileri giden bir topluluksunuz\".",""],[20,"وَجَآءَ مِنْ أَقْصَا ٱلْمَدِينَةِ رَجُلٌ يَسْعَىٰ قَالَ يَٰقَوْمِ ٱتَّبِعُوا۟ ٱلْمُرْسَلِينَ","Ve câ'a min aksal-madînati raculuy yas'â kâla yâ kavmittabi'ul-mursalîn.","Derken beldenin öbür ucundan bir adam koşarak geldi ve; \"Ey kavmim! Bu elçilere uyunuz.\" dedi.",""],[21,"ٱتَّبِعُوا۟ مَن لَّا يَسْـَٔلُكُمْ أَجْرًا وَهُم مُّهْتَدُونَ","Ittabi'û mal lâ yas'alukum acrav ve hum muhtadûn.","Sizden herhangi bir ücret istemeyen bu kimselere tabi olun. Çünkü onlar hidayete ermiş kimselerdir.",""],[22,"وَمَا لِىَ لَآ أَعْبُدُ ٱلَّذِى فَطَرَنِى وَإِلَيْهِ تُرْجَعُونَ","Ve mâ liya lâ a'budul-lazî fataranî ve ilayhi turca'ûn.","Ben, beni yaratana ne diye ibadet etmeyecekmişim? Üstelik siz yalnız ona döndürüleceksiniz.",""],[23,"ءَأَتَّخِذُ مِن دُونِهِۦٓ ءَالِهَةً إِن يُرِدْنِ ٱلرَّحْمَٰنُ بِضُرٍّ لَّا تُغْنِ عَنِّى شَفَٰعَتُهُمْ شَيْـًٔا وَلَا يُنقِذُونِ","A'attahizu min dûnihî âlihatan iy yuridnir-rahmânu bidurril lâ tugni 'annî şafâ'atuhum şay'av ve lâ yunkizûn.","“O’nu bırakıp da başka ilahlar mı edineyim? Eğer Rahman; bana bir zarar vermek istese, onların şefaati bana hiçbir fayda sağlamaz ve beni kurtaramazlar.”",""],[24,"إِنِّىٓ إِذًا لَّفِى ضَلَٰلٍ مُّبِينٍ","Innî izal lafî dalâlim mubîn.","Bu takdirde ben muhakkak apaçık bir sapıklık içinde olurum.",""],[25,"إِنِّىٓ ءَامَنتُ بِرَبِّكُمْ فَٱسْمَعُونِ","Innî âmantu birabbikum fasma'ûn.","\"Şüphesiz ben; Rabbinize iman ettim. Beni dinleyin!\"",""],[26,"قِيلَ ٱدْخُلِ ٱلْجَنَّةَ قَالَ يَٰلَيْتَ قَوْمِى يَعْلَمُونَ","Kîladhulil-cannah, kâla yâ layta kavmî ya'lamûn.","Ona: \"Cennet'e gir!\" denildi. O da: \"Keşke kavmim bilseydi.\" dedi.",""],[27,"بِمَا غَفَرَ لِى رَبِّى وَجَعَلَنِى مِنَ ٱلْمُكْرَمِينَ","Bimâ gafaralî rabbî ve ca'alanî minal-mukramîn.","\"Rabbimin beni bağışladığını ve beni ikrama layık kimselerden kıldığını.\"",""],[28,"وَمَآ أَنزَلْنَا عَلَىٰ قَوْمِهِۦ مِنۢ بَعْدِهِۦ مِن جُندٍ مِّنَ ٱلسَّمَآءِ وَمَا كُنَّا مُنزِلِينَ","Ve mâ anzalnâ 'alâ kavmihî mim ba'dihî min cundim minas-samâ'i ve mâ kunnâ munzilîn.","Kendisinden sonra kavmi üzerine (onları cezalandırmak için) gökten hiçbir ordu indirmedik. İndirecek de değildik.",""],[29,"إِن كَانَتْ إِلَّا صَيْحَةً وَٰحِدَةً فَإِذَا هُمْ خَٰمِدُونَ","In kânat illâ sayhatav vâhidatan fa'izâ hum hâmidûn.","(Onları helâk eden) Korkunç sesten başka bir şey değildi. Bir anda sönüp gittiler.",""],[30,"يَٰحَسْرَةً عَلَى ٱلْعِبَادِ مَا يَأْتِيهِم مِّن رَّسُولٍ إِلَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ","Yâ hasratan 'alal-'ibâd, mâ ya'tîhim mir rasûlin illâ kânû bihî yastahzi'ûn.","Yazıklar olsun o kullara! Ne zaman kendilerine bir peygamber gelse muhakkak onunla alay ederlerdi.",""],[31,"أَلَمْ يَرَوْا۟ كَمْ أَهْلَكْنَا قَبْلَهُم مِّنَ ٱلْقُرُونِ أَنَّهُمْ إِلَيْهِمْ لَا يَرْجِعُونَ","Alam yarav kam ahlaknâ kablahum minal-kurûni annahum ilayhim lâ yarci'ûn.","Kendilerinden önce nice nesilleri helâk ettiğimizi görmüyorlar mı? Onların artık kendilerine dönmeyeceklerini görmediler mi?",""],[32,"وَإِن كُلٌّ لَّمَّا جَمِيعٌ لَّدَيْنَا مُحْضَرُونَ","Ve in kullul lammâ camî'ul ladaynâ muhdarûn.","Ve hepsi toplanıp huzurumuza çıkarılacaklardır.",""],[33,"وَءَايَةٌ لَّهُمُ ٱلْأَرْضُ ٱلْمَيْتَةُ أَحْيَيْنَٰهَا وَأَخْرَجْنَا مِنْهَا حَبًّا فَمِنْهُ يَأْكُلُونَ","Ve âyatul lahumul-ardul-maytah, ahyaynâhâ ve ahracnâ minhâ habban faminhu ya'kulûn.","Ölü toprak onlar için bir delildir. Biz, onu diriltir ve ondan taneler çıkarırız da onlardan yerler.",""],[34,"وَجَعَلْنَا فِيهَا جَنَّٰتٍ مِّن نَّخِيلٍ وَأَعْنَٰبٍ وَفَجَّرْنَا فِيهَا مِنَ ٱلْعُيُونِ","Ve ca'alnâ fîhâ cannâtim min nahîliv ve a'nâbiv ve faccarnâ fîhâ minal-'uyûn.","Biz, yeryüzünde nice hurma bahçeleri, üzüm bağları yarattık ve oralarda birçok pınarlar fışkırttık.",""],[35,"لِيَأْكُلُوا۟ مِن ثَمَرِهِۦ وَمَا عَمِلَتْهُ أَيْدِيهِمْ أَفَلَا يَشْكُرُونَ","Liya'kulû min samarihî ve mâ 'amilathu aydîhim, afalâ yaşkurûn.","Ürünlerinden ve yetiştirdiklerinden yesinler diye. Hâlâ şükretmiyorlar mı?",""],[36,"سُبْحَٰنَ ٱلَّذِى خَلَقَ ٱلْأَزْوَٰجَ كُلَّهَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ وَمِنْ أَنفُسِهِمْ وَمِمَّا لَا يَعْلَمُونَ","Subhânal-lazî halakal-azvâca kullahâ mimmâ tumbitul-ardu ve min anfusihim ve mimmâ lâ ya'lamûn.","Yerin bitirdiklerinden, kendi nefislerinden ve daha bilmedikleri şeylerden bütün çiftleri yaratan (Allah) çok münezzehtir.",""],[37,"وَءَايَةٌ لَّهُمُ ٱلَّيْلُ نَسْلَخُ مِنْهُ ٱلنَّهَارَ فَإِذَا هُم مُّظْلِمُونَ","Ve âyatul lahumul-laylu naslahu minhun-nahâra fa'izâ hum muzlimûn.","Gece de kendileri için bir delildir. Gündüzü ondan sıyırarak çekip alırız. Bir de bakarsın ki karanlık içinde kalmışlardır.",""],[38,"وَٱلشَّمْسُ تَجْرِى لِمُسْتَقَرٍّ لَّهَا ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ","Vaş-şamsu tacrî limustakarril lahâ, zâlika takdîrul-'azîzil-'alîm.","Güneş de kendi yörüngesinde akıp gitmektedir. İşte bu, Azîz ve Alîm olan Allah'ın takdiridir.",""],[39,"وَٱلْقَمَرَ قَدَّرْنَٰهُ مَنَازِلَ حَتَّىٰ عَادَ كَٱلْعُرْجُونِ ٱلْقَدِيمِ","Vel-kamara kaddarnâhu manâzila hattâ 'âda kal-'urcûnil-kadîm.","Ay için de birtakım menziller (yörüngeler) tayin ettik. Nihayet o, eğri hurma dalı gibi (hilâl) olur da geri döner.",""],[40,"لَا ٱلشَّمْسُ يَنۢبَغِى لَهَآ أَن تُدْرِكَ ٱلْقَمَرَ وَلَا ٱلَّيْلُ سَابِقُ ٱلنَّهَارِ وَكُلٌّ فِى فَلَكٍ يَسْبَحُونَ","Laş-şamsu yambagî lahâ an tudrikal-kamara ve lal-laylu sâbikun-nahâr, ve kullun fî falakiy yasbahûn.","Ne Güneş Ay'a yetişebilir, ne de gece gündüzü geçebilir. Her biri bir yörüngede yüzmektedir.",""],[41,"وَءَايَةٌ لَّهُمْ أَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِى ٱلْفُلْكِ ٱلْمَشْحُونِ","Ve âyatul lahum annâ hamalnâ zurriyyatahum fil-fulkil-maşhûn.","Onların soylarını dolu gemide taşımamız da onlar için bir delildir.",""],[42,"وَخَلَقْنَا لَهُم مِّن مِّثْلِهِۦ مَا يَرْكَبُونَ","Ve halaknâ lahum mim mislihî mâ yarkabûn.","Ve onlar için bindikleri daha başka taşıtlar da yarattık.",""],[43,"وَإِن نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنقَذُونَ","Ve in naşa' nugrikhum falâ sarîha lahum ve lâ hum yunkazûn.","Eğer dilersek, onları suda boğarız da kimse de yardımlarına gelemez. İşte o zaman onlar için bir kurtuluş da yoktur.",""],[44,"إِلَّا رَحْمَةً مِّنَّا وَمَتَٰعًا إِلَىٰ حِينٍ","Illâ rahmatam minnâ ve matâ'an ilâ hîn.","Ancak bizim tarafımızdan bir rahmet ve belli bir zamana kadar dünyadan faydalandırmamız müstesnadır.",""],[45,"وَإِذَا قِيلَ لَهُمُ ٱتَّقُوا۟ مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَ","Ve izâ kîla lahumuttakû mâ bayna aydîkum ve mâ halfakum la'allakum turhamûn.","Önünüzdekinden ve arkanızdakinden (dünya ve ahiret azabından) sakının. Umulur ki, size merhamet olunur denildiğinde (yüz çevirirler).",""],[46,"وَمَا تَأْتِيهِم مِّنْ ءَايَةٍ مِّنْ ءَايَٰتِ رَبِّهِمْ إِلَّا كَانُوا۟ عَنْهَا مُعْرِضِينَ","Ve mâ ta'tîhim min âyatim min âyâti rabbihim illâ kânû 'anhâ mu'ridîn.","Onlara, ne zaman Rablerinin ayetlerinden bir ayet gelse mutlaka ondan yüz çevirirler.",""],[47,"وَإِذَا قِيلَ لَهُمْ أَنفِقُوا۟ مِمَّا رَزَقَكُمُ ٱللَّهُ قَالَ ٱلَّذِينَ كَفَرُوا۟ لِلَّذِينَ ءَامَنُوٓا۟ أَنُطْعِمُ مَن لَّوْ يَشَآءُ ٱللَّهُ أَطْعَمَهُۥٓ إِنْ أَنتُمْ إِلَّا فِى ضَلَٰلٍ مُّبِينٍ","Ve izâ kîla lahum anfikû mimmâ razakakumullâh, kâlal-lazîna kafarû lil-lazîna âmanû anut'imu mal lav yaşâ'ullâhu at'amah, in antum illâ fî dalâlim mubîn.","Kendilerine; \"Allah’ın size verdiği rızıklardan infak edin!\" denildiği zaman kâfirler, iman edenlere derler ki; \"Allah'ın dilediği takdirde yedirip doyuracağı kişiyi acaba biz mi doyuracağız? Gerçekten siz apaçık bir sapıklık içindesiniz.”",""],[48,"وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلْوَعْدُ إِن كُنتُمْ صَٰدِقِينَ","Ve yakûlûna matâ hâzal-ve'du in kuntum sâdikîn.","\"Eğer, doğru söylüyorsanız bu vaat/tehdit ne zaman?\" derler.",""],[49,"مَا يَنظُرُونَ إِلَّا صَيْحَةً وَٰحِدَةً تَأْخُذُهُمْ وَهُمْ يَخِصِّمُونَ","Mâ yanzurûna illâ sayhatav vâhidatan ta'huzuhum ve hum yahissimûn.","Onlar, birbirleriyle çekişip dururken kendilerini ansızın yakalayacak korkunç bir sesi bekliyorlar.",""],[50,"فَلَا يَسْتَطِيعُونَ تَوْصِيَةً وَلَآ إِلَىٰٓ أَهْلِهِمْ يَرْجِعُونَ","Falâ yastatî'ûna tavsiyatav ve lâ ilâ ahlihim yarci'ûn.","İşte o anda onlar; ne bir vasiyette bulunabilirler, ne de ailelerine dönebilirler.",""],[51,"وَنُفِخَ فِى ٱلصُّورِ فَإِذَا هُم مِّنَ ٱلْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَ","Ve nufiha fis-sûri fa'izâ hum minal-acdâsi ilâ rabbihim yansilûn.","Sur'a üflenince, hemen kabirlerinden Rablerine doğru koşarak çıkarlar.",""],[52,"قَالُوا۟ يَٰوَيْلَنَا مَنۢ بَعَثَنَا مِن مَّرْقَدِنَا هَٰذَا مَا وَعَدَ ٱلرَّحْمَٰنُ وَصَدَقَ ٱلْمُرْسَلُونَ","Kâlû yâ vaylanâ mam ba'asanâ mim markadinâ…hâzâ mâ ve'adar-rahmânu ve sadakal-mursalûn.","\"Eyvah bize! Mezarımızdan bizi kim kaldırdı? Bu, Rahman'ın vadettiğidir. Peygamberler, gerçekten doğru söylemiştir.\" derler.",""],[53,"إِن كَانَتْ إِلَّا صَيْحَةً وَٰحِدَةً فَإِذَا هُمْ جَمِيعٌ لَّدَيْنَا مُحْضَرُونَ","In kânat illâ sayhatav vâhidatan fa'izâ hum camî'ul ladaynâ muhdarûn.","Sadece korkunç bir ses olur. Bunun üzerine onların hepsi hemen huzurumuzda hazır bulunurlar.",""],[54,"فَٱلْيَوْمَ لَا تُظْلَمُ نَفْسٌ شَيْـًٔا وَلَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ","Fal-yavma lâ tuzlamu nafsun şay'av ve lâ tuczavna illâ mâ kuntum ta'malûn.","O günde hiçbir kimseye en ufak bir zulüm yapılmaz. Siz işlediğinizin ancak karşılığını görürsünüz.",""],[55,"إِنَّ أَصْحَٰبَ ٱلْجَنَّةِ ٱلْيَوْمَ فِى شُغُلٍ فَٰكِهُونَ","Inna ashâbal-cannatil-yavma fî şugulin fâkihûn.","Doğrusu bugün, cennetlikler eğlenceyle meşguldürler.",""],[56,"هُمْ وَأَزْوَٰجُهُمْ فِى ظِلَٰلٍ عَلَى ٱلْأَرَآئِكِ مُتَّكِـُٔونَ","Hum ve azvâcuhum fî zilâlin 'alal-arâ'iki muttaki'ûn.","Kendileri ve eşleri gölgeliklerde, tahtlar üzerine yaslanmışlardır.",""],[57,"لَهُمْ فِيهَا فَٰكِهَةٌ وَلَهُم مَّا يَدَّعُونَ","Lahum fîhâ fâkihatuv ve lahum mâ yadda'ûn.","Orada, onlar için meyveler vardır. Canlarının istediği her şey onlarındır.",""],[58,"سَلَٰمٌ قَوْلًا مِّن رَّبٍّ رَّحِيمٍ","Salâmun kavlam mir rabbir rahîm.","Rahim olan Rabden sözlü bir selam vardır.",""],[59,"وَٱمْتَٰزُوا۟ ٱلْيَوْمَ أَيُّهَا ٱلْمُجْرِمُونَ","Vamtâzul-yavma ayyuhal-mucrimûn.","Ey günahkârlar! Bugün siz (bir tarafa) ayrılın!",""],[60,"أَلَمْ أَعْهَدْ إِلَيْكُمْ يَٰبَنِىٓ ءَادَمَ أَن لَّا تَعْبُدُوا۟ ٱلشَّيْطَٰنَ إِنَّهُۥ لَكُمْ عَدُوٌّ مُّبِينٌ","Alam a'had ilaykum yâ banî âdama allâ ta'buduş-şaytân, innahû lakum 'aduvvum mubîn.","\"Ey Ademoğulları! Size, Şeytan'a ibadet etmeyin. Çünkü o, sizin apaçık düşmanınızdır.\" deyip söz almadım mı?",""],[61,"وَأَنِ ٱعْبُدُونِى هَٰذَا صِرَٰطٌ مُّسْتَقِيمٌ","Ve ani'budûnî, hâzâ sirâtum mustakîm.","Bana ibadet edin. Dosdoğru yol budur, demedim mi?",""],[62,"وَلَقَدْ أَضَلَّ مِنكُمْ جِبِلًّا كَثِيرًا أَفَلَمْ تَكُونُوا۟ تَعْقِلُونَ","Ve lakad adalla minkum cibillan kasîrâ, afalam takûnû ta'kilûn.","O, sizden çoğu toplumları saptırmıştı. Hiç mi akıl erdirmiyordunuz?",""],[63,"هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى كُنتُمْ تُوعَدُونَ","Hâzihî cahannamul-latî kuntum tû'adûn.","İşte bu, size vadedilen Cehennem'dir.",""],[64,"ٱصْلَوْهَا ٱلْيَوْمَ بِمَا كُنتُمْ تَكْفُرُونَ","Islavhal-yavma bimâ kuntum takfurûn.","Küfrünüz (İnkârınız) sebebiyle bugün girin oraya!",""],[65,"ٱلْيَوْمَ نَخْتِمُ عَلَىٰٓ أَفْوَٰهِهِمْ وَتُكَلِّمُنَآ أَيْدِيهِمْ وَتَشْهَدُ أَرْجُلُهُم بِمَا كَانُوا۟ يَكْسِبُونَ","Al-yavma nahtimu 'alâ afvâhihim ve tukallimunâ aydîhim ve taşhadu arculuhum bimâ kânû yaksibûn.","O gün onların ağızlarını mühürleriz. Yaptıklarını bizlere elleri anlatır, ayakları da şahitlik eder.",""],[66,"وَلَوْ نَشَآءُ لَطَمَسْنَا عَلَىٰٓ أَعْيُنِهِمْ فَٱسْتَبَقُوا۟ ٱلصِّرَٰطَ فَأَنَّىٰ يُبْصِرُونَ","Ve lav naşâ'u latamasnâ 'alâ a'yunihim fastabakus-sirâta fa annâ yubsirûn.","Dileseydik; gözlerini silme kör ederdik de, o zaman doğru yolu bulmaya koşuşurlardı. Fakat nasıl görecekler ki?",""],[67,"وَلَوْ نَشَآءُ لَمَسَخْنَٰهُمْ عَلَىٰ مَكَانَتِهِمْ فَمَا ٱسْتَطَٰعُوا۟ مُضِيًّا وَلَا يَرْجِعُونَ","Ve lav naşâ'u lamasahnâhum 'alâ makânatihim famastatâ'û mudiyyav ve lâ yarci'ûn.","Eğer dilesek; oldukları yerde onların şekillerini değiştirirdik de, ne ileriye gitmeye güçleri yeterdi, ne de geri gelmeye.",""],[68,"وَمَن نُّعَمِّرْهُ نُنَكِّسْهُ فِى ٱلْخَلْقِ أَفَلَا يَعْقِلُونَ","Ve man nu'ammirhu nunakkishu fil-halk, afalâ ya'kilûn.","Kime uzun ömür verirsek onu yaratılışında tersine döndürürüz. Hâlâ akletmiyorlar mı?",""],[69,"وَمَا عَلَّمْنَٰهُ ٱلشِّعْرَ وَمَا يَنۢبَغِى لَهُۥٓ إِنْ هُوَ إِلَّا ذِكْرٌ وَقُرْءَانٌ مُّبِينٌ","Ve mâ 'allamnâhuş-şi'ra ve mâ yambagî lah, in huva illâ zikruv ve kur'ânum mubîn.","Ona şiir öğretmedik, ona yakışmaz da. Bu, yalnızca bir öğüt ve apaçık Kur’an’dır.",""],[70,"لِّيُنذِرَ مَن كَانَ حَيًّا وَيَحِقَّ ٱلْقَوْلُ عَلَى ٱلْكَٰفِرِينَ","Liyunzira man kâna hayyav ve yahikkal-kavlu 'alal-kâfirîn.","(Kur'an,) Diri olanları uyarıp korkutmak ve küfre sapanların üzerine sözün hak olması için (indirilmiştir).",""],[71,"أَوَلَمْ يَرَوْا۟ أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَآ أَنْعَٰمًا فَهُمْ لَهَا مَٰلِكُونَ","Avalam yarav annâ halaknâ lahum mimmâ 'amilat aydînâ an'âman fahum lahâ mâlikûn.","Kendi elimizle onlar için yarattığımız hayvanları görmüyorlar mı? (Bu sayede) Onlar bunlara sahip olmuşlardır.",""],[72,"وَذَلَّلْنَٰهَا لَهُمْ فَمِنْهَا رَكُوبُهُمْ وَمِنْهَا يَأْكُلُونَ","Ve zallalnâhâ lahum fa minhâ rakûbuhum ve minhâ ya'kulûn.","O hayvanları, onların emrine verdik. Onlardan kimine biniyorlar, kiminin de etini yiyorlar.",""],[73,"وَلَهُمْ فِيهَا مَنَٰفِعُ وَمَشَارِبُ أَفَلَا يَشْكُرُونَ","Ve lahum fîhâ manâfi'u ve maşârib, afalâ yaşkurûn.","O hayvanlarda, insanlar için daha başka faydalar ve içecekler vardır. Hâlâ şükretmiyorlar mı?",""],[74,"وَٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ ءَالِهَةً لَّعَلَّهُمْ يُنصَرُونَ","Vattahazû min dûnillâhi âlihatal la'allahum yunsarûn.","Belki yardım görürler diye Allah'tan başka ilahlar edindiler.",""],[75,"لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُندٌ مُّحْضَرُونَ","Lâ yastatî'ûna nasrahum, ve hum lahum cundum muhdarûn.","Onlar, kendilerine yardımda bulunmaya güç yetiremezler. Aksine kendileri onlar için hazırlanmış askerlerdir.",""],[76,"فَلَا يَحْزُنكَ قَوْلُهُمْ إِنَّا نَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ","Falâ yahzunka kavluhum, innâ na'lamu mâ yusirrûna ve mâ yu'linûn.","Artık onların sözleri seni üzmesin. Biz onların gizlediklerini de açıkladıklarını da elbette biliyoruz.",""],[77,"أَوَلَمْ يَرَ ٱلْإِنسَٰنُ أَنَّا خَلَقْنَٰهُ مِن نُّطْفَةٍ فَإِذَا هُوَ خَصِيمٌ مُّبِينٌ","Avalam yaral-insânu annâ halaknâhu min nutfatin fa'izâ huva hasîmum mubîn.","İnsan, kendisini bir nutfeden yarattığımızı görmüyor mu? Derken, o apaçık bir düşman kesiliverir.",""],[78,"وَضَرَبَ لَنَا مَثَلًا وَنَسِىَ خَلْقَهُۥ قَالَ مَن يُحْىِ ٱلْعِظَٰمَ وَهِىَ رَمِيمٌ","Ve daraba lanâ masalav ve nasiya halkah, kâla may yuhyil-'izâma ve hiya ramîm.","Kendi yaratılışını unutup, bize örnek veriyor: \"Bu çürümüş kemikleri kim diriltebilir?\" diyor.",""],[79,"قُلْ يُحْيِيهَا ٱلَّذِىٓ أَنشَأَهَآ أَوَّلَ مَرَّةٍ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ","Kul yuhyîhal-lazî anşa'ahâ avvala marrah, ve huva bikulli halkin 'alîm.","De ki: \"Onları ilk defa yaratan diriltecek. O, her yaratılmışı hakkıyla bilendir.\"",""],[80,"ٱلَّذِى جَعَلَ لَكُم مِّنَ ٱلشَّجَرِ ٱلْأَخْضَرِ نَارًا فَإِذَآ أَنتُم مِّنْهُ تُوقِدُونَ","Allazî ca'ala lakum minaş-şacaril-ahdari nârâ, fa'izâ antum minhu tûkidûn.","Yeşil ağaçtan sizin için ateş çıkaran O’dur. İşte siz ateşi ondan yakıyorsunuz.",""],[81,"أَوَلَيْسَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ بِقَٰدِرٍ عَلَىٰٓ أَن يَخْلُقَ مِثْلَهُم بَلَىٰ وَهُوَ ٱلْخَلَّٰقُ ٱلْعَلِيمُ","Ava laysal-lazî halakas-samâvâti vel-arda bikâdirin 'alâ ay yahluka mislahum, balâ ve huval-hallâkul-'alîm.","Gökleri ve yeri yaratan onların bir benzerini yaratmaya güç yetiremez mi? Evet, elbette kadirdir. O hakkıyla yaratıcıdır ve her şeyi bilir.",""],[82,"إِنَّمَآ أَمْرُهُۥٓ إِذَآ أَرَادَ شَيْـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ","Innamâ amruhû izâ arâda şay'an ay yakûla lahû kun fa yakûn.","Bir şeyi dilediği zaman, O'nun emri yalnızca: 'Ol!' demesidir. O da hemen oluverir.",""],[83,"فَسُبْحَٰنَ ٱلَّذِى بِيَدِهِۦ مَلَكُوتُ كُلِّ شَىْءٍ وَإِلَيْهِ تُرْجَعُونَ","Fa subhânal-lazî biyadihî malakûtu kulli şay'iv ve ilayhi turca'ûn.","Her şeyin mülkü elinde olan ve sizin de kendisine döneceğiniz Allah (noksanlıklardan) münezzehtir.",""]],"67":[[1,"تَبَٰرَكَ ٱلَّذِى بِيَدِهِ ٱلْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","Tabârakal-lazî biyadihil-mulk, ve huva 'alâ kulli şay'in kadîr.","Bütün mülk elinde olan Allah, yüceler yücesidir ve Onun her şeye gücü yeter.",""],[2,"ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ","Allazî halakal-mavta vel-hayâta liyabluvakum ayyukum ahsanu 'amalâ, ve huval-'azîzul-gafûr.","O, hanginizin daha güzel amel yapacağını sınamak için ölümü ve hayatı yaratandır. O; mutlak güç sahibidir, çok bağışlayandır.",""],[3,"ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍ طِبَاقًا مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ","Allazî halaka sab'a samâvâtin tibâkâ, mâ tarâ fî halkir-rahmâni min tafâvut, farci'il-basara hal tarâ min futûr.","Gökleri, üst üste yedi kat yaratan O’dur. Rahman’ın yaratmasında bir düzensizlik göremezsin. Gözünü çevir de bak, (gökte) bir çatlak görüyor musunuz?",""],[4,"ثُمَّ ٱرْجِعِ ٱلْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ ٱلْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ","Summarci'il-basara karratayni yankalib ilaykal-basaru hâsi'av ve huva hasîr.","Sonra gözünü iki kere daha çevir (de bak). Göz hakir ve umudunu kesmiş bir halde sana döner.",""],[5,"وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًا لِّلشَّيَٰطِينِ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ","Ve lakad zayyannas-samâ'ad-dun-yâ bimasâbîha ve ca'alnâhâ rucûmal liş-şayâtîni ve a'tadnâ lahum 'azâbas-sa'îr.","Andolsun biz, en yakın göğü kandillerle donattık. Onları Şeytanlara atılan taşlar yaptık ve (ahirette de) onlara alevli ateş azabını hazırladık.",""],[6,"وَلِلَّذِينَ كَفَرُوا۟ بِرَبِّهِمْ عَذَابُ جَهَنَّمَ وَبِئْسَ ٱلْمَصِيرُ","Ve lil-lazîna kafarû birabbihim 'azâbu cahannam, ve bi'sal-masîr.","Rablerini inkâr edenlere cehennem azabı vardır. Orası ne kötü bir varış yeri!",""],[7,"إِذَآ أُلْقُوا۟ فِيهَا سَمِعُوا۟ لَهَا شَهِيقًا وَهِىَ تَفُورُ","Izâ ulkû fîhâ sami'û lahâ şahîkav ve hiya tafûr.","Oraya atıldıklarında o kaynayıp coşarken onun korkunç sesini işitirler.",""],[8,"تَكَادُ تَمَيَّزُ مِنَ ٱلْغَيْظِ كُلَّمَآ أُلْقِىَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَآ أَلَمْ يَأْتِكُمْ نَذِيرٌ","Takâdu tamayyazu minal-gayz, kullamâ ulkiya fîhâ favcun sa'alahum hazanatuhâ alam ya'tikum nazîr.","Neredeyse Cehennem öfkeden çatlayacaktır! Oraya her bir topluluk atıldıkça oranın bekçileri onlara; “Size bir uyarıcı gelmemiş miydi?” diye sorarlar.",""],[9,"قَالُوا۟ بَلَىٰ قَدْ جَآءَنَا نَذِيرٌ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ ٱللَّهُ مِن شَىْءٍ إِنْ أَنتُمْ إِلَّا فِى ضَلَٰلٍ كَبِيرٍ","Kâlû balâ kad câ'anâ nazîr, fa kazzabnâ ve kulnâ mâ nazzalallâhu min şay', in antum illâ fî dalâlin kabîr.","Onlar da şöyle derler: “Evet! Bize bir uyarıcı gelmişti. Fakat biz onu yalanlamış ve Allah hiçbir şey indirmemiştir. Siz ancak büyük bir sapıklık içindesiniz demiştik.”",""],[10,"وَقَالُوا۟ لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِىٓ أَصْحَٰبِ ٱلسَّعِيرِ","Ve kâlû lav kunnâ nasma'u av na'kilu mâ kunnâ fî ashâbis-sa'îr.","Yine derler ki: \"Eğer biz dinleseydik ve aklımızı kullanmış olsaydık, cehennemlikler arasında olmazdık.\"",""],[11,"فَٱعْتَرَفُوا۟ بِذَنۢبِهِمْ فَسُحْقًا لِّأَصْحَٰبِ ٱلسَّعِيرِ","Fa'tarafû bizambihim, fasuhkal li'ashâbis-sa'îr.","İşte böylece günahlarını itiraf ederler. Artık alevli ateştekiler Allah’ın rahmetinden uzak olsun!",""],[12,"إِنَّ ٱلَّذِينَ يَخْشَوْنَ رَبَّهُم بِٱلْغَيْبِ لَهُم مَّغْفِرَةٌ وَأَجْرٌ كَبِيرٌ","Innal-lazîna yahşavna rabbahum bil-gaybi lahum magfiratuv ve acrun kabîr.","Görmediği halde Rablerinden korkup çekinen kimseler için de elbette bir bağışlanma ve büyük bir ödül vardır.",""],[13,"وَأَسِرُّوا۟ قَوْلَكُمْ أَوِ ٱجْهَرُوا۟ بِهِۦٓ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ","Ve asirrû kavlakum avicharû bih, innahû 'alîmum bizâtis-sudûr.","Sözünüzü ister gizleyin ve isterse onu açığa vurun. Şüphesiz O gönüllerde olanı bilir.",""],[14,"أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلْخَبِيرُ","Alâ ya'lamu man halak, ve huval-latîful-habîr.","Yaratan bilmez mi? O latiftir, her şeyden haberdar olandır.",""],[15,"هُوَ ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ ذَلُولًا فَٱمْشُوا۟ فِى مَنَاكِبِهَا وَكُلُوا۟ مِن رِّزْقِهِۦ وَإِلَيْهِ ٱلنُّشُورُ","Huval-lazî ca'ala lakumul-arda zalûlan famşû fî manâkibihâ ve kulû mir rizkih, ve ilayhin-nuşûr.","O, yeryüzünü sizin ayaklarınızın altına serendir. Haydi onun üzerinde yürüyün ve Allah’ın rızkından yiyin. Dönüş ancak O’nadır.",""],[16,"ءَأَمِنتُم مَّن فِى ٱلسَّمَآءِ أَن يَخْسِفَ بِكُمُ ٱلْأَرْضَ فَإِذَا هِىَ تَمُورُ","A'amintum man fis-samâ'i ay yahsifa bikumul-arda fa'izâ hiya tamûr.","Gökte olanın, yeryüzü sarsıldığı zaman sizi yerin dibine batırmayacağından emin mi oldunuz?",""],[17,"أَمْ أَمِنتُم مَّن فِى ٱلسَّمَآءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًا فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ","Am amintum man fis-samâ'i ay yursila 'alaykum hâsibâ, fa sata'lamûna kayfa nazîr.","Yoksa gökte olanın üzerinize taş yağdıran (fırtınalı) bir rüzgâr göndermeyeceğinden emin misiniz? Siz o takdirde benim uyarmam nasılmış bilip öğreneceksiniz.",""],[18,"وَلَقَدْ كَذَّبَ ٱلَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ","Ve lakad kazzabal-lazîna min kablihim fakayfa kâna nakîr.","Andolsun ki onlardan öncekiler de yalanladılar. Fakat benim inkârım nasıl oldu?",""],[19,"أَوَلَمْ يَرَوْا۟ إِلَى ٱلطَّيْرِ فَوْقَهُمْ صَٰٓفَّٰتٍ وَيَقْبِضْنَ مَا يُمْسِكُهُنَّ إِلَّا ٱلرَّحْمَٰنُ إِنَّهُۥ بِكُلِّ شَىْءٍۭ بَصِيرٌ","Avalam yarav ilat-tayri favkahum sâffâtiv ve yakbidn, mâ yumsikuhunna illar-rahmân, innahû bikulli şay'im basîr.","Üstlerinde kanatlarını açarak ve kapayarak uçan kuşları görmediler mi? Onları Rahman'dan başkası tutmuyor. Doğrusu O, her şeyi görendir.",""],[20,"أَمَّنْ هَٰذَا ٱلَّذِى هُوَ جُندٌ لَّكُمْ يَنصُرُكُم مِّن دُونِ ٱلرَّحْمَٰنِ إِنِ ٱلْكَٰفِرُونَ إِلَّا فِى غُرُورٍ","Am man hâzal-lazî huva cundul lakum yansurukum min dûnir-rahmân, inil-kâfirûna illâ fî gurûr.","Rahman olan Allah'a karşı şu size yardım edecek askerleriniz hani kimlerdir? Kâfirler ancak boş bir gurur/aldanış içindedirler.",""],[21,"أَمَّنْ هَٰذَا ٱلَّذِى يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُۥ بَل لَّجُّوا۟ فِى عُتُوٍّ وَنُفُورٍ","Am man hâzal-lazî yarzukukum in amsaka rizkah, bal laccû fî 'utuvviv ve nufûr.","Eğer O, rızkınızı kesecek olsa size rızık verecek olan kimdir? Bilâkis onlar azgınlık ve nefret içinde inatla direnmektedirler.",""],[22,"أَفَمَن يَمْشِى مُكِبًّا عَلَىٰ وَجْهِهِۦٓ أَهْدَىٰٓ أَمَّن يَمْشِى سَوِيًّا عَلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ","Afamay yamşî mukibban 'alâ vachihî ahdâ ammay yamşî saviyyan 'alâ sirâtim mustakîm.","O halde, yüzüstü kapanarak yürüyen mi daha çok hidâyete erendir, yoksa dosdoğru bir yol üzerinde dimdik yürüyen kimse mi?",""],[23,"قُلْ هُوَ ٱلَّذِىٓ أَنشَأَكُمْ وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَٰرَ وَٱلْأَفْـِٔدَةَ قَلِيلًا مَّا تَشْكُرُونَ","Kul huval-lazî anşa'akum ve ca'ala lakumus-sam'a vel-absâra vel-af'idah, kalîlam mâ taşkurûn.","Deki: \"Sizi yaratan size işitme (için kulaklar), gözler ve kalpler veren odur. Ne kadar az şükredersiniz.\"",""],[24,"قُلْ هُوَ ٱلَّذِى ذَرَأَكُمْ فِى ٱلْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ","Kul huval-lazî zara'akum fil-ardi ve ilayhi tuhşarûn.","Deki: \"O sizi yeryüzüne dağıtıp, yayandır. Yalnız onun huzuruna toplanıp götürüleceksiniz.\"",""],[25,"وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلْوَعْدُ إِن كُنتُمْ صَٰدِقِينَ","Ve yakûlûna matâ hâzal-ve'du in kuntum sâdikîn.","“Eğer doğru söyleyenler iseniz, bu tehdit ne zaman gerçekleşecek?” diyorlar.",""],[26,"قُلْ إِنَّمَا ٱلْعِلْمُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٌ مُّبِينٌ","Kul innamal-'ilmu 'indallâh, ve innamâ ana nazîrum mubîn.","De ki: “Bunun bilgisi yalnız Allah’ın katındadır. Ben sadece apaçık bir uyarıcıyım.''",""],[27,"فَلَمَّا رَأَوْهُ زُلْفَةً سِيٓـَٔتْ وُجُوهُ ٱلَّذِينَ كَفَرُوا۟ وَقِيلَ هَٰذَا ٱلَّذِى كُنتُم بِهِۦ تَدَّعُونَ","Falammâ ra'avhu zulfatan sî'at vucûhul-lazîna kafarû ve kîla hâzal-lazî kuntum bihî tadda'ûn.","Onun yaklaştığını gördükleri zaman, kâfirlerin yüzleri kötüleşir ve onlara; “İşte, isteyip durduğunuz şey budur!” denir.",""],[28,"قُلْ أَرَءَيْتُمْ إِنْ أَهْلَكَنِىَ ٱللَّهُ وَمَن مَّعِىَ أَوْ رَحِمَنَا فَمَن يُجِيرُ ٱلْكَٰفِرِينَ مِنْ عَذَابٍ أَلِيمٍ","Kul ara'aytum in ahlakaniyallâhu ve mam ma'iya av rahimanâ, famay yucîrul-kâfirîna min 'azâbin alîm.","De ki: “Söyleyin bakalım: \"Eğer Allah beni ve beraberimdekileri helâk etse yahut bize merhamet ederse kâfirleri acıklı bir azaptan kim kurtarabilir?\"",""],[29,"قُلْ هُوَ ٱلرَّحْمَٰنُ ءَامَنَّا بِهِۦ وَعَلَيْهِ تَوَكَّلْنَا فَسَتَعْلَمُونَ مَنْ هُوَ فِى ضَلَٰلٍ مُّبِينٍ","Kul huvar-rahmânu âmannâ bihî ve 'alayhi tavakkalnâ, fasata'lamûna man huva fî dalâlim mubîn.","De ki: “O, Rahman’dır. O'na iman ettik ve O'na tevekkül ettik. Kimin apaçık bir dalalette olduğunu yakında öğreneceksiniz.''",""],[30,"قُلْ أَرَءَيْتُمْ إِنْ أَصْبَحَ مَآؤُكُمْ غَوْرًا فَمَن يَأْتِيكُم بِمَآءٍ مَّعِينٍۭ","Kul ara'aytum in asbaha mâ'ukum gavran famay ya'tîkum bimâ'im ma'în.","De ki: “Söyleyin bakalım: Suyunuz çekiliverse, size kim temiz bir akar su getirir?”",""]],"78":[[1,"عَمَّ يَتَسَآءَلُونَ","'Amma yatasâ'alûn.","Birbirlerine neyi soruyorlar?",""],[2,"عَنِ ٱلنَّبَإِ ٱلْعَظِيمِ","'Anin naba'il-'azîm.","O büyük haberi mi?",""],[3,"ٱلَّذِى هُمْ فِيهِ مُخْتَلِفُونَ","Allazî hum fîhi muhtalifûn.","Ki onlar, onda ihtilafa düşmüşlerdir.",""],[4,"كَلَّا سَيَعْلَمُونَ","Kallâ saya'lamûn.","Hayır! Onlar yakında öğrenecekler.",""],[5,"ثُمَّ كَلَّا سَيَعْلَمُونَ","Summa kallâ saya'lamûn.","Sonra tekrar hayır! Yakında öğrenecekler.",""],[6,"أَلَمْ نَجْعَلِ ٱلْأَرْضَ مِهَٰدًا","Alam nac'alil-arda mihâdâ.","Yeri bir döşek kılmadık mı?",""],[7,"وَٱلْجِبَالَ أَوْتَادًا","Vel-cibâla avtâdâ.","Dağları da birer kazık kılmadık mı?",""],[8,"وَخَلَقْنَٰكُمْ أَزْوَٰجًا","Ve halaknâkum azvâcâ.","Sizleri (erkekli dişili) eşler halinde yarattık.",""],[9,"وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا","Ve ca'alnâ navmakum subâtâ.","Uykunuzu bir dinlenme (sebebi) kıldık.",""],[10,"وَجَعَلْنَا ٱلَّيْلَ لِبَاسًا","Ve ca'alnal-layla libâsâ.","Geceyi örtü bir kıldık.",""],[11,"وَجَعَلْنَا ٱلنَّهَارَ مَعَاشًا","Ve ca'alnan-nahâra ma'âşâ.","Gündüzü de geçim zamanı kıldık.",""],[12,"وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًا","Ve banaynâ favkakum sab'an şidâdâ.","Üstünüze yedi sağlam gök bina ettik.",""],[13,"وَجَعَلْنَا سِرَاجًا وَهَّاجًا","Ve ca'alnâ sirâcav vahhâcâ.","Alev alev yanan aydınlatıcı ve ısıtıcı bir kandil yarattık.",""],[14,"وَأَنزَلْنَا مِنَ ٱلْمُعْصِرَٰتِ مَآءً ثَجَّاجًا","Ve anzalnâ minal-mu'sirâti mâ'an saccâcâ.","Ve yağmur yüklü bulutlardan şarıl şarıl akan bir su indirdik.",""],[15,"لِّنُخْرِجَ بِهِۦ حَبًّا وَنَبَاتًا","Linuhrica bihî habbav ve nabâtâ.","Onunla taneler ve bitkiler çıkaralım diye.",""],[16,"وَجَنَّٰتٍ أَلْفَافًا","Ve cannâtin alfâfâ.","Ve birbirine girmiş sarmaş dolaş bahçeler yetiştirelim diye.",""],[17,"إِنَّ يَوْمَ ٱلْفَصْلِ كَانَ مِيقَٰتًا","Inna yavmal-fasli kâna mîkâtâ.","Şüphe yok ki hüküm verip, ayırt etme günü belirlenmiş bir vakittir.",""],[18,"يَوْمَ يُنفَخُ فِى ٱلصُّورِ فَتَأْتُونَ أَفْوَاجًا","Yavma yunfahu fis-sûri fa ta'tûna afvâcâ.","Sur’a üflendiği gün bölük bölük geleceksiniz.",""],[19,"وَفُتِحَتِ ٱلسَّمَآءُ فَكَانَتْ أَبْوَٰبًا","Ve futihatis-samâ'u fa kânat abvâbâ.","Ve gökyüzü açılarak orada pek çok kapılar oluşur.",""],[20,"وَسُيِّرَتِ ٱلْجِبَالُ فَكَانَتْ سَرَابًا","Ve suyyiratil-cibâlu fa kânat sarâbâ.","Dağlar yürütülüp bir seraba dönüşür.",""],[21,"إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًا","Inna cahannama kânat mirsâdâ.","Şüphesiz Cehennem de bir gözetleme yeridir.",""],[22,"لِّلطَّٰغِينَ مَـَٔابًا","Lit-tâgîna ma'âbâ.","Azgınların varacağı sığınaktır.",""],[23,"لَّٰبِثِينَ فِيهَآ أَحْقَابًا","Lâbisîna fîhâ ahkâbâ.","Orada çağlar boyu kalacaklardır.",""],[24,"لَّا يَذُوقُونَ فِيهَا بَرْدًا وَلَا شَرَابًا","Lâ yazûkûna fîhâ bardav ve lâ şarâbâ.","Orada ne bir serinlik, ne de bir içecek tadacaklar.",""],[25,"إِلَّا حَمِيمًا وَغَسَّاقًا","Illâ hamîmav ve gassâkâ.","Yalnızca kaynar su ve irinden içecekler.",""],[26,"جَزَآءً وِفَاقًا","Cazâ'av vifâkâ.","(Dünyada yaptıklarına karşılık) Uygun bir ceza olarak.",""],[27,"إِنَّهُمْ كَانُوا۟ لَا يَرْجُونَ حِسَابًا","Innahum kânû lâ yarcûna hisâbâ.","Çünkü onlar hesaba çekilmeyi ummuyorlardı.",""],[28,"وَكَذَّبُوا۟ بِـَٔايَٰتِنَا كِذَّابًا","Ve kazzabû bi'âyâtinâ kizzâbâ.","Ayetlerimizi de alabildiğine yalanlamışlardı.",""],[29,"وَكُلَّ شَىْءٍ أَحْصَيْنَٰهُ كِتَٰبًا","Ve kulla şay'in ahsaynâhu kitâbâ.","Biz ise, her şeyi bir kitapta (Levh-i Mahfuz’da) tamamiyle sayıp tespit ettik.",""],[30,"فَذُوقُوا۟ فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا","Fa zûkû falan nazîdakum illâ 'azâbâ","Kâfirlere şöyle denilir: “Şimdi tadın. Artık bundan sonra yalnızca azabınızı artıracağız.”",""],[31,"إِنَّ لِلْمُتَّقِينَ مَفَازًا","Inna lil-muttakîna mafâzâ.","Şüphesiz takva sahipleri için bir kurtuluş vardır.",""],[32,"حَدَآئِقَ وَأَعْنَٰبًا","Hadâ'ika ve a'nâbâ.","Bahçeler ve üzümler vardır.",""],[33,"وَكَوَاعِبَ أَتْرَابًا","Ve kavâ'iba atrâbâ.","Göğüsleri olgun yaşıt kızlar vardır.",""],[34,"وَكَأْسًا دِهَاقًا","Ve ka'san dihâkâ.","Dolu dolu kadehler vardır.",""],[35,"لَّا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّٰبًا","Lâ yasma'ûna fîhâ lagvav ve lâ kizzâbâ.","Orada ne bir boş söz işitirler, ne de bir yalan.",""],[36,"جَزَآءً مِّن رَّبِّكَ عَطَآءً حِسَابًا","Cazâ'am mir rabbika 'atâ'an hisâbâ.","Rabbinden bir karşılık olmak üzere yeterli bir bağıştır bu.",""],[37,"رَّبِّ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ٱلرَّحْمَٰنِ لَا يَمْلِكُونَ مِنْهُ خِطَابًا","Rabbis-samâvâti vel-ardi ve mâ baynahumar-rahmâni lâ yamlikûna minhu hitâbâ.","Bunlar; göklerin, yerin ve ikisi arasında bulunanların Rahman olan Rabbindendir. Ona hitap etmeye güç yetiremezler.",""],[38,"يَوْمَ يَقُومُ ٱلرُّوحُ وَٱلْمَلَٰٓئِكَةُ صَفًّا لَّا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ ٱلرَّحْمَٰنُ وَقَالَ صَوَابًا","Yavma yakûmur-rûhu vel-malâ'ikatu saffâ, lâ yatakallamûna illâ man azina lahur-rahmânu ve kâla savâbâ.","Ruh'un ve meleklerin sıra sıra duracakları gün; Rahman'ın kendilerine izin verdikleri dışındakiler konuşamazlar. Onlar da doğruyu söylerler.",""],[39,"ذَٰلِكَ ٱلْيَوْمُ ٱلْحَقُّ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ مَـَٔابًا","Zâlikal-yavmul-hakk, faman şâ'attahaza ilâ rabbihî ma'âbâ.","İşte bu o hak gündür. O halde dileyen Rabbine bir dönüş yolu edinsin.",""],[40,"إِنَّآ أَنذَرْنَٰكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنظُرُ ٱلْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ ٱلْكَافِرُ يَٰلَيْتَنِى كُنتُ تُرَٰبًۢا","Innâ anzarnâkum 'azâban karîbâ, yavma yanzurul-mar'u mâ kaddamat yadâhu ve yakûlul-kâfiru yâ laytanî kuntu turâbâ.","Biz, sizi çok yakın bir azapla uyardık. Herkes o gün, kendi elleriyle ne yaptığına bir bakar ve kâfir olanlar da: \"Keşke toprak olsaydım!\" der.",""]],"48":[[1,"إِنَّا فَتَحْنَا لَكَ فَتْحًا مُّبِينًا","Innâ fatahnâ laka fatham mubînâ.","Şüphesiz biz, sana apaçık bir fetih verdik.",""],[2,"لِّيَغْفِرَ لَكَ ٱللَّهُ مَا تَقَدَّمَ مِن ذَنۢبِكَ وَمَا تَأَخَّرَ وَيُتِمَّ نِعْمَتَهُۥ عَلَيْكَ وَيَهْدِيَكَ صِرَٰطًا مُّسْتَقِيمًا","Liyagfira lakallâhu mâ takaddama min zambika ve mâ ta'ahhara ve yutimma ni'matahû 'alayka ve yahdiyaka sirâtam mustakîmâ.","Böylece Allah, senin geçmiş ve gelecek günahını bağışlar. Sana olan nimetini tamamlar ve seni dosdoğru bir yola iletir.",""],[3,"وَيَنصُرَكَ ٱللَّهُ نَصْرًا عَزِيزًا","Ve yansurakallâhu nasran 'azîzâ.","Ve Allah, sana üstün bir zaferle yardım eder.",""],[4,"هُوَ ٱلَّذِىٓ أَنزَلَ ٱلسَّكِينَةَ فِى قُلُوبِ ٱلْمُؤْمِنِينَ لِيَزْدَادُوٓا۟ إِيمَٰنًا مَّعَ إِيمَٰنِهِمْ وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَكَانَ ٱللَّهُ عَلِيمًا حَكِيمًا","Huval-lazî anzalas-sakînata fî kulûbil-mu'minîna liyazdâdû îmânam ma'a îmânihim, ve lillâhi cunûdus-samâvâti vel-ard, ve kânallâhu 'alîman hakîmâ.","İmanlarına iman katmaları için Müminlerin kalplerine huzur indiren O’dur. Göklerin ve yerin orduları Allah’ındır. Allah; Alîm'dir, Hakim'dir.",""],[5,"لِّيُدْخِلَ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ جَنَّٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَا وَيُكَفِّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَكَانَ ذَٰلِكَ عِندَ ٱللَّهِ فَوْزًا عَظِيمًا","Liyudhilal-mu'minîna vel-mu'minâti cannâtin tacrî min tahtihal-anhâru hâlidîna fîhâ ve yukaffira 'anhum sayyi'âtihim, ve kâna zâlika 'indallâhi favzan 'azîmâ.","Bütün bunlar Allah’ın; iman eden erkek ve kadınları, altından ırmaklar akan, içinde ebedi kalacakları Cennetler'e koyması, onların kötülüklerini örtmesi içindir. İşte bu, Allah katında büyük bir kurtuluş/başarıdır.",""],[6,"وَيُعَذِّبَ ٱلْمُنَٰفِقِينَ وَٱلْمُنَٰفِقَٰتِ وَٱلْمُشْرِكِينَ وَٱلْمُشْرِكَٰتِ ٱلظَّآنِّينَ بِٱللَّهِ ظَنَّ ٱلسَّوْءِ عَلَيْهِمْ دَآئِرَةُ ٱلسَّوْءِ وَغَضِبَ ٱللَّهُ عَلَيْهِمْ وَلَعَنَهُمْ وَأَعَدَّ لَهُمْ جَهَنَّمَ وَسَآءَتْ مَصِيرًا","Ve yu'azzibal-munâfikîna vel-munâfikâti vel-muşrikîna vel-muşrikâtiz-zânnîna billâhi zannas-sav', 'alayhim dâ'iratus-sav', ve gadiballâhu 'alayhim ve la'anahum ve a'adda lahum cahannam, ve sâ'at masîrâ.","Allah hakkında kötü zanda bulunan münafık erkeklere ve münafık kadınlara, müşrik erkek ve müşrik kadınlara azap edecektir. Üzerlerine azap (iner). Allah onlara gazap etmiş, onları lanetlemiş ve onlara Cehennem'i hazırlamıştır. Varacakları yer ne kötüdür.",""],[7,"وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا","Ve lillâhi cunûdus-samâvâti vel-ard, ve kânallâhu 'azîzan hakîmâ.","Göklerin ve yerin orduları Allah’ındır. Allah; Azîz'dir, Hakîm'dir.",""],[8,"إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًا وَمُبَشِّرًا وَنَذِيرًا","Innâ arsalnâka şâhidav ve mubaşşirav ve nazîrâ.","Biz seni şahit, müjdeci ve uyarıcı olarak gönderdik .",""],[9,"لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةً وَأَصِيلًا","Litu'minû billâhi ve rasûlihî ve tu'azzirûhu ve tuvakkirûh, ve tusabbihûhu bukratav ve asîlâ.","Ta ki (Ey Müminler!) Allah'a ve Rasûl'üne iman edesiniz, Rasûlüne yardım edesiniz, ona saygı gösteresiniz ve sabah akşam Allah'ı tesbih edesiniz.",""],[10,"إِنَّ ٱلَّذِينَ يُبَايِعُونَكَ إِنَّمَا يُبَايِعُونَ ٱللَّهَ يَدُ ٱللَّهِ فَوْقَ أَيْدِيهِمْ فَمَن نَّكَثَ فَإِنَّمَا يَنكُثُ عَلَىٰ نَفْسِهِۦ وَمَنْ أَوْفَىٰ بِمَا عَٰهَدَ عَلَيْهُ ٱللَّهَ فَسَيُؤْتِيهِ أَجْرًا عَظِيمًا","Innal-lazîna yubâyi'ûnaka innamâ yubâyi'ûnallâh, yadullâhi favka aydîhim, faman nakasa fa'innamâ yankusu 'alâ nafsih, ve man avfâ bimâ 'âhada 'alayhullâha fa sayu'tîhi acran 'azîmâ.","Muhakkak ki sana bey’at edenler ancak Allah’a bey’at etmiş olurlar. Allah’ın eli onların ellerinin üzerindedir. Kim ahdini bozarsa kendi aleyhine bozmuş olur. Kim de Allah'a verdiği sözün gereğini yerine getirirse ona (Allah) büyük bir ecir verecektir.",""],[11,"سَيَقُولُ لَكَ ٱلْمُخَلَّفُونَ مِنَ ٱلْأَعْرَابِ شَغَلَتْنَآ أَمْوَٰلُنَا وَأَهْلُونَا فَٱسْتَغْفِرْ لَنَا يَقُولُونَ بِأَلْسِنَتِهِم مَّا لَيْسَ فِى قُلُوبِهِمْ قُلْ فَمَن يَمْلِكُ لَكُم مِّنَ ٱللَّهِ شَيْـًٔا إِنْ أَرَادَ بِكُمْ ضَرًّا أَوْ أَرَادَ بِكُمْ نَفْعًۢا بَلْ كَانَ ٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرًۢا","Sayakûlu lakal-muhallafûna minal-a'râbi şagalatnâ amvâlunâ ve ahlûnâ fastagfir lanâ, yakûlûna bi'alsinatihim mâ laysa fî kulûbihim, kul famay yamliku lakum minallâhi şay'an in arâda bikum darran av arâda bikum naf'â, bal kânallâhu bimâ ta'malûna habîrâ.","Geride kalan bedeviler, sana: \"Bizi mallarımız ve ailelerimiz meşgul etti. Bizim için bağışlanma dile!\" diyeceklerdir. Kalplerinde olmayanı dilleri ile söylüyorlar. De ki: \"Eğer Allah, size bir zarar veya fayda vermek isterse; kim sizin için bir şeye sahip olabilir? Oysa hayır! Allah yapmakta olduklarınızdan haberdardır.\"",""],[12,"بَلْ ظَنَنتُمْ أَن لَّن يَنقَلِبَ ٱلرَّسُولُ وَٱلْمُؤْمِنُونَ إِلَىٰٓ أَهْلِيهِمْ أَبَدًا وَزُيِّنَ ذَٰلِكَ فِى قُلُوبِكُمْ وَظَنَنتُمْ ظَنَّ ٱلسَّوْءِ وَكُنتُمْ قَوْمًۢا بُورًا","Bal zanantum allay yankalibar-rasûlu vel-mu'minûna ilâ ahlîhim abadav ve zuyyina zâlika fî kulûbikum ve zanantum zannas-sav', ve kuntum kavmam bûrâ.","Aslında siz Peygamberin ve Müminlerin ailelerine bir daha dönmeyeceklerini sanmıştınız. Bu sizin gönüllerinize güzel göründü de kötü zanda bulundunuz ve helâkı hak etmiş bir topluluk oldunuz.",""],[13,"وَمَن لَّمْ يُؤْمِنۢ بِٱللَّهِ وَرَسُولِهِۦ فَإِنَّآ أَعْتَدْنَا لِلْكَٰفِرِينَ سَعِيرًا","Ve mal lam yu'mim billâhi ve rasûlihî fa'innâ a'tadnâ lil-kâfirîna sa'îrâ.","Kim Allah’a ve Peygamberine iman etmezse, biz o kâfirlere alevli bir ateş hazırladık.",""],[14,"وَلِلَّهِ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ وَكَانَ ٱللَّهُ غَفُورًا رَّحِيمًا","Ve lillâhi mulkus-samâvâti vel-ard, yagfiru limay yaşâ'u ve yu'azzibu may yaşâ', ve kânallâhu gafûrar rahîmâ.","Göklerin ve yerin mülkü Allah’a aittir. Dilediğini bağışlar, dilediğini cezalandırır. Allah çokça bağışlayıcıdır, çokça merhametlidir.",""],[15,"سَيَقُولُ ٱلْمُخَلَّفُونَ إِذَا ٱنطَلَقْتُمْ إِلَىٰ مَغَانِمَ لِتَأْخُذُوهَا ذَرُونَا نَتَّبِعْكُمْ يُرِيدُونَ أَن يُبَدِّلُوا۟ كَلَٰمَ ٱللَّهِ قُل لَّن تَتَّبِعُونَا كَذَٰلِكُمْ قَالَ ٱللَّهُ مِن قَبْلُ فَسَيَقُولُونَ بَلْ تَحْسُدُونَنَا بَلْ كَانُوا۟ لَا يَفْقَهُونَ إِلَّا قَلِيلًا","Sayakûlul-muhallafûna izantalaktum ilâ magânima lita'huzûhâ zarûnâ nattabi'kum, yurîdûna ay yubaddilû kalâmallâh, kul lan tattabi'ûnâ kazâlikum kâlallâhu min kabl, fasayakûlûna bal tahsudûnanâ, bal kânû lâ yafkahûna illâ kalîlâ.","Geride kalanlar, siz ganimetleri almaya giderken diyecekler ki: \"Bizi bırakın da size uyalım/ardınızdan gelelim.\" Allah’ın sözünü değiştirmek istiyorlar. De ki: Asla bizim ardımızdan gelmeyeceksiniz. Daha önce Allah da böyle buyurmuştu. Hayır! Siz bizi çekemiyorsunuz/kıskanıyorsunuz, diyecekler. Hayır! Onlar pek az anlarlar.",""],[16,"قُل لِّلْمُخَلَّفِينَ مِنَ ٱلْأَعْرَابِ سَتُدْعَوْنَ إِلَىٰ قَوْمٍ أُو۟لِى بَأْسٍ شَدِيدٍ تُقَٰتِلُونَهُمْ أَوْ يُسْلِمُونَ فَإِن تُطِيعُوا۟ يُؤْتِكُمُ ٱللَّهُ أَجْرًا حَسَنًا وَإِن تَتَوَلَّوْا۟ كَمَا تَوَلَّيْتُم مِّن قَبْلُ يُعَذِّبْكُمْ عَذَابًا أَلِيمًا","Kul lil-muhallafîna minal-a'râbi satud'avna ilâ kavmin ulî ba'sin şadîdin tukâtilûnahum av yuslimûn, fa'in tutî'û yu'tikumullâhu acran hasanâ, ve in tatavallav kamâ tavallaytum min kablu yu'azzibkum 'azâban alîmâ.","Bedevilerden (seferden) geri kalanlara de ki: \"Çok güçlü bir kavme karşı savaşmak için çağrılacaksınız ya da onlar Müslüman olacaklar. Eğer itaat ederseniz, Allah size güzel bir mükâfat verir. Eğer daha önce yüz çevirdiğiniz gibi yüz çevirirseniz, sizi acı bir azapla cezalandırır.\"",""],[17,"لَّيْسَ عَلَى ٱلْأَعْمَىٰ حَرَجٌ وَلَا عَلَى ٱلْأَعْرَجِ حَرَجٌ وَلَا عَلَى ٱلْمَرِيضِ حَرَجٌ وَمَن يُطِعِ ٱللَّهَ وَرَسُولَهُۥ يُدْخِلْهُ جَنَّٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ وَمَن يَتَوَلَّ يُعَذِّبْهُ عَذَابًا أَلِيمًا","Laysa 'alal-a'mâ haracuv ve lâ 'alal-a'raci haracuv ve lâ 'alal-marîdi harac, ve may yuti'illâha ve rasûlahû yudhilhu cannâtin tacrî min tahtihal-anhâr, ve may yatavalla yu'azzibhu 'azâban alîmâ.","Kör olana güçlük (sorumluluk) yoktur, topal olana güçlük yoktur ve hasta olana da güçlük yoktur. Kim Allah'a ve resulüne itaat ederse, (Allah) onu, altından ırmaklar akan cennetlere sokar. Kim de yüz çevirirse onu da acı bir azapla cezalandırır.",""],[18,"لَّقَدْ رَضِىَ ٱللَّهُ عَنِ ٱلْمُؤْمِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ ٱلشَّجَرَةِ فَعَلِمَ مَا فِى قُلُوبِهِمْ فَأَنزَلَ ٱلسَّكِينَةَ عَلَيْهِمْ وَأَثَٰبَهُمْ فَتْحًا قَرِيبًا","Lakad radiyallâhu 'anil-mu'minîna iz yubâyi'ûnaka tahtaş-şacarati fa'alima mâ fî kulûbihim fa'anzalas-sakînata 'alayhim ve asâbahum fathan karîbâ.","Muhakkak o ağacın altında sana biat ederlerken Allah, o Müminlerden razı olmuştur. Kalplerinde olanı bilmiş, üzerlerine huzur indirmiş ve onlara yakın bir fetih vermiştir.",""],[19,"وَمَغَانِمَ كَثِيرَةً يَأْخُذُونَهَا وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا","Ve magânima kasîratay ya'huzûnahâ, ve kânallâhu 'azîzan hakîmâ.","Ve alacakları birçok ganimetlerle de. Allah Azîzdir, Hakîmdir.",""],[20,"وَعَدَكُمُ ٱللَّهُ مَغَانِمَ كَثِيرَةً تَأْخُذُونَهَا فَعَجَّلَ لَكُمْ هَٰذِهِۦ وَكَفَّ أَيْدِىَ ٱلنَّاسِ عَنكُمْ وَلِتَكُونَ ءَايَةً لِّلْمُؤْمِنِينَ وَيَهْدِيَكُمْ صِرَٰطًا مُّسْتَقِيمًا","Ve'adakumullâhu magânima kasîratan ta'huzûnahâ fa'accala lakum hâzihî ve kaffa aydiyan-nâsi 'ankum, ve litakûna âyatal lil-mu'minîna ve yahdiyakum sirâtam mustakîmâ.","Allah, size elde edeceğiniz bir çok ganimet vaadi vermiştir. Bunu sizin için çabuklaştırmış ve Müminlere bir işaret olması, sizin de doğru yolu bulmanız için insanların ellerini sizden çekmiştir.",""],[21,"وَأُخْرَىٰ لَمْ تَقْدِرُوا۟ عَلَيْهَا قَدْ أَحَاطَ ٱللَّهُ بِهَا وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرًا","Ve uhrâ lam takdirû 'alayhâ kad ahâtallâhu bihâ, ve kânallâhu 'alâ kulli şay'in kadîrâ.","Henüz elde edemediğiniz başka ganimetler de vardır ki, onları Allah kuşatmıştır. Allah’ın her şeye gücü yeter.",""],[22,"وَلَوْ قَٰتَلَكُمُ ٱلَّذِينَ كَفَرُوا۟ لَوَلَّوُا۟ ٱلْأَدْبَٰرَ ثُمَّ لَا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا","Ve lav kâtalakumul-lazîna kafarû lavallavul-adbâra summa lâ yacidûna valiyyav ve lâ nasîrâ.","Kâfirler sizinle savaşmış olsalardı, arkalarını dönüp kaçarlardı da bir dost ve yardımcı bulamazlardı.",""],[23,"سُنَّةَ ٱللَّهِ ٱلَّتِى قَدْ خَلَتْ مِن قَبْلُ وَلَن تَجِدَ لِسُنَّةِ ٱللَّهِ تَبْدِيلًا","Sunnatallâhil-latî kad halat min kabl, ve lan tacida lisunnatillâhi tabdîlâ.","(Bu,) Allah'ın öteden beri süregelen sünnetidir. Sen Allah'ın sünnetinde kesinlikle hiç bir değişiklik bulamazsın.",""],[24,"وَهُوَ ٱلَّذِى كَفَّ أَيْدِيَهُمْ عَنكُمْ وَأَيْدِيَكُمْ عَنْهُم بِبَطْنِ مَكَّةَ مِنۢ بَعْدِ أَنْ أَظْفَرَكُمْ عَلَيْهِمْ وَكَانَ ٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرًا","Ve huval-lazî kaffa aydiyahum 'ankum ve aydiyakum 'anhum bibatni makkata mim ba'di an azfarakum 'alayhim, ve kânallâh bimâ ta'malûna basîrâ.","Sizi onlara karşı zafere ulaştırdıktan sonra, Mekke’nin içinde (Hudeybiye'de) onların ellerini sizden, sizin elinizi de onlardan çeken O’dur. Allah, bütün işlediğiniz amelleri hakkıyla görendir.",""],[25,"هُمُ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوكُمْ عَنِ ٱلْمَسْجِدِ ٱلْحَرَامِ وَٱلْهَدْىَ مَعْكُوفًا أَن يَبْلُغَ مَحِلَّهُۥ وَلَوْلَا رِجَالٌ مُّؤْمِنُونَ وَنِسَآءٌ مُّؤْمِنَٰتٌ لَّمْ تَعْلَمُوهُمْ أَن تَطَـُٔوهُمْ فَتُصِيبَكُم مِّنْهُم مَّعَرَّةٌۢ بِغَيْرِ عِلْمٍ لِّيُدْخِلَ ٱللَّهُ فِى رَحْمَتِهِۦ مَن يَشَآءُ لَوْ تَزَيَّلُوا۟ لَعَذَّبْنَا ٱلَّذِينَ كَفَرُوا۟ مِنْهُمْ عَذَابًا أَلِيمًا","Humul-lazîna kafarû ve saddûkum 'anil-mascidil-harâmi vel-hadya ma'kûfan ay yabluga mahillah, ve lav lâ ricâlum mu'minûna ve nisâ'um mu'minâtul lam ta'lamûhum an tata'ûhum fa tusîbakum minhum ma'arratum bigayri 'ilm, liyudhilallâhu fî rahmatihî may yaşâ', lav tazayyalû la'azzabnal-lazîna kafarû minhum 'azâban alîmâ.","Onlar, sizin Kâbe’yi ziyaret etmenize ve bekletilen kurbanların yerlerine ulaşmasına engel olan kâfirlerdir. Eğer, oradaki henüz tanımadığınız iman etmiş erkeklerle iman etmiş kadınları bilmeyerek ezmeniz ve böylece size bir vebal gelecek olmasaydı, (Allah, Mekke’ye girmenize izin verirdi). Allah, dilediğini rahmetine koymak için böyle yapmıştır. Eğer (Müminler) seçilip ayrılmış olsalardı elbette kâfirleri elem verici bir azaba çarptırırdık.",""],[26,"إِذْ جَعَلَ ٱلَّذِينَ كَفَرُوا۟ فِى قُلُوبِهِمُ ٱلْحَمِيَّةَ حَمِيَّةَ ٱلْجَٰهِلِيَّةِ فَأَنزَلَ ٱللَّهُ سَكِينَتَهُۥ عَلَىٰ رَسُولِهِۦ وَعَلَى ٱلْمُؤْمِنِينَ وَأَلْزَمَهُمْ كَلِمَةَ ٱلتَّقْوَىٰ وَكَانُوٓا۟ أَحَقَّ بِهَا وَأَهْلَهَا وَكَانَ ٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمًا","Iz ca'alal-lazîna kafarû fî kulûbihimul-hamiyyata hamiyyatal-câhiliyyati fa anzalallâhu sakînatahû 'alâ rasûlihî ve 'alal-mu'minîna ve alzamahum kalimatat-takvâ ve kânû ahakka bihâ ve ahlahâ, ve kânallâhu bikulli şay'in 'alîmâ.","Zira kâfirler, kalplerine taassubu/bağnazlığı, (hem de) cahiliye bağnazlığını yerleştirmişlerdi. Allah da Rasûlüne ve Müminlere sükûnet ve güvenini indirdi, onları takva sözüne (kelime-i tevhide) bağlı kıldı. Zaten onlar buna layık ve ehil kimselerdi. Allah her şeyi bilendir.",""],[27,"لَّقَدْ صَدَقَ ٱللَّهُ رَسُولَهُ ٱلرُّءْيَا بِٱلْحَقِّ لَتَدْخُلُنَّ ٱلْمَسْجِدَ ٱلْحَرَامَ إِن شَآءَ ٱللَّهُ ءَامِنِينَ مُحَلِّقِينَ رُءُوسَكُمْ وَمُقَصِّرِينَ لَا تَخَافُونَ فَعَلِمَ مَا لَمْ تَعْلَمُوا۟ فَجَعَلَ مِن دُونِ ذَٰلِكَ فَتْحًا قَرِيبًا","Lakad sadakallâhu rasûlahur-ru'yâ bil-hakk, latadhulunnal-mascidal-harâma in şâ'allâhu âminîn, muhallikîna ru'ûsakum ve mukassirîn, lâ tahâfûn, fa'alima mâ lam ta'lamû faca'ala min dûni zâlika fathan karîbâ.","Evet! Allah, elçisinin rüyasını hakkıyla doğruladı. Allah’ın dilemesiyle güven içinde, başlarınızı tıraş etmiş ve saçlarınızı kısaltmış olarak, korkusuzca Mescid-i Haram’a gireceksiniz. Allah, sizin bilmediğinizi bilir. Oraya girmeden önce de yakın bir fetih vermiştir.",""],[28,"هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ وَكَفَىٰ بِٱللَّهِ شَهِيدًا","Huval-lazî arsala rasûlahû bil-hudâ ve dînil-hakki liyuzhirahû 'alad-dîni kullih, ve kafâ billâhi şahîdâ.","Bütün dinlerden üstün kılmak üzere, Peygamberini hidayet ve hak din ile gönderen O'dur. Şahit olarak Allah yeter.",""],[29,"مُّحَمَّدٌ رَّسُولُ ٱللَّهِ وَٱلَّذِينَ مَعَهُۥٓ أَشِدَّآءُ عَلَى ٱلْكُفَّارِ رُحَمَآءُ بَيْنَهُمْ تَرَىٰهُمْ رُكَّعًا سُجَّدًا يَبْتَغُونَ فَضْلًا مِّنَ ٱللَّهِ وَرِضْوَٰنًا سِيمَاهُمْ فِى وُجُوهِهِم مِّنْ أَثَرِ ٱلسُّجُودِ ذَٰلِكَ مَثَلُهُمْ فِى ٱلتَّوْرَىٰةِ وَمَثَلُهُمْ فِى ٱلْإِنجِيلِ كَزَرْعٍ أَخْرَجَ شَطْـَٔهُۥ فَـَٔازَرَهُۥ فَٱسْتَغْلَظَ فَٱسْتَوَىٰ عَلَىٰ سُوقِهِۦ يُعْجِبُ ٱلزُّرَّاعَ لِيَغِيظَ بِهِمُ ٱلْكُفَّارَ وَعَدَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ مِنْهُم مَّغْفِرَةً وَأَجْرًا عَظِيمًۢا","Muhammadur rasûlullâh, vel-lazîna ma'ahû aşiddâ'u 'alal-kuffâri ruhamâ'u baynahum tarâhum rukka'an succaday yabtagûna fadlam minallâhi ve ridvânâ, sîmâhum fî vucûhihim min asaris-sucûd, zâlika masaluhum fit-tavrâh, ve masaluhum fil-incîl, kazar'in ahraca şat'ahû fa âzarahû fastaglaza fastavâ 'alâ sûkihî yu'cibuz-zurrâ'a liyagîza bihimul-kuffâr, ve'adallâhul-lazîna âmanû ve 'amilus-sâlihâti minhum magfiratav ve acran 'azîmâ.","Muhammed, Allah’ın Rasûlüdür. Onunla beraber olanlar; kâfirlere karşı şiddetli, kendi aralarında merhametlidirler. Onların rükû ve secde ederek Allah’ın lütuf ve rızasını arzuladıklarını görürsün. Onların işareti yüzlerindeki secde izleridir. İşte bu onların Tevrat’taki örneğidir. İncil'deki örneği ise filizini yarıp çıkarmış, gittikçe onu kuvvetlendirerek kalınlaşmış, gövdesi üzerine dikilmiş bir ekin gibidir ki, bu çiftçilerin de hoşuna gider. (Bu) Onunla kâfirleri öfkelendirmek içindir. Onlardan iman eden ve salih amellerde bulunanlara mağfiret ve büyük bir mükâfat vadetmiştir.",""]],"59":[[22,"هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَٰهَ إِلَّا هُوَ عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ هُوَ ٱلرَّحْمَٰنُ ٱلرَّحِيمُ","Huvallâhul-lazî lâ ilâha illâ huv, 'âlimul-gaybi vaş-şahâdah, huvar-rahmânur-rahîm.","O öyle Allah'tır ki, O'ndan başka (hakkıyla ibadete layık hiçbir) ilah yoktur. Görülmeyeni (gaybı) ve görüleni bilendir. O; çok bağışlayıcıdır, çok merhametlidir.",""],[23,"هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَٰهَ إِلَّا هُوَ ٱلْمَلِكُ ٱلْقُدُّوسُ ٱلسَّلَٰمُ ٱلْمُؤْمِنُ ٱلْمُهَيْمِنُ ٱلْعَزِيزُ ٱلْجَبَّارُ ٱلْمُتَكَبِّرُ سُبْحَٰنَ ٱللَّهِ عَمَّا يُشْرِكُونَ","Huvallâhul-lazî lâ ilâha illâ huv, al-malikul-kuddûsus-salâmul-mu'minul-muhayminul-'azîzul-cabbârul-mutakabbir, subhânallâhi 'ammâ yuşrikûn.","O Allah’tır ki ondan başka hiçbir ilah yoktur. Melik’tir, Kuddüs’tür, Selam’dır, Mümin’dir, Muheymin’dir, Aziz’dir, Cebbar’dır, Mütekkebbir’dir. Allah koştukları ortaklardan münezzehtir.",""],[24,"هُوَ ٱللَّهُ ٱلْخَٰلِقُ ٱلْبَارِئُ ٱلْمُصَوِّرُ لَهُ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ يُسَبِّحُ لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ","Huvallâhul-hâlikul-bâri'ul-musavviru lahul-asmâ'ul-husnâ, yusabbihu lahû mâ fis-samâvâti vel-ard, ve huval-'azîzul-hakîm.","O Allah; yaratan, yoktan var eden, şekil verendir. En güzel isimler O’nundur. Göklerde ve yerde ne varsa O’nu tesbih eder. O; çok güçlüdür, Hakîm’dir.",""]],"2":[[285,"ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِۦ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ","Âmanar-rasûlu bimâ unzila ilayhi mir rabbihî vel-mu'minûn, kullun âmana billâhi ve malâ'ikatihî ve kutubihî ve rusulih, lâ nufarriku bayna ahadim mir rusulih, ve kâlû sami'nâ ve ata'nâ, gufrânaka rabbanâ ve ilaykal-masîr.","Peygamber, Rabbinden kendisine indirilene iman etmiştir, Müminler de! Hepsi de Allah’a, meleklerine, kitaplarına ve peygamberlerine iman etmiş ve Allah’ın peygamberlerinden hiçbirini (diğerinden) ayırmayız. İşittik ve itaat ettik, demişlerdir. Rabbimiz! Bağışlamanı dileriz, dönüş sanadır.",""],[286,"لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","Lâ yukallifullâhu nafsan illâ vus'ahâ, lahâ mâ kasabat ve 'alayhâ maktasabat, rabbanâ lâ tu'âhiznâ in nasînâ av ahta'nâ, rabbanâ ve lâ tahmil 'alaynâ isran kamâ hamaltahû 'alal-lazîna min kablinâ, rabbanâ ve lâ tuhammilnâ mâ lâ tâkata lanâ bih, ve'fu 'annâ, vagfir lanâ, varhamnâ, anta mavlânâ fansurnâ 'alal kavmil-kâfirîn.","Allah, hiç kimseye gücünün üstünde bir şey (sorumluluk) yüklemez. (Herkesin) kazandığı (iyilik) lehine ve işlediği (kötülük) ise aleyhinedir! Rabbimiz, eğer unuttuk veya hata yaptıysak bizi hesaba çekme. Rabbimiz! Bizden öncekilere yüklediğin gibi bize de ağır bir görev yükleme. Rabbimiz! Gücümüzün yetmeyeceğini bize taşıtma. Bizi affet, bizi bağışla ve bize merhamet et. Sen bizim mevlâmızsın. Kâfir topluma karşı bize yardım et.",""]]};

["takva","tövbe","ahlak","iyilik"]},{"ar":"إِذَا لَمْ تَسْتَحْيِ فَاصْنَعْ مَا شِئْتَ","ok":"İzâ lem testahyi fasna' mâ şi't.","ml":"Utanmıyorsan dilediğini yap.","src":"Buhârî","tags":["hayâ","utanmak","ahlak"]},{"ar":"الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ","ok":"El-müslimü men selime'l-müslimûne min lisânihî ve yedih.","ml":"Müslüman, elinden ve dilinden Müslümanların güvende olduğu kimsedir.","src":"Buhârî, Müslim","tags":["dil","komşu","güven","ahlak"]},{"ar":"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ","ok":"Hayruküm men teallema'l-Kur'âne ve allemeh.","ml":"Sizin en hayırlınız Kur'an'ı öğrenen ve öğretendir.","src":"Buhârî","tags":["Kur'an","ilim","öğretmek"]},{"ar":"الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ","ok":"El-kelimetü't-tayyibetü sadaka.","ml":"Güzel söz sadakadır.","src":"Buhârî, Müslim","tags":["söz","sadaka","iyilik"]},{"ar":"تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ","ok":"Tebessümüke fî vechi ehîke leke sadaka.","ml":"Kardeşinin yüzüne gülümsemen senin için sadakadır.","src":"Tirmizî","tags":["sadaka","tebessüm","kardeşlik"]},{"ar":"لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ","ok":"Leyse'ş-şedîdü bi's-sura'a, inneme'ş-şedîdü'llezî yemlikü nefsehû inde'l-ğadab.","ml":"Güçlü kimse güreşte rakibini yenen değildir. Asıl güçlü, öfke anında kendine hâkim olandır.","src":"Buhârî, Müslim","tags":["öfke","sabır","güç"]},{"ar":"مَنْ لَا يَرْحَمُ لَا يُرْحَمُ","ok":"Men lâ yerhamü lâ yürham.","ml":"Merhamet etmeyene merhamet edilmez.","src":"Buhârî, Müslim","tags":["merhamet","şefkat"]},{"ar":"الرَّاحِمُونَ يَرْحَمُهُمُ الرَّحْمَنُ","ok":"Er-râhimûne yerhamühümü'r-Rahmân.","ml":"Merhamet edenlere Rahmân olan Allah da merhamet eder.","src":"Ebû Dâvûd, Tirmizî","tags":["merhamet","şefkat"]},{"ar":"إِنَّ اللَّهَ رَفِيقٌ يُحِبُّ الرِّفْقَ فِي الْأَمْرِ كُلِّهِ","ok":"İnnallâhe rafîkun yuhibbü'r-rıfka fi'l-emri küllih.","ml":"Allah yumuşak davranandır, her işte yumuşaklığı sever.","sr  rızasında, Rabbin öfkesi anne babanın öfkesindedir.","src":"Tirmizî","tags":["anne baba","aile","rıza"]},{"ar":"خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ، وَأَنَا خَيْرُكُمْ لِأَهْلِي","ok":"Hayruküm hayruküm li-ehlih, ve ene hayruküm li-ehlî.","ml":"Sizin en hayırlınız ailesine karşı en iyi olanınızdır. Ben de aileme karşı en iyi olanınızım.","src":"Tirmizî","tags":["aile","eş","ahlak"]},{"ar":"أَكْمَلُ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنُهُمْ خُلُقًا","ok":"Ekmelü'l-mü'minîne îmânen ahsenühüm hulukâ.","ml":"İman bakımından müminlerin en olgunu, ahlakı en güzel olanıdır.","src":"Ebû Dâvûd, Tirmizî","tags":["ahlak","iman"]},{"ar":"إِنَّمَا بُعِثْتُ لِأُتَمِّمَ صَالِحَ الْأَخْلَاقِ","ok":"İnnemâ bu'istü li-ütemmime sâliha'l-ahlâk.","ml":"Ben ancak güzel ahlakı tamamlamak için gönderildim.","src":"Ahmed b. Hanbel","tags":["ahlak","peygamber"]},{"ar":"طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ","ok":"Talebü'l-ilmi farîdatün alâ külli müslim.","ml":"İlim öğrenmek her Müslümana farzdır.","src":"İbn Mâce","tags":["ilim","öğrenmek"]},{"ar":"مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ","ok":"Men seleke tarîkan yeltemisü fîhi ilmen sehhelallâhü lehû bihî tarîkan ile'l-cenneh.","ml":"Kim ilim öğrenmek için bir yola girerse, Allah ona bu sayede cennete giden yolu kolaylaştırır.","src":"Müslim","tags":["ilim","cennet","öğrenmek"]},{"ar":"الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا","ok":"El-mü'minü li'l-mü'mini ke'l-bünyân, yeşüddü ba'duhû ba'dâ.","ml":"Mümin mümine karşı, parçaları birbirini tutan bir bina gibidir.","src":"Buhârî, Müslim","tags":["kardeşlik","birlik","dayanışma"]},{"ar":"إِيَّاكُمْ وَالظَّنَّ، فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ","ok":"İyyâküm ve'z-zann, fe-inne'z-zanne ekzebü'l-hadîs.","ml":"Kötü zandan sakının. Çünkü zan, sözlerin en yalanıdır.","src":"Buhârî, Müslim","tags":["zan","dedikodu","ahlak"]},{"ar":"عَلَيْكُمْ بِالصِّدْقِ، فَإِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ","ok":"Aleyküm bi's-sıdk, fe-inne's-sıdka yehdî ile'l-birr, ve inne'l-birra yehdî ile'l-cenneh.","ml":"Doğruluktan ayrılmayın. Çünkü doğruluk iyiliğe, iyilik de cennete götürür.","src":"Müslim","tags":["doğruluk","iyilik","cennet"]},{"ar":"آيَةُ الْمُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ","ok":"Âyetü'l-münâfıkı selâs: izâ haddese kezeb, ve izâ vaade ahlef, ve izâ'tümine hân.","ml":"Münafığın alameti üçtür: Konuşunca yalan söyler, söz verince sözünde durmaz, kendisine bir şey emanet edilince hıyanet eder.","src":"Buhârî, Müslim","tags":["yalan","emanet","söz","münafık"]},{"ar":"الْحَيَاءُ مِنَ الْإِيمَانِ","ok":"El-hayâü mine'l-îmân.","ml":"Hayâ imandandır.","src":"Buhârî, Müslim","tags":["hayâ","iman"]},{"ar":"عَجَبًا لِأَمْرِ الْمُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ","ok":"Aceben li-emri'l-mü'min, inne emrahû küllehû hayr.","ml":"Müminin durumu ne hoştur! Onun her işi kendisi için hayırlıdır.","src":"Müslim","tags":["sabır","şükür","tevekkül"]},{"ar":"الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ","ok":"El-mü'minü'l-kaviyyü hayrun ve ehabbü ila'llâhi mine'l-mü'mini'd-daîf.","ml":"Güçlü mümin, Allah katında zayıf müminden daha hayırlı ve daha sevimlidir.","src":"Müslim","tags":["güç","azim","çalışmak"]},{"ar":"ازْهَدْ فِي الدُّنْيَا يُحِبَّكَ اللَّهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّكَ النَّاسُ","ok":"İzhed fi'd-dünyâ yuhibbekellâh, vezhed fîmâ inde'n-nâsi yuhibbeke'n-nâs.","ml":"Dünyaya gönül bağlama ki Allah seni sevsin. İnsanların elindekine göz dikme ki insanlar seni sevsin.","src":"İbn Mâce","tags":["dünya","zühd","kanaat"]},{"ar":"كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ","ok":"Kün fi'd-dünyâ ke-enneke ğarîbün ev âbiru sebîl.","ml":"Dünyada bir garip ya da bir yolcu gibi ol.","src":"Buhârî","tags":["dünya","zühd","ahiret"]},{"ar":"نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالْفَرَاغُ","ok":"Ni'metâni mağbûnün fîhimâ kesîrün mine'n-nâs: es-sıhhatü ve'l-ferâğ.","ml":"İki nimet vardır ki insanların çoğu bunlarda aldanmıştır: Sağlık ve boş vakit.","src":"Buhârî","tags":["zaman","sağlık","nimet"]},{"ar":"إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ، وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ","ok":"İnnallâhe lâ yenzuru ilâ suveriküm ve emvâliküm, ve lâkin yenzuru ilâ kulûbiküm ve a'mâliküm.","ml":"Allah sizin dış görünüşünüze ve mallarınıza bakmaz, kalplerinize ve amellerinize bakar.","src":"Müslim","tags":["kalp","niyet","amel"]},{"ar":"أَفْشُوا السَّلَامَ بَيْنَكُمْ","ok":"Efşü's-selâme beyneküm.","ml":"Aranızda selamı yayın.","src":"Müslim","tags":["selam","sevgi","kardeşlik"]},{"ar":"مَنْ غَشَّنَا فَلَيْسَ مِنَّا","ok":"Men ğaşşenâ fe-leyse minnâ.","ml":"Bizi aldatan bizden değildir.","src":"Müslim","tags":["ticaret","dürüstlük","hile"]},{"ar":"أَعْطُوا الْأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ","ok":"A'tu'l-ecîra ecrahû kable en yeciffe arakuh.","ml":"İşçiye ücretini alnının teri kurumadan verin.","src":"İbn Mâce","tags":["işçi","ticaret","hak","emek"]},{"ar":"مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ","ok":"Men delle alâ hayrin fe-lehû mislü ecri fâilih.","ml":"Kim bir hayra yol gösterirse, ona o hayrı yapanın sevabı kadar sevap vardır.","src":"Müslim","tags":["hayır","iyilik","sevap"]},{"ar":"إِنَّ اللَّهَ جَمِيلٌ يُحِبُّ الْجَمَالَ","ok":"İnnallâhe cemîlün yuhibbü'l-cemâl.","ml":"Allah güzeldir, güzelliği sever.","src":"Müslim","tags":["güzellik","temizlik"]},{"ar":"لَيْسَ مِنَّا مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَيُوَقِّرْ كَبِيرَنَا","ok":"Leyse minnâ men lem yerham sağîranâ ve yüvakkir kebîranâ.","ml":"Küçüklerimize merhamet etmeyen, büyüklerimize saygı göstermeyen bizden değildir.","src":"Tirmizî","tags":["merhamet","saygı","aile","çocuk"]},{"ar":"مَا مَلَأَ آدَمِيٌّ وِعَاءً شَرًّا مِنْ بَطْنٍ","ok":"Mâ mele'e âdemiyyün viâen şerran min batn.","ml":"İnsanoğlu midesinden daha kötü bir kap doldurmamıştır.","src":"Tirmizî","tags":["sağlık","yemek","ölçü"]},{"ar":"مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَيُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ","ok":"Men ehabbe en yübsata lehû fî rızkıhî ve yünse'e lehû fî eserihî fe'l-yesıl rahimeh.","ml":"Rızkının bollaşmasını ve ömrünün bereketlenmesini isteyen, akrabasını gözetsin.","src":"Buhârî, Müslim","tags":["akraba","rızık","sıla-i rahim","aile"]},{"ar":"الْمَرْءُ مَعَ مَنْ أَحَبَّ","ok":"El-mer'ü mea men ehabb.","ml":"Kişi sevdiğiyle beraberdir.","src":"Buhârî, Müslim","tags":["sevgi","dostluk"]},{"ar":"دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ","ok":"Da' mâ yerîbüke ilâ mâ lâ yerîbük.","ml":"Şüpheli olanı bırak, şüphe vermeyene yönel.","src":"Tirmizî, Nesâî","tags":["şüphe","helal","takva"]}];

   ok:"Allâhümme innâ nesteînüke ve nestağfirüke ve nestehdîk. Ve nü'minü bike ve netûbü ileyk. Ve netevekkelü aleyke ve nüsnî aleyke'l-hayra küllehû neşkürük. Ve lâ nekfürüke ve nahleu ve netrükü men yefcürük.",
   ml:"Allah'ım! Senden yardım ister, bağışlanma diler ve hidayet isteriz. Sana inanır, sana tövbe eder ve sana dayanırız. Bütün hayırlarla seni överiz, sana şükreder, nankörlük etmeyiz. Sana karşı geleni bırakır, ondan uzak dururuz."},
  {id:"kunut2", g:"namaz", t:"Kunut Duası – 2", s:"Birinci kunut duasından sonra",
   ar:"اَللّٰهُمَّ إِيَّاكَ نَعْبُدُ وَلَكَ نُصَلِّي وَنَسْجُدُ ۝ وَإِلَيْكَ نَسْعٰى وَنَحْفِدُ ۝ نَرْجُو رَحْمَتَكَ وَنَخْشٰى عَذَابَكَ ۝ إِنَّ عَذَابَكَ بِالْكُفَّارِ مُلْحِقٌ",
   ok:"Allâhümme iyyâke na'büdü ve leke nüsallî ve nescüdü ve ileyke nes'â ve nahfidü nercû rahmeteke ve nahşâ azâbeke inne azâbeke bi'l-küffâri mülhık.",
   ml:"Allah'ım! Yalnız sana ibadet eder, senin için namaz kılar ve secde ederiz. Sana koşar, sana yöneliriz. Rahmetini umar, azabından korkarız. Şüphesiz senin azabın inkârcılara ulaşacaktır."},

  {id:"fil", q:[105,1,5], g:"sure", t:"Fîl Sûresi", s:"105. sure",
   ar:"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ ۝ أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ ۝ وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ ۝ تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ ۝ فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ",
   ok:"Elem tera keyfe fe'ale rabbüke bi-ashâbi'l-fîl. Elem yec'al keydehüm fî tadlîl. Ve ersele aleyhim tayran ebâbîl. Termîhim bi-hıcâratin min siccîl. Fe-ce'alehüm ke-asfin me'kûl.",
   ml:"Rabbinin fil sahiplerine ne yaptığını görmedin mi? Onların tuzağını boşa çıkarmadı mı? Üzerlerine sürü sürü kuşlar gönderdi. O kuşlar onlara pişmiş çamurdan taşlar atıyordu. Sonunda onları yenilmiş ekin yaprağı gibi yaptı."},
  {id:"kureys", q:[106,1,4], g:"sure", t:"Kureyş Sûresi", s:"106. sure",
   ar:"لِإِيلَافِ قُرَيْشٍ ۝ إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ ۝ فَلْيَعْبُدُوا رَبَّ هٰذَا الْبَيْتِ ۝ الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ",
   ok:"Li-îlâfi Kureyş. Îlâfihim rihlete'ş-şitâi ve's-sayf. Fe'l-ya'büdû rabbe hâze'l-beyt. Ellezî et'amehüm min cû'in ve âmenehüm min havf.",
   ml:"Kureyş'e kolaylık sağlandığı, kış ve yaz yolculuklarında onlara kolaylık sağlandığı için, bu evin Rabbine ibadet etsinler. O ki onları açlıktan doyurdu ve korkudan emin kıldı."},
  {id:"maun", q:[107,1,7], g:"sure", t:"Mâûn Sûresi", s:"107. sure",
   ar:"أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ ۝ فَذٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ ۝ وَلَا يَحُضُّ عَلٰى طَعَامِ الْمِسْكِينِ ۝ فَوَيْلٌ لِلْمُصَلِّينَ ۝ الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ ۝ الَّذِينَ هُمْ يُرَاءُونَ ۝ وَيَمْنَعُونَ الْمَاعُونَ",
   ok:"Era'eyte'llezî yükezzibü bi'd-dîn. Fe-zâlike'llezî yedu'u'l-yetîm. Ve lâ yehuddu alâ taâmi'l-miskîn. Fe-veylün li'l-musallîn. Ellezîne hüm an salâtihim sâhûn. Ellezîne hüm yürâûn. Ve yemne'ûne'l-mâ'ûn.",
   ml:"Dini yalanlayanı gördün mü? İşte o, yetimi itip kakan ve yoksulu doyurmaya teşvik etmeyendir. Yazıklar olsun o namaz kılanlara ki namazlarını ciddiye almazlar, gösteriş yaparlar ve en küçük yardımı bile esirgerler."},
  {id:"kevser", q:[108,1,3], g:"sure", t:"Kevser Sûresi", s:"108. sure",
   ar:"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ۝ فَصَلِّ لِرَبِّكَ وَانْحَرْ ۝ إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ",
   ok:"İnnâ a'taynâke'l-kevser. Fe-salli li-rabbike ve'nhar. İnne şânieke hüve'l-ebter.",
   ml:"Şüphesiz biz sana Kevser'i verdik. Öyleyse Rabbin için namaz kıl ve kurban kes. Asıl soyu kesik olan, sana kin besleyendir."},
  {id:"kafirun", q:[109,1,6], g:"sure", t:"Kâfirûn Sûresi", s:"109. sure",
   ar:"قُلْ يَا أَيُّهَا الْكَافِرُونَ ۝ لَا أَعْبُدُ مَا تَعْبُدُونَ ۝ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ ۝ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ لَكُمْ دِينُكُمْ وَلِيَ دِينِ",
   ok:"Kul yâ eyyühe'l-kâfirûn. Lâ a'büdü mâ ta'büdûn. Ve lâ entüm âbidûne mâ a'büd. Ve lâ ene âbidün mâ abedtüm. Ve lâ entüm âbidûne mâ a'büd. Leküm dînüküm ve liye dîn.",
   ml:"De ki: Ey inkâr edenler! Ben sizin taptıklarınıza tapmam. Siz de benim taptığıma tapmıyorsunuz. Ben sizin taptıklarınıza tapacak değilim. Siz de benim taptığıma tapacak değilsiniz. Sizin dininiz size, benim dinim bana."},
  {id:"nasr", q:[110,1,3], g:"sure", t:"Nasr Sûresi", s:"110. sure",
   ar:"إِذَا جَاءَ نَصْرُ اللّٰهِ وَالْفَتْحُ ۝ وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللّٰهِ أَفْوَاجًا ۝ فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا",
   ok:"İzâ câe nasrullâhi ve'l-feth. Ve raeyte'n-nâse yedhulûne fî dînillâhi efvâcâ. Fe-sebbih bi-hamdi rabbike ve'stağfirh, innehû kâne tevvâbâ.",
   ml:"Allah'ın yardımı ve fetih geldiğinde ve insanların bölük bölük Allah'ın dinine girdiğini gördüğünde, Rabbini hamd ile tesbih et ve O'ndan bağışlanma dile. Çünkü O, tövbeleri çokça kabul edendir."},
  {id:"tebbet", q:[111,1,5], g:"sure", t:"Tebbet Sûresi", s:"111. sure",
   ar:"تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ ۝ مَا أَغْنٰى عَنْهُ مَالُهُ وَمَا كَسَبَ ۝ سَيَصْلٰى نَارًا ذَاتَ لَهَبٍ ۝ وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ ۝ فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ",
   ok:"Tebbet yedâ ebî lehebin ve tebb. Mâ ağnâ anhü mâlühû ve mâ keseb. Se-yaslâ nâran zâte leheb. Vemraetühû hammâlete'l-hatab. Fî cîdihâ hablün min mesed.",
   ml:"Ebû Leheb'in elleri kurusun, kurudu da. Ne malı ne kazandıkları ona fayda verdi. O alevli bir ateşe girecek. Odun taşıyıcı karısı da; boynunda hurma lifinden bir ip olduğu halde."},
  {id:"ihlas", q:[112,1,4], g:"sure", t:"İhlâs Sûresi", s:"112. sure",
   ar:"قُلْ هُوَ اللّٰهُ أَحَدٌ ۝ اَللّٰهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",
   ok:"Kul hüvallâhü ehad. Allâhü's-samed. Lem yelid ve lem yûled. Ve lem yekün lehû küfüven ehad.",
   ml:"De ki: O Allah birdir. Allah sameddir; her şey O'na muhtaçtır, O hiçbir şeye muhtaç değildir. Doğurmamış ve doğurulmamıştır. Hiçbir şey O'na denk değildir."},
  {id:"felak", q:[113,1,5], g:"sure", t:"Felak Sûresi", s:"113. sure",
   ar:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ",
   ok:"Kul eûzü bi-rabbi'l-felak. Min şerri mâ halak. Ve min şerri ğâsikın izâ vekab. Ve min şerri'n-neffâsâti fi'l-ukad. Ve min şerri hâsidin izâ hased.",
   ml:"De ki: Yarattığı şeylerin şerrinden, karanlığı çöktüğünde gecenin şerrinden, düğümlere üfleyenlerin şerrinden ve haset ettiğinde hasetçinin şerrinden sabahın Rabbine sığınırım."},
  {id:"nas", q:[114,1,6], g:"sure", t:"Nâs Sûresi", s:"114. sure",
   ar:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",
   ok:"Kul eûzü bi-rabbi'n-nâs. Meliki'n-nâs. İlâhi'n-nâs. Min şerri'l-vesvâsi'l-hannâs. Ellezî yüvesvisü fî sudûri'n-nâs. Mine'l-cinneti ve'n-nâs.",
   ml:"De ki: İnsanların Rabbine, insanların Hükümdarına, insanların İlahına sığınırım; insanların göğüslerine vesvese veren sinsi vesvesecinin şerrinden. O ister cinlerden ister insanlardan olsun."},
  {id:"asr", q:[103,1,3], g:"sure", t:"Asr Sûresi", s:"103. sure",
   ar:"وَالْعَصْرِ ۝ إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ ۝ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ",
   ok:"Ve'l-asr. İnne'l-insâne lefî husr. İlle'llezîne âmenû ve amilü's-sâlihâti ve tevâsav bi'l-hakkı ve tevâsav bi's-sabr.",
   ml:"Asra yemin olsun ki insan gerçekten ziyandadır. Ancak iman edip salih amel işleyenler, birbirlerine hakkı ve sabrı tavsiye edenler bunun dışındadır."},

  {id:"entesselam", g:"sonra", t:"Allâhümme ente's-selâm", s:"Farzdan sonra",
   ar:"اَللّٰهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ",
   ok:"Allâhümme ente's-selâmü ve minke's-selâm, tebârakte yâ ze'l-celâli ve'l-ikrâm.",
   ml:"Allah'ım! Esenlik sensin, esenlik ancak sendendir. Ey celâl ve ikram sahibi, sen yücesin."},
  {id:"ayetelkursi", q:[2,255,255], g:"sonra", t:"Âyetü'l-Kürsî", s:"Tesbihattan önce · Bakara 255",
   ar:"اَللّٰهُ لَا إِلٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",
   ok:"Allâhü lâ ilâhe illâ hüve'l-hayyü'l-kayyûm. Lâ te'huzühû sinetün ve lâ nevm. Lehû mâ fi's-semâvâti ve mâ fi'l-ard. Men ze'llezî yeşfeu indehû illâ bi-iznih. Ya'lemü mâ beyne eydîhim ve mâ halfehüm, ve lâ yuhîtûne bi-şey'in min ilmihî illâ bimâ şâ'. Vesia kürsiyyühü's-semâvâti ve'l-ard, ve lâ yeûdühû hıfzuhumâ, ve hüve'l-aliyyü'l-azîm.",
   ml:"Allah, kendisinden başka ilah olmayan, diri ve her şeyi ayakta tutandır. Onu ne uyuklama ne uyku tutar. Göklerde ve yerde ne varsa O'nundur. İzni olmadan O'nun katında kim şefaat edebilir? İnsanların önlerindekini ve arkalarındakini bilir; onlar O'nun dilediği dışında ilminden hiçbir şeyi kavrayamazlar. Kürsüsü gökleri ve yeri kaplar, onları korumak O'na ağır gelmez. O yücedir, büyüktür."},
  {id:"tesbihat", g:"sonra", t:"Tesbihat", s:"Âyetü'l-Kürsî'den sonra · Sayaçta “Namaz tesbihatı” modu",
   ar:"سُبْحَانَ اللّٰهِ ۝ اَلْحَمْدُ لِلّٰهِ ۝ اَللّٰهُ أَكْبَرُ",
   ok:"33 kez Sübhânallâh, 33 kez Elhamdülillâh, 33 kez Allâhu Ekber.",
   ml:"Allah'ı eksikliklerden uzak tutarım. Hamd Allah'a mahsustur. Allah en büyüktür."},
  {id:"tevhid", g:"sonra", t:"Tesbihatın sonu", s:"Tesbihattan sonra 1 kez",
   ar:"لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلٰى كُلِّ شَيْءٍ قَدِيرٌ",
   ok:"Lâ ilâhe illallâhu vahdehû lâ şerîke leh, lehü'l-mülkü ve lehü'l-hamdü ve hüve alâ külli şey'in kadîr.",
   ml:"Allah'tan başka ilah yoktur. O tektir, ortağı yoktur. Mülk O'nundur, hamd O'na aittir ve O her şeye gücü yetendir."},
  {id:"ezanduasi", g:"sonra", t:"Ezan duası", s:"Ezandan sonra",
   ar:"اَللّٰهُمَّ رَبَّ هٰذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ",
   ok:"Allâhümme rabbe hâzihi'd-da'veti't-tâmme ve's-salâti'l-kâime. Âti Muhammeden el-vesîlete ve'l-fazîle. Veb'ashü makâmen mahmûdenillezî veadteh.",
   ml:"Ey bu eksiksiz davetin ve kılınacak namazın Rabbi olan Allah'ım! Muhammed'e vesileyi ve fazileti ver. Onu kendisine vaat ettiğin övülmüş makama ulaştır."},
  {id:"hasr", g:"sonra", q:[59,22,24], t:"Hüvallâhüllezî", s:"Sabah ve akşam namazlarından sonra · Haşr 22–24",
   okList:["Hüvallâhüllezî lâ ilâhe illâ hû, âlimü'l-ğaybi ve'ş-şehâdeh, hüve'r-rahmânü'r-rahîm.",
     "Hüvallâhüllezî lâ ilâhe illâ hû, el-melikü'l-kuddûsü's-selâmü'l-mü'minü'l-müheyminü'l-azîzü'l-cebbârü'l-mütekebbir, sübhânallâhi ammâ yüşrikûn.",
     "Hüvallâhü'l-hâliku'l-bâriü'l-musavviru lehü'l-esmâü'l-hüsnâ, yüsebbihu lehû mâ fi's-semâvâti ve'l-ard, ve hüve'l-azîzü'l-hakîm."],
   not:"Sabah ve akşam namazlarının farzından sonra, tesbihat ve duadan sonra okunması âdettir."},
  {id:"amenerrasulu", g:"sonra", q:[2,285,286], t:"Âmenerrasûlü", s:"Yatsı namazından sonra · Bakara 285–286",
   okList:["Âmene'r-rasûlü bimâ ünzile ileyhi min rabbihî ve'l-mü'minûn, küllün âmene billâhi ve melâiketihî ve kütübihî ve rusülih, lâ nüferrikü beyne ehadin min rusülih, ve kâlû semi'nâ ve eta'nâ ğufrâneke rabbenâ ve ileyke'l-masîr.",
     "Lâ yükellifullâhü nefsen illâ vüs'ahâ, lehâ mâ kesebet ve aleyhâ mektesebet, rabbenâ lâ tüâhiznâ in nesînâ ev ahta'nâ, rabbenâ ve lâ tahmil aleynâ ısran kemâ hameltehû ale'llezîne min kablinâ, rabbenâ ve lâ tühammilnâ mâ lâ tâkate lenâ bih, va'fü annâ, vağfir lenâ, verhamnâ, ente mevlânâ fensurnâ ale'l-kavmi'l-kâfirîn."],
   not:"Yatsı namazının farzından sonra, tesbihat ve duadan sonra okunması âdettir."},
  {id:"yasin", g:"sureler", q:[36,1,83], t:"Yâsîn Sûresi", s:"36. sure · 83 âyet · Kur'an'ın kalbi"},

  {id:"nebe", g:"sureler", q:[78,1,40], t:"Amme (Nebe) Sûresi", s:"78. sure · 40 âyet · İkindiden sonra okunması âdettir"},

function vibrate(p){ if(!S.settings.vib) return; try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
let AC = null;
let acUnlocked=false;
function ac(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state!=="running") AC.resume();
    if(!acUnlocked){ const b=AC.createBuffer(1,1,22050), src=AC.createBufferSource(); src.buffer=b; src.connect(AC.destination); src.start(0); acUnlocked=true; }
  }catch(e){ AC=null; }
  return AC;
}
/* Telefonlarda ses ancak parmak kalkınca (dokunuş bitince) açılabiliyor; her dokunuşun sonunda sesi hazır tut. */
["pointerup","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ if(!AC||AC.state!=="running"||!acUnlocked) ac(); },{passive:true,capture:true}));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && AC && AC.state!=="running"){ try{ AC.resume(); }catch(e){} } });
try{ if(navigator.audioSession) navigator.audioSession.type="transient"; }catch(e){}
function tone(freq, start, dur, vol){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, a.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol, a.currentTime+start+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+start+dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime+start); o.stop(a.currentTime+start+dur+0.05);
}
function tick(){ if(S.settings.tapSound) tone(1400,0,0.05,0.08); }
function bell(){ if(!S.settings.sound) return; tone(880,0,1.4,0.25); tone(1320,0,1.0,0.10); tone(660,0.35,1.6,0.22); tone(990,0.35,1.2,0.08); }
function chime(){ if(!S.settings.sound) return; tone(1046,0,0.45,0.22); tone(1568,0.12,0.4,0.10); }
function kasemBell(){ if(!S.settings.sound) return; tone(784,0,0.9,0.26); tone(1176,0,0.7,0.10); tone(988,0.28,1.1,0.24); tone(1480,0.28,0.8,0.08); }

let wakeLock = null;
async function applyWake(){
  try{
    if(S.settings.wake && "wakeLock" in navigator && document.visibilityState==="visible"){ if(!wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null;}); } }
    else if(!S.settings.wake && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
}
document.addEventListener("visibilitychange", applyWake);

const DR=Math.PI/180, sn=d=>Math.sin(d*DR), cs=d=>Math.cos(d*DR), tn=d=>Math.tan(d*DR), asn=x=>Math.asin(x)/DR, acs=x=>Math.acos(Math.max(-1,Math.min(1,x)))/DR, at2=(y,x)=>Math.atan2(y,x)/DR, acot=x=>Math.atan(1/x)/DR;

let openDua = null;

function ayahRows(d){
  if(!d.q) return null;
  const [s,a0,a1]=d.q, rows=(QD[String(s)]||[]).filter(r=>r[0]>=a0&&r[0]<=a1);
  if(!rows.length) return null;
  return rows.map((r,i)=>({n:r[0], ar:r[1], ok:(d.okList&&d.okList[i])||r[2], ml:r[3], fn:r[4]}));
}
function duaCard(d, open){
